head>\n<tbody>\n<tr>\n<td><strong>TPID</strong></td>\n<td>16 bit</td>\n<td>Bernilai <code>0x8100</code> (penanda frame 802.1Q)</td>\n</tr>\n<tr>\n<td><strong>PCP</strong></td>\n<td>3 bit</td>\n<td>Prioritas (CoS / 802.1p)</td>\n</tr>\n<tr>\n<td><strong>DEI</strong></td>\n<td>1 bit</td>\n<td><em>Drop Eligible Indicator</em></td>\n</tr>\n<tr>\n<td><strong>VID</strong></td>\n<td>12 bit</td>\n<td><strong>VLAN ID</strong> (0 – 4095)</td>\n</tr>\n</tbody>\n</table>\n<h3>2.2.c Native VLAN</h3>\n<ul>\n<li>VLAN yang frame-nya dikirim <strong>tanpa tag</strong> melalui trunk 802.1Q.</li>\n<li><strong>Default: VLAN 1.</strong></li>\n<li>Native VLAN harus <strong>sama di kedua ujung trunk</strong> (jika tidak cocok akan terjadi <em>native VLAN mismatch</em>, muncul pesan CDP dan trafik dapat bocor antar VLAN).</li>\n<li>Praktik baik: gunakan VLAN khusus yang tidak dipakai untuk trafik pengguna.</li>\n</ul>\n<pre><code>Switch(config-if)# switchport trunk native vlan 99\n</code></pre>\n<h3>Verifikasi trunk</h3>\n<pre><code>Switch# show interfaces trunk\nSwitch# show interfaces gigabitEthernet 0/1 switchport\nSwitch# show vlan brief\n</code></pre>\n<p><code>show interfaces trunk</code> menampilkan: mode, encapsulation (802.1q), status, <strong>native vlan</strong>, <strong>VLAN yang diizinkan (allowed)</strong>, dan VLAN yang aktif/forwarding.</p>", "raw": "### 2.2.a Trunk Ports\n\n- **Trunk** adalah link yang membawa **banyak VLAN** sekaligus antar switch (atau switch ke router/AP/server tertentu) melalui satu link fisik.\n- Frame diberi **tag** agar penerima tahu VLAN asalnya (kecuali native VLAN).\n\n```\nSwitch(config)# interface gigabitEthernet 0/1\nSwitch(config-if)# switchport mode trunk\nSwitch(config-if)# switchport trunk encapsulation dot1q\nSwitch(config-if)# switchport trunk allowed vlan 10,20,99\n```\n\n### 2.2.b 802.1Q\n\n- Standar IEEE untuk **VLAN tagging** pada Ethernet.\n- Menyisipkan **tag 4 byte** ke dalam frame Ethernet (antara *source MAC* dan *EtherType*).\n\n| Field tag | Ukuran | Fungsi |\n|---|---|---|\n| **TPID** | 16 bit | Bernilai `0x8100` (penanda frame 802.1Q) |\n| **PCP** | 3 bit | Prioritas (CoS / 802.1p) |\n| **DEI** | 1 bit | *Drop Eligible Indicator* |\n| **VID** | 12 bit | **VLAN ID** (0 – 4095) |\n\n### 2.2.c Native VLAN\n\n- VLAN yang frame-nya dikirim **tanpa tag** melalui trunk 802.1Q.\n- **Default: VLAN 1.**\n- Native VLAN harus **sama di kedua ujung trunk** (jika tidak cocok akan terjadi *native VLAN mismatch*, muncul pesan CDP dan trafik dapat bocor antar VLAN).\n- Praktik baik: gunakan VLAN khusus yang tidak dipakai untuk trafik pengguna.\n\n```\nSwitch(config-if)# switchport trunk native vlan 99\n```\n\n### Verifikasi trunk\n\n```\nSwitch# show interfaces trunk\nSwitch# show interfaces gigabitEthernet 0/1 switchport\nSwitch# show vlan brief\n```\n\n`show interfaces trunk` menampilkan: mode, encapsulation (802.1q), status, **native vlan**, **VLAN yang diizinkan (allowed)**, dan VLAN yang aktif/forwarding."}, {"id": "sum-2-3", "label": "2.3 Layer 2 discovery protocols (CDP dan LLDP)", "title": "2.3 Layer 2 discovery protocols (CDP dan LLDP)", "html": "<p>Protokol Layer 2 untuk <strong>menemukan perangkat tetangga langsung</strong> (<em>directly connected neighbors</em>) dan informasi perangkat tersebut.</p>\n<table>\n<thead>\n<tr>\n<th>Aspek</th>\n<th><strong>CDP</strong></th>\n<th><strong>LLDP</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Kepanjangan</td>\n<td>Cisco Discovery Protocol</td>\n<td>Link Layer Discovery Protocol</td>\n</tr>\n<tr>\n<td>Standar</td>\n<td><strong>Proprietary Cisco</strong></td>\n<td><strong>IEEE 802.1AB</strong> (vendor-neutral)</td>\n</tr>\n<tr>\n<td>Status default (Cisco)</td>\n<td><strong>Aktif</strong></td>\n<td><strong>Nonaktif</strong></td>\n</tr>\n<tr>\n<td>Alamat multicast tujuan</td>\n<td><code>01:00:0C:CC:CC:CC</code></td>\n<td><code>01:80:C2:00:00:0E</code></td>\n</tr>\n<tr>\n<td>Interval kirim (timer)</td>\n<td><strong>60 detik</strong></td>\n<td><strong>30 detik</strong></td>\n</tr>\n<tr>\n<td>Holdtime</td>\n<td><strong>180 detik</strong></td>\n<td><strong>120 detik</strong></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Informasi yang dibagikan:</strong> Device ID (hostname), interface lokal dan port ID tetangga, platform/model, capability (router/switch), alamat IP manajemen, versi software.</p>\n<h3>Konfigurasi dan verifikasi CDP</h3>\n<pre><code>Switch(config)# cdp run                  ! aktif global (default)\nSwitch(config)# no cdp run               ! nonaktif global\nSwitch(config-if)# no cdp enable         ! nonaktif pada satu interface\nSwitch(config)# cdp timer 30\nSwitch(config)# cdp holdtime 120\n\nSwitch# show cdp\nSwitch# show cdp interface\nSwitch# show cdp neighbors\nSwitch# show cdp neighbors detail\n</code></pre>\n<h3>Konfigurasi dan verifikasi LLDP</h3>\n<pre><code>Switch(config)# lldp run                 ! aktifkan global\nSwitch(config)# no lldp run\nSwitch(config-if)# lldp transmit         ! kirim LLDP pada interface\nSwitch(config-if)# lldp receive          ! terima LLDP pada interface\nSwitch(config-if)# no lldp transmit\nSwitch(config)# lldp timer 30\nSwitch(config)# lldp holdtime 120\n\nSwitch# show lldp\nSwitch# show lldp interface\nSwitch# show lldp neighbors\nSwitch# show lldp neighbors detail\n</code></pre>\n<blockquote>\n<p>Karena CDP/LLDP membocorkan informasi perangkat, nonaktifkan pada interface yang menghadap ke jaringan yang tidak tepercaya.</p>\n</blockquote>", "raw": "Protokol Layer 2 untuk **menemukan perangkat tetangga langsung** (*directly connected neighbors*) dan informasi perangkat tersebut.\n\n| Aspek | **CDP** | **LLDP** |\n|---|---|---|\n| Kepanjangan | Cisco Discovery Protocol | Link Layer Discovery Protocol |\n| Standar | **Proprietary Cisco** | **IEEE 802.1AB** (vendor-neutral) |\n| Status default (Cisco) | **Aktif** | **Nonaktif** |\n| Alamat multicast tujuan | `01:00:0C:CC:CC:CC` | `01:80:C2:00:00:0E` |\n| Interval kirim (timer) | **60 detik** | **30 detik** |\n| Holdtime | **180 detik** | **120 detik** |\n\n**Informasi yang dibagikan:** Device ID (hostname), interface lokal dan port ID tetangga, platform/model, capability (router/switch), alamat IP manajemen, versi software.\n\n### Konfigurasi dan verifikasi CDP\n\n```\nSwitch(config)# cdp run                  ! aktif global (default)\nSwitch(config)# no cdp run               ! nonaktif global\nSwitch(config-if)# no cdp enable         ! nonaktif pada satu interface\nSwitch(config)# cdp timer 30\nSwitch(config)# cdp holdtime 120\n\nSwitch# show cdp\nSwitch# show cdp interface\nSwitch# show cdp neighbors\nSwitch# show cdp neighbors detail\n```\n\n### Konfigurasi dan verifikasi LLDP\n\n```\nSwitch(config)# lldp run                 ! aktifkan global\nSwitch(config)# no lldp run\nSwitch(config-if)# lldp transmit         ! kirim LLDP pada interface\nSwitch(config-if)# lldp receive          ! terima LLDP pada interface\nSwitch(config-if)# no lldp transmit\nSwitch(config)# lldp timer 30\nSwitch(config)# lldp holdtime 120\n\nSwitch# show lldp\nSwitch# show lldp interface\nSwitch# show lldp neighbors\nSwitch# show lldp neighbors detail\n```\n\n> Karena CDP/LLDP membocorkan informasi perangkat, nonaktifkan pada interface yang menghadap ke jaringan yang tidak tepercaya."}, {"id": "sum-2-4", "label": "2.4 EtherChannel (Layer 2/Layer 3) dengan LACP", "title": "2.4 EtherChannel (Layer 2/Layer 3) dengan LACP", "html": "<h3>Konsep</h3>\n<ul>\n<li><strong>EtherChannel</strong> menggabungkan <strong>beberapa link fisik</strong> menjadi <strong>satu link logis</strong> (<strong>Port-Channel</strong>).</li>\n<li>Manfaat: <strong>bandwidth lebih besar</strong>, <strong>redundansi</strong> (jika satu link putus, link lain tetap jalan), dan <strong>STP memperlakukannya sebagai satu link</strong> sehingga tidak ada port yang diblokir hanya karena link paralel.</li>\n</ul>\n<pre><code>SW1 ═══ Gi0/1 ──┐\nSW1 ═══ Gi0/2 ──┼── Port-Channel 1 ── SW2   (tampak seperti satu link)\n</code></pre>\n<h3>Protokol negosiasi</h3>\n<p><strong>LACP</strong> (IEEE 802.3ad / 802.1AX) adalah protokol negosiasi standar terbuka dengan mode <code>active</code> dan <code>passive</code>.</p>\n<p><strong>Kombinasi mode LACP:</strong></p>\n<table>\n<thead>\n<tr>\n<th>Sisi A</th>\n<th>Sisi B</th>\n<th>Hasil</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>active</td>\n<td>active</td>\n<td>✅ Terbentuk</td>\n</tr>\n<tr>\n<td>active</td>\n<td>passive</td>\n<td>✅ Terbentuk</td>\n</tr>\n<tr>\n<td>passive</td>\n<td>passive</td>\n<td>❌ Tidak terbentuk</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li><code>active</code> memulai negosiasi LACP; <code>passive</code> hanya merespons.</li>\n</ul>\n<h3>Syarat anggota bundle</h3>\n<p>Semua interface anggota harus <strong>konsisten</strong>: <strong>speed</strong>, <strong>duplex</strong>, <strong>mode switchport</strong> (access/trunk), <strong>VLAN/native VLAN/allowed VLAN</strong>. Maksimum <strong>8 link aktif</strong> per bundle.</p>\n<h3>Layer 2 EtherChannel (LACP)</h3>\n<pre><code>Switch(config)# interface range gigabitEthernet 0/1 - 2\nSwitch(config-if-range)# switchport mode trunk\nSwitch(config-if-range)# channel-group 1 mode active\n\nSwitch(config)# interface port-channel 1\nSwitch(config-if)# switchport mode trunk\nSwitch(config-if)# switchport trunk allowed vlan 10,20\n</code></pre>\n<h3>Layer 3 EtherChannel (LACP)</h3>\n<p>Port-channel menjadi <strong>routed port</strong> dengan alamat IP.</p>\n<pre><code>Switch(config)# interface range gigabitEthernet 0/1 - 2\nSwitch(config-if-range)# no switchport\nSwitch(config-if-range)# channel-group 1 mode active\n\nSwitch(config)# interface port-channel 1\nSwitch(config-if)# no switchport\nSwitch(config-if)# ip address 10.1.1.1 255.255.255.252\n</code></pre>\n<h3>Verifikasi</h3>\n<pre><code>Switch# show etherchannel summary\nSwitch# show etherchannel port-channel\nSwitch# show interfaces port-channel 1\nSwitch# show lacp neighbor\n</code></pre>\n<p><strong>Flag penting pada <code>show etherchannel summary</code>:</strong></p>\n<table>\n<thead>\n<tr>\n<th>Flag</th>\n<th>Arti</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>S</strong></td>\n<td>Layer 2 EtherChannel</td>\n</tr>\n<tr>\n<td><strong>R</strong></td>\n<td>Layer 3 EtherChannel</td>\n</tr>\n<tr>\n<td><strong>U</strong></td>\n<td>In use</td>\n</tr>\n<tr>\n<td><strong>D</strong></td>\n<td>Down</td>\n</tr>\n<tr>\n<td><strong>P</strong></td>\n<td>Bundled dalam port-channel</td>\n</tr>\n<tr>\n<td><strong>I</strong></td>\n<td>Stand-alone</td>\n</tr>\n<tr>\n<td><strong>s</strong></td>\n<td>Suspended</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p><code>SU</code> = Layer 2 aktif; <code>RU</code> = Layer 3 aktif; anggota normal bertanda <code>(P)</code>.</p>\n</blockquote>", "raw": "### Konsep\n\n- **EtherChannel** menggabungkan **beberapa link fisik** menjadi **satu link logis** (**Port-Channel**).\n- Manfaat: **bandwidth lebih besar**, **redundansi** (jika satu link putus, link lain tetap jalan), dan **STP memperlakukannya sebagai satu link** sehingga tidak ada port yang diblokir hanya karena link paralel.\n\n```\nSW1 ═══ Gi0/1 ──┐\nSW1 ═══ Gi0/2 ──┼── Port-Channel 1 ── SW2   (tampak seperti satu link)\n```\n\n### Protokol negosiasi\n\n**LACP** (IEEE 802.3ad / 802.1AX) adalah protokol negosiasi standar terbuka dengan mode `active` dan `passive`.\n\n**Kombinasi mode LACP:**\n\n| Sisi A | Sisi B | Hasil |\n|---|---|---|\n| active | active | ✅ Terbentuk |\n| active | passive | ✅ Terbentuk |\n| passive | passive | ❌ Tidak terbentuk |\n\n- `active` memulai negosiasi LACP; `passive` hanya merespons.\n\n### Syarat anggota bundle\n\nSemua interface anggota harus **konsisten**: **speed**, **duplex**, **mode switchport** (access/trunk), **VLAN/native VLAN/allowed VLAN**. Maksimum **8 link aktif** per bundle.\n\n### Layer 2 EtherChannel (LACP)\n\n```\nSwitch(config)# interface range gigabitEthernet 0/1 - 2\nSwitch(config-if-range)# switchport mode trunk\nSwitch(config-if-range)# channel-group 1 mode active\n\nSwitch(config)# interface port-channel 1\nSwitch(config-if)# switchport mode trunk\nSwitch(config-if)# switchport trunk allowed vlan 10,20\n```\n\n### Layer 3 EtherChannel (LACP)\n\nPort-channel menjadi **routed port** dengan alamat IP.\n\n```\nSwitch(config)# interface range gigabitEthernet 0/1 - 2\nSwitch(config-if-range)# no switchport\nSwitch(config-if-range)# channel-group 1 mode active\n\nSwitch(config)# interface port-channel 1\nSwitch(config-if)# no switchport\nSwitch(config-if)# ip address 10.1.1.1 255.255.255.252\n```\n\n### Verifikasi\n\n```\nSwitch# show etherchannel summary\nSwitch# show etherchannel port-channel\nSwitch# show interfaces port-channel 1\nSwitch# show lacp neighbor\n```\n\n**Flag penting pada `show etherchannel summary`:**\n\n| Flag | Arti |\n|---|---|\n| **S** | Layer 2 EtherChannel |\n| **R** | Layer 3 EtherChannel |\n| **U** | In use |\n| **D** | Down |\n| **P** | Bundled dalam port-channel |\n| **I** | Stand-alone |\n| **s** | Suspended |\n\n> `SU` = Layer 2 aktif; `RU` = Layer 3 aktif; anggota normal bertanda `(P)`."}, {"id": "sum-2-5", "label": "2.5 Operasi dasar Rapid PVST+ Spanning Tree Protocol", "title": "2.5 Operasi dasar Rapid PVST+ Spanning Tree Protocol", "html": "<h3>Tujuan STP</h3>\n<p>Mencegah <strong>loop Layer 2</strong> pada topologi redundan yang dapat menyebabkan <strong>broadcast storm</strong>, <strong>MAC table instability</strong>, dan <strong>duplikasi frame</strong>. STP memblokir sebagian port secara logis sehingga topologi menjadi <strong>tanpa loop (tree)</strong>.</p>\n<h3>Rapid PVST+</h3>\n<ul>\n<li>Versi Cisco dari <strong>RSTP (IEEE 802.1w)</strong> yang berjalan <strong>per VLAN</strong> (satu instance STP per VLAN).</li>\n<li><strong>Konvergensi jauh lebih cepat</strong> dibanding STP/PVST+ klasik.</li>\n<li>Antar switch bertukar <strong>BPDU</strong> (Bridge Protocol Data Unit); <strong>hello timer = 2 detik</strong>. RSTP menganggap neighbor hilang setelah <strong>3 hello terlewat</strong>.</li>\n</ul>\n<pre><code>Switch(config)# spanning-tree mode rapid-pvst\n</code></pre>\n<h3>2.5.a Root port, root bridge (primary/secondary), dan nama port lainnya</h3>\n<p><strong>Bridge ID (BID)</strong> = <strong>Priority</strong> (default 32768) + <strong>System ID Extension (VLAN ID)</strong> + <strong>MAC address</strong>.</p>\n<ul>\n<li>Contoh: VLAN 10, priority default → <code>32768 + 10 = 32778</code>.</li>\n<li>Priority berkelipatan <strong>4096</strong>.</li>\n</ul>\n<p><strong>Pemilihan root bridge:</strong> switch dengan <strong>BID terendah</strong> (priority terendah; jika sama, MAC terendah).</p>\n<pre><code>Switch(config)# spanning-tree vlan 10 root primary      ! jadikan root (priority 24576 atau lebih rendah)\nSwitch(config)# spanning-tree vlan 10 root secondary    ! cadangan root (priority 28672)\nSwitch(config)# spanning-tree vlan 10 priority 4096     ! set manual\n</code></pre>\n<p><strong>Root port (RP):</strong> satu per <strong>non-root switch</strong>; port dengan <strong>jalur terbaik menuju root bridge</strong>. Kriteria berurutan:</p>\n<ol>\n<li><strong>Root path cost</strong> terendah</li>\n<li><strong>Bridge ID</strong> pengirim (neighbor) terendah</li>\n<li><strong>Port ID</strong> pengirim terendah</li>\n</ol>\n<p><strong>Designated port (DP):</strong> port yang meneruskan BPDU terbaik pada tiap segmen; <strong>satu DP per segmen</strong>. Semua port di <strong>root bridge</strong> adalah DP.</p>\n<p><strong>Default cost (short method):</strong></p>\n<table>\n<thead>\n<tr>\n<th>Kecepatan</th>\n<th>Cost</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>10 Mbps</td>\n<td>100</td>\n</tr>\n<tr>\n<td>100 Mbps</td>\n<td>19</td>\n</tr>\n<tr>\n<td>1 Gbps</td>\n<td>4</td>\n</tr>\n<tr>\n<td>10 Gbps</td>\n<td>2</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p><strong>Root path cost</strong> = penjumlahan cost interface yang <strong>menerima</strong> BPDU sepanjang jalur menuju root.</p>\n</blockquote>\n<h3>2.5.b Port states dan roles</h3>\n<p><strong>Port roles (RSTP):</strong></p>\n<table>\n<thead>\n<tr>\n<th>Role</th>\n<th>Fungsi</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Root</strong></td>\n<td>Jalur terbaik ke root bridge</td>\n</tr>\n<tr>\n<td><strong>Designated</strong></td>\n<td>Meneruskan frame untuk segmen tersebut</td>\n</tr>\n<tr>\n<td><strong>Alternate</strong></td>\n<td>Jalur <strong>cadangan</strong> ke root melalui switch lain (pengganti cepat root port)</td>\n</tr>\n<tr>\n<td><strong>Backup</strong></td>\n<td>Cadangan untuk designated port pada <strong>segmen yang sama</strong> (pada switch yang sama)</td>\n</tr>\n<tr>\n<td><strong>Disabled</strong></td>\n<td>Port dimatikan (shutdown)</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Port states:</strong></p>\n<table>\n<thead>\n<tr>\n<th>State RSTP</th>\n<th>Belajar MAC</th>\n<th>Meneruskan data</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Discarding</strong></td>\n<td>Tidak</td>\n<td>Tidak</td>\n</tr>\n<tr>\n<td><strong>Learning</strong></td>\n<td>Ya</td>\n<td>Tidak</td>\n</tr>\n<tr>\n<td><strong>Forwarding</strong></td>\n<td>Ya</td>\n<td>Ya</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Verifikasi:</strong></p>\n<pre><code>Switch# show spanning-tree\nSwitch# show spanning-tree vlan 10\nSwitch# show spanning-tree summary\nSwitch# show spanning-tree interface gigabitEthernet 0/1\n</code></pre>\n<pre><code>VLAN0010\n  Spanning tree enabled protocol rstp\n  Root ID    Priority    24586\n             Address     0011.2233.4455\n             This bridge is the root\n  Bridge ID  Priority    24586  (priority 24576 sys-id-ext 10)\n\nInterface        Role Sts Cost      Prio.Nbr Type\n---------------- ---- --- --------- -------- ------\nGi0/1            Desg FWD 4         128.1    P2p\nGi0/2            Desg FWD 4         128.2    P2p\n</code></pre>\n<h3>2.5.c PortFast</h3>\n<ul>\n<li>Membuat port <strong>langsung masuk Forwarding</strong> tanpa melewati state Discarding/Learning.</li>\n<li><strong>Hanya untuk port access yang terhubung ke end device</strong> (PC, printer, server) — bukan ke switch.</li>\n</ul>\n<pre><code>Switch(config-if)# spanning-tree portfast                 ! per interface\nSwitch(config)# spanning-tree portfast default            ! semua access port\nSwitch# show spanning-tree interface fastEthernet 0/1 portfast\n</code></pre>\n<h3>2.5.d Root guard, loop guard, BPDU filter, dan BPDU guard</h3>\n<table>\n<thead>\n<tr>\n<th>Fitur</th>\n<th>Fungsi</th>\n<th>Perilaku saat terpicu</th>\n<th>Konfigurasi</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>BPDU Guard</strong></td>\n<td>Melindungi port <strong>PortFast</strong> dari switch/BPDU yang tidak seharusnya</td>\n<td>Port masuk <strong>err-disabled</strong> (shutdown) saat menerima BPDU</td>\n<td><code>spanning-tree bpduguard enable</code> (interface) atau <code>spanning-tree portfast bpduguard default</code> (global)</td>\n</tr>\n<tr>\n<td><strong>BPDU Filter</strong></td>\n<td>Menghentikan <strong>pengiriman dan penerimaan</strong> BPDU pada port</td>\n<td>Port tidak lagi mengirim/menerima BPDU (berisiko loop jika salah pakai)</td>\n<td><code>spanning-tree bpdufilter enable</code> (interface) atau <code>spanning-tree portfast bpdufilter default</code> (global)</td>\n</tr>\n<tr>\n<td><strong>Root Guard</strong></td>\n<td>Menjaga posisi <strong>root bridge</strong> agar tidak digeser switch lain</td>\n<td>Menerima BPDU lebih superior → port menjadi <strong>root-inconsistent</strong> (diblokir); pulih otomatis jika BPDU superior berhenti</td>\n<td><code>spanning-tree guard root</code> (interface, pada <strong>designated port</strong>)</td>\n</tr>\n<tr>\n<td><strong>Loop Guard</strong></td>\n<td>Mencegah loop akibat <strong>hilangnya BPDU</strong> (mis. link unidirectional)</td>\n<td>Port <strong>non-designated</strong> tidak berubah menjadi designated/forwarding; menjadi <strong>loop-inconsistent</strong></td>\n<td><code>spanning-tree guard loop</code> (interface) atau <code>spanning-tree loopguard default</code> (global)</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Catatan:</strong></p>\n<ul>\n<li><strong>BPDU Guard</strong> biasanya dipasangkan dengan PortFast. Untuk memulihkan port err-disabled: <code>shutdown</code> lalu <code>no shutdown</code>, atau <code>errdisable recovery cause bpduguard</code>.</li>\n<li><strong>BPDU Filter</strong> pada level interface mengabaikan semua BPDU; pada level global (portfast default) filter dimatikan otomatis bila port menerima BPDU.</li>\n<li><strong>Root Guard</strong> dipasang pada port yang menghadap switch yang <strong>tidak boleh</strong> menjadi root.</li>\n</ul>", "raw": "### Tujuan STP\n\nMencegah **loop Layer 2** pada topologi redundan yang dapat menyebabkan **broadcast storm**, **MAC table instability**, dan **duplikasi frame**. STP memblokir sebagian port secara logis sehingga topologi menjadi **tanpa loop (tree)**.\n\n### Rapid PVST+\n\n- Versi Cisco dari **RSTP (IEEE 802.1w)** yang berjalan **per VLAN** (satu instance STP per VLAN).\n- **Konvergensi jauh lebih cepat** dibanding STP/PVST+ klasik.\n- Antar switch bertukar **BPDU** (Bridge Protocol Data Unit); **hello timer = 2 detik**. RSTP menganggap neighbor hilang setelah **3 hello terlewat**.\n\n```\nSwitch(config)# spanning-tree mode rapid-pvst\n```\n\n### 2.5.a Root port, root bridge (primary/secondary), dan nama port lainnya\n\n**Bridge ID (BID)** = **Priority** (default 32768) + **System ID Extension (VLAN ID)** + **MAC address**.\n\n- Contoh: VLAN 10, priority default → `32768 + 10 = 32778`.\n- Priority berkelipatan **4096**.\n\n**Pemilihan root bridge:** switch dengan **BID terendah** (priority terendah; jika sama, MAC terendah).\n\n```\nSwitch(config)# spanning-tree vlan 10 root primary      ! jadikan root (priority 24576 atau lebih rendah)\nSwitch(config)# spanning-tree vlan 10 root secondary    ! cadangan root (priority 28672)\nSwitch(config)# spanning-tree vlan 10 priority 4096     ! set manual\n```\n\n**Root port (RP):** satu per **non-root switch**; port dengan **jalur terbaik menuju root bridge**. Kriteria berurutan:\n\n1. **Root path cost** terendah\n2. **Bridge ID** pengirim (neighbor) terendah\n3. **Port ID** pengirim terendah\n\n**Designated port (DP):** port yang meneruskan BPDU terbaik pada tiap segmen; **satu DP per segmen**. Semua port di **root bridge** adalah DP.\n\n**Default cost (short method):**\n\n| Kecepatan | Cost |\n|---|---|\n| 10 Mbps | 100 |\n| 100 Mbps | 19 |\n| 1 Gbps | 4 |\n| 10 Gbps | 2 |\n\n> **Root path cost** = penjumlahan cost interface yang **menerima** BPDU sepanjang jalur menuju root.\n\n### 2.5.b Port states dan roles\n\n**Port roles (RSTP):**\n\n| Role | Fungsi |\n|---|---|\n| **Root** | Jalur terbaik ke root bridge |\n| **Designated** | Meneruskan frame untuk segmen tersebut |\n| **Alternate** | Jalur **cadangan** ke root melalui switch lain (pengganti cepat root port) |\n| **Backup** | Cadangan untuk designated port pada **segmen yang sama** (pada switch yang sama) |\n| **Disabled** | Port dimatikan (shutdown) |\n\n**Port states:**\n\n| State RSTP | Belajar MAC | Meneruskan data |\n|---|---|---|\n| **Discarding** | Tidak | Tidak |\n| **Learning** | Ya | Tidak |\n| **Forwarding** | Ya | Ya |\n\n**Verifikasi:**\n\n```\nSwitch# show spanning-tree\nSwitch# show spanning-tree vlan 10\nSwitch# show spanning-tree summary\nSwitch# show spanning-tree interface gigabitEthernet 0/1\n```\n\n```\nVLAN0010\n  Spanning tree enabled protocol rstp\n  Root ID    Priority    24586\n             Address     0011.2233.4455\n             This bridge is the root\n  Bridge ID  Priority    24586  (priority 24576 sys-id-ext 10)\n\nInterface        Role Sts Cost      Prio.Nbr Type\n---------------- ---- --- --------- -------- ------\nGi0/1            Desg FWD 4         128.1    P2p\nGi0/2            Desg FWD 4         128.2    P2p\n```\n\n### 2.5.c PortFast\n\n- Membuat port **langsung masuk Forwarding** tanpa melewati state Discarding/Learning.\n- **Hanya untuk port access yang terhubung ke end device** (PC, printer, server) — bukan ke switch.\n\n```\nSwitch(config-if)# spanning-tree portfast                 ! per interface\nSwitch(config)# spanning-tree portfast default            ! semua access port\nSwitch# show spanning-tree interface fastEthernet 0/1 portfast\n```\n\n### 2.5.d Root guard, loop guard, BPDU filter, dan BPDU guard\n\n| Fitur | Fungsi | Perilaku saat terpicu | Konfigurasi |\n|---|---|---|---|\n| **BPDU Guard** | Melindungi port **PortFast** dari switch/BPDU yang tidak seharusnya | Port masuk **err-disabled** (shutdown) saat menerima BPDU | `spanning-tree bpduguard enable` (interface) atau `spanning-tree portfast bpduguard default` (global) |\n| **BPDU Filter** | Menghentikan **pengiriman dan penerimaan** BPDU pada port | Port tidak lagi mengirim/menerima BPDU (berisiko loop jika salah pakai) | `spanning-tree bpdufilter enable` (interface) atau `spanning-tree portfast bpdufilter default` (global) |\n| **Root Guard** | Menjaga posisi **root bridge** agar tidak digeser switch lain | Menerima BPDU lebih superior → port menjadi **root-inconsistent** (diblokir); pulih otomatis jika BPDU superior berhenti | `spanning-tree guard root` (interface, pada **designated port**) |\n| **Loop Guard** | Mencegah loop akibat **hilangnya BPDU** (mis. link unidirectional) | Port **non-designated** tidak berubah menjadi designated/forwarding; menjadi **loop-inconsistent** | `spanning-tree guard loop` (interface) atau `spanning-tree loopguard default` (global) |\n\n**Catatan:**\n\n- **BPDU Guard** biasanya dipasangkan dengan PortFast. Untuk memulihkan port err-disabled: `shutdown` lalu `no shutdown`, atau `errdisable recovery cause bpduguard`.\n- **BPDU Filter** pada level interface mengabaikan semua BPDU; pada level global (portfast default) filter dimatikan otomatis bila port menerima BPDU.\n- **Root Guard** dipasang pada port yang menghadap switch yang **tidak boleh** menjadi root."}, {"id": "sum-2-6", "label": "2.6 Arsitektur Cisco Wireless dan AP modes", "title": "2.6 Arsitektur Cisco Wireless dan AP modes", "html": "<h3>Arsitektur Cisco Wireless</h3>\n<table>\n<thead>\n<tr>\n<th>Arsitektur</th>\n<th>Penjelasan</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Autonomous AP</strong></td>\n<td>AP berdiri sendiri; dikonfigurasi dan dikelola <strong>satu per satu</strong> (CLI/GUI). Cocok untuk jaringan kecil. Tidak ada kontrol terpusat.</td>\n</tr>\n<tr>\n<td><strong>Cloud-based AP</strong></td>\n<td>AP dikelola lewat <strong>cloud</strong> (mis. <strong>Cisco Meraki</strong>) menggunakan dashboard web. Konfigurasi, monitoring, dan update dilakukan terpusat dari cloud; <strong>trafik data pengguna tetap lokal</strong> (tidak lewat cloud).</td>\n</tr>\n<tr>\n<td><strong>Split-MAC (Lightweight AP + WLC)</strong></td>\n<td>Fungsi MAC <strong>dibagi</strong> antara AP dan <strong>Wireless LAN Controller (WLC)</strong>. AP <em>lightweight</em> terhubung ke WLC melalui terowongan <strong>CAPWAP</strong>. Manajemen terpusat.</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Pembagian fungsi Split-MAC:</strong></p>\n<table>\n<thead>\n<tr>\n<th>AP (real-time)</th>\n<th>WLC (manajemen)</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Transmisi/penerimaan frame, beacon, probe response, enkripsi/dekripsi frame</td>\n<td>Autentikasi dan asosiasi client, <strong>roaming</strong>, manajemen RF, kebijakan keamanan, QoS</td>\n</tr>\n</tbody>\n</table>\n<p><strong>CAPWAP</strong> (<em>Control and Provisioning of Wireless Access Points</em>):</p>\n<ul>\n<li>Terowongan antara AP dan WLC: <strong>control</strong> (UDP <strong>5246</strong>) dan <strong>data</strong> (UDP <strong>5247</strong>).</li>\n<li>Control plane dienkripsi dengan DTLS; data plane dapat dienkripsi opsional.</li>\n</ul>\n<h3>AP Modes (Lightweight AP)</h3>\n<table>\n<thead>\n<tr>\n<th>Mode</th>\n<th>Fungsi</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Local</strong></td>\n<td>Mode <strong>default</strong>; melayani client dan membangun tunnel CAPWAP ke WLC; semua trafik client di-tunnel ke WLC; memindai channel lain secara berkala</td>\n</tr>\n<tr>\n<td><strong>FlexConnect</strong></td>\n<td>Untuk <strong>kantor cabang</strong>; trafik dapat di-<em>switch</em> <strong>secara lokal</strong> di cabang dan tetap berfungsi saat link ke WLC putus</td>\n</tr>\n<tr>\n<td><strong>Bridge (Mesh)</strong></td>\n<td>Menghubungkan jaringan/lokasi (point-to-point, point-to-multipoint, mesh), umum untuk outdoor</td>\n</tr>\n<tr>\n<td><strong>Monitor</strong></td>\n<td><strong>Tidak melayani client</strong>; memantau spektrum RF, mendeteksi <strong>rogue AP</strong> dan serangan (IDS), serta membantu location tracking</td>\n</tr>\n<tr>\n<td><strong>Sniffer</strong></td>\n<td>Menangkap paket 802.11 dan meneruskannya ke analyzer (mis. Wireshark)</td>\n</tr>\n<tr>\n<td><strong>Rogue Detector</strong></td>\n<td>Mendengarkan trafik kabel untuk mencocokkan MAC/ARP dengan rogue AP</td>\n</tr>\n<tr>\n<td><strong>SE-Connect</strong></td>\n<td>Mode analisis spektrum RF untuk mendeteksi interferensi</td>\n</tr>\n</tbody>\n</table>", "raw": "### Arsitektur Cisco Wireless\n\n| Arsitektur | Penjelasan |\n|---|---|\n| **Autonomous AP** | AP berdiri sendiri; dikonfigurasi dan dikelola **satu per satu** (CLI/GUI). Cocok untuk jaringan kecil. Tidak ada kontrol terpusat. |\n| **Cloud-based AP** | AP dikelola lewat **cloud** (mis. **Cisco Meraki**) menggunakan dashboard web. Konfigurasi, monitoring, dan update dilakukan terpusat dari cloud; **trafik data pengguna tetap lokal** (tidak lewat cloud). |\n| **Split-MAC (Lightweight AP + WLC)** | Fungsi MAC **dibagi** antara AP dan **Wireless LAN Controller (WLC)**. AP *lightweight* terhubung ke WLC melalui terowongan **CAPWAP**. Manajemen terpusat. |\n\n**Pembagian fungsi Split-MAC:**\n\n| AP (real-time) | WLC (manajemen) |\n|---|---|\n| Transmisi/penerimaan frame, beacon, probe response, enkripsi/dekripsi frame | Autentikasi dan asosiasi client, **roaming**, manajemen RF, kebijakan keamanan, QoS |\n\n**CAPWAP** (*Control and Provisioning of Wireless Access Points*):\n\n- Terowongan antara AP dan WLC: **control** (UDP **5246**) dan **data** (UDP **5247**).\n- Control plane dienkripsi dengan DTLS; data plane dapat dienkripsi opsional.\n\n### AP Modes (Lightweight AP)\n\n| Mode | Fungsi |\n|---|---|\n| **Local** | Mode **default**; melayani client dan membangun tunnel CAPWAP ke WLC; semua trafik client di-tunnel ke WLC; memindai channel lain secara berkala |\n| **FlexConnect** | Untuk **kantor cabang**; trafik dapat di-*switch* **secara lokal** di cabang dan tetap berfungsi saat link ke WLC putus |\n| **Bridge (Mesh)** | Menghubungkan jaringan/lokasi (point-to-point, point-to-multipoint, mesh), umum untuk outdoor |\n| **Monitor** | **Tidak melayani client**; memantau spektrum RF, mendeteksi **rogue AP** dan serangan (IDS), serta membantu location tracking |\n| **Sniffer** | Menangkap paket 802.11 dan meneruskannya ke analyzer (mis. Wireshark) |\n| **Rogue Detector** | Mendengarkan trafik kabel untuk mencocokkan MAC/ARP dengan rogue AP |\n| **SE-Connect** | Mode analisis spektrum RF untuk mendeteksi interferensi |"}, {"id": "sum-2-7", "label": "2.7 Koneksi infrastruktur fisik komponen WLAN", "title": "2.7 Koneksi infrastruktur fisik komponen WLAN", "html": "<h3>Topologi umum</h3>\n<pre><code>  [Client] ~~ wireless ~~ [AP] ──(access/trunk, PoE)── [Access SW] ── [Distribution/Core SW] ══(trunk / LAG)══ [WLC]\n</code></pre>\n<h3>Koneksi tiap komponen</h3>\n<table>\n<thead>\n<tr>\n<th>Komponen</th>\n<th>Port switch</th>\n<th>Alasan</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Autonomous AP</strong></td>\n<td><strong>Trunk</strong> (jika banyak SSID↔VLAN) atau access (satu VLAN)</td>\n<td>AP memetakan tiap SSID ke VLAN dan meneruskan trafik langsung ke jaringan kabel</td>\n</tr>\n<tr>\n<td><strong>Lightweight AP (mode Local)</strong></td>\n<td><strong>Access port</strong> pada VLAN manajemen AP</td>\n<td>Semua trafik client dibungkus dalam <strong>tunnel CAPWAP</strong> ke WLC; VLAN client tidak perlu ada di port AP</td>\n</tr>\n<tr>\n<td><strong>Lightweight AP (FlexConnect local switching)</strong></td>\n<td><strong>Trunk port</strong></td>\n<td>Trafik client di-switch lokal sehingga VLAN client harus melewati port AP</td>\n</tr>\n<tr>\n<td><strong>WLC</strong></td>\n<td><strong>Trunk port</strong> (atau LAG)</td>\n<td>WLC memetakan tiap WLAN ke <strong>VLAN/interface</strong>, sehingga port WLC harus membawa banyak VLAN</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li>AP umumnya diberi daya melalui <strong>PoE</strong> dari switch.</li>\n</ul>\n<h3>Port fisik WLC</h3>\n<table>\n<thead>\n<tr>\n<th>Port</th>\n<th>Fungsi</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Distribution System Port</strong></td>\n<td>Membawa trafik data dan manajemen ke switch; umumnya <strong>trunk</strong></td>\n</tr>\n<tr>\n<td><strong>Service Port</strong></td>\n<td>Manajemen <strong>out-of-band</strong>; terhubung ke <strong>access port</strong></td>\n</tr>\n<tr>\n<td><strong>Redundancy Port</strong></td>\n<td>Menghubungkan pasangan WLC untuk <strong>high availability</strong></td>\n</tr>\n<tr>\n<td><strong>Console Port</strong></td>\n<td>Akses konsol lokal</td>\n</tr>\n</tbody>\n</table>\n<h3>LAG (Link Aggregation Group)</h3>\n<ul>\n<li>Menggabungkan <strong>beberapa distribution system port</strong> WLC menjadi <strong>satu link logis</strong> (mirip EtherChannel) untuk menambah <strong>bandwidth</strong> dan <strong>redundansi</strong>.</li>\n<li>Sisi switch dikonfigurasi sebagai <strong>EtherChannel trunk</strong> yang sesuai. Pada WLC generasi klasik (AireOS), LAG bersifat <strong>statis</strong> (tanpa negosiasi protokol).</li>\n</ul>\n<blockquote>\n<p>Pada arsitektur <strong>cloud-based</strong> (mis. Meraki), AP terhubung ke switch dan hanya memerlukan <strong>konektivitas ke Internet/cloud</strong>.</p>\n</blockquote>", "raw": "### Topologi umum\n\n```\n  [Client] ~~ wireless ~~ [AP] ──(access/trunk, PoE)── [Access SW] ── [Distribution/Core SW] ══(trunk / LAG)══ [WLC]\n```\n\n### Koneksi tiap komponen\n\n| Komponen | Port switch | Alasan |\n|---|---|---|\n| **Autonomous AP** | **Trunk** (jika banyak SSID↔VLAN) atau access (satu VLAN) | AP memetakan tiap SSID ke VLAN dan meneruskan trafik langsung ke jaringan kabel |\n| **Lightweight AP (mode Local)** | **Access port** pada VLAN manajemen AP | Semua trafik client dibungkus dalam **tunnel CAPWAP** ke WLC; VLAN client tidak perlu ada di port AP |\n| **Lightweight AP (FlexConnect local switching)** | **Trunk port** | Trafik client di-switch lokal sehingga VLAN client harus melewati port AP |\n| **WLC** | **Trunk port** (atau LAG) | WLC memetakan tiap WLAN ke **VLAN/interface**, sehingga port WLC harus membawa banyak VLAN |\n\n- AP umumnya diberi daya melalui **PoE** dari switch.\n\n### Port fisik WLC\n\n| Port | Fungsi |\n|---|---|\n| **Distribution System Port** | Membawa trafik data dan manajemen ke switch; umumnya **trunk** |\n| **Service Port** | Manajemen **out-of-band**; terhubung ke **access port** |\n| **Redundancy Port** | Menghubungkan pasangan WLC untuk **high availability** |\n| **Console Port** | Akses konsol lokal |\n\n### LAG (Link Aggregation Group)\n\n- Menggabungkan **beberapa distribution system port** WLC menjadi **satu link logis** (mirip EtherChannel) untuk menambah **bandwidth** dan **redundansi**.\n- Sisi switch dikonfigurasi sebagai **EtherChannel trunk** yang sesuai. Pada WLC generasi klasik (AireOS), LAG bersifat **statis** (tanpa negosiasi protokol).\n\n> Pada arsitektur **cloud-based** (mis. Meraki), AP terhubung ke switch dan hanya memerlukan **konektivitas ke Internet/cloud**."}, {"id": "sum-2-8", "label": "2.8 Akses manajemen perangkat jaringan", "title": "2.8 Akses manajemen perangkat jaringan", "html": "<h3>Jenis akses</h3>\n<table>\n<thead>\n<tr>\n<th>Metode</th>\n<th>Jalur</th>\n<th>Protokol/Port</th>\n<th>Keamanan</th>\n<th>Keterangan</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Console</strong></td>\n<td><strong>Out-of-band</strong> (kabel serial/USB langsung)</td>\n<td>–</td>\n<td>Aman secara fisik</td>\n<td>Dipakai untuk konfigurasi awal; tidak perlu jaringan atau IP. Default: 9600 baud, 8 data bit, tanpa parity, 1 stop bit, tanpa flow control</td>\n</tr>\n<tr>\n<td><strong>Telnet</strong></td>\n<td>In-band (via jaringan)</td>\n<td>TCP <strong>23</strong></td>\n<td>❌ <strong>Plaintext</strong> (tidak terenkripsi)</td>\n<td>Tidak direkomendasikan</td>\n</tr>\n<tr>\n<td><strong>SSH</strong></td>\n<td>In-band</td>\n<td>TCP <strong>22</strong></td>\n<td>✅ <strong>Terenkripsi</strong></td>\n<td>Pengganti aman Telnet</td>\n</tr>\n<tr>\n<td><strong>HTTP</strong></td>\n<td>In-band (web GUI)</td>\n<td>TCP <strong>80</strong></td>\n<td>❌ Plaintext</td>\n<td>Antarmuka web tidak aman</td>\n</tr>\n<tr>\n<td><strong>HTTPS</strong></td>\n<td>In-band (web GUI)</td>\n<td>TCP <strong>443</strong></td>\n<td>✅ Terenkripsi (TLS)</td>\n<td>Antarmuka web aman</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li><strong>Out-of-band:</strong> manajemen tidak melewati jaringan produksi (console, service port).</li>\n<li><strong>In-band:</strong> manajemen melewati jaringan produksi (Telnet, SSH, HTTP, HTTPS).</li>\n</ul>\n<h3>TACACS+ / RADIUS (autentikasi terpusat untuk akses manajemen)</h3>\n<p>Administrator dapat diautentikasi melalui <strong>server AAA terpusat</strong> alih-alih akun lokal di tiap perangkat.</p>\n<table>\n<thead>\n<tr>\n<th>Aspek</th>\n<th><strong>TACACS+</strong></th>\n<th><strong>RADIUS</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Standar</td>\n<td>Awalnya proprietary Cisco</td>\n<td><strong>Standar terbuka</strong> (IETF)</td>\n</tr>\n<tr>\n<td>Transport</td>\n<td><strong>TCP 49</strong></td>\n<td><strong>UDP 1812</strong> (autentikasi/otorisasi), <strong>UDP 1813</strong> (accounting)</td>\n</tr>\n<tr>\n<td>Enkripsi</td>\n<td><strong>Seluruh isi paket</strong></td>\n<td><strong>Hanya password</strong></td>\n</tr>\n<tr>\n<td>Pemisahan AAA</td>\n<td><strong>Authentication, Authorization, Accounting terpisah</strong></td>\n<td>Authentication dan authorization <strong>digabung</strong></td>\n</tr>\n<tr>\n<td>Kontrol perintah</td>\n<td><strong>Granular</strong> (otorisasi per command)</td>\n<td>Terbatas</td>\n</tr>\n<tr>\n<td>Penggunaan umum</td>\n<td><strong>Administrasi perangkat</strong> (device administration)</td>\n<td><strong>Akses jaringan</strong> (user/client, mis. WLAN 802.1X, VPN)</td>\n</tr>\n</tbody>\n</table>\n<h3>Cloud Managed</h3>\n<ul>\n<li>Perangkat (AP, switch, router, firewall) dikelola melalui <strong>dashboard cloud</strong> (contoh: <strong>Cisco Meraki</strong>) lewat browser (HTTPS).</li>\n<li>Perangkat membuat koneksi keluar ke cloud sehingga <strong>konfigurasi, monitoring, dan update firmware terpusat</strong>, mendukung <strong>zero-touch provisioning</strong>.</li>\n<li>Cocok untuk banyak lokasi tersebar dan tim IT kecil.</li>\n<li>Perlu <strong>konektivitas Internet</strong> ke cloud agar dapat dikelola (trafik data pengguna umumnya tetap lokal).</li>\n</ul>", "raw": "### Jenis akses\n\n| Metode | Jalur | Protokol/Port | Keamanan | Keterangan |\n|---|---|---|---|---|\n| **Console** | **Out-of-band** (kabel serial/USB langsung) | – | Aman secara fisik | Dipakai untuk konfigurasi awal; tidak perlu jaringan atau IP. Default: 9600 baud, 8 data bit, tanpa parity, 1 stop bit, tanpa flow control |\n| **Telnet** | In-band (via jaringan) | TCP **23** | ❌ **Plaintext** (tidak terenkripsi) | Tidak direkomendasikan |\n| **SSH** | In-band | TCP **22** | ✅ **Terenkripsi** | Pengganti aman Telnet |\n| **HTTP** | In-band (web GUI) | TCP **80** | ❌ Plaintext | Antarmuka web tidak aman |\n| **HTTPS** | In-band (web GUI) | TCP **443** | ✅ Terenkripsi (TLS) | Antarmuka web aman |\n\n- **Out-of-band:** manajemen tidak melewati jaringan produksi (console, service port).\n- **In-band:** manajemen melewati jaringan produksi (Telnet, SSH, HTTP, HTTPS).\n\n### TACACS+ / RADIUS (autentikasi terpusat untuk akses manajemen)\n\nAdministrator dapat diautentikasi melalui **server AAA terpusat** alih-alih akun lokal di tiap perangkat.\n\n| Aspek | **TACACS+** | **RADIUS** |\n|---|---|---|\n| Standar | Awalnya proprietary Cisco | **Standar terbuka** (IETF) |\n| Transport | **TCP 49** | **UDP 1812** (autentikasi/otorisasi), **UDP 1813** (accounting) |\n| Enkripsi | **Seluruh isi paket** | **Hanya password** |\n| Pemisahan AAA | **Authentication, Authorization, Accounting terpisah** | Authentication dan authorization **digabung** |\n| Kontrol perintah | **Granular** (otorisasi per command) | Terbatas |\n| Penggunaan umum | **Administrasi perangkat** (device administration) | **Akses jaringan** (user/client, mis. WLAN 802.1X, VPN) |\n\n### Cloud Managed\n\n- Perangkat (AP, switch, router, firewall) dikelola melalui **dashboard cloud** (contoh: **Cisco Meraki**) lewat browser (HTTPS).\n- Perangkat membuat koneksi keluar ke cloud sehingga **konfigurasi, monitoring, dan update firmware terpusat**, mendukung **zero-touch provisioning**.\n- Cocok untuk banyak lokasi tersebar dan tim IT kecil.\n- Perlu **konektivitas Internet** ke cloud agar dapat dikelola (trafik data pengguna umumnya tetap lokal)."}, {"id": "sum-2-9", "label": "2.9 Interpretasi konfigurasi GUI wireless LAN", "title": "2.9 Interpretasi konfigurasi GUI wireless LAN", "html": "<p>Guidelines meminta kemampuan <strong>membaca/menafsirkan</strong> halaman konfigurasi WLAN pada <strong>GUI WLC</strong>, yaitu <strong>WLAN creation, security settings, QoS profiles, dan advanced settings</strong>.</p>\n<h3>Pembuatan WLAN (WLAN creation) — tab <em>General</em></h3>\n<table>\n<thead>\n<tr>\n<th>Field</th>\n<th>Arti</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Profile Name</strong></td>\n<td>Nama internal WLAN pada WLC</td>\n</tr>\n<tr>\n<td><strong>SSID</strong></td>\n<td>Nama jaringan yang dilihat client</td>\n</tr>\n<tr>\n<td><strong>Status</strong></td>\n<td><em>Enabled</em> agar WLAN aktif</td>\n</tr>\n<tr>\n<td><strong>Radio Policy</strong></td>\n<td>Pita/radio yang dipakai (mis. All, 802.11a only (5 GHz), 802.11g only (2.4 GHz))</td>\n</tr>\n<tr>\n<td><strong>Interface/Interface Group</strong></td>\n<td><strong>VLAN/interface</strong> tempat trafik WLAN dipetakan</td>\n</tr>\n<tr>\n<td><strong>Broadcast SSID</strong></td>\n<td>Menyiarkan SSID atau menyembunyikannya</td>\n</tr>\n</tbody>\n</table>\n<h3>Security Settings — tab <em>Security</em></h3>\n<table>\n<thead>\n<tr>\n<th>Sub-tab</th>\n<th>Pilihan/Isi</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Layer 2</strong></td>\n<td>Metode keamanan: <strong>None (open)</strong>, <strong>WPA/WPA2/WPA3 – Personal (PSK)</strong>, <strong>Enterprise (802.1X)</strong>. Pengaturan terkait: kebijakan WPA2/WPA3, enkripsi <strong>AES</strong>, <strong>Auth Key Management</strong> (PSK atau 802.1X)</td>\n</tr>\n<tr>\n<td><strong>Layer 3</strong></td>\n<td>Kebijakan tambahan, mis. <strong>Web Authentication/Web Policy</strong> (guest portal)</td>\n</tr>\n<tr>\n<td><strong>AAA Servers</strong></td>\n<td>Pemilihan <strong>RADIUS server</strong> untuk autentikasi (dipakai pada mode Enterprise/802.1X)</td>\n</tr>\n</tbody>\n</table>\n<h3>QoS Profiles — tab <em>QoS</em></h3>\n<table>\n<thead>\n<tr>\n<th>Profil</th>\n<th>Digunakan untuk</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Platinum</strong></td>\n<td><strong>Voice</strong> (prioritas tertinggi)</td>\n</tr>\n<tr>\n<td><strong>Gold</strong></td>\n<td><strong>Video</strong></td>\n</tr>\n<tr>\n<td><strong>Silver</strong></td>\n<td><strong>Best effort</strong> (default)</td>\n</tr>\n<tr>\n<td><strong>Bronze</strong></td>\n<td><strong>Background</strong> (prioritas terendah)</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li><strong>WMM Policy:</strong> <em>Disabled</em>, <em>Allowed</em>, atau <em>Required</em> (client wajib mendukung WMM).</li>\n</ul>\n<h3>Advanced Settings — tab <em>Advanced</em></h3>\n<table>\n<thead>\n<tr>\n<th>Pengaturan</th>\n<th>Fungsi</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Allow AAA Override</strong></td>\n<td>Mengizinkan atribut dari server AAA (mis. VLAN, QoS) menimpa konfigurasi WLAN</td>\n</tr>\n<tr>\n<td><strong>Session Timeout</strong></td>\n<td>Batas durasi sesi client sebelum harus autentikasi ulang</td>\n</tr>\n<tr>\n<td><strong>Coverage Hole Detection</strong></td>\n<td>Mendeteksi area dengan sinyal lemah</td>\n</tr>\n<tr>\n<td><strong>Maximum Allowed Clients</strong></td>\n<td>Membatasi jumlah client per WLAN</td>\n</tr>\n<tr>\n<td><strong>Client Exclusion</strong></td>\n<td>Mengeluarkan sementara client yang bermasalah/mencurigakan</td>\n</tr>\n<tr>\n<td><strong>Peer-to-Peer Blocking</strong></td>\n<td>Mencegah komunikasi antar client pada WLAN yang sama</td>\n</tr>\n<tr>\n<td><strong>DHCP (Server Override / Address Assignment Required)</strong></td>\n<td>Menentukan server DHCP atau mewajibkan client mendapat IP DHCP</td>\n</tr>\n<tr>\n<td><strong>Management Frame Protection (MFP)</strong></td>\n<td>Melindungi frame manajemen 802.11</td>\n</tr>\n<tr>\n<td><strong>Band Select / Load Balancing</strong></td>\n<td>Mengarahkan client ke pita 5 GHz dan menyeimbangkan beban antar AP</td>\n</tr>\n<tr>\n<td><strong>802.11k / 802.11v / 802.11r</strong></td>\n<td>Dukungan roaming cepat dan manajemen client</td>\n</tr>\n</tbody>\n</table>\n<h3>Checklist agar client dapat terhubung</h3>\n<ol>\n<li>WLAN berstatus <strong>Enabled</strong> dan SSID sesuai.</li>\n<li><strong>Radio policy</strong> mencakup pita yang dipakai client.</li>\n<li><strong>Metode keamanan</strong> (mis. PSK/802.1X) dan kredensial cocok dengan konfigurasi client.</li>\n<li>WLAN <strong>dipetakan ke VLAN/interface</strong> yang benar dan VLAN tersebut tersedia pada trunk WLC (lihat 2.7).</li>\n<li><strong>DHCP</strong> pada VLAN tersebut tersedia agar client mendapat IP.</li>\n<li>Pengaturan <strong>Advanced</strong> (client exclusion, maksimum client, dll.) tidak memblokir client.</li>\n</ol>", "raw": "Guidelines meminta kemampuan **membaca/menafsirkan** halaman konfigurasi WLAN pada **GUI WLC**, yaitu **WLAN creation, security settings, QoS profiles, dan advanced settings**.\n\n### Pembuatan WLAN (WLAN creation) — tab *General*\n\n| Field | Arti |\n|---|---|\n| **Profile Name** | Nama internal WLAN pada WLC |\n| **SSID** | Nama jaringan yang dilihat client |\n| **Status** | *Enabled* agar WLAN aktif |\n| **Radio Policy** | Pita/radio yang dipakai (mis. All, 802.11a only (5 GHz), 802.11g only (2.4 GHz)) |\n| **Interface/Interface Group** | **VLAN/interface** tempat trafik WLAN dipetakan |\n| **Broadcast SSID** | Menyiarkan SSID atau menyembunyikannya |\n\n### Security Settings — tab *Security*\n\n| Sub-tab | Pilihan/Isi |\n|---|---|\n| **Layer 2** | Metode keamanan: **None (open)**, **WPA/WPA2/WPA3 – Personal (PSK)**, **Enterprise (802.1X)**. Pengaturan terkait: kebijakan WPA2/WPA3, enkripsi **AES**, **Auth Key Management** (PSK atau 802.1X) |\n| **Layer 3** | Kebijakan tambahan, mis. **Web Authentication/Web Policy** (guest portal) |\n| **AAA Servers** | Pemilihan **RADIUS server** untuk autentikasi (dipakai pada mode Enterprise/802.1X) |\n\n### QoS Profiles — tab *QoS*\n\n| Profil | Digunakan untuk |\n|---|---|\n| **Platinum** | **Voice** (prioritas tertinggi) |\n| **Gold** | **Video** |\n| **Silver** | **Best effort** (default) |\n| **Bronze** | **Background** (prioritas terendah) |\n\n- **WMM Policy:** *Disabled*, *Allowed*, atau *Required* (client wajib mendukung WMM).\n\n### Advanced Settings — tab *Advanced*\n\n| Pengaturan | Fungsi |\n|---|---|\n| **Allow AAA Override** | Mengizinkan atribut dari server AAA (mis. VLAN, QoS) menimpa konfigurasi WLAN |\n| **Session Timeout** | Batas durasi sesi client sebelum harus autentikasi ulang |\n| **Coverage Hole Detection** | Mendeteksi area dengan sinyal lemah |\n| **Maximum Allowed Clients** | Membatasi jumlah client per WLAN |\n| **Client Exclusion** | Mengeluarkan sementara client yang bermasalah/mencurigakan |\n| **Peer-to-Peer Blocking** | Mencegah komunikasi antar client pada WLAN yang sama |\n| **DHCP (Server Override / Address Assignment Required)** | Menentukan server DHCP atau mewajibkan client mendapat IP DHCP |\n| **Management Frame Protection (MFP)** | Melindungi frame manajemen 802.11 |\n| **Band Select / Load Balancing** | Mengarahkan client ke pita 5 GHz dan menyeimbangkan beban antar AP |\n| **802.11k / 802.11v / 802.11r** | Dukungan roaming cepat dan manajemen client |\n\n### Checklist agar client dapat terhubung\n\n1. WLAN berstatus **Enabled** dan SSID sesuai.\n2. **Radio policy** mencakup pita yang dipakai client.\n3. **Metode keamanan** (mis. PSK/802.1X) dan kredensial cocok dengan konfigurasi client.\n4. WLAN **dipetakan ke VLAN/interface** yang benar dan VLAN tersebut tersedia pada trunk WLC (lihat 2.7).\n5. **DHCP** pada VLAN tersebut tersedia agar client mendapat IP.\n6. Pengaturan **Advanced** (client exclusion, maksimum client, dll.) tidak memblokir client."}, {"id": "sum-2-checklist", "label": "Checklist Review 2.0", "title": "Checklist Review Cepat — 2.0 Network Access (20%)", "html": "<table>\n<thead>\n<tr>\n<th>No.</th>\n<th>Topik</th>\n<th>Poin kunci</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2.1</td>\n<td>VLAN</td>\n<td>Normal range 1–1005; access port data + voice; default VLAN 1; ROAS vs SVI (L3 switch)</td>\n</tr>\n<tr>\n<td>2.2</td>\n<td>Interswitch</td>\n<td>Trunk; 802.1Q tag 4 byte (VID 12 bit); native VLAN untagged, harus cocok; <code>show interfaces trunk</code></td>\n</tr>\n<tr>\n<td>2.3</td>\n<td>CDP &amp; LLDP</td>\n<td>CDP (Cisco, aktif, 60/180 s) vs LLDP (IEEE, nonaktif, 30/120 s); <code>show cdp/lldp neighbors</code></td>\n</tr>\n<tr>\n<td>2.4</td>\n<td>EtherChannel</td>\n<td>LACP active/passive; L2 (<code>switchport</code>) vs L3 (<code>no switchport</code> + IP); <code>show etherchannel summary</code> (SU/RU, P)</td>\n</tr>\n<tr>\n<td>2.5</td>\n<td>Rapid PVST+</td>\n<td>BID terendah = root; root port, designated, alternate, backup; Discarding/Learning/Forwarding; PortFast, BPDU Guard, BPDU Filter, Root Guard, Loop Guard</td>\n</tr>\n<tr>\n<td>2.6</td>\n<td>Wireless architecture</td>\n<td>Autonomous, cloud-based, split-MAC (CAPWAP 5246/5247); AP modes: Local, FlexConnect, Bridge, Monitor, Sniffer, Rogue Detector, SE-Connect</td>\n</tr>\n<tr>\n<td>2.7</td>\n<td>Koneksi fisik WLAN</td>\n<td>AP → access (Local) / trunk (FlexConnect); WLC → trunk/LAG; port WLC: distribution, service, redundancy, console</td>\n</tr>\n<tr>\n<td>2.8</td>\n<td>Akses manajemen</td>\n<td>Console (out-of-band), Telnet (plain), SSH, HTTP vs HTTPS, TACACS+ (TCP 49) vs RADIUS (UDP 1812/1813), cloud managed</td>\n</tr>\n<tr>\n<td>2.9</td>\n<td>GUI WLAN</td>\n<td>WLAN creation (SSID, interface/VLAN), Security (L2/L3/AAA), QoS (Platinum/Gold/Silver/Bronze), Advanced</td>\n</tr>\n</tbody>\n</table>", "raw": "| No. | Topik | Poin kunci |\n|---|---|---|\n| 2.1 | VLAN | Normal range 1–1005; access port data + voice; default VLAN 1; ROAS vs SVI (L3 switch) |\n| 2.2 | Interswitch | Trunk; 802.1Q tag 4 byte (VID 12 bit); native VLAN untagged, harus cocok; `show interfaces trunk` |\n| 2.3 | CDP & LLDP | CDP (Cisco, aktif, 60/180 s) vs LLDP (IEEE, nonaktif, 30/120 s); `show cdp/lldp neighbors` |\n| 2.4 | EtherChannel | LACP active/passive; L2 (`switchport`) vs L3 (`no switchport` + IP); `show etherchannel summary` (SU/RU, P) |\n| 2.5 | Rapid PVST+ | BID terendah = root; root port, designated, alternate, backup; Discarding/Learning/Forwarding; PortFast, BPDU Guard, BPDU Filter, Root Guard, Loop Guard |\n| 2.6 | Wireless architecture | Autonomous, cloud-based, split-MAC (CAPWAP 5246/5247); AP modes: Local, FlexConnect, Bridge, Monitor, Sniffer, Rogue Detector, SE-Connect |\n| 2.7 | Koneksi fisik WLAN | AP → access (Local) / trunk (FlexConnect); WLC → trunk/LAG; port WLC: distribution, service, redundancy, console |\n| 2.8 | Akses manajemen | Console (out-of-band), Telnet (plain), SSH, HTTP vs HTTPS, TACACS+ (TCP 49) vs RADIUS (UDP 1812/1813), cloud managed |\n| 2.9 | GUI WLAN | WLAN creation (SSID, interface/VLAN), Security (L2/L3/AAA), QoS (Platinum/Gold/Silver/Bronze), Advanced |"}]}, {"category": "3.0 IP CONNECTIVITY", "items": [{"id": "sum-3-1", "label": "3.1 Komponen routing table", "title": "3.1 Komponen routing table", "html": "<p><strong>Routing table</strong> adalah tabel pada router yang berisi rute menuju jaringan tujuan. Dilihat dengan:</p>\n<pre><code>Router# show ip route\nRouter# show ipv6 route\n</code></pre>\n<p><strong>Contoh output (IPv4):</strong></p>\n<pre><code>Codes: L - local, C - connected, S - static, R - RIP, B - BGP\n       D - EIGRP, O - OSPF, IA - OSPF inter area, * - candidate default\n\nGateway of last resort is 203.0.113.2 to network 0.0.0.0\n\nS*    0.0.0.0/0 [1/0] via 203.0.113.2\n      10.0.0.0/8 is variably subnetted, 4 subnets, 2 masks\nC        10.1.1.0/24 is directly connected, GigabitEthernet0/0\nL        10.1.1.1/32 is directly connected, GigabitEthernet0/0\nO        10.2.2.0/24 [110/2] via 10.1.1.2, 00:05:12, GigabitEthernet0/0\nS        10.3.3.0/24 [1/0] via 10.1.1.3\n</code></pre>\n<p><strong>Cara membaca satu baris rute:</strong></p>\n<pre><code>O   10.2.2.0/24  [110/2]  via 10.1.1.2,  00:05:12,  GigabitEthernet0/0\n│   │      │       │   │      │            │              └─ Exit interface\n│   │      │       │   │      │            └─ Umur rute (route timer)\n│   │      │       │   │      └─ Next hop\n│   │      │       │   └─ Metric\n│   │      │       └─ Administrative distance\n│   │      └─ Network mask (prefix length)\n│   └─ Prefix (network address)\n└─ Routing protocol code\n</code></pre>\n<h3>3.1.a Routing protocol code</h3>\n<p>Kode di kolom paling kiri yang menunjukkan <strong>sumber/asal rute</strong>.</p>\n<table>\n<thead>\n<tr>\n<th>Kode</th>\n<th>Arti</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>L</strong></td>\n<td><strong>Local</strong> — alamat IP interface router itu sendiri (/32 untuk IPv4, /128 untuk IPv6)</td>\n</tr>\n<tr>\n<td><strong>C</strong></td>\n<td><strong>Connected</strong> — jaringan yang terhubung langsung ke interface</td>\n</tr>\n<tr>\n<td><strong>S</strong></td>\n<td><strong>Static</strong> — rute statis yang dikonfigurasi manual</td>\n</tr>\n<tr>\n<td><strong>S*</strong></td>\n<td>Static yang menjadi <strong>candidate default route</strong></td>\n</tr>\n<tr>\n<td><strong>O</strong></td>\n<td><strong>OSPF</strong> (IA = inter area)</td>\n</tr>\n<tr>\n<td><strong>D</strong></td>\n<td><strong>EIGRP</strong></td>\n</tr>\n<tr>\n<td><strong>R</strong></td>\n<td><strong>RIP</strong></td>\n</tr>\n<tr>\n<td><strong>B</strong></td>\n<td><strong>BGP</strong></td>\n</tr>\n</tbody>\n</table>\n<h3>3.1.b Prefix</h3>\n<ul>\n<li>Alamat <strong>network tujuan</strong> (bagian network dari alamat), mis. <code>10.2.2.0</code>.</li>\n<li>Bersama panjang prefix membentuk <strong>jaringan tujuan</strong> yang dicocokkan dengan alamat IP tujuan paket.</li>\n</ul>\n<h3>3.1.c Network mask</h3>\n<ul>\n<li>Menentukan <strong>berapa bit</strong> dari alamat yang dianggap bagian network.</li>\n<li>Ditampilkan dalam notasi <strong>prefix length</strong> (<code>/24</code> = 255.255.255.0).</li>\n<li>Baris seperti <em>\"10.0.0.0/8 is variably subnetted, 4 subnets, 2 masks\"</em> berarti ada beberapa subnet dari satu <em>major network</em> dengan panjang mask berbeda.</li>\n</ul>\n<h3>3.1.d Next hop</h3>\n<ul>\n<li><strong>Alamat IP router berikutnya</strong> (<code>via 10.1.1.2</code>) yang harus dituju untuk mencapai jaringan tersebut.</li>\n<li>Rute <strong>connected</strong> tidak memiliki next hop; hanya menampilkan <strong>exit interface</strong> (<em>directly connected</em>).</li>\n</ul>\n<h3>3.1.e Administrative distance (AD)</h3>\n<ul>\n<li>Ukuran <strong>tingkat kepercayaan sumber rute</strong>; <strong>makin kecil makin dipercaya</strong>.</li>\n<li>Digunakan untuk memilih antara rute ke <strong>prefix yang sama</strong> dari sumber berbeda.</li>\n</ul>\n<table>\n<thead>\n<tr>\n<th>Sumber rute</th>\n<th>AD default</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Connected</td>\n<td><strong>0</strong></td>\n</tr>\n<tr>\n<td>Static</td>\n<td><strong>1</strong></td>\n</tr>\n<tr>\n<td>eBGP</td>\n<td>20</td>\n</tr>\n<tr>\n<td>EIGRP (internal)</td>\n<td><strong>90</strong></td>\n</tr>\n<tr>\n<td><strong>OSPF</strong></td>\n<td><strong>110</strong></td>\n</tr>\n<tr>\n<td><strong>RIP</strong></td>\n<td><strong>120</strong></td>\n</tr>\n</tbody>\n</table>\n<h3>3.1.f Metric</h3>\n<ul>\n<li>Nilai yang dipakai <strong>protokol routing</strong> untuk memilih <strong>jalur terbaik</strong> ke tujuan yang sama; <strong>makin kecil makin baik</strong>.</li>\n<li>Setiap protokol memiliki cara hitung berbeda:</li>\n</ul>\n<table>\n<thead>\n<tr>\n<th>Protokol</th>\n<th>Metric</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>OSPF</strong></td>\n<td><strong>Cost</strong> = <em>reference bandwidth</em> ÷ <em>bandwidth interface</em> (reference default 100 Mbps; akumulasi sepanjang jalur)</td>\n</tr>\n<tr>\n<td><strong>Static / Connected</strong></td>\n<td>Metric <strong>0</strong></td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li>Metric <strong>tidak dapat dibandingkan antar protokol</strong> yang berbeda.</li>\n</ul>\n<h3>3.1.g Gateway of last resort</h3>\n<ul>\n<li><strong>Default route</strong> yang dipakai bila tidak ada rute lain yang cocok dengan tujuan paket.</li>\n<li>Tampil sebagai: <code>Gateway of last resort is 203.0.113.2 to network 0.0.0.0</code>.</li>\n<li>Jika belum ada default route: <code>Gateway of last resort is not set</code>.</li>\n<li>Rute default ditandai <strong><code>*</code></strong> (mis. <code>S*</code>), yaitu <code>0.0.0.0/0</code> (IPv4) atau <code>::/0</code> (IPv6).</li>\n</ul>", "raw": "**Routing table** adalah tabel pada router yang berisi rute menuju jaringan tujuan. Dilihat dengan:\n\n```\nRouter# show ip route\nRouter# show ipv6 route\n```\n\n**Contoh output (IPv4):**\n\n```\nCodes: L - local, C - connected, S - static, R - RIP, B - BGP\n       D - EIGRP, O - OSPF, IA - OSPF inter area, * - candidate default\n\nGateway of last resort is 203.0.113.2 to network 0.0.0.0\n\nS*    0.0.0.0/0 [1/0] via 203.0.113.2\n      10.0.0.0/8 is variably subnetted, 4 subnets, 2 masks\nC        10.1.1.0/24 is directly connected, GigabitEthernet0/0\nL        10.1.1.1/32 is directly connected, GigabitEthernet0/0\nO        10.2.2.0/24 [110/2] via 10.1.1.2, 00:05:12, GigabitEthernet0/0\nS        10.3.3.0/24 [1/0] via 10.1.1.3\n```\n\n**Cara membaca satu baris rute:**\n\n```\nO   10.2.2.0/24  [110/2]  via 10.1.1.2,  00:05:12,  GigabitEthernet0/0\n│   │      │       │   │      │            │              └─ Exit interface\n│   │      │       │   │      │            └─ Umur rute (route timer)\n│   │      │       │   │      └─ Next hop\n│   │      │       │   └─ Metric\n│   │      │       └─ Administrative distance\n│   │      └─ Network mask (prefix length)\n│   └─ Prefix (network address)\n└─ Routing protocol code\n```\n\n### 3.1.a Routing protocol code\n\nKode di kolom paling kiri yang menunjukkan **sumber/asal rute**.\n\n| Kode | Arti |\n|---|---|\n| **L** | **Local** — alamat IP interface router itu sendiri (/32 untuk IPv4, /128 untuk IPv6) |\n| **C** | **Connected** — jaringan yang terhubung langsung ke interface |\n| **S** | **Static** — rute statis yang dikonfigurasi manual |\n| **S\\*** | Static yang menjadi **candidate default route** |\n| **O** | **OSPF** (IA = inter area) |\n| **D** | **EIGRP** |\n| **R** | **RIP** |\n| **B** | **BGP** |\n\n### 3.1.b Prefix\n\n- Alamat **network tujuan** (bagian network dari alamat), mis. `10.2.2.0`.\n- Bersama panjang prefix membentuk **jaringan tujuan** yang dicocokkan dengan alamat IP tujuan paket.\n\n### 3.1.c Network mask\n\n- Menentukan **berapa bit** dari alamat yang dianggap bagian network.\n- Ditampilkan dalam notasi **prefix length** (`/24` = 255.255.255.0).\n- Baris seperti *\"10.0.0.0/8 is variably subnetted, 4 subnets, 2 masks\"* berarti ada beberapa subnet dari satu *major network* dengan panjang mask berbeda.\n\n### 3.1.d Next hop\n\n- **Alamat IP router berikutnya** (`via 10.1.1.2`) yang harus dituju untuk mencapai jaringan tersebut.\n- Rute **connected** tidak memiliki next hop; hanya menampilkan **exit interface** (*directly connected*).\n\n### 3.1.e Administrative distance (AD)\n\n- Ukuran **tingkat kepercayaan sumber rute**; **makin kecil makin dipercaya**.\n- Digunakan untuk memilih antara rute ke **prefix yang sama** dari sumber berbeda.\n\n| Sumber rute | AD default |\n|---|---|\n| Connected | **0** |\n| Static | **1** |\n| eBGP | 20 |\n| EIGRP (internal) | **90** |\n| **OSPF** | **110** |\n| **RIP** | **120** |\n\n### 3.1.f Metric\n\n- Nilai yang dipakai **protokol routing** untuk memilih **jalur terbaik** ke tujuan yang sama; **makin kecil makin baik**.\n- Setiap protokol memiliki cara hitung berbeda:\n\n| Protokol | Metric |\n|---|---|\n| **OSPF** | **Cost** = *reference bandwidth* ÷ *bandwidth interface* (reference default 100 Mbps; akumulasi sepanjang jalur) |\n| **Static / Connected** | Metric **0** |\n\n- Metric **tidak dapat dibandingkan antar protokol** yang berbeda.\n\n### 3.1.g Gateway of last resort\n\n- **Default route** yang dipakai bila tidak ada rute lain yang cocok dengan tujuan paket.\n- Tampil sebagai: `Gateway of last resort is 203.0.113.2 to network 0.0.0.0`.\n- Jika belum ada default route: `Gateway of last resort is not set`.\n- Rute default ditandai **`*`** (mis. `S*`), yaitu `0.0.0.0/0` (IPv4) atau `::/0` (IPv6)."}, {"id": "sum-3-2", "label": "3.2 Keputusan forwarding router secara default", "title": "3.2 Keputusan forwarding router secara default", "html": "<p>Saat paket tiba, router mencari rute terbaik di routing table dengan urutan berikut:</p>\n<table>\n<thead>\n<tr>\n<th>Urutan</th>\n<th>Kriteria</th>\n<th>Penjelasan</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>1</strong></td>\n<td><strong>Longest prefix match</strong></td>\n<td>Pilih rute dengan <strong>prefix length terpanjang</strong> (paling spesifik) yang cocok dengan IP tujuan</td>\n</tr>\n<tr>\n<td><strong>2</strong></td>\n<td><strong>Administrative distance</strong></td>\n<td>Jika ada beberapa sumber untuk <strong>prefix yang sama</strong>, pilih <strong>AD terendah</strong></td>\n</tr>\n<tr>\n<td><strong>3</strong></td>\n<td><strong>Routing protocol metric</strong></td>\n<td>Jika sumber/protokol sama dan prefix sama, pilih <strong>metric terendah</strong></td>\n</tr>\n</tbody>\n</table>\n<h3>3.2.a Longest prefix match</h3>\n<p><strong>Contoh:</strong> paket ke <code>192.168.1.130</code> dengan rute berikut:</p>\n<table>\n<thead>\n<tr>\n<th>Rute di tabel</th>\n<th>Cocok?</th>\n<th>Panjang prefix</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>192.168.0.0/16</code></td>\n<td>Ya</td>\n<td>16</td>\n</tr>\n<tr>\n<td><code>192.168.1.0/24</code></td>\n<td>Ya</td>\n<td>24</td>\n</tr>\n<tr>\n<td><code>192.168.1.128/25</code> (range .128–.255)</td>\n<td>Ya</td>\n<td><strong>25</strong> ← <strong>dipilih</strong></td>\n</tr>\n<tr>\n<td><code>0.0.0.0/0</code></td>\n<td>Ya</td>\n<td>0</td>\n</tr>\n<tr>\n<td><code>192.168.1.0/25</code> (range .0–.127)</td>\n<td>Tidak</td>\n<td>–</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p>Rute <strong>/25</strong> dipilih karena paling spesifik. Default route <code>/0</code> adalah pilihan <strong>terakhir</strong>.</p>\n</blockquote>\n<h3>3.2.b Administrative distance</h3>\n<ul>\n<li>Berlaku saat <strong>prefix dan prefix length sama</strong>, tetapi dipelajari dari sumber berbeda.</li>\n<li>Contoh: <code>10.5.0.0/24</code> diketahui dari <strong>OSPF (AD 110)</strong> dan <strong>static (AD 1)</strong> → rute <strong>static</strong> dipasang di routing table.</li>\n</ul>\n<h3>3.2.c Routing protocol metric</h3>\n<ul>\n<li>Berlaku saat prefix sama <strong>dari protokol routing yang sama</strong>.</li>\n<li>Contoh: dua jalur OSPF ke <code>10.5.0.0/24</code>, cost 20 dan cost 30 → dipilih <strong>cost 20</strong>.</li>\n<li>Jika <strong>metric sama</strong> (<em>equal-cost</em>), router dapat membagi trafik ke beberapa jalur (<strong>load balancing / ECMP</strong>).</li>\n</ul>\n<h3>Jika tidak ada rute yang cocok</h3>\n<ul>\n<li>Router memakai <strong>default route</strong> (gateway of last resort) bila ada.</li>\n<li>Jika tidak ada, paket <strong>dibuang</strong> (drop) dan router biasanya mengirim pesan <strong>ICMP destination unreachable</strong>.</li>\n</ul>", "raw": "Saat paket tiba, router mencari rute terbaik di routing table dengan urutan berikut:\n\n| Urutan | Kriteria | Penjelasan |\n|---|---|---|\n| **1** | **Longest prefix match** | Pilih rute dengan **prefix length terpanjang** (paling spesifik) yang cocok dengan IP tujuan |\n| **2** | **Administrative distance** | Jika ada beberapa sumber untuk **prefix yang sama**, pilih **AD terendah** |\n| **3** | **Routing protocol metric** | Jika sumber/protokol sama dan prefix sama, pilih **metric terendah** |\n\n### 3.2.a Longest prefix match\n\n**Contoh:** paket ke `192.168.1.130` dengan rute berikut:\n\n| Rute di tabel | Cocok? | Panjang prefix |\n|---|---|---|\n| `192.168.0.0/16` | Ya | 16 |\n| `192.168.1.0/24` | Ya | 24 |\n| `192.168.1.128/25` (range .128–.255) | Ya | **25** ← **dipilih** |\n| `0.0.0.0/0` | Ya | 0 |\n| `192.168.1.0/25` (range .0–.127) | Tidak | – |\n\n> Rute **/25** dipilih karena paling spesifik. Default route `/0` adalah pilihan **terakhir**.\n\n### 3.2.b Administrative distance\n\n- Berlaku saat **prefix dan prefix length sama**, tetapi dipelajari dari sumber berbeda.\n- Contoh: `10.5.0.0/24` diketahui dari **OSPF (AD 110)** dan **static (AD 1)** → rute **static** dipasang di routing table.\n\n### 3.2.c Routing protocol metric\n\n- Berlaku saat prefix sama **dari protokol routing yang sama**.\n- Contoh: dua jalur OSPF ke `10.5.0.0/24`, cost 20 dan cost 30 → dipilih **cost 20**.\n- Jika **metric sama** (*equal-cost*), router dapat membagi trafik ke beberapa jalur (**load balancing / ECMP**).\n\n### Jika tidak ada rute yang cocok\n\n- Router memakai **default route** (gateway of last resort) bila ada.\n- Jika tidak ada, paket **dibuang** (drop) dan router biasanya mengirim pesan **ICMP destination unreachable**."}, {"id": "sum-3-3", "label": "3.3 Static routing IPv4 dan IPv6", "title": "3.3 Static routing IPv4 dan IPv6", "html": "<p><strong>Static route</strong> adalah rute yang dikonfigurasi <strong>manual</strong> oleh administrator.</p>\n<ul>\n<li>Kelebihan: sederhana, tanpa overhead protokol routing, AD rendah (1).</li>\n<li>Kekurangan: tidak beradaptasi otomatis terhadap perubahan topologi; sulit diskalakan.</li>\n</ul>\n<h3>Sintaks</h3>\n<pre><code>! IPv4\nRouter(config)# ip route &lt;prefix&gt; &lt;mask&gt; {&lt;next-hop&gt; | &lt;exit-interface&gt; | &lt;exit-interface&gt; &lt;next-hop&gt;} [AD]\n\n! IPv6 (aktifkan routing IPv6 terlebih dahulu)\nRouter(config)# ipv6 unicast-routing\nRouter(config)# ipv6 route &lt;prefix&gt;/&lt;length&gt; {&lt;next-hop&gt; | &lt;exit-interface&gt; | &lt;exit-interface&gt; &lt;next-hop&gt;} [AD]\n</code></pre>\n<p><strong>Pilihan penentuan tujuan:</strong></p>\n<table>\n<thead>\n<tr>\n<th>Bentuk</th>\n<th>Keterangan</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Next-hop IP</strong></td>\n<td>Router mencari exit interface melalui <em>recursive lookup</em></td>\n</tr>\n<tr>\n<td><strong>Exit interface</strong></td>\n<td>Cocok untuk link point-to-point; pada Ethernet kurang efisien</td>\n</tr>\n<tr>\n<td><strong>Fully specified</strong> (interface + next hop)</td>\n<td>Paling presisi; <strong>wajib</strong> untuk IPv6 bila next hop berupa alamat <strong>link-local</strong></td>\n</tr>\n</tbody>\n</table>\n<h3>3.3.a Default Route</h3>\n<p>Mengarahkan <strong>semua trafik</strong> yang tidak punya rute spesifik; dipakai mis. untuk arah ke ISP/Internet.</p>\n<pre><code>! IPv4\nRouter(config)# ip route 0.0.0.0 0.0.0.0 203.0.113.1\n\n! IPv6\nRouter(config)# ipv6 route ::/0 2001:DB8:FF::1\n</code></pre>\n<h3>3.3.b Network Route</h3>\n<p>Rute ke <strong>seluruh jaringan/subnet</strong> tertentu.</p>\n<pre><code>! IPv4\nRouter(config)# ip route 192.168.20.0 255.255.255.0 10.1.1.2\n\n! IPv6\nRouter(config)# ipv6 route 2001:DB8:20::/64 2001:DB8:12::2\n\n! IPv6 dengan next hop link-local (wajib sertakan exit interface)\nRouter(config)# ipv6 route 2001:DB8:20::/64 gigabitEthernet 0/0 FE80::2\n</code></pre>\n<h3>3.3.c Host Route</h3>\n<p>Rute ke <strong>satu host spesifik</strong>: IPv4 mask <strong>/32</strong> (255.255.255.255), IPv6 <strong>/128</strong>.</p>\n<pre><code>! IPv4\nRouter(config)# ip route 192.168.100.5 255.255.255.255 10.1.1.2\n\n! IPv6\nRouter(config)# ipv6 route 2001:DB8:100::5/128 2001:DB8:12::2\n</code></pre>\n<h3>3.3.d Floating Static</h3>\n<ul>\n<li>Rute statis cadangan (<em>backup</em>) dengan <strong>AD lebih tinggi</strong> daripada rute utama.</li>\n<li>Tidak dipasang di routing table selama rute utama aktif; <strong>baru dipakai</strong> saat rute utama hilang.</li>\n</ul>\n<pre><code>! Rute utama: static via ISP-A (AD 1); cadangan via ISP-B dengan AD 5\nRouter(config)# ip route 0.0.0.0 0.0.0.0 203.0.113.1\nRouter(config)# ip route 0.0.0.0 0.0.0.0 198.51.100.1 5\n\n! Backup untuk rute yang dipelajari OSPF (AD 110) → pakai AD &gt; 110\nRouter(config)# ip route 192.168.50.0 255.255.255.0 203.0.113.6 130\n\n! IPv6\nRouter(config)# ipv6 route 2001:DB8:50::/64 2001:DB8:FF::2 130\n</code></pre>\n<blockquote>\n<p>Syarat: AD floating static harus <strong>lebih besar</strong> dari AD rute utama.</p>\n</blockquote>\n<h3>Verifikasi static route</h3>\n<pre><code>Router# show ip route\nRouter# show ip route static\nRouter# show ipv6 route static\nRouter# show running-config | include ip route\nRouter# ping 192.168.20.1\nRouter# traceroute 192.168.20.1\n</code></pre>", "raw": "**Static route** adalah rute yang dikonfigurasi **manual** oleh administrator.\n\n- Kelebihan: sederhana, tanpa overhead protokol routing, AD rendah (1).\n- Kekurangan: tidak beradaptasi otomatis terhadap perubahan topologi; sulit diskalakan.\n\n### Sintaks\n\n```\n! IPv4\nRouter(config)# ip route <prefix> <mask> {<next-hop> | <exit-interface> | <exit-interface> <next-hop>} [AD]\n\n! IPv6 (aktifkan routing IPv6 terlebih dahulu)\nRouter(config)# ipv6 unicast-routing\nRouter(config)# ipv6 route <prefix>/<length> {<next-hop> | <exit-interface> | <exit-interface> <next-hop>} [AD]\n```\n\n**Pilihan penentuan tujuan:**\n\n| Bentuk | Keterangan |\n|---|---|\n| **Next-hop IP** | Router mencari exit interface melalui *recursive lookup* |\n| **Exit interface** | Cocok untuk link point-to-point; pada Ethernet kurang efisien |\n| **Fully specified** (interface + next hop) | Paling presisi; **wajib** untuk IPv6 bila next hop berupa alamat **link-local** |\n\n### 3.3.a Default Route\n\nMengarahkan **semua trafik** yang tidak punya rute spesifik; dipakai mis. untuk arah ke ISP/Internet.\n\n```\n! IPv4\nRouter(config)# ip route 0.0.0.0 0.0.0.0 203.0.113.1\n\n! IPv6\nRouter(config)# ipv6 route ::/0 2001:DB8:FF::1\n```\n\n### 3.3.b Network Route\n\nRute ke **seluruh jaringan/subnet** tertentu.\n\n```\n! IPv4\nRouter(config)# ip route 192.168.20.0 255.255.255.0 10.1.1.2\n\n! IPv6\nRouter(config)# ipv6 route 2001:DB8:20::/64 2001:DB8:12::2\n\n! IPv6 dengan next hop link-local (wajib sertakan exit interface)\nRouter(config)# ipv6 route 2001:DB8:20::/64 gigabitEthernet 0/0 FE80::2\n```\n\n### 3.3.c Host Route\n\nRute ke **satu host spesifik**: IPv4 mask **/32** (255.255.255.255), IPv6 **/128**.\n\n```\n! IPv4\nRouter(config)# ip route 192.168.100.5 255.255.255.255 10.1.1.2\n\n! IPv6\nRouter(config)# ipv6 route 2001:DB8:100::5/128 2001:DB8:12::2\n```\n\n### 3.3.d Floating Static\n\n- Rute statis cadangan (*backup*) dengan **AD lebih tinggi** daripada rute utama.\n- Tidak dipasang di routing table selama rute utama aktif; **baru dipakai** saat rute utama hilang.\n\n```\n! Rute utama: static via ISP-A (AD 1); cadangan via ISP-B dengan AD 5\nRouter(config)# ip route 0.0.0.0 0.0.0.0 203.0.113.1\nRouter(config)# ip route 0.0.0.0 0.0.0.0 198.51.100.1 5\n\n! Backup untuk rute yang dipelajari OSPF (AD 110) → pakai AD > 110\nRouter(config)# ip route 192.168.50.0 255.255.255.0 203.0.113.6 130\n\n! IPv6\nRouter(config)# ipv6 route 2001:DB8:50::/64 2001:DB8:FF::2 130\n```\n\n> Syarat: AD floating static harus **lebih besar** dari AD rute utama.\n\n### Verifikasi static route\n\n```\nRouter# show ip route\nRouter# show ip route static\nRouter# show ipv6 route static\nRouter# show running-config | include ip route\nRouter# ping 192.168.20.1\nRouter# traceroute 192.168.20.1\n```"}, {"id": "sum-3-4", "label": "3.4 Single area OSPFv2", "title": "3.4 Single area OSPFv2", "html": "<h3>Konsep dasar</h3>\n<ul>\n<li><strong>OSPF (Open Shortest Path First)</strong>: protokol routing <strong>link-state</strong> untuk <strong>IPv4</strong> (OSPFv2), standar terbuka, AD <strong>110</strong>, metric <strong>cost</strong>.</li>\n<li>Setiap router membangun <strong>LSDB</strong> (<em>Link-State Database</em>) yang sama, lalu menjalankan algoritma <strong>SPF (Dijkstra)</strong> untuk menghitung jalur terbaik.</li>\n<li><strong>Single area:</strong> seluruh router berada pada <strong>satu area</strong>, yaitu <strong>Area 0</strong> (backbone).</li>\n<li>Berjalan langsung di atas IP (<strong>protocol number 89</strong>) dengan alamat multicast:</li>\n<li><strong>224.0.0.5</strong> — semua router OSPF</li>\n<li><strong>224.0.0.6</strong> — DR dan BDR</li>\n</ul>\n<h3>3.4.a Neighbor adjacencies</h3>\n<p><strong>Tahapan terbentuknya adjacency:</strong></p>\n<table>\n<thead>\n<tr>\n<th>State</th>\n<th>Keterangan</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Down</strong></td>\n<td>Belum ada Hello dari neighbor</td>\n</tr>\n<tr>\n<td><strong>Init</strong></td>\n<td>Hello diterima, tetapi router sendiri belum terlihat di Hello neighbor</td>\n</tr>\n<tr>\n<td><strong>2-Way</strong></td>\n<td>Komunikasi dua arah; Router ID saling terlihat (DR/BDR dipilih pada tahap ini di jaringan broadcast)</td>\n</tr>\n<tr>\n<td><strong>ExStart</strong></td>\n<td>Menentukan master/slave untuk pertukaran database</td>\n</tr>\n<tr>\n<td><strong>Exchange</strong></td>\n<td>Bertukar ringkasan database (DBD)</td>\n</tr>\n<tr>\n<td><strong>Loading</strong></td>\n<td>Meminta (LSR) dan menerima (LSU) LSA yang belum dimiliki</td>\n</tr>\n<tr>\n<td><strong>Full</strong></td>\n<td>Database tersinkron; adjacency penuh</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Syarat agar dua router menjadi neighbor</strong> (parameter yang harus cocok/benar):</p>\n<ul>\n<li>Berada pada <strong>area yang sama</strong></li>\n<li><strong>Subnet dan mask</strong> yang sama pada link</li>\n<li><strong>Hello dan dead timer</strong> sama (default <strong>10 s / 40 s</strong> pada broadcast &amp; point-to-point)</li>\n<li><strong>Router ID unik</strong> (tidak boleh sama)</li>\n<li><strong>Authentication</strong> (bila dipakai) cocok</li>\n<li><strong>MTU</strong> dan tipe area yang kompatibel</li>\n</ul>\n<h3>3.4.b Point-to-point</h3>\n<ul>\n<li>Link yang menghubungkan <strong>tepat dua router</strong> (mis. link serial atau Ethernet yang dikonfigurasi point-to-point).</li>\n<li><strong>Tidak ada pemilihan DR/BDR</strong>; kedua router langsung membentuk adjacency <strong>Full</strong>.</li>\n<li>Konvergensi lebih sederhana dan cepat.</li>\n</ul>\n<pre><code>Router(config-if)# ip ospf network point-to-point\n</code></pre>\n<h3>3.4.c Broadcast (DR/BDR selection)</h3>\n<ul>\n<li><strong>Network type default pada interface Ethernet</strong> adalah <strong>broadcast</strong> (multi-access).</li>\n<li>Untuk mengurangi jumlah adjacency dan trafik LSA, dipilih:</li>\n<li><strong>DR</strong> (<em>Designated Router</em>) — pusat pertukaran LSA pada segmen</li>\n<li><strong>BDR</strong> (<em>Backup Designated Router</em>) — cadangan DR</li>\n<li><strong>DROther</strong> — router lainnya</li>\n</ul>\n<p><strong>Aturan pemilihan DR/BDR (per segmen):</strong></p>\n<ol>\n<li><strong>OSPF priority tertinggi</strong> (default <strong>1</strong>; nilai <strong>0</strong> = tidak pernah menjadi DR/BDR).</li>\n<li>Jika seri, <strong>Router ID tertinggi</strong>.</li>\n<li><strong>Non-preemptive</strong>: DR/BDR yang sudah terpilih <strong>tidak digantikan</strong> meski ada router baru dengan priority lebih tinggi (kecuali proses OSPF di-reset).</li>\n</ol>\n<p><strong>Hubungan adjacency:</strong></p>\n<table>\n<thead>\n<tr>\n<th>Pasangan</th>\n<th>State</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>DROther ↔ DR / BDR</td>\n<td><strong>Full</strong></td>\n</tr>\n<tr>\n<td>DROther ↔ DROther</td>\n<td><strong>2-Way</strong></td>\n</tr>\n</tbody>\n</table>\n<pre><code>Router(config-if)# ip ospf priority 100     ! naikkan peluang menjadi DR\nRouter(config-if)# ip ospf priority 0       ! tidak ikut pemilihan DR/BDR\n</code></pre>\n<h3>3.4.d Router ID</h3>\n<ul>\n<li>Identitas unik router OSPF berformat <strong>32 bit</strong> (ditulis seperti alamat IPv4, mis. <code>1.1.1.1</code>).</li>\n</ul>\n<p><strong>Urutan pemilihan Router ID:</strong></p>\n<ol>\n<li>Dikonfigurasi manual dengan perintah <strong><code>router-id</code></strong></li>\n<li>Jika tidak ada → <strong>alamat IP loopback tertinggi</strong> yang aktif</li>\n<li>\n<p>Jika tidak ada loopback → <strong>alamat IP interface fisik aktif tertinggi</strong></p>\n</li>\n<li>\n<p>Perubahan Router ID baru berlaku setelah <strong><code>clear ip ospf process</code></strong> atau reload.</p>\n</li>\n</ol>\n<h3>Konfigurasi OSPFv2 (single area)</h3>\n<p><strong>Metode 1 — perintah <code>network</code>:</strong></p>\n<pre><code>Router(config)# router ospf 1                          ! process ID (lokal, tidak harus sama)\nRouter(config-router)# router-id 1.1.1.1\nRouter(config-router)# network 10.1.1.0 0.0.0.255 area 0\nRouter(config-router)# network 192.168.10.0 0.0.0.255 area 0\nRouter(config-router)# passive-interface gigabitEthernet 0/1   ! tidak mengirim Hello (mis. ke LAN pengguna)\n</code></pre>\n<p><strong>Metode 2 — langsung pada interface:</strong></p>\n<pre><code>Router(config)# interface gigabitEthernet 0/0\nRouter(config-if)# ip ospf 1 area 0\n</code></pre>\n<p><strong>Wildcard mask</strong> (kebalikan dari subnet mask), dipakai pada perintah <code>network</code>:</p>\n<table>\n<thead>\n<tr>\n<th>Prefix</th>\n<th>Subnet mask</th>\n<th>Wildcard mask</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>/24</td>\n<td>255.255.255.0</td>\n<td>0.0.0.255</td>\n</tr>\n<tr>\n<td>/30</td>\n<td>255.255.255.252</td>\n<td>0.0.0.3</td>\n</tr>\n<tr>\n<td>/32 (host)</td>\n<td>255.255.255.255</td>\n<td>0.0.0.0</td>\n</tr>\n</tbody>\n</table>\n<h3>Verifikasi OSPFv2</h3>\n<pre><code>Router# show ip ospf neighbor\nRouter# show ip ospf interface\nRouter# show ip ospf interface brief\nRouter# show ip protocols\nRouter# show ip route ospf\nRouter# show ip ospf\n</code></pre>\n<p><strong>Contoh <code>show ip ospf neighbor</code>:</strong></p>\n<pre><code>Neighbor ID     Pri   State        Dead Time   Address       Interface\n2.2.2.2           1   FULL/DR      00:00:35    10.1.1.2      GigabitEthernet0/0\n3.3.3.3           1   FULL/BDR     00:00:33    10.1.1.3      GigabitEthernet0/0\n</code></pre>\n<table>\n<thead>\n<tr>\n<th>Tampilan state</th>\n<th>Arti</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>FULL/DR</code></td>\n<td>Adjacency penuh dengan neighbor yang menjadi DR</td>\n</tr>\n<tr>\n<td><code>FULL/BDR</code></td>\n<td>Adjacency penuh dengan BDR</td>\n</tr>\n<tr>\n<td><code>FULL/DROTHER</code></td>\n<td>Adjacency penuh dengan router DROther (terjadi bila router lokal adalah DR/BDR)</td>\n</tr>\n<tr>\n<td><code>2WAY/DROTHER</code></td>\n<td>Hanya 2-Way dengan sesama DROther (normal)</td>\n</tr>\n<tr>\n<td><code>FULL/ -</code></td>\n<td>Adjacency penuh pada link point-to-point (tidak ada DR/BDR)</td>\n</tr>\n</tbody>\n</table>", "raw": "### Konsep dasar\n\n- **OSPF (Open Shortest Path First)**: protokol routing **link-state** untuk **IPv4** (OSPFv2), standar terbuka, AD **110**, metric **cost**.\n- Setiap router membangun **LSDB** (*Link-State Database*) yang sama, lalu menjalankan algoritma **SPF (Dijkstra)** untuk menghitung jalur terbaik.\n- **Single area:** seluruh router berada pada **satu area**, yaitu **Area 0** (backbone).\n- Berjalan lan
