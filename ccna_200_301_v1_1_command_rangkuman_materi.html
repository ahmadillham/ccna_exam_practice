engguna/perangkat** ↔ jaringan perusahaan |\n| Ujung tunnel | **Gateway** (router/firewall) di kedua sisi | **Perangkat pengguna** (dengan VPN client) ↔ gateway VPN |\n| Bagi pengguna | **Transparan** (host tidak menjalankan software VPN) | Pengguna **menjalankan VPN client** (mis. Cisco Secure Client/AnyConnect) |\n| Sifat koneksi | Umumnya **permanen** (always-on) | **Sesuai kebutuhan** (on-demand) |\n| Contoh | Router cabang ↔ router pusat | Karyawan WFH terhubung ke kantor |\n\n### Layanan yang diberikan IPsec\n\n| Layanan | Penjelasan | Mekanisme |\n|---|---|---|\n| **Confidentiality** | Data dienkripsi | AES (disarankan), 3DES, DES (usang) |\n| **Integrity** | Data tidak diubah | Hash/HMAC (SHA; MD5 usang) |\n| **Authentication** | Memastikan identitas peer | **Pre-shared key** atau **sertifikat digital** |\n| **Anti-replay** | Menolak paket yang diputar ulang | Nomor urut |\n| **Key exchange** | Pertukaran kunci aman | **Diffie-Hellman** |\n\n### Komponen protokol IPsec\n\n| Protokol | Fungsi | Detail |\n|---|---|---|\n| **IKE** (IKEv1/IKEv2) | Negosiasi parameter dan **membangun Security Association (SA)** serta mengelola kunci | **UDP 500** (UDP 4500 untuk NAT-T) |\n| **ESP** (*Encapsulating Security Payload*) | **Enkripsi + integritas + autentikasi** | IP protocol **50** (paling umum dipakai) |\n| **AH** (*Authentication Header*) | **Integritas + autentikasi**, **tanpa enkripsi** | IP protocol **51** |\n\n**Tahapan IKE (IKEv1):**\n\n1. **Phase 1** — membangun **IKE SA** (kanal aman antar peer; autentikasi peer dan pertukaran kunci).\n2. **Phase 2** — membangun **IPsec SA** (parameter yang melindungi data pengguna).\n\n### Mode IPsec\n\n| Mode | Perilaku | Penggunaan |\n|---|---|---|\n| **Tunnel mode** | **Seluruh paket asli** dienkapsulasi dan diberi **header IP baru** | **Site-to-site** (antar gateway), umum pada remote access |\n| **Transport mode** | Hanya **payload** dilindungi; **header IP asli** dipertahankan | Komunikasi **host-to-host** langsung |"}, {"id": "sum-5-6", "label": "5.6 Access Control List (ACL)", "title": "5.6 Access Control List (ACL)", "html": "<h3>Konsep</h3>\n<ul>\n<li><strong>ACL</strong> adalah daftar aturan <strong>permit/deny</strong> yang menyaring paket berdasarkan kriteria (alamat, protokol, port).</li>\n<li><strong>Diproses berurutan dari atas ke bawah</strong>; <strong>berhenti pada kecocokan pertama</strong>.</li>\n<li>Di akhir ada <strong>implicit deny any</strong> — paket yang tidak cocok aturan mana pun <strong>dibuang</strong>.</li>\n<li>Hanya <strong>satu ACL per protokol, per arah, per interface</strong>.</li>\n<li>Arah: <strong>inbound</strong> (masuk interface) atau <strong>outbound</strong> (keluar interface).</li>\n</ul>\n<h3>Jenis ACL</h3>\n<table>\n<thead>\n<tr>\n<th>Aspek</th>\n<th><strong>Standard ACL</strong></th>\n<th><strong>Extended ACL</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Nomor</td>\n<td><strong>1–99</strong>, 1300–1999</td>\n<td><strong>100–199</strong>, 2000–2699</td>\n</tr>\n<tr>\n<td>Kriteria</td>\n<td><strong>Hanya alamat IP sumber</strong></td>\n<td><strong>Protokol, sumber, tujuan, dan port</strong></td>\n</tr>\n<tr>\n<td>Penempatan</td>\n<td><strong>Dekat tujuan</strong></td>\n<td><strong>Dekat sumber</strong></td>\n</tr>\n<tr>\n<td>Bentuk</td>\n<td>Numbered atau <strong>named</strong></td>\n<td>Numbered atau <strong>named</strong></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Wildcard mask:</strong> kebalikan subnet mask (<code>0</code> = harus cocok, <code>1</code> = diabaikan).</p>\n<table>\n<thead>\n<tr>\n<th>Keyword</th>\n<th>Arti</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>host 10.1.1.1</code></td>\n<td>Sama dengan <code>10.1.1.1 0.0.0.0</code></td>\n</tr>\n<tr>\n<td><code>any</code></td>\n<td>Sama dengan <code>0.0.0.0 255.255.255.255</code></td>\n</tr>\n<tr>\n<td><code>192.168.1.0 0.0.0.255</code></td>\n<td>Seluruh subnet 192.168.1.0/24</td>\n</tr>\n</tbody>\n</table>\n<h3>Konfigurasi</h3>\n<p><strong>Standard ACL:</strong></p>\n<pre><code>! Numbered\nRouter(config)# access-list 10 permit 192.168.1.0 0.0.0.255\n\n! Named\nRouter(config)# ip access-list standard BLOCK_HOST\nRouter(config-std-nacl)# deny host 192.168.1.50\nRouter(config-std-nacl)# permit any\n</code></pre>\n<p><strong>Extended ACL:</strong></p>\n<pre><code>! Sintaks: permit|deny &lt;protokol&gt; &lt;sumber&gt; &lt;wildcard&gt; [operator port] &lt;tujuan&gt; &lt;wildcard&gt; [operator port]\n\nRouter(config)# ip access-list extended WEB_ONLY\nRouter(config-ext-nacl)# remark Izinkan web dari LAN\nRouter(config-ext-nacl)# permit tcp 192.168.1.0 0.0.0.255 any eq 80\nRouter(config-ext-nacl)# permit tcp 192.168.1.0 0.0.0.255 any eq 443\nRouter(config-ext-nacl)# deny ip any any log\n\n! Numbered\nRouter(config)# access-list 110 permit tcp 192.168.1.0 0.0.0.255 host 10.1.1.10 eq 22\n</code></pre>\n<blockquote>\n<p>Operator port: <code>eq</code> (sama dengan), <code>neq</code>, <code>gt</code>, <code>lt</code>, <code>range</code>.</p>\n</blockquote>\n<p><strong>Menerapkan ACL:</strong></p>\n<pre><code>! Pada interface\nRouter(config)# interface gigabitEthernet 0/0\nRouter(config-if)# ip access-group WEB_ONLY in      ! atau out\n\n! Membatasi akses remote (VTY)\nRouter(config)# line vty 0 15\nRouter(config-line)# access-class 10 in\n</code></pre>\n<p><strong>Mengedit named ACL (nomor urut):</strong></p>\n<pre><code>Router(config)# ip access-list extended WEB_ONLY\nRouter(config-ext-nacl)# 15 permit tcp 192.168.1.0 0.0.0.255 any eq 8080   ! sisipkan pada urutan 15\nRouter(config-ext-nacl)# no 20                                             ! hapus entri urutan 20\n</code></pre>\n<h3>Verifikasi</h3>\n<pre><code>Router# show access-lists\nRouter# show ip access-lists WEB_ONLY\nRouter# show ip interface gigabitEthernet 0/0      ! menampilkan ACL inbound/outbound\nRouter# show running-config | section access-list\n</code></pre>\n<ul>\n<li><code>show access-lists</code> menampilkan <strong>hit counter</strong> (<code>matches</code>) pada tiap entri.</li>\n</ul>", "raw": "### Konsep\n\n- **ACL** adalah daftar aturan **permit/deny** yang menyaring paket berdasarkan kriteria (alamat, protokol, port).\n- **Diproses berurutan dari atas ke bawah**; **berhenti pada kecocokan pertama**.\n- Di akhir ada **implicit deny any** — paket yang tidak cocok aturan mana pun **dibuang**.\n- Hanya **satu ACL per protokol, per arah, per interface**.\n- Arah: **inbound** (masuk interface) atau **outbound** (keluar interface).\n\n### Jenis ACL\n\n| Aspek | **Standard ACL** | **Extended ACL** |\n|---|---|---|\n| Nomor | **1–99**, 1300–1999 | **100–199**, 2000–2699 |\n| Kriteria | **Hanya alamat IP sumber** | **Protokol, sumber, tujuan, dan port** |\n| Penempatan | **Dekat tujuan** | **Dekat sumber** |\n| Bentuk | Numbered atau **named** | Numbered atau **named** |\n\n**Wildcard mask:** kebalikan subnet mask (`0` = harus cocok, `1` = diabaikan).\n\n| Keyword | Arti |\n|---|---|\n| `host 10.1.1.1` | Sama dengan `10.1.1.1 0.0.0.0` |\n| `any` | Sama dengan `0.0.0.0 255.255.255.255` |\n| `192.168.1.0 0.0.0.255` | Seluruh subnet 192.168.1.0/24 |\n\n### Konfigurasi\n\n**Standard ACL:**\n\n```\n! Numbered\nRouter(config)# access-list 10 permit 192.168.1.0 0.0.0.255\n\n! Named\nRouter(config)# ip access-list standard BLOCK_HOST\nRouter(config-std-nacl)# deny host 192.168.1.50\nRouter(config-std-nacl)# permit any\n```\n\n**Extended ACL:**\n\n```\n! Sintaks: permit|deny <protokol> <sumber> <wildcard> [operator port] <tujuan> <wildcard> [operator port]\n\nRouter(config)# ip access-list extended WEB_ONLY\nRouter(config-ext-nacl)# remark Izinkan web dari LAN\nRouter(config-ext-nacl)# permit tcp 192.168.1.0 0.0.0.255 any eq 80\nRouter(config-ext-nacl)# permit tcp 192.168.1.0 0.0.0.255 any eq 443\nRouter(config-ext-nacl)# deny ip any any log\n\n! Numbered\nRouter(config)# access-list 110 permit tcp 192.168.1.0 0.0.0.255 host 10.1.1.10 eq 22\n```\n\n> Operator port: `eq` (sama dengan), `neq`, `gt`, `lt`, `range`.\n\n**Menerapkan ACL:**\n\n```\n! Pada interface\nRouter(config)# interface gigabitEthernet 0/0\nRouter(config-if)# ip access-group WEB_ONLY in      ! atau out\n\n! Membatasi akses remote (VTY)\nRouter(config)# line vty 0 15\nRouter(config-line)# access-class 10 in\n```\n\n**Mengedit named ACL (nomor urut):**\n\n```\nRouter(config)# ip access-list extended WEB_ONLY\nRouter(config-ext-nacl)# 15 permit tcp 192.168.1.0 0.0.0.255 any eq 8080   ! sisipkan pada urutan 15\nRouter(config-ext-nacl)# no 20                                             ! hapus entri urutan 20\n```\n\n### Verifikasi\n\n```\nRouter# show access-lists\nRouter# show ip access-lists WEB_ONLY\nRouter# show ip interface gigabitEthernet 0/0      ! menampilkan ACL inbound/outbound\nRouter# show running-config | section access-list\n```\n\n- `show access-lists` menampilkan **hit counter** (`matches`) pada tiap entri."}, {"id": "sum-5-7", "label": "5.7 Fitur keamanan Layer 2", "title": "5.7 Fitur keamanan Layer 2", "html": "<p>Melindungi dari serangan di <strong>jaringan LAN</strong> (pada switch).</p>\n<h3>DHCP Snooping</h3>\n<p><strong>Fungsi:</strong> bertindak seperti \"firewall\" antara host yang tidak tepercaya dan server DHCP yang sah.</p>\n<ul>\n<li>Mencegah <strong>rogue DHCP server</strong> (server DHCP palsu) dan membantu mitigasi <strong>DHCP starvation</strong>.</li>\n<li>Port dibagi menjadi:</li>\n<li><strong>Trusted</strong> — port ke <strong>server DHCP sah / uplink</strong> (pesan DHCP server diizinkan).</li>\n<li><strong>Untrusted</strong> — port ke <strong>client</strong> (pesan DHCP server, mis. Offer/Ack, <strong>diblokir</strong>).</li>\n<li>Membangun <strong>DHCP snooping binding table</strong> (MAC, IP, VLAN, port, lease) yang juga dipakai DAI.</li>\n</ul>\n<pre><code>Switch(config)# ip dhcp snooping\nSwitch(config)# ip dhcp snooping vlan 10,20\n\nSwitch(config)# interface gigabitEthernet 0/1          ! uplink / ke server DHCP\nSwitch(config-if)# ip dhcp snooping trust\n\nSwitch(config)# interface range fastEthernet 0/1 - 24  ! port client (untrusted, default)\nSwitch(config-if-range)# ip dhcp snooping limit rate 15\n\nSwitch# show ip dhcp snooping\nSwitch# show ip dhcp snooping binding\n</code></pre>\n<h3>Dynamic ARP Inspection (DAI)</h3>\n<p><strong>Fungsi:</strong> memvalidasi <strong>paket ARP</strong> agar tidak dipalsukan (<strong>ARP spoofing/poisoning</strong>, dasar serangan MITM).</p>\n<ul>\n<li>Membandingkan pasangan <strong>IP–MAC</strong> pada ARP dengan <strong>DHCP snooping binding table</strong> (atau ARP ACL statis).</li>\n<li>ARP tidak valid pada port <strong>untrusted</strong> → <strong>dibuang</strong> (dan dilog).</li>\n<li>Port dibagi <strong>trusted</strong> (mis. uplink antar switch) dan <strong>untrusted</strong> (port client; default).</li>\n<li>Bergantung pada <strong>DHCP snooping</strong> untuk tabel binding.</li>\n</ul>\n<pre><code>Switch(config)# ip arp inspection vlan 10,20\n\nSwitch(config)# interface gigabitEthernet 0/1         ! uplink\nSwitch(config-if)# ip arp inspection trust\n\nSwitch(config-if)# ip arp inspection limit rate 15    ! (opsional) batasi laju ARP pada port client\n\n! Validasi tambahan (opsional)\nSwitch(config)# ip arp inspection validate src-mac dst-mac ip\n\nSwitch# show ip arp inspection\nSwitch# show ip arp inspection interfaces\nSwitch# show ip arp inspection vlan 10\n</code></pre>\n<h3>Port Security</h3>\n<p><strong>Fungsi:</strong> membatasi <strong>MAC address</strong> yang boleh memakai sebuah port, mencegah <strong>MAC flooding</strong> dan perangkat tidak sah.</p>\n<ul>\n<li>Diterapkan pada port <strong>access</strong> (atau trunk statis), bukan pada port dinamis.</li>\n<li>Jenis pembelajaran MAC: <strong>static</strong>, <strong>dynamic</strong> (hilang saat reload), dan <strong>sticky</strong> (dipelajari otomatis dan disimpan di running-config).</li>\n<li>Default: <strong>maksimum 1 MAC</strong>, <strong>violation = shutdown</strong>.</li>\n</ul>\n<pre><code>Switch(config)# interface fastEthernet 0/1\nSwitch(config-if)# switchport mode access\nSwitch(config-if)# switchport port-security\nSwitch(config-if)# switchport port-security maximum 2\nSwitch(config-if)# switchport port-security mac-address 0050.7966.6800     ! static\nSwitch(config-if)# switchport port-security mac-address sticky              ! sticky\nSwitch(config-if)# switchport port-security violation shutdown              ! protect | restrict | shutdown\n</code></pre>\n<p><strong>Mode violation:</strong></p>\n<table>\n<thead>\n<tr>\n<th>Mode</th>\n<th>Frame pelanggar</th>\n<th>Log / SNMP trap</th>\n<th>Counter violation</th>\n<th>Port</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Protect</strong></td>\n<td>Dibuang</td>\n<td>Tidak</td>\n<td>Tidak bertambah</td>\n<td>Tetap <strong>up</strong></td>\n</tr>\n<tr>\n<td><strong>Restrict</strong></td>\n<td>Dibuang</td>\n<td><strong>Ya</strong></td>\n<td><strong>Bertambah</strong></td>\n<td>Tetap <strong>up</strong></td>\n</tr>\n<tr>\n<td><strong>Shutdown</strong> (default)</td>\n<td>Port dimatikan</td>\n<td><strong>Ya</strong></td>\n<td>Bertambah</td>\n<td><strong>err-disabled</strong></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Memulihkan port err-disabled:</strong></p>\n<pre><code>Switch(config-if)# shutdown\nSwitch(config-if)# no shutdown\n! atau otomatis:\nSwitch(config)# errdisable recovery cause psecure-violation\n</code></pre>\n<p><strong>Verifikasi:</strong></p>\n<pre><code>Switch# show port-security\nSwitch# show port-security interface fastEthernet 0/1\nSwitch# show port-security address\nSwitch# show interfaces status err-disabled\n</code></pre>", "raw": "Melindungi dari serangan di **jaringan LAN** (pada switch).\n\n### DHCP Snooping\n\n**Fungsi:** bertindak seperti \"firewall\" antara host yang tidak tepercaya dan server DHCP yang sah.\n\n- Mencegah **rogue DHCP server** (server DHCP palsu) dan membantu mitigasi **DHCP starvation**.\n- Port dibagi menjadi:\n  - **Trusted** — port ke **server DHCP sah / uplink** (pesan DHCP server diizinkan).\n  - **Untrusted** — port ke **client** (pesan DHCP server, mis. Offer/Ack, **diblokir**).\n- Membangun **DHCP snooping binding table** (MAC, IP, VLAN, port, lease) yang juga dipakai DAI.\n\n```\nSwitch(config)# ip dhcp snooping\nSwitch(config)# ip dhcp snooping vlan 10,20\n\nSwitch(config)# interface gigabitEthernet 0/1          ! uplink / ke server DHCP\nSwitch(config-if)# ip dhcp snooping trust\n\nSwitch(config)# interface range fastEthernet 0/1 - 24  ! port client (untrusted, default)\nSwitch(config-if-range)# ip dhcp snooping limit rate 15\n\nSwitch# show ip dhcp snooping\nSwitch# show ip dhcp snooping binding\n```\n\n### Dynamic ARP Inspection (DAI)\n\n**Fungsi:** memvalidasi **paket ARP** agar tidak dipalsukan (**ARP spoofing/poisoning**, dasar serangan MITM).\n\n- Membandingkan pasangan **IP–MAC** pada ARP dengan **DHCP snooping binding table** (atau ARP ACL statis).\n- ARP tidak valid pada port **untrusted** → **dibuang** (dan dilog).\n- Port dibagi **trusted** (mis. uplink antar switch) dan **untrusted** (port client; default).\n- Bergantung pada **DHCP snooping** untuk tabel binding.\n\n```\nSwitch(config)# ip arp inspection vlan 10,20\n\nSwitch(config)# interface gigabitEthernet 0/1         ! uplink\nSwitch(config-if)# ip arp inspection trust\n\nSwitch(config-if)# ip arp inspection limit rate 15    ! (opsional) batasi laju ARP pada port client\n\n! Validasi tambahan (opsional)\nSwitch(config)# ip arp inspection validate src-mac dst-mac ip\n\nSwitch# show ip arp inspection\nSwitch# show ip arp inspection interfaces\nSwitch# show ip arp inspection vlan 10\n```\n\n### Port Security\n\n**Fungsi:** membatasi **MAC address** yang boleh memakai sebuah port, mencegah **MAC flooding** dan perangkat tidak sah.\n\n- Diterapkan pada port **access** (atau trunk statis), bukan pada port dinamis.\n- Jenis pembelajaran MAC: **static**, **dynamic** (hilang saat reload), dan **sticky** (dipelajari otomatis dan disimpan di running-config).\n- Default: **maksimum 1 MAC**, **violation = shutdown**.\n\n```\nSwitch(config)# interface fastEthernet 0/1\nSwitch(config-if)# switchport mode access\nSwitch(config-if)# switchport port-security\nSwitch(config-if)# switchport port-security maximum 2\nSwitch(config-if)# switchport port-security mac-address 0050.7966.6800     ! static\nSwitch(config-if)# switchport port-security mac-address sticky              ! sticky\nSwitch(config-if)# switchport port-security violation shutdown              ! protect | restrict | shutdown\n```\n\n**Mode violation:**\n\n| Mode | Frame pelanggar | Log / SNMP trap | Counter violation | Port |\n|---|---|---|---|---|\n| **Protect** | Dibuang | Tidak | Tidak bertambah | Tetap **up** |\n| **Restrict** | Dibuang | **Ya** | **Bertambah** | Tetap **up** |\n| **Shutdown** (default) | Port dimatikan | **Ya** | Bertambah | **err-disabled** |\n\n**Memulihkan port err-disabled:**\n\n```\nSwitch(config-if)# shutdown\nSwitch(config-if)# no shutdown\n! atau otomatis:\nSwitch(config)# errdisable recovery cause psecure-violation\n```\n\n**Verifikasi:**\n\n```\nSwitch# show port-security\nSwitch# show port-security interface fastEthernet 0/1\nSwitch# show port-security address\nSwitch# show interfaces status err-disabled\n```"}, {"id": "sum-5-8", "label": "5.8 Authentication, Authorization, Accounting (AAA)", "title": "5.8 Authentication, Authorization, Accounting (AAA)", "html": "<h3>Perbandingan konsep</h3>\n<table>\n<thead>\n<tr>\n<th>Komponen</th>\n<th>Pertanyaan</th>\n<th>Fungsi</th>\n<th>Contoh</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Authentication</strong></td>\n<td><em>Siapa Anda?</em></td>\n<td><strong>Memverifikasi identitas</strong> pengguna/perangkat</td>\n<td>Username + password, MFA, sertifikat</td>\n</tr>\n<tr>\n<td><strong>Authorization</strong></td>\n<td><em>Apa yang boleh Anda lakukan?</em></td>\n<td><strong>Menentukan hak akses/izin</strong> setelah terautentikasi</td>\n<td>Boleh <code>show</code> saja, atau boleh konfigurasi (privilege level, daftar perintah)</td>\n</tr>\n<tr>\n<td><strong>Accounting</strong></td>\n<td><em>Apa yang telah Anda lakukan?</em></td>\n<td><strong>Mencatat aktivitas dan penggunaan</strong></td>\n<td>Log login, durasi sesi, perintah yang dijalankan (audit, billing)</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Urutan:</strong> Authentication → Authorization → Accounting.</p>", "raw": "### Perbandingan konsep\n\n| Komponen | Pertanyaan | Fungsi | Contoh |\n|---|---|---|---|\n| **Authentication** | *Siapa Anda?* | **Memverifikasi identitas** pengguna/perangkat | Username + password, MFA, sertifikat |\n| **Authorization** | *Apa yang boleh Anda lakukan?* | **Menentukan hak akses/izin** setelah terautentikasi | Boleh `show` saja, atau boleh konfigurasi (privilege level, daftar perintah) |\n| **Accounting** | *Apa yang telah Anda lakukan?* | **Mencatat aktivitas dan penggunaan** | Log login, durasi sesi, perintah yang dijalankan (audit, billing) |\n\n**Urutan:** Authentication → Authorization → Accounting."}, {"id": "sum-5-9", "label": "5.9 Protokol keamanan wireless", "title": "5.9 Protokol keamanan wireless", "html": "<p>Melindungi WLAN dari penyadapan dan akses tidak sah melalui <strong>autentikasi</strong> dan <strong>enkripsi</strong>.</p>\n<h3>Mode autentikasi</h3>\n<table>\n<thead>\n<tr>\n<th>Mode</th>\n<th>Penjelasan</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Personal</strong></td>\n<td>Satu <strong>kunci bersama</strong> (PSK pada WPA/WPA2, SAE pada WPA3) untuk semua pengguna; cocok SOHO</td>\n</tr>\n<tr>\n<td><strong>Enterprise</strong></td>\n<td>Autentikasi per pengguna lewat <strong>802.1X</strong> dengan <strong>server RADIUS</strong> (EAP); cocok perusahaan</td>\n</tr>\n</tbody>\n</table>\n<h3>Perbandingan WPA, WPA2, WPA3</h3>\n<table>\n<thead>\n<tr>\n<th>Aspek</th>\n<th><strong>WPA</strong></th>\n<th><strong>WPA2</strong></th>\n<th><strong>WPA3</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Standar</td>\n<td>Wi-Fi Alliance (interim, 2003)</td>\n<td><strong>IEEE 802.11i</strong></td>\n<td>Wi-Fi Alliance (2018)</td>\n</tr>\n<tr>\n<td>Enkripsi</td>\n<td><strong>TKIP</strong> (berbasis RC4)</td>\n<td><strong>AES-CCMP</strong></td>\n<td><strong>AES-CCMP 128</strong> (Personal/Enterprise), <strong>GCMP-256</strong> (Enterprise 192-bit)</td>\n</tr>\n<tr>\n<td>Integritas</td>\n<td>MIC (<em>Michael</em>)</td>\n<td>CCMP (CBC-MAC)</td>\n<td>CCMP/GCMP</td>\n</tr>\n<tr>\n<td>Autentikasi Personal</td>\n<td><strong>PSK</strong></td>\n<td><strong>PSK</strong></td>\n<td><strong>SAE</strong> (<em>Simultaneous Authentication of Equals</em>)</td>\n</tr>\n<tr>\n<td>Autentikasi Enterprise</td>\n<td>802.1X</td>\n<td>802.1X</td>\n<td>802.1X (opsi 192-bit)</td>\n</tr>\n<tr>\n<td><strong>PMF</strong> (<em>Protected Management Frames</em>, 802.11w)</td>\n<td>Tidak</td>\n<td>Opsional</td>\n<td><strong>Wajib</strong></td>\n</tr>\n<tr>\n<td>Kelemahan/keunggulan</td>\n<td>Usang, TKIP lemah</td>\n<td>Aman bila PSK kuat; PSK rentan <strong>offline dictionary attack</strong></td>\n<td>Tahan offline dictionary attack, ada <strong>forward secrecy</strong></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Catatan WPA3:</strong></p>\n<ul>\n<li><strong>SAE</strong> menggantikan pertukaran PSK sehingga menangkap handshake tidak cukup untuk menebak password secara offline.</li>\n</ul>", "raw": "Melindungi WLAN dari penyadapan dan akses tidak sah melalui **autentikasi** dan **enkripsi**.\n\n### Mode autentikasi\n\n| Mode | Penjelasan |\n|---|---|\n| **Personal** | Satu **kunci bersama** (PSK pada WPA/WPA2, SAE pada WPA3) untuk semua pengguna; cocok SOHO |\n| **Enterprise** | Autentikasi per pengguna lewat **802.1X** dengan **server RADIUS** (EAP); cocok perusahaan |\n\n### Perbandingan WPA, WPA2, WPA3\n\n| Aspek | **WPA** | **WPA2** | **WPA3** |\n|---|---|---|---|\n| Standar | Wi-Fi Alliance (interim, 2003) | **IEEE 802.11i** | Wi-Fi Alliance (2018) |\n| Enkripsi | **TKIP** (berbasis RC4) | **AES-CCMP** | **AES-CCMP 128** (Personal/Enterprise), **GCMP-256** (Enterprise 192-bit) |\n| Integritas | MIC (*Michael*) | CCMP (CBC-MAC) | CCMP/GCMP |\n| Autentikasi Personal | **PSK** | **PSK** | **SAE** (*Simultaneous Authentication of Equals*) |\n| Autentikasi Enterprise | 802.1X | 802.1X | 802.1X (opsi 192-bit) |\n| **PMF** (*Protected Management Frames*, 802.11w) | Tidak | Opsional | **Wajib** |\n| Kelemahan/keunggulan | Usang, TKIP lemah | Aman bila PSK kuat; PSK rentan **offline dictionary attack** | Tahan offline dictionary attack, ada **forward secrecy** |\n\n**Catatan WPA3:**\n\n- **SAE** menggantikan pertukaran PSK sehingga menangkap handshake tidak cukup untuk menebak password secara offline."}, {"id": "sum-5-10", "label": "5.10 Konfigurasi WLAN di GUI dengan WPA2 PSK", "title": "5.10 Konfigurasi WLAN di GUI dengan WPA2 PSK", "html": "<p>Konfigurasi WLAN baru pada <strong>GUI Wireless LAN Controller (WLC)</strong> dengan keamanan <strong>WPA2 Personal (PSK)</strong>.</p>\n<h3>Langkah (GUI WLC Cisco — tampilan klasik/AireOS)</h3>\n<table>\n<thead>\n<tr>\n<th>No.</th>\n<th>Langkah</th>\n<th>Detail</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>Buka menu <strong>WLANs</strong></td>\n<td>Pada menu atas WLC</td>\n</tr>\n<tr>\n<td>2</td>\n<td>Pilih <strong>Create New</strong> → <strong>Go</strong></td>\n<td>Tipe: <strong>WLAN</strong></td>\n</tr>\n<tr>\n<td>3</td>\n<td>Isi <strong>Profile Name</strong>, <strong>SSID</strong>, <strong>ID</strong></td>\n<td>Contoh: Profile <code>Corp-WiFi</code>, SSID <code>Corp-WiFi</code>, ID <code>1</code> → <strong>Apply</strong></td>\n</tr>\n<tr>\n<td>4</td>\n<td>Tab <strong>General</strong></td>\n<td><strong>Status = Enabled</strong>; pilih <strong>Interface/Interface Group</strong> (VLAN tempat WLAN dipetakan)</td>\n</tr>\n<tr>\n<td>5</td>\n<td>Tab <strong>Security → Layer 2</strong></td>\n<td><strong>Layer 2 Security = WPA+WPA2</strong></td>\n</tr>\n<tr>\n<td>6</td>\n<td>Pada <strong>WPA+WPA2 Parameters</strong></td>\n<td>Centang <strong>WPA2 Policy</strong> dan <strong>WPA2 Encryption = AES</strong></td>\n</tr>\n<tr>\n<td>7</td>\n<td><strong>Authentication Key Management</strong></td>\n<td>Centang <strong>PSK</strong> (jangan 802.1X)</td>\n</tr>\n<tr>\n<td>8</td>\n<td><strong>PSK Format</strong> dan kunci</td>\n<td>Format <strong>ASCII</strong>; isi passphrase (<strong>8–63 karakter</strong> ASCII, atau 64 digit hex)</td>\n</tr>\n<tr>\n<td>9</td>\n<td>(Opsional) tab <strong>QoS</strong> dan <strong>Advanced</strong></td>\n<td>Atur sesuai kebutuhan (lihat 2.9)</td>\n</tr>\n<tr>\n<td>10</td>\n<td>Klik <strong>Apply</strong></td>\n<td>Simpan konfigurasi</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p><strong>Prasyarat:</strong> AP sudah terdaftar (<em>joined</em>) ke WLC dan VLAN/interface yang dipilih tersedia pada trunk WLC (lihat 2.7).</p>\n</blockquote>\n<h3>Verifikasi</h3>\n<table>\n<thead>\n<tr>\n<th>Lokasi GUI</th>\n<th>Yang diperiksa</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>WLANs</strong> (daftar WLAN)</td>\n<td><strong>Admin Status = Enabled</strong>; kolom <strong>Security Policies</strong> menunjukkan <code>[WPA2][Auth(PSK)]</code></td>\n</tr>\n<tr>\n<td><strong>Monitor → Clients</strong></td>\n<td>Client <strong>terhubung</strong> (terasosiasi): SSID, alamat IP, VLAN/interface, status</td>\n</tr>\n<tr>\n<td><strong>Monitor → Summary</strong></td>\n<td>Jumlah client, AP, dan WLAN aktif</td>\n</tr>\n<tr>\n<td><strong>Sisi client</strong></td>\n<td>Pilih SSID, masukkan <strong>passphrase</strong>, pastikan menerima alamat IP</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Troubleshooting umum:</strong> WLAN masih <em>Disabled</em>, passphrase salah, WLAN tidak dipetakan ke VLAN yang benar atau VLAN tidak ada pada trunk, serta DHCP tidak tersedia pada VLAN tersebut.</p>", "raw": "Konfigurasi WLAN baru pada **GUI Wireless LAN Controller (WLC)** dengan keamanan **WPA2 Personal (PSK)**.\n\n### Langkah (GUI WLC Cisco — tampilan klasik/AireOS)\n\n| No. | Langkah | Detail |\n|---|---|---|\n| 1 | Buka menu **WLANs** | Pada menu atas WLC |\n| 2 | Pilih **Create New** → **Go** | Tipe: **WLAN** |\n| 3 | Isi **Profile Name**, **SSID**, **ID** | Contoh: Profile `Corp-WiFi`, SSID `Corp-WiFi`, ID `1` → **Apply** |\n| 4 | Tab **General** | **Status = Enabled**; pilih **Interface/Interface Group** (VLAN tempat WLAN dipetakan) |\n| 5 | Tab **Security → Layer 2** | **Layer 2 Security = WPA+WPA2** |\n| 6 | Pada **WPA+WPA2 Parameters** | Centang **WPA2 Policy** dan **WPA2 Encryption = AES** |\n| 7 | **Authentication Key Management** | Centang **PSK** (jangan 802.1X) |\n| 8 | **PSK Format** dan kunci | Format **ASCII**; isi passphrase (**8–63 karakter** ASCII, atau 64 digit hex) |\n| 9 | (Opsional) tab **QoS** dan **Advanced** | Atur sesuai kebutuhan (lihat 2.9) |\n| 10 | Klik **Apply** | Simpan konfigurasi |\n\n> **Prasyarat:** AP sudah terdaftar (*joined*) ke WLC dan VLAN/interface yang dipilih tersedia pada trunk WLC (lihat 2.7).\n\n### Verifikasi\n\n| Lokasi GUI | Yang diperiksa |\n|---|---|\n| **WLANs** (daftar WLAN) | **Admin Status = Enabled**; kolom **Security Policies** menunjukkan `[WPA2][Auth(PSK)]` |\n| **Monitor → Clients** | Client **terhubung** (terasosiasi): SSID, alamat IP, VLAN/interface, status |\n| **Monitor → Summary** | Jumlah client, AP, dan WLAN aktif |\n| **Sisi client** | Pilih SSID, masukkan **passphrase**, pastikan menerima alamat IP |\n\n**Troubleshooting umum:** WLAN masih *Disabled*, passphrase salah, WLAN tidak dipetakan ke VLAN yang benar atau VLAN tidak ada pada trunk, serta DHCP tidak tersedia pada VLAN tersebut."}, {"id": "sum-5-checklist", "label": "Checklist Review 5.0", "title": "Checklist Review Cepat — 5.0 Security Fundamentals (15%)", "html": "<table>\n<thead>\n<tr>\n<th>No.</th>\n<th>Topik</th>\n<th>Poin kunci</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>5.1</td>\n<td>Konsep keamanan</td>\n<td>Threat (potensi bahaya), vulnerability (kelemahan), exploit (pemanfaat kelemahan), mitigation (mengurangi risiko)</td>\n</tr>\n<tr>\n<td>5.2</td>\n<td>Program keamanan</td>\n<td>User awareness (berkelanjutan), training (formal), physical access control (kunci, badge, biometrik, CCTV)</td>\n</tr>\n<tr>\n<td>5.3</td>\n<td>Local passwords</td>\n<td><code>enable secret</code>, console/VTY <code>password</code> + <code>login</code>, <code>username … secret</code> + <code>login local</code>, <code>service password-encryption</code> (type 7 lemah)</td>\n</tr>\n<tr>\n<td>5.4</td>\n<td>Kebijakan password</td>\n<td>Management, complexity, alternatif: <strong>MFA</strong>, <strong>sertifikat</strong>, <strong>biometrik</strong></td>\n</tr>\n<tr>\n<td>5.5</td>\n<td>IPsec VPN</td>\n<td>Site-to-site (antar gateway) vs remote access (client); IKE (UDP 500), ESP (50), AH (51); tunnel vs transport mode</td>\n</tr>\n<tr>\n<td>5.6</td>\n<td>ACL</td>\n<td>Standard (1–99, sumber, dekat tujuan) vs extended (100–199, dekat sumber); top-down, <strong>implicit deny</strong>; <code>ip access-group in/out</code></td>\n</tr>\n<tr>\n<td>5.7</td>\n<td>Layer 2 security</td>\n<td><strong>DHCP snooping</strong> (trusted/untrusted, binding table); <strong>DAI</strong> (validasi ARP); <strong>port security</strong> (maximum, sticky, violation: protect/restrict/shutdown)</td>\n</tr>\n<tr>\n<td>5.8</td>\n<td>AAA</td>\n<td>Authentication (siapa), authorization (boleh apa), accounting (melakukan apa)</td>\n</tr>\n<tr>\n<td>5.9</td>\n<td>Wireless security</td>\n<td>WPA (TKIP), WPA2 (AES-CCMP, PSK), WPA3 (SAE, PMF wajib); Personal vs Enterprise</td>\n</tr>\n<tr>\n<td>5.10</td>\n<td>WLAN WPA2 PSK di GUI</td>\n<td>WLANs → Create New → SSID → General (Enabled, VLAN) → Security L2: WPA+WPA2, AES, PSK → Apply</td>\n</tr>\n</tbody>\n</table>", "raw": "| No. | Topik | Poin kunci |\n|---|---|---|\n| 5.1 | Konsep keamanan | Threat (potensi bahaya), vulnerability (kelemahan), exploit (pemanfaat kelemahan), mitigation (mengurangi risiko) |\n| 5.2 | Program keamanan | User awareness (berkelanjutan), training (formal), physical access control (kunci, badge, biometrik, CCTV) |\n| 5.3 | Local passwords | `enable secret`, console/VTY `password` + `login`, `username … secret` + `login local`, `service password-encryption` (type 7 lemah) |\n| 5.4 | Kebijakan password | Management, complexity, alternatif: **MFA**, **sertifikat**, **biometrik** |\n| 5.5 | IPsec VPN | Site-to-site (antar gateway) vs remote access (client); IKE (UDP 500), ESP (50), AH (51); tunnel vs transport mode |\n| 5.6 | ACL | Standard (1–99, sumber, dekat tujuan) vs extended (100–199, dekat sumber); top-down, **implicit deny**; `ip access-group in/out` |\n| 5.7 | Layer 2 security | **DHCP snooping** (trusted/untrusted, binding table); **DAI** (validasi ARP); **port security** (maximum, sticky, violation: protect/restrict/shutdown) |\n| 5.8 | AAA | Authentication (siapa), authorization (boleh apa), accounting (melakukan apa) |\n| 5.9 | Wireless security | WPA (TKIP), WPA2 (AES-CCMP, PSK), WPA3 (SAE, PMF wajib); Personal vs Enterprise |\n| 5.10 | WLAN WPA2 PSK di GUI | WLANs → Create New → SSID → General (Enabled, VLAN) → Security L2: WPA+WPA2, AES, PSK → Apply |"}]}, {"category": "6.0 AUTOMATION AND PROGRAMMABILITY", "items": [{"id": "sum-6-1", "label": "6.1 Dampak otomasi terhadap manajemen jaringan", "title": "6.1 Dampak otomasi terhadap manajemen jaringan", "html": "<p><strong>Otomasi jaringan</strong> adalah penggunaan perangkat lunak, skrip, dan alat untuk menjalankan tugas jaringan <strong>secara otomatis</strong>, menggantikan konfigurasi manual perangkat satu per satu lewat CLI.</p>\n<h3>Dampak positif</h3>\n<table>\n<thead>\n<tr>\n<th>Dampak</th>\n<th>Penjelasan</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Kecepatan dan efisiensi</strong></td>\n<td>Tugas berulang (provisioning, perubahan konfigurasi) selesai jauh lebih cepat</td>\n</tr>\n<tr>\n<td><strong>Konsistensi</strong></td>\n<td>Konfigurasi yang sama diterapkan ke banyak perangkat dengan hasil seragam</td>\n</tr>\n<tr>\n<td><strong>Pengurangan human error</strong></td>\n<td>Mengurangi salah ketik dan perbedaan konfigurasi antar perangkat</td>\n</tr>\n<tr>\n<td><strong>Skalabilitas</strong></td>\n<td>Mengelola ratusan/ribuan perangkat dengan upaya yang relatif sama</td>\n</tr>\n<tr>\n<td><strong>Mengurangi configuration drift</strong></td>\n<td>Konfigurasi aktual dapat dibandingkan dan dikembalikan ke kondisi yang diinginkan</td>\n</tr>\n<tr>\n<td><strong>Kepatuhan (compliance)</strong></td>\n<td>Pemeriksaan dan penegakan standar/kebijakan dilakukan otomatis</td>\n</tr>\n<tr>\n<td><strong>Visibilitas dan troubleshooting</strong></td>\n<td>Pengumpulan data dan analisis otomatis mempercepat deteksi masalah</td>\n</tr>\n<tr>\n<td><strong>Efisiensi biaya dan SDM</strong></td>\n<td>Staf fokus pada pekerjaan bernilai lebih tinggi (desain, optimasi)</td>\n</tr>\n<tr>\n<td><strong>Agilitas</strong></td>\n<td>Layanan baru dapat diluncurkan lebih cepat dan sesuai kebutuhan bisnis</td>\n</tr>\n</tbody>\n</table>\n<h3>Contoh tugas yang diotomasi</h3>\n<ul>\n<li>Provisioning perangkat baru (<em>zero-touch provisioning</em>)</li>\n<li>Backup dan penerapan konfigurasi massal</li>\n<li>Pemeriksaan kepatuhan dan audit konfigurasi</li>\n<li>Pembaruan software/firmware</li>\n<li>Pengumpulan data monitoring dan pembuatan laporan</li>\n</ul>\n<h3>Hal yang perlu diperhatikan</h3>\n<ul>\n<li>Butuh <strong>investasi awal</strong> (alat, keterampilan, perubahan proses).</li>\n<li><strong>Kesalahan dalam skrip/template</strong> dapat menyebar ke banyak perangkat sekaligus, sehingga perlu <strong>pengujian</strong> dan <strong>version control</strong>.</li>\n</ul>", "raw": "**Otomasi jaringan** adalah penggunaan perangkat lunak, skrip, dan alat untuk menjalankan tugas jaringan **secara otomatis**, menggantikan konfigurasi manual perangkat satu per satu lewat CLI.\n\n### Dampak positif\n\n| Dampak | Penjelasan |\n|---|---|\n| **Kecepatan dan efisiensi** | Tugas berulang (provisioning, perubahan konfigurasi) selesai jauh lebih cepat |\n| **Konsistensi** | Konfigurasi yang sama diterapkan ke banyak perangkat dengan hasil seragam |\n| **Pengurangan human error** | Mengurangi salah ketik dan perbedaan konfigurasi antar perangkat |\n| **Skalabilitas** | Mengelola ratusan/ribuan perangkat dengan upaya yang relatif sama |\n| **Mengurangi configuration drift** | Konfigurasi aktual dapat dibandingkan dan dikembalikan ke kondisi yang diinginkan |\n| **Kepatuhan (compliance)** | Pemeriksaan dan penegakan standar/kebijakan dilakukan otomatis |\n| **Visibilitas dan troubleshooting** | Pengumpulan data dan analisis otomatis mempercepat deteksi masalah |\n| **Efisiensi biaya dan SDM** | Staf fokus pada pekerjaan bernilai lebih tinggi (desain, optimasi) |\n| **Agilitas** | Layanan baru dapat diluncurkan lebih cepat dan sesuai kebutuhan bisnis |\n\n### Contoh tugas yang diotomasi\n\n- Provisioning perangkat baru (*zero-touch provisioning*)\n- Backup dan penerapan konfigurasi massal\n- Pemeriksaan kepatuhan dan audit konfigurasi\n- Pembaruan software/firmware\n- Pengumpulan data monitoring dan pembuatan laporan\n\n### Hal yang perlu diperhatikan\n\n- Butuh **investasi awal** (alat, keterampilan, perubahan proses).\n- **Kesalahan dalam skrip/template** dapat menyebar ke banyak perangkat sekaligus, sehingga perlu **pengujian** dan **version control**."}, {"id": "sum-6-2", "label": "6.2 Traditional networks vs controller-based networking", "title": "6.2 Traditional networks vs controller-based networking", "html": "<h3>Traditional (device-by-device)</h3>\n<ul>\n<li>Setiap perangkat (router/switch) <strong>memiliki sendiri</strong> control plane dan data plane, serta dikonfigurasi <strong>satu per satu</strong> (CLI/SSH, SNMP).</li>\n<li>Keputusan routing/switching diambil <strong>terdistribusi</strong> oleh masing-masing perangkat.</li>\n</ul>\n<h3>Controller-based</h3>\n<ul>\n<li>Ada <strong>controller terpusat</strong> (mis. <strong>Cisco Catalyst Center</strong>, sebelumnya DNA Center) yang menjadi titik <strong>manajemen dan kebijakan</strong> bagi seluruh perangkat.</li>\n<li>Administrator menyatakan <strong>intent/kebijakan</strong> di controller; controller menerjemahkannya menjadi konfigurasi yang didorong ke perangkat.</li>\n<li>Terhubung ke perangkat melalui <strong>southbound API</strong> dan menyediakan <strong>northbound API</strong> untuk aplikasi/otomasi (lihat 6.3.b).</li>\n</ul>\n<h3>Perbandingan</h3>\n<table>\n<thead>\n<tr>\n<th>Aspek</th>\n<th><strong>Traditional Network</strong></th>\n<th><strong>Controller-Based Network</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Manajemen</td>\n<td><strong>Per perangkat</strong> (distributed)</td>\n<td><strong>Terpusat</strong> lewat controller</td>\n</tr>\n<tr>\n<td>Cara konfigurasi</td>\n<td>Manual via CLI per perangkat</td>\n<td>Kebijakan/template dari controller, diterapkan otomatis</td>\n</tr>\n<tr>\n<td>Konsistensi konfigurasi</td>\n<td>Rentan beda antar perangkat</td>\n<td><strong>Konsisten</strong> (kebijakan terpusat)</td>\n</tr>\n<tr>\n<td>Kecepatan perubahan</td>\n<td>Lambat (banyak perangkat disentuh satu per satu)</td>\n<td><strong>Cepat</strong></td>\n</tr>\n<tr>\n<td>Visibilitas jaringan</td>\n<td>Terbatas per perangkat</td>\n<td><strong>Pandangan menyeluruh</strong> (end-to-end)</td>\n</tr>\n<tr>\n<td>Otomasi</td>\n<td>Terbatas (skrip individual)</td>\n<td><strong>Native</strong>, berbasis API</td>\n</tr>\n<tr>\n<td>Skalabilitas</td>\n<td>Sulit pada jaringan besar</td>\n<td>Lebih mudah</td>\n</tr>\n<tr>\n<td>Titik kritis</td>\n<td>Tidak ada pusat tunggal</td>\n<td>Controller menjadi komponen <strong>kritis</strong> (dibuat redundan/cluster)</td>\n</tr>\n<tr>\n<td>Contoh</td>\n<td>Konfigurasi manual CLI di tiap switch</td>\n<td>Cisco Catalyst Center, SD-Access</td>\n</tr>\n</tbody>\n</table>", "raw": "### Traditional (device-by-device)\n\n- Setiap perangkat (router/switch) **memiliki sendiri** control plane dan data plane, serta dikonfigurasi **satu per satu** (CLI/SSH, SNMP).\n- Keputusan routing/switching diambil **terdistribusi** oleh masing-masing perangkat.\n\n### Controller-based\n\n- Ada **controller terpusat** (mis. **Cisco Catalyst Center**, sebelumnya DNA Center) yang menjadi titik **manajemen dan kebijakan** bagi seluruh perangkat.\n- Administrator menyatakan **intent/kebijakan** di controller; controller menerjemahkannya menjadi konfigurasi yang didorong ke perangkat.\n- Terhubung ke perangkat melalui **southbound API** dan menyediakan **northbound API** untuk aplikasi/otomasi (lihat 6.3.b).\n\n### Perbandingan\n\n| Aspek | **Traditional Network** | **Controller-Based Network** |\n|---|---|---|\n| Manajemen | **Per perangkat** (distributed) | **Terpusat** lewat controller |\n| Cara konfigurasi | Manual via CLI per perangkat | Kebijakan/template dari controller, diterapkan otomatis |\n| Konsistensi konfigurasi | Rentan beda antar perangkat | **Konsisten** (kebijakan terpusat) |\n| Kecepatan perubahan | Lambat (banyak perangkat disentuh satu per satu) | **Cepat** |\n| Visibilitas jaringan | Terbatas per perangkat | **Pandangan menyeluruh** (end-to-end) |\n| Otomasi | Terbatas (skrip individual) | **Native**, berbasis API |\n| Skalabilitas | Sulit pada jaringan besar | Lebih mudah |\n| Titik kritis | Tidak ada pusat tunggal | Controller menjadi komponen **kritis** (dibuat redundan/cluster) |\n| Contoh | Konfigurasi manual CLI di tiap switch | Cisco Catalyst Center, SD-Access |"}, {"id": "sum-6-3", "label": "6.3 Arsitektur controller-based (software defined)", "title": "6.3 Arsitektur controller-based (software defined)", "html": "<p>Arsitektur <strong>Software-Defined Networking (SDN)</strong> memisahkan fungsi \"otak\" jaringan dari perangkat pengirim data, lalu mengelolanya secara terpusat. Komponen logis jaringan dibangun dari <strong>underlay</strong>, <strong>overlay</strong>, dan <strong>fabric</strong>.</p>\n<h3>Underlay</h3>\n<ul>\n<li><strong>Jaringan fisik</strong> (switch, router, kabel) yang menyediakan <strong>konektivitas IP</strong> antar node fabric.</li>\n<li>Biasanya <strong>Layer 3 (routed)</strong>, sederhana, stabil, dan berkinerja tinggi.</li>\n<li>Berfungsi sebagai <strong>transport</strong> bagi trafik overlay; tidak peduli pada layanan/segmentasi pengguna.</li>\n</ul>\n<h3>Overlay</h3>\n<ul>\n<li><strong>Jaringan virtual</strong> yang dibangun <strong>di atas underlay</strong> menggunakan <strong>tunnel/enkapsulasi</strong> (mis. <strong>VXLAN</strong>, GRE, IPsec).</li>\n<li><strong>Memisahkan topologi logis dari topologi fisik</strong>: segmentasi, mobilitas, dan kebijakan dapat diatur tanpa mengubah underlay.</li>\n<li>Paket pengguna <strong>dibungkus</strong> (encapsulated) dengan header baru melintasi underlay.</li>\n</ul>\n<h3>Fabric</h3>\n<ul>\n<li><strong>Gabungan overlay + underlay</strong> yang berfungsi sebagai <strong>satu domain jaringan terpadu</strong>, dikelola controller sebagai satu entitas.</li>\n<li>Contoh: <strong>Cisco SD-Access</strong> (fabric berbasis VXLAN yang dikelola Catalyst Center).</li>\n</ul>\n<pre><code>        ┌───────────────── FABRIC ─────────────────┐\n        │  OVERLAY  (jaringan virtual/tunnel VXLAN) │\n        │  ─────────────────────────────────────── │\n        │  UNDERLAY (switch/router + routing IP)    │\n        └───────────────────────────────────────────┘\n</code></pre>\n<table>\n<thead>\n<tr>\n<th>Aspek</th>\n<th>Underlay</th>\n<th>Overlay</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Sifat</td>\n<td>Fisik</td>\n<td>Logis/virtual</td>\n</tr>\n<tr>\n<td>Fungsi</td>\n<td>Transport &amp; konektivitas IP</td>\n<td>Layanan, segmentasi, kebijakan</td>\n</tr>\n<tr>\n<td>Teknologi umum</td>\n<td>Routing IP (routed access)</td>\n<td>VXLAN, tunnel</td>\n</tr>\n</tbody>\n</table>\n<h3>6.3.a Separation of control plane and data plane</h3>\n<table>\n<thead>\n<tr>\n<th>Plane</th>\n<th>Fungsi</th>\n<th>Contoh</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Control plane</strong> (\"otak\")</td>\n<td>Mengambil <strong>keputusan</strong>: membangun tabel routing/forwarding</td>\n<td>Protokol routing (OSPF), STP, pembelajaran ARP/MAC</td>\n</tr>\n<tr>\n<td><strong>Data plane</strong> / forwarding plane (\"otot\")</td>\n<td><strong>Meneruskan</strong> frame/paket sesuai tabel yang sudah dibangun</td>\n<td>Forwarding paket, enkapsulasi, NAT, ACL, marking QoS</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li><strong>Traditional:</strong> setiap perangkat menjalankan <strong>control plane dan data plane sendiri</strong>.</li>\n<li><strong>SDN/controller-based:</strong> control plane (logika/keputusan) <strong>dipusatkan pada controller</strong>, sedangkan <strong>data plane tetap pada perangkat</strong> jaringan yang bertugas meneruskan paket.</li>\n<li><strong>Manfaat:</strong> pandangan dan kebijakan terpusat, perubahan lebih cepat, jaringan dapat <strong>diprogram</strong>.</li>\n</ul>\n<h3>6.3.b Northbound and Southbound APIs</h3>\n<pre><code>   [Aplikasi / Skrip / GUI / Orkestrasi]\n                  │\n        Northbound API (mis. REST)\n                  ▼\n          [   CONTROLLER   ]\n                  │\n        Southbound API (mis. NETCONF, CLI)\n                  ▼\n   [ Router ]   [ Switch ]   [ AP / WLC ]\n</code></pre>\n<table>\n<thead>\n<tr>\n<th>Aspek</th>\n<th><strong>Northbound API</strong></th>\n<th><strong>Southbound API</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Arah</td>\n<td>Controller → <strong>ke atas</strong> (aplikasi/administrator)</td>\n<td>Controller → <strong>ke bawah</strong> (perangkat jaringan)</td>\n</tr>\n<tr>\n<td>Fungsi</td>\n<td>Aplikasi/skrip <strong>meminta data dan menyampaikan intent</strong> ke controller</td>\n<td>Controller <strong>mengirim konfigurasi/kebijakan</strong> dan <strong>mengumpulkan data</strong> dari perangkat</td>\n</tr>\n<tr>\n<td>Contoh protokol</td>\n<td><strong>REST API</strong> (HTTP/HTTPS + JSON)</td>\n<td><strong>NETCONF</strong>, <strong>RESTCONF</strong>, <strong>OpenFlow</strong>, CLI (SSH), SNMP</td>\n</tr>\n<tr>\n<td>Pengguna</td>\n<td>Developer, aplikasi, sistem otomasi</td>\n<td>Controller itu sendiri</td>\n</tr>\n</tbody>\n</table>", "raw": "Arsitektur **Software-Defined Networking (SDN)** memisahkan fungsi \"otak\" jaringan dari perangkat pengirim data, lalu mengelolanya secara terpusat. Komponen logis jaringan dibangun dari **underlay**, **overlay**, dan **fabric**.\n\n### Underlay\n\n- **Jaringan fisik** (switch, router, kabel) yang menyediakan **konektivitas IP** antar node fabric.\n- Biasanya **Layer 3 (routed)**, sederhana, stabil, dan berkinerja tinggi.\n- Berfungsi sebagai **transport** bagi trafik overlay; tidak peduli pada layanan/segmentasi pengguna.\n\n### Overlay\n\n- **Jaringan virtual** yang dibangun **di atas underlay** menggunakan **tunnel/enkapsulasi** (mis. **VXLAN**, GRE, IPsec).\n- **Memisahkan topologi logis dari topologi fisik**: segmentasi, mobilitas, dan kebijakan dapat diatur tanpa mengubah underlay.\n- Paket pengguna **dibungkus** (encapsulated) dengan header baru melintasi underlay.\n\n### Fabric\n\n- **Gabungan overlay + underlay** yang berfungsi sebagai **satu domain jaringan terpadu**, dikelola controller sebagai satu entitas.\n- Contoh: **Cisco SD-Access** (fabric berbasis VXLAN yang dikelola Catalyst Center).\n\n```\n        ┌───────────────── FABRIC ─────────────────┐\n        │  OVERLAY  (jaringan virtual/tunnel VXLAN) │\n        │  ─────────────────────────────────────── │\n        │  UNDERLAY (switch/router + routing IP)    │\n        └───────────────────────────────────────────┘\n```\n\n| Aspek | Underlay | Overlay |\n|---|---|---|\n| Sifat | Fisik | Logis/virtual |\n| Fungsi | Transport & konektivitas IP | Layanan, segmentasi, kebijakan |\n| Teknologi umum | Routing IP (routed access) | VXLAN, tunnel |\n\n### 6.3.a Separation of control plane and data plane\n\n| Plane | Fungsi | Contoh |\n|---|---|---|\n| **Control plane** (\"otak\") | Mengambil **keputusan**: membangun tabel routing/forwarding | Protokol routing (OSPF), STP, pembelajaran ARP/MAC |\n| **Data plane** / forwarding plane (\"otot\") | **Meneruskan** frame/paket sesuai tabel yang sudah dibangun | Forwarding paket, enkapsulasi, NAT, ACL, marking QoS |\n\n- **Traditional:** setiap perangkat menjalankan **control plane dan data plane sendiri**.\n- **SDN/controller-based:** control plane (logika/keputusan) **dipusatkan pada controller**, sedangkan **data plane tetap pada perangkat** jaringan yang bertugas meneruskan paket.\n- **Manfaat:** pandangan dan kebijakan terpusat, perubahan lebih cepat, jaringan dapat **diprogram**.\n\n### 6.3.b Northbound and Southbound APIs\n\n```\n   [Aplikasi / Skrip / GUI / Orkestrasi]\n                  │\n        Northbound API (mis. REST)\n                  ▼\n          [   CONTROLLER   ]\n                  │\n        Southbound API (mis. NETCONF, CLI)\n                  ▼\n   [ Router ]   [ Switch ]   [ AP / WLC ]\n```\n\n| Aspek | **Northbound API** | **Southbound API** |\n|---|---|---|\n| Arah | Controller → **ke atas** (aplikasi/administrator) | Controller → **ke bawah** (perangkat jaringan) |\n| Fungsi | Aplikasi/skrip **meminta data dan menyampaikan intent** ke controller | Controller **mengirim konfigurasi/kebijakan** dan **mengumpulkan data** dari perangkat |\n| Contoh protokol | **REST API** (HTTP/HTTPS + JSON) | **NETCONF**, **RESTCONF**, **OpenFlow**, CLI (SSH), SNMP |\n| Pengguna | Developer, aplikasi, sistem otomasi | Controller itu sendiri |"}, {"id": "sum-6-4", "label": "6.4 AI (generative dan predictive) dan machine learning dalam operasional jaringan", "title": "6.4 AI (generative dan predictive) dan machine learning dalam operasional jaringan", "html": "<h3>Konsep dasar</h3>\n<table>\n<thead>\n<tr>\n<th>Istilah</th>\n<th>Penjelasan</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>AI (Artificial Intelligence)</strong></td>\n<td>Sistem yang meniru kemampuan kognitif manusia (menganalisis, memutuskan, belajar)</td>\n</tr>\n<tr>\n<td><strong>ML (Machine Learning)</strong></td>\n<td><strong>Bagian dari AI</strong>: algoritma <strong>belajar dari data</strong> untuk menemukan pola dan membuat prediksi <strong>tanpa diprogram secara eksplisit</strong></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Pendekatan ML umum:</strong> <em>supervised</em> (data berlabel), <em>unsupervised</em> (menemukan pola tanpa label), dan <em>reinforcement</em> (belajar lewat umpan balik/reward).</p>\n<h3>Predictive AI</h3>\n<ul>\n<li>Menganalisis <strong>data historis dan real-time</strong> (telemetri, log, flow) menggunakan <strong>model ML</strong> untuk <strong>memprediksi</strong> atau <strong>mendeteksi</strong> kondisi.</li>\n<li><strong>Penggunaan dalam network operations:</strong></li>\n<li><strong>Deteksi anomali</strong> dan penetapan baseline kinerja normal</li>\n<li><strong>Memprediksi kegagalan</strong> perangkat/link dan kebutuhan kapasitas (<em>capacity planning</em>)</li>\n<li><strong>Analisis akar masalah</strong> dan deteksi masalah secara proaktif</li>\n<li><strong>Deteksi ancaman keamanan</strong> (perilaku trafik tidak wajar)</li>\n<li>Contoh: <strong>AI Network Analytics</strong> pada Cisco Catalyst Center.</li>\n</ul>\n<h3>Generative AI</h3>\n<ul>\n<li>Model (umumnya <strong>LLM</strong>, <em>Large Language Model</em>) yang <strong>menghasilkan konten baru</strong>: teks, kode, ringkasan, konfigurasi.</li>\n<li><strong>Penggunaan dalam network operations:</strong></li>\n<li><strong>Asisten percakapan</strong> untuk bertanya dengan bahasa alami (mis. \"mengapa aplikasi lambat di cabang A?\")</li>\n<li><strong>Menghasilkan konfigurasi atau skrip otomasi</strong> (mis. playbook Ansible, template)</li>\n<li><strong>Merangkum</strong> log, insiden, dan data troubleshooting</li>\n<li><strong>Membuat dokumentasi</strong> dan memandu langkah troubleshooting</li>\n<li><strong>Catatan:</strong> keluaran dapat <strong>keliru (hallucination)</strong> → harus <strong>diverifikasi manusia</strong> sebelum diterapkan; perhatikan <strong>privasi data</strong>.</li>\n</ul>\n<h3>Perbandingan</h3>\n<table>\n<thead>\n<tr>\n<th>Aspek</th>\n<th><strong>Predictive AI</strong></th>\n<th><strong>Generative AI</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Tujuan</td>\n<td><strong>Memprediksi/mendeteksi</strong> kejadian</td>\n<td><strong>Menciptakan</strong> konten baru</td>\n</tr>\n<tr>\n<td>Keluaran</td>\n<td>Skor, prediksi, peringatan, klasifikasi</td>\n<td>Teks, kode, konfigurasi, ringkasan</td>\n</tr>\n<tr>\n<td>Data masukan</td>\n<td>Data historis dan telemetri jaringan</td>\n<td>Prompt/pertanyaan + data konteks</td>\n</tr>\n<tr>\n<td>Contoh di jaringan</td>\n<td>Prediksi kegagalan, deteksi anomali</td>\n<td>Chat asisten, pembuat konfigurasi/skrip</td>\n</tr>\n</tbody>\n</table>\n<h3>Manfaat dan pertimbangan</h3>\n<ul>\n<li><strong>Manfaat:</strong> deteksi masalah lebih cepat, mengurangi waktu perbaikan (<em>MTTR</em>), operasi proaktif, mengurangi <em>alert noise</em>.</li>\n<li><strong>Pertimbangan:</strong> kualitas data, bias model, kemampuan menjelaskan hasil, dan perlunya <strong>pengawasan manusia</strong>.</li>\n</ul>", "raw": "### Konsep dasar\n\n| Istilah | Penjelasan |\n|---|---|\n| **AI (Artificial Intelligence)** | Sistem yang meniru kemampuan kognitif manusia (menganalisis, memutuskan, belajar) |\n| **ML (Machine Learning)** | **Bagian dari AI**: algoritma **belajar dari data** untuk menemukan pola dan membuat prediksi **tanpa diprogram secara eksplisit** |\n\n**Pendekatan ML umum:** *supervised* (data berlabel), *unsupervised* (menemukan pola tanpa label), dan *reinforcement* (belajar lewat umpan balik/reward).\n\n### Predictive AI\n\n- Menganalisis **data historis dan real-time** (telemetri, log, flow) menggunakan **model ML** untuk **memprediksi** atau **mendeteksi** kondisi.\n- **Penggunaan dalam network operations:**\n  - **Deteksi anomali** dan penetapan baseline kinerja normal\n  - **Memprediksi kegagalan** perangkat/link dan kebutuhan kapasitas (*capacity planning*)\n  - **Analisis akar masalah** dan deteksi masalah secara proaktif\n  - **Deteksi ancaman keamanan** (perilaku trafik tidak wajar)\n- Contoh: **AI Network Analytics** pada Cisco Catalyst Center.\n\n### Generative AI\n\n- Model (umumnya **LLM**, *Large Language Model*) yang **menghasilkan konten baru**: teks, kode, ringkasan, konfigurasi.\n- **Penggunaan dalam network operations:**\n  - **Asisten percakapan** untuk bertanya dengan bahasa alami (mis. \"mengapa aplikasi lambat di cabang A?\")\n  - **Menghasilkan konfigurasi atau skrip otomasi** (mis. playbook Ansible, template)\n  - **Merangkum** log, insiden, dan data troubleshooting\n  - **Membuat dokumentasi** dan memandu langkah troubleshooting\n- **Catatan:** keluaran dapat **keliru (hallucination)** → harus **diverifikasi manusia** sebelum diterapkan; perhatikan **privasi data**.\n\n### Perbandingan\n\n| Aspek | **Predictive AI** | **Generative AI** |\n|---|---|---|\n| Tujuan | **Memprediksi/mendeteksi** kejadian | **Menciptakan** konten baru |\n| Keluaran | Skor, prediksi, peringatan, klasifikasi | Teks, kode, konfigurasi, ringkasan |\n| Data masukan | Data historis dan telemetri jaringan | Prompt/pertanyaan + data konteks |\n| Contoh di jaringan | Prediksi kegagalan, deteksi anomali | Chat asisten, pembuat konfigurasi/skrip |\n\n### Manfaat dan pertimbangan\n\n- **Manfaat:** deteksi masalah lebih cepat, mengurangi waktu perbaikan (*MTTR*), operasi proaktif, mengurangi *alert noise*.\n- **Pertimbangan:** kualitas data, bias model, kemampuan menjelaskan hasil, dan perlunya **pengawasan manusia**."}, {"id": "sum-6-5", "label": "6.5 Karakteristik REST-based API", "title": "6.5 Karakteristik REST-based API", "html": "<h3>Konsep</h3>\n<ul>\n<li><strong>API (Application Programming Interface)</strong> memungkinkan satu perangkat lunak berkomunikasi dengan yang lain.</li>\n<li><strong>REST (Representational State Transfer)</strong> adalah <strong>gaya arsitektur</strong> API berbasis <strong>HTTP/HTTPS</strong>; API yang mengikutinya disebut <strong>RESTful</strong>.</li>\n</ul>\n<p><strong>Karakteristik utama REST:</strong></p>\n<table>\n<thead>\n<tr>\n<th>Karakteristik</th>\n<th>Penjelasan</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Client-server</strong></td>\n<td>Client (pengirim permintaan) dan server (penyedia resource) terpisah</td>\n</tr>\n<tr>\n<td><strong>Stateless</strong></td>\n<td>Tiap request <strong>berdiri sendiri</strong>; server tidak menyimpan state sesi antar request</td>\n</tr>\n<tr>\n<td><strong>Cacheable</strong></td>\n<td>Respons dapat ditandai agar dapat di-<em>cache</em></td>\n</tr>\n<tr>\n<td><strong>Uniform interface</strong></td>\n<td>Resource diidentifikasi dengan <strong>URI</strong> dan dioperasikan lewat <strong>HTTP verb</strong> standar</td>\n</tr>\n<tr>\n<td><strong>Layered system</strong></td>\n<td>Dapat melewati perantara (proxy, load balancer) tanpa diketahui client</td>\n</tr>\n</tbody>\n</table>\n<h3>Struktur request</h3>\n<pre><code>https://api.example.com/v1/devices/R1?fields=hostname\n└─┬─┘   └──────┬──────┘ └───── path/resource ─────┘ └─ query ─┘\nScheme       Host\n</code></pre>\n<ul>\n<li>Komponen request: <strong>HTTP verb</strong>, <strong>URI</strong>, <strong>header</strong> (mis. Authorization, Content-Type), dan <strong>body</strong> (data, untuk POST/PUT/PATCH).</li>\n</ul>\n<h3>CRUD dan HTTP verbs</h3>\n<table>\n<thead>\n<tr>\n<th>Operasi CRUD</th>\n<th><strong>HTTP verb</strong></th>\n<th>Fungsi</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>C</strong>reate</td>\n<td><strong>POST</strong></td>\n<td>Membuat resource baru</td>\n</tr>\n<tr>\n<td><strong>R</strong>ead</td>\n<td><strong>GET</strong></td>\n<td>Mengambil/membaca resource</td>\n</tr>\n<tr>\n<td><strong>U</strong>pdate</td>\n<td><strong>PUT</strong></td>\n<td>Mengganti/memperbarui resource <strong>secara menyeluruh</strong></td>\n</tr>\n<tr>\n<td><strong>U</strong>pdate</td>\n<td><strong>PATCH</strong></td>\n<td>Memperbarui <strong>sebagian</strong> resource</td>\n</tr>\n<tr>\n<td><strong>D</strong>elete</td>\n<td><strong>DELETE</strong></td>\n<td>Menghapus resource</td>\n</tr>\n</tbody>\n</table>\n<h3>Authentication types</h3>\n<table>\n<thead>\n<tr>\n<th>Tipe</th>\n<th>Cara kerja</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Basic authentication</strong></td>\n<td>Username dan password dikirim di header <code>Authorization</code> (di-encode <strong>Base64</strong>, bukan dienkripsi) → <strong>wajib lewat HTTPS</strong></td>\n</tr>\n<tr>\n<td><strong>Token-based (Bearer)</strong></td>\n<td>Client login sekali, memperoleh <strong>token</strong>, lalu mengirimnya pada tiap request (mis. <code>Authorization: Bearer &lt;token&gt;</code>)</td>\n</tr>\n<tr>\n<td><strong>API key</strong></td>\n<td>Kunci unik yang dikirim di header atau query string untuk mengidentifikasi aplikasi</td>\n</tr>\n<tr>\n<td><strong>OAuth 2.0</strong></td>\n<td>Kerangka <strong>otorisasi terdelegasi</strong>: aplikasi mendapat <strong>access token</strong> terbatas tanpa mengetahui password pengguna</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p>Contoh pada <strong>Cisco Catalyst Center</strong>: client mengirim <code>POST</code> dengan Basic auth ke endpoint autentikasi untuk memperoleh token, lalu menyertakan token pada header <code>X-Auth-Token</code> di request berikutnya.</p>\n</blockquote>\n<h3>Data encoding</h3>\n<p>Format data yang dipertukarkan pada body request/response, ditandai dengan header <code>Content-Type</code> / <code>Accept</code>.</p>\n<table>\n<thead>\n<tr>\n<th>Format</th>\n<th>Ciri</th>\n<th>Header</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>JSON</strong></td>\n<td>Ringkas, mudah dibaca, <strong>paling umum</strong> pada REST</td>\n<td><code>application/json</code></td>\n</tr>\n<tr>\n<td><strong>XML</strong></td>\n<td>Berbasis tag, lebih verbose</td>\n<td><code>application/xml</code></td>\n</tr>\n<tr>\n<td><strong>YAML</strong></td>\n<td>Berbasis indentasi, mudah dibaca manusia (umum pada file konfigurasi/otomasi)</td>\n<td><code>application/yaml</code></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Data yang sama dalam tiga format:</strong></p>\n<pre><code>JSON:  {&quot;hostname&quot;: &quot;R1&quot;, &quot;enabled&quot;: true}\n\nXML:   &lt;device&gt;&lt;hostname&gt;R1&lt;/hostname&gt;&lt;enabled&gt;true&lt;/enabled&gt;&lt;/device&gt;\n\nYAML:  hostname: R1\n       enabled: true\n</code></pre>\n<h3>Contoh request dan response</h3>\n<pre><code>GET https://api.example.com/v1/devices/R1\nAuthorization: Bearer eyJhbGciOi...\nAccept: application/json\n\nHTTP/1.1 200 OK\nContent-Type: application/json\n\n{ &quot;hostname&quot;: &quot;R1&quot;, &quot;model&quot;: &quot;ISR4331&quot;, &quot;status&quot;: &quot;up&quot; }\n</code></pre>", "raw": "### Konsep\n\n- **API (Application Programming Interface)** memungkinkan satu perangkat lunak berkomunikasi dengan yang lain.\n- **REST (Representational State Transfer)** adalah **gaya arsitektur** API berbasis **HTTP/HTTPS**; API yang mengikutinya disebut **RESTful**.\n\n**Karakteristik utama REST:**\n\n| Karakteristik | Penjelasan |\n|---|---|\n| **Client-server** | Client (pengirim permintaan) dan server (penyedia resource) terpisah |\n| **Stateless** | Tiap request **berdiri sendiri**; server tidak menyimpan state sesi antar request |\n| **Cacheable** | Respons dapat ditandai agar dapat di-*cache* |\n| **Uniform interface** | Resource diidentifikasi dengan **URI** dan dioperasikan lewat **HTTP verb** standar |\n| **Layered system** | Dapat melewati perantara (proxy, load balancer) tanpa diketahui client |\n\n### Struktur request\n\n```\nhttps://api.example.com/v1/devices/R1?fields=hostname\n└─┬─┘   └──────┬──────┘ └───── path/resource ─────┘ └─ query ─┘\nScheme       Host\n```\n\n- Komponen request: **HTTP verb**, **URI**, **header** (mis. Authorization, Content-Type), dan **body** (data, untuk POST/PUT/PATCH).\n\n### CRUD dan HTTP verbs\n\n| Operasi CRUD | **HTTP verb** | Fungsi |\n|---|---|---|\n| **C**reate | **POST** | Membuat resource baru |\n| **R**ead | **GET** | Mengambil/membaca resource |\n| **U**pdate | **PUT** | Mengganti/memperbarui resource **secara menyeluruh** |\n| **U**pdate | **PATCH** | Memperbarui **sebagian** resource |\n| **D**elete | **DELETE** | Menghapus resource |\n\n### Authentication types\n\n| Tipe | Cara kerja |\n|---|---|\n| **Basic authentication** | Username dan password dikirim di header `Authorization` (di-encode **Base64**, bukan dienkripsi) → **wajib lewat HTTPS** |\n| **Token-based (Bearer)** | Client login sekali, memperoleh **token**, lalu mengirimnya pada tiap request (mis. `Authorization: Bearer <token>`) |\n| **API key** | Kunci unik yang dikirim di header atau query string untuk mengidentifikasi aplikasi |\n| **OAuth 2.0** | Kerangka **otorisasi terdelegasi**: aplikasi mendapat **access token** terbatas tanpa mengetahui password pengguna |\n\n> Contoh pada **Cisco Catalyst Center**: client mengirim `POST` dengan Basic auth ke endpoint autentikasi untuk memperoleh token, lalu menyertakan token pada header `X-Auth-Token` di request berikutnya.\n\n### Data encoding\n\nFormat data yang dipertukarkan pada body request/response, ditandai dengan header `Content-Type` / `Accept`.\n\n| Format | Ciri | Header |\n|---|---|---|\n| **JSON** | Ringkas, mudah dibaca, **paling umum** pada REST | `application/json` |\n| **XML** | Berbasis tag, lebih verbose | `application/xml` |\n| **YAML** | Berbasis indentasi, mudah dibaca manusia (umum pada file konfigurasi/otomasi) | `application/yaml` |\n\n**Data yang sama dalam tiga format:**\n\n```\nJSON:  {\"hostname\": \"R1\", \"enabled\": true}\n\nXML:   <device><hostname>R1</hostname><enabled>true</enabled></device>\n\nYAML:  hostname: R1\n       enabled: true\n```\n\n### Contoh request dan response\n\n```\nGET https://api.example.com/v1/devices/R1\nAuthorization: Bearer eyJhbGciOi...\nAccept: application/json\n\nHTTP/1.1 200 OK\nContent-Type: application/json\n\n{ \"hostname\": \"R1\", \"model\": \"ISR4331\", \"status\": \"up\" }\n```"}, {"id": "sum-6-6", "label": "6.6 Configuration management: Ansible dan Terraform", "title": "6.6 Configuration management: Ansible dan Terraform", "html": "<h3>Kemampuan umum configuration management</h3>\n<ul>\n<li>Mengelola konfigurasi banyak perangkat/infrastruktur <strong>secara otomatis dan konsisten</strong>.</li>\n<li>Mendefinisikan <strong>kondisi yang diinginkan (desired state)</strong> dalam file/kode yang dapat disimpan di <strong>version control</strong>.</li>\n<li><strong>Idempotent:</strong> menjalankan berulang kali menghasilkan keadaan akhir yang sama (tidak menggandakan perubahan).</li>\n<li>Mendeteksi dan memperbaiki <strong>configuration drift</strong>, serta mempercepat provisioning dan mengurangi kesalahan manual.</li>\n</ul>\n<h3>Ansible</h3>\n<table>\n<thead>\n<tr>\n<th>Aspek</th>\n<th>Penjelasan</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Pengembang</strong></td>\n<td>Red Hat</td>\n</tr>\n<tr>\n<td><strong>Sifat</strong></td>\n<td><strong>Agentless</strong> — tidak perlu software agen di perangkat; terhubung via <strong>SSH, NETCONF, atau API</strong></td>\n</tr>\n<tr>\n<td><strong>Model</strong></td>\n<td><strong>Push</strong> — control node mendorong konfigurasi ke perangkat</td>\n</tr>\n<tr>\n<td><strong>Bahasa</strong></td>\n<td><strong>YAML</strong> (file <strong>playbook</strong>)</td>\n</tr>\n<tr>\n<td><strong>Fungsi utama</strong></td>\n<td>Manajemen konfigurasi, deployment, dan orkestrasi tugas</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Komponen:</strong> <em>control node</em> (tempat Ansible dijalankan), <em>managed nodes</em> (perangkat target), <strong>inventory</strong> (daftar perangkat), <strong>playbook</strong> (rangkaian <em>play</em>), <strong>task</strong>, <strong>module</strong> (unit kerja, mis. modul <code>ios_*</code>), dan <strong>role</strong>.</p>\n<p><strong>Contoh playbook:</strong></p>\n<pre><code class=\"language-yaml\">- name: Konfigurasi VLAN pada switch\n  hosts: switches\n  gather_facts: false\n  tasks:\n    - name: Pastikan VLAN 10 ada\n      cisco.ios.ios_vlans:\n        config:\n          - vlan_id: 10\n            name: DATA\n        state: merged\n</code></pre>\n<h3>Terraform</h3>\n<table>\n<thead>\n<tr>\n<th>Aspek</th>\n<th>Penjelasan</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Pengembang</strong></td>\n<td>HashiCorp</td>\n</tr>\n<tr>\n<td><strong>Pendekatan</strong></td>\n<td><strong>Infrastructure as Code (IaC)</strong> — infrastruktur didefinisikan dalam kode</td>\n</tr>\n<tr>\n<td><strong>Sifat</strong></td>\n<td><strong>Declarative</strong> (menyatakan hasil akhir yang diinginkan) dan <strong>agentless</strong> (memakai API provider)</td>\n</tr>\n<tr>\n<td><strong>Bahasa</strong></td>\n<td><strong>HCL</strong> (<em>HashiCorp Configuration Language</em>)</td>\n</tr>\n<tr>\n<td><strong>Fungsi utama</strong></td>\n<td><strong>Provisioning</strong> infrastruktur (cloud, jaringan, server)</td>\n</tr>\n<tr>\n<td><strong>Komponen</strong></td>\n<td><strong>Provider</strong> (konektor ke platform/API), <strong>resource</strong>, dan <strong>state file</strong> (mencatat kondisi infrastruktur saat ini)</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Alur kerja Terraform:</strong></p>\n<pre><code>terraform init      # inisialisasi, unduh provider\nterraform plan      # pratinjau perubahan yang akan dilakukan\nterraform apply     # menerapkan perubahan\nterraform destroy   # menghapus infrastruktur yang dikelola\n</code></pre>\n<h3>Perbandingan Ansible dan Terraform</h3>\n<table>\n<thead>\n<tr>\n<th>Aspek</th>\n<th><strong>Ansible</strong></th>\n<th><strong>Terraform</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Fokus utama</td>\n<td>Config management &amp; orkestrasi</td>\n<td><strong>Provisioning</strong> infrastruktur</td>\n</tr>\n<tr>\n<td>Agen di target</td>\n<td><strong>Tidak</strong></td>\n<td><strong>Tidak</strong></td>\n</tr>\n<tr>\n<td>Model</td>\n<td><strong>Push</strong></td>\n<td>Push (menerapkan via API)</td>\n</tr>\n<tr>\n<td>Bahasa</td>\n<td><strong>YAML</strong></td>\n<td><strong>HCL</strong></td>\n</tr>\n<tr>\n<td>Pendekatan</td>\n<td>Deklaratif/prosedural (urutan task)</td>\n<td><strong>Deklaratif</strong></td>\n</tr>\n</tbody>\n</table>", "raw": "### Kemampuan umum configuration management\n\n- Mengelola konfigurasi banyak perangkat/infrastruktur **secara otomatis dan konsisten**.\n- Mendefinisikan **kondisi yang diinginkan (desired state)** dalam file/kode yang dapat disimpan di **version control**.\n- **Idempotent:** menjalankan berulang kali menghasilkan keadaan akhir yang sama (tidak menggandakan perubahan).\n- Mendeteksi dan memperbaiki **configuration drift**, serta mempercepat provisioning dan mengurangi kesalahan manual.\n\n### Ansible\n\n| Aspek | Penjelasan |\n|---|---|\n| **Pengembang** | Red Hat |\n| **Sifat** | **Agentless** — tidak perlu software agen di perangkat; terhubung via **SSH, NETCONF, atau API** |\n| **Model** | **Push** — control node mendorong konfigurasi ke perangkat |\n| **Bahasa** | **YAML** (file **playbook**) |\n| **Fungsi utama** | Manajemen konfigurasi, deployment, dan orkestrasi tugas |\n\n**Komponen:** *control node* (tempat Ansible dijalankan), *managed nodes* (perangkat target), **inventory** (daftar perangkat), **playbook** (rangkaian *play*), **task**, **module** (unit kerja, mis. modul `ios_*`), dan **role**.\n\n**Contoh playbook:**\n\n```yaml\n- name: Konfigurasi VLAN pada switch\n  hosts: switches\n  gather_facts: false\n  tasks:\n    - name: Pastikan VLAN 10 ada\n      cisco.ios.ios_vlans:\n        config:\n          - vlan_id: 10\n            name: DATA\n        state: merged\n```\n\n### Terraform\n\n| Aspek | Penjelasan |\n|---|---|\n| **Pengembang** | HashiCorp |\n| **Pendekatan** | **Infrastructure as Code (IaC)** — infrastruktur didefinisikan dalam kode |\n| **Sifat** | **Declarative** (menyatakan hasil akhir yang diinginkan) dan **agentless** (memakai API provider) |\n| **Bahasa** | **HCL** (*HashiCorp Configuration Language*) |\n| **Fungsi utama** | **Provisioning** infrastruktur (cloud, jaringan, server) |\n| **Komponen** | **Provider** (konektor ke platform/API), **resource**, dan **state file** (mencatat kondisi infrastruktur saat ini) |\n\n**Alur kerja Terraform:**\n\n```\nterraform init      # inisialisasi, unduh provider\nterraform plan      # pratinjau perubahan yang akan dilakukan\nterraform apply     # menerapkan perubahan\nterraform destroy   # menghapus infrastruktur yang dikelola\n```\n\n### Perbandingan Ansible dan Terraform\n\n| Aspek | **Ansible** | **Terraform** |\n|---|---|---|\n| Fokus utama | Config management & orkestrasi | **Provisioning** infrastruktur |\n| Agen di target | **Tidak** | **Tidak** |\n| Model | **Push** | Push (menerapkan via API) |\n| Bahasa | **YAML** | **HCL** |\n| Pendekatan | Deklaratif/prosedural (urutan task) | **Deklaratif** |"}, {"id": "sum-6-7", "label": "6.7 Komponen data JSON", "title": "6.7 Komponen data JSON", "html": "<p><strong>JSON (JavaScript Object Notation)</strong> adalah format data teks <strong>ringan, mudah dibaca</strong>, berbasis pasangan <strong>key–value</strong>; dipakai luas pada REST API dan otomasi jaringan.</p>\n<h3>Tipe data JSON</h3>\n<table>\n<thead>\n<tr>\n<th>Tipe</th>\n<th>Contoh</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>String</strong></td>\n<td><code>\"GigabitEthernet0/1\"</code> (dalam tanda kutip ganda)</td>\n</tr>\n<tr>\n<td><strong>Number</strong></td>\n<td><code>1500</code>, <code>3.14</code></td>\n</tr>\n<tr>\n<td><strong>Boolean</strong></td>\n<td><code>true</code>, <code>false</code></td>\n</tr>\n<tr>\n<td><strong>Null</strong></td>\n<td><code>null</code></td>\n</tr>\n<tr>\n<td><strong>Object</strong></td>\n<td><code>{ \"key\": \"value\" }</code> — kumpulan pasangan key–value dalam kurung kurawal</td>\n</tr>\n<tr>\n<td><strong>Array</strong></td>\n<td><code>[ \"a\", \"b\" ]</code> — daftar nilai berurutan dalam kurung siku</td>\n</tr>\n</tbody>\n</table>\n<h3>Aturan sintaks</h3>\n<ul>\n<li>Data berupa pasangan <strong><code>\"key\": value</code></strong>; <strong>key harus berupa string</strong> dalam tanda kutip ganda.</li>\n<li>Pasangan dipisahkan <strong>koma</strong> (tanpa koma setelah elemen terakhir).</li>\n<li><strong>Object</strong> memakai <code>{ }</code>, <strong>array</strong> memakai <code>[ ]</code>; keduanya dapat <strong>bersarang (nested)</strong>.</li>\n<li>String menggunakan <strong>tanda kutip ganda</strong> (<code>\" \"</code>); JSON <strong>tidak mendukung komentar</strong>.</li>\n<li>Spasi/indentasi tidak memengaruhi arti (hanya untuk keterbacaan).</li>\n</ul>\n<h3>Contoh dan penjelasan</h3>\n<pre><code class=\"language-json\">{\n  &quot;interface&quot;: {\n    &quot;name&quot;: &quot;GigabitEthernet0/1&quot;,\n    &quot;enabled&quot;: true,\n    &quot;mtu&quot;: 1500,\n    &quot;description&quot;: null,\n    &quot;ipv4&quot;: [\n      { &quot;address&quot;: &quot;192.168.1.1&quot;, &quot;mask&quot;: &quot;255.255.255.0&quot; },\n      { &quot;address&quot;: &quot;192.168.2.1&quot;, &quot;mask&quot;: &quot;255.255.255.0&quot; }\n    ]\n  }\n}\n</code></pre>\n<table>\n<thead>\n<tr>\n<th>Bagian</th>\n<th>Penjelasan</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>{ ... }</code> terluar</td>\n<td><strong>Object</strong> utama</td>\n</tr>\n<tr>\n<td><code>\"interface\"</code></td>\n<td><strong>Key</strong> yang nilainya berupa <strong>object bersarang</strong></td>\n</tr>\n<tr>\n<td><code>\"name\": \"GigabitEthernet0/1\"</code></td>\n<td>Pasangan key–value bertipe <strong>string</strong></td>\n</tr>\n<tr>\n<td><code>\"enabled\": true</code></td>\n<td>Nilai <strong>boolean</strong></td>\n</tr>\n<tr>\n<td><code>\"mtu\": 1500</code></td>\n<td>Nilai <strong>number</strong></td>\n</tr>\n<tr>\n<td><code>\"description\": null</code></td>\n<td>Nilai <strong>null</strong> (kosong)</td>\n</tr>\n<tr>\n<td><code>\"ipv4\": [ ... ]</code></td>\n<td><strong>Array</strong> berisi dua <strong>object</strong></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Cara membaca/mengakses nilai</strong> (indeks array dimulai dari <strong>0</strong>):</p>\n<pre><code>interface → ipv4 → elemen ke-0 → address   =   &quot;192.168.1.1&quot;\ndata[&quot;interface&quot;][&quot;ipv4&quot;][0][&quot;address&quot;]\n</code></pre>", "raw": "**JSON (JavaScript Object Notation)** adalah format data teks **ringan, mudah dibaca**, berbasis pasangan **key–value**; dipakai luas pada REST API dan otomasi jaringan.\n\n### Tipe data JSON\n\n| Tipe | Contoh |\n|---|---|\n| **String** | `\"GigabitEthernet0/1\"` (dalam tanda kutip ganda) |\n| **Number** | `1500`, `3.14` |\n| **Boolean** | `true`, `false` |\n| **Null** | `null` |\n| **Object** | `{ \"key\": \"value\" }` — kumpulan pasangan key–value dalam kurung kurawal |\n| **Array** | `[ \"a\", \"b\" ]` — daftar nilai berurutan dalam kurung siku |\n\n### Aturan sintaks\n\n- Data berupa pasangan **`\"key\": value`**; **key harus berupa string** dalam tanda kutip ganda.\n- Pasangan dipisahkan **koma** (tanpa koma setelah elemen terakhir).\n- **Object** memakai `{ }`, **array** memakai `[ ]`; keduanya dapat **bersarang (nested)**.\n- String menggunakan **tanda kutip ganda** (`\" \"`); JSON **tidak mendukung komentar**.\n- Spasi/indentasi tidak memengaruhi arti (hanya untuk keterbacaan).\n\n### Contoh dan penjelasan\n\n```json\n{\n  \"interface\": {\n    \"name\": \"GigabitEthernet0/1\",\n    \"enabled\": true,\n    \"mtu\": 1500,\n    \"description\": null,\n    \"ipv4\": [\n      { \"address\": \"192.168.1.1\", \"mask\": \"255.255.255.0\" },\n      { \"address\": \"192.168.2.1\", \"mask\": \"255.255.255.0\" }\n    ]\n  }\n}\n```\n\n| Bagian | Penjelasan |\n|---|---|\n| `{ ... }` terluar | **Object** utama |\n| `\"interface\"` | **Key** yang nilainya berupa **object bersarang** |\n| `\"name\": \"GigabitEthernet0/1\"` | Pasangan key–value bertipe **string** |\n| `\"enabled\": true` | Nilai **boolean** |\n| `\"mtu\": 1500` | Nilai **number** |\n| `\"description\": null` | Nilai **null** (kosong) |\n| `\"ipv4\": [ ... ]` | **Array** berisi dua **object** |\n\n**Cara membaca/mengakses nilai** (indeks array dimulai dari **0**):\n\n```\ninterface → ipv4 → elemen ke-0 → address   =   \"192.168.1.1\"\ndata[\"interface\"][\"ipv4\"][0][\"address\"]\n```"}, {"id": "sum-6-checklist", "label": "Checklist Review 6.0", "title": "Checklist Review Cepat — 6.0 Automation and Programmability (10%)", "html": "<table>\n<thead>\n<tr>\n<th>No.</th>\n<th>Topik</th>\n<th>Poin kunci</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>6.1</td>\n<td>Dampak otomasi</td>\n<td>Cepat, konsisten, kurangi human error, skalabel, kurangi drift, compliance; perlu pengujian dan version control</td>\n</tr>\n<tr>\n<td>6.2</td>\n<td>Traditional vs controller-based</td>\n<td>Per perangkat/CLI vs terpusat/otomasi API; contoh Cisco Catalyst Center</td>\n</tr>\n<tr>\n<td>6.3</td>\n<td>SDN: underlay, overlay, fabric</td>\n<td>Underlay = transport IP fisik; overlay = jaringan virtual (VXLAN); fabric = underlay + overlay</td>\n</tr>\n<tr>\n<td>6.3.a</td>\n<td>Control vs data plane</td>\n<td>Control = keputusan (otak); data = forwarding (otot); SDN memusatkan control plane di controller</td>\n</tr>\n<tr>\n<td>6.3.b</td>\n<td>Northbound vs southbound</td>\n<td>Northbound = ke aplikasi (REST); southbound = ke perangkat (NETCONF, RESTCONF, OpenFlow, CLI, SNMP)</td>\n</tr>\n<tr>\n<td>6.4</td>\n<td>AI/ML</td>\n<td>ML bagian dari AI; <strong>predictive</strong> memprediksi/mendeteksi; <strong>generative</strong> menciptakan konten (LLM); hasil perlu diverifikasi</td>\n</tr>\n<tr>\n<td>6.5</td>\n<td>REST API</td>\n<td>Stateless, HTTP; POST/GET/PUT-PATCH/DELETE = CRUD; auth: Basic, token/Bearer, API key, OAuth; encoding JSON/XML/YAML</td>\n</tr>\n<tr>\n<td>6.6</td>\n<td>Ansible &amp; Terraform</td>\n<td>Ansible: agentless, push, YAML playbook; Terraform: IaC deklaratif, HCL, init/plan/apply</td>\n</tr>\n<tr>\n<td>6.7</td>\n<td>JSON</td>\n<td>Key–value; object <code>{}</code>, array <code>[]</code>; string, number, boolean, null; key dalam tanda kutip ganda</td>\n</tr>\n</tbody>\n</table>", "raw": "| No. | Topik | Poin kunci |\n|---|---|---|\n| 6.1 | Dampak otomasi | Cepat, konsisten, kurangi human error, skalabel, kurangi drift, compliance; perlu pengujian dan version control |\n| 6.2 | Traditional vs controller-based | Per perangkat/CLI vs terpusat/otomasi API; contoh Cisco Catalyst Center |\n| 6.3 | SDN: underlay, overlay, fabric | Underlay = transport IP fisik; overlay = jaringan virtual (VXLAN); fabric = underlay + overlay |\n| 6.3.a | Control vs data plane | Control = keputusan (otak); data = forwarding (otot); SDN memusatkan control plane di controller |\n| 6.3.b | Northbound vs southbound | Northbound = ke aplikasi (REST); southbound = ke perangkat (NETCONF, RESTCONF, OpenFlow, CLI, SNMP) |\n| 6.4 | AI/ML | ML bagian dari AI; **predictive** memprediksi/mendeteksi; **generative** menciptakan konten (LLM); hasil perlu diverifikasi |\n| 6.5 | REST API | Stateless, HTTP; POST/GET/PUT-PATCH/DELETE = CRUD; auth: Basic, token/Bearer, API key, OAuth; encoding JSON/XML/YAML |\n| 6.6 | Ansible & Terraform | Ansible: agentless, push, YAML playbook; Terraform: IaC deklaratif, HCL, init/plan/apply |\n| 6.7 | JSON | Key–value; object `{}`, array `[]`; string, number, boolean, null; key dalam tanda kutip ganda |"}]}]};

    // Application state — defaults to "command" mode and "2.1 VLAN (Normal Range)" matching the reference screenshot
