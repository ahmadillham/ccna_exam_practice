gsung di atas IP (**protocol number 89**) dengan alamat multicast:\n  - **224.0.0.5** — semua router OSPF\n  - **224.0.0.6** — DR dan BDR\n\n### 3.4.a Neighbor adjacencies\n\n**Tahapan terbentuknya adjacency:**\n\n| State | Keterangan |\n|---|---|\n| **Down** | Belum ada Hello dari neighbor |\n| **Init** | Hello diterima, tetapi router sendiri belum terlihat di Hello neighbor |\n| **2-Way** | Komunikasi dua arah; Router ID saling terlihat (DR/BDR dipilih pada tahap ini di jaringan broadcast) |\n| **ExStart** | Menentukan master/slave untuk pertukaran database |\n| **Exchange** | Bertukar ringkasan database (DBD) |\n| **Loading** | Meminta (LSR) dan menerima (LSU) LSA yang belum dimiliki |\n| **Full** | Database tersinkron; adjacency penuh |\n\n**Syarat agar dua router menjadi neighbor** (parameter yang harus cocok/benar):\n\n- Berada pada **area yang sama**\n- **Subnet dan mask** yang sama pada link\n- **Hello dan dead timer** sama (default **10 s / 40 s** pada broadcast & point-to-point)\n- **Router ID unik** (tidak boleh sama)\n- **Authentication** (bila dipakai) cocok\n- **MTU** dan tipe area yang kompatibel\n\n### 3.4.b Point-to-point\n\n- Link yang menghubungkan **tepat dua router** (mis. link serial atau Ethernet yang dikonfigurasi point-to-point).\n- **Tidak ada pemilihan DR/BDR**; kedua router langsung membentuk adjacency **Full**.\n- Konvergensi lebih sederhana dan cepat.\n\n```\nRouter(config-if)# ip ospf network point-to-point\n```\n\n### 3.4.c Broadcast (DR/BDR selection)\n\n- **Network type default pada interface Ethernet** adalah **broadcast** (multi-access).\n- Untuk mengurangi jumlah adjacency dan trafik LSA, dipilih:\n  - **DR** (*Designated Router*) — pusat pertukaran LSA pada segmen\n  - **BDR** (*Backup Designated Router*) — cadangan DR\n  - **DROther** — router lainnya\n\n**Aturan pemilihan DR/BDR (per segmen):**\n\n1. **OSPF priority tertinggi** (default **1**; nilai **0** = tidak pernah menjadi DR/BDR).\n2. Jika seri, **Router ID tertinggi**.\n3. **Non-preemptive**: DR/BDR yang sudah terpilih **tidak digantikan** meski ada router baru dengan priority lebih tinggi (kecuali proses OSPF di-reset).\n\n**Hubungan adjacency:**\n\n| Pasangan | State |\n|---|---|\n| DROther ↔ DR / BDR | **Full** |\n| DROther ↔ DROther | **2-Way** |\n\n```\nRouter(config-if)# ip ospf priority 100     ! naikkan peluang menjadi DR\nRouter(config-if)# ip ospf priority 0       ! tidak ikut pemilihan DR/BDR\n```\n\n### 3.4.d Router ID\n\n- Identitas unik router OSPF berformat **32 bit** (ditulis seperti alamat IPv4, mis. `1.1.1.1`).\n\n**Urutan pemilihan Router ID:**\n\n1. Dikonfigurasi manual dengan perintah **`router-id`**\n2. Jika tidak ada → **alamat IP loopback tertinggi** yang aktif\n3. Jika tidak ada loopback → **alamat IP interface fisik aktif tertinggi**\n\n- Perubahan Router ID baru berlaku setelah **`clear ip ospf process`** atau reload.\n\n### Konfigurasi OSPFv2 (single area)\n\n**Metode 1 — perintah `network`:**\n\n```\nRouter(config)# router ospf 1                          ! process ID (lokal, tidak harus sama)\nRouter(config-router)# router-id 1.1.1.1\nRouter(config-router)# network 10.1.1.0 0.0.0.255 area 0\nRouter(config-router)# network 192.168.10.0 0.0.0.255 area 0\nRouter(config-router)# passive-interface gigabitEthernet 0/1   ! tidak mengirim Hello (mis. ke LAN pengguna)\n```\n\n**Metode 2 — langsung pada interface:**\n\n```\nRouter(config)# interface gigabitEthernet 0/0\nRouter(config-if)# ip ospf 1 area 0\n```\n\n**Wildcard mask** (kebalikan dari subnet mask), dipakai pada perintah `network`:\n\n| Prefix | Subnet mask | Wildcard mask |\n|---|---|---|\n| /24 | 255.255.255.0 | 0.0.0.255 |\n| /30 | 255.255.255.252 | 0.0.0.3 |\n| /32 (host) | 255.255.255.255 | 0.0.0.0 |\n\n### Verifikasi OSPFv2\n\n```\nRouter# show ip ospf neighbor\nRouter# show ip ospf interface\nRouter# show ip ospf interface brief\nRouter# show ip protocols\nRouter# show ip route ospf\nRouter# show ip ospf\n```\n\n**Contoh `show ip ospf neighbor`:**\n\n```\nNeighbor ID     Pri   State        Dead Time   Address       Interface\n2.2.2.2           1   FULL/DR      00:00:35    10.1.1.2      GigabitEthernet0/0\n3.3.3.3           1   FULL/BDR     00:00:33    10.1.1.3      GigabitEthernet0/0\n```\n\n| Tampilan state | Arti |\n|---|---|\n| `FULL/DR` | Adjacency penuh dengan neighbor yang menjadi DR |\n| `FULL/BDR` | Adjacency penuh dengan BDR |\n| `FULL/DROTHER` | Adjacency penuh dengan router DROther (terjadi bila router lokal adalah DR/BDR) |\n| `2WAY/DROTHER` | Hanya 2-Way dengan sesama DROther (normal) |\n| `FULL/ -` | Adjacency penuh pada link point-to-point (tidak ada DR/BDR) |"}, {"id": "sum-3-5", "label": "3.5 First hop redundancy protocols (FHRP)", "title": "3.5 First hop redundancy protocols (FHRP)", "html": "<h3>Tujuan (purpose)</h3>\n<ul>\n<li>Host biasanya hanya memiliki <strong>satu default gateway</strong>. Jika router tersebut mati, host <strong>kehilangan akses</strong> keluar subnet walaupun ada router cadangan.</li>\n<li><strong>FHRP</strong> menyediakan <strong>redundansi default gateway</strong> sehingga failover berlangsung <strong>otomatis dan transparan</strong> bagi host (tanpa mengubah konfigurasi host).</li>\n</ul>\n<h3>Fungsi dan konsep</h3>\n<table>\n<thead>\n<tr>\n<th>Konsep</th>\n<th>Penjelasan</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Virtual IP</strong></td>\n<td>Alamat IP gateway <strong>virtual</strong> yang dikonfigurasi sebagai default gateway pada semua host</td>\n</tr>\n<tr>\n<td><strong>Virtual MAC</strong></td>\n<td>MAC address virtual yang dikembalikan saat host melakukan ARP ke virtual IP</td>\n</tr>\n<tr>\n<td><strong>Grup FHRP</strong></td>\n<td>Beberapa router fisik (mis. R1 dan R2) berbagi satu virtual IP/MAC</td>\n</tr>\n<tr>\n<td><strong>Peran Active/Standby</strong></td>\n<td>Satu router meneruskan trafik (aktif); router lain siaga dan mengambil alih bila aktif gagal</td>\n</tr>\n<tr>\n<td><strong>Priority</strong></td>\n<td>Router dengan <strong>priority tertinggi</strong> terpilih sebagai active/master</td>\n</tr>\n<tr>\n<td><strong>Hello message</strong></td>\n<td>Dipertukarkan untuk memantau kondisi router; bila hello berhenti (melewati <em>hold time</em>), standby mengambil alih</td>\n</tr>\n<tr>\n<td><strong>Preemption</strong></td>\n<td>Router dengan priority lebih tinggi dapat <strong>merebut kembali</strong> peran aktif</td>\n</tr>\n</tbody>\n</table>\n<pre><code>              Virtual IP 192.168.1.254\n                  /             \\\n R1 (Active) 192.168.1.2    R2 (Standby) 192.168.1.3\n                  \\             /\n                   [Switch]\n                      |\n              Host (gateway = 192.168.1.254)\n</code></pre>", "raw": "### Tujuan (purpose)\n\n- Host biasanya hanya memiliki **satu default gateway**. Jika router tersebut mati, host **kehilangan akses** keluar subnet walaupun ada router cadangan.\n- **FHRP** menyediakan **redundansi default gateway** sehingga failover berlangsung **otomatis dan transparan** bagi host (tanpa mengubah konfigurasi host).\n\n### Fungsi dan konsep\n\n| Konsep | Penjelasan |\n|---|---|\n| **Virtual IP** | Alamat IP gateway **virtual** yang dikonfigurasi sebagai default gateway pada semua host |\n| **Virtual MAC** | MAC address virtual yang dikembalikan saat host melakukan ARP ke virtual IP |\n| **Grup FHRP** | Beberapa router fisik (mis. R1 dan R2) berbagi satu virtual IP/MAC |\n| **Peran Active/Standby** | Satu router meneruskan trafik (aktif); router lain siaga dan mengambil alih bila aktif gagal |\n| **Priority** | Router dengan **priority tertinggi** terpilih sebagai active/master |\n| **Hello message** | Dipertukarkan untuk memantau kondisi router; bila hello berhenti (melewati *hold time*), standby mengambil alih |\n| **Preemption** | Router dengan priority lebih tinggi dapat **merebut kembali** peran aktif |\n\n```\n              Virtual IP 192.168.1.254\n                  /             \\\n R1 (Active) 192.168.1.2    R2 (Standby) 192.168.1.3\n                  \\             /\n                   [Switch]\n                      |\n              Host (gateway = 192.168.1.254)\n```"}, {"id": "sum-3-checklist", "label": "Checklist Review 3.0", "title": "Checklist Review Cepat — 3.0 IP Connectivity (25%)", "html": "<table>\n<thead>\n<tr>\n<th>No.</th>\n<th>Topik</th>\n<th>Poin kunci</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>3.1</td>\n<td>Routing table</td>\n<td>Kode (L, C, S, O, D, R, B, S*), prefix, mask, next hop, AD (C 0, S 1, eBGP 20, EIGRP 90, OSPF 110, RIP 120), metric, gateway of last resort</td>\n</tr>\n<tr>\n<td>3.2</td>\n<td>Keputusan forwarding</td>\n<td><strong>1) Longest prefix match → 2) AD terendah → 3) Metric terendah</strong>; tanpa rute → default route atau drop</td>\n</tr>\n<tr>\n<td>3.3</td>\n<td>Static route</td>\n<td>Default (<code>0.0.0.0/0</code>, <code>::/0</code>), network, host (/32, /128), floating static (AD lebih tinggi); <code>ip route</code> / <code>ipv6 route</code></td>\n</tr>\n<tr>\n<td>3.4</td>\n<td>OSPFv2 single area</td>\n<td>Area 0; adjacency sampai <strong>Full</strong>; point-to-point tanpa DR/BDR; broadcast → DR/BDR (priority → Router ID, non-preemptive); Router ID (manual → loopback tertinggi → interface tertinggi)</td>\n</tr>\n<tr>\n<td>3.5</td>\n<td>FHRP</td>\n<td>Tujuan: redundansi default gateway; virtual IP/MAC, grup FHRP, peran active/standby, priority, hello, preemption</td>\n</tr>\n</tbody>\n</table>", "raw": "| No. | Topik | Poin kunci |\n|---|---|---|\n| 3.1 | Routing table | Kode (L, C, S, O, D, R, B, S\\*), prefix, mask, next hop, AD (C 0, S 1, eBGP 20, EIGRP 90, OSPF 110, RIP 120), metric, gateway of last resort |\n| 3.2 | Keputusan forwarding | **1) Longest prefix match → 2) AD terendah → 3) Metric terendah**; tanpa rute → default route atau drop |\n| 3.3 | Static route | Default (`0.0.0.0/0`, `::/0`), network, host (/32, /128), floating static (AD lebih tinggi); `ip route` / `ipv6 route` |\n| 3.4 | OSPFv2 single area | Area 0; adjacency sampai **Full**; point-to-point tanpa DR/BDR; broadcast → DR/BDR (priority → Router ID, non-preemptive); Router ID (manual → loopback tertinggi → interface tertinggi) |\n| 3.5 | FHRP | Tujuan: redundansi default gateway; virtual IP/MAC, grup FHRP, peran active/standby, priority, hello, preemption |"}]}, {"category": "4.0 IP SERVICES", "items": [{"id": "sum-4-1", "label": "4.1 Inside source NAT (static dan pool)", "title": "4.1 Inside source NAT (static dan pool)", "html": "<h3>Konsep</h3>\n<ul>\n<li><strong>NAT (Network Address Translation)</strong> menerjemahkan alamat IP pada header paket, umumnya dari <strong>alamat privat</strong> (inside) ke <strong>alamat publik</strong> (outside) agar perangkat internal dapat mengakses Internet.</li>\n<li><strong>Inside source NAT:</strong> yang diterjemahkan adalah <strong>alamat sumber</strong> dari host <strong>di dalam</strong> jaringan (paket keluar).</li>\n<li>Manfaat: menghemat alamat IPv4 publik dan menyembunyikan alamat internal.</li>\n</ul>\n<h3>Terminologi alamat NAT</h3>\n<table>\n<thead>\n<tr>\n<th>Istilah</th>\n<th>Arti</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Inside local</strong></td>\n<td>Alamat host <strong>inside</strong> sebagaimana terlihat dari jaringan inside (biasanya IP privat)</td>\n</tr>\n<tr>\n<td><strong>Inside global</strong></td>\n<td>Alamat host <strong>inside</strong> sebagaimana terlihat dari <strong>jaringan luar</strong> (IP publik hasil terjemahan)</td>\n</tr>\n<tr>\n<td><strong>Outside local</strong></td>\n<td>Alamat host <strong>outside</strong> sebagaimana terlihat dari jaringan inside</td>\n</tr>\n<tr>\n<td><strong>Outside global</strong></td>\n<td>Alamat <strong>sebenarnya</strong> dari host outside pada jaringan luar</td>\n</tr>\n</tbody>\n</table>\n<pre><code>[PC 192.168.1.10] ──Gi0/0 (inside) [Router NAT] Gi0/1 (outside)── Internet\n inside local = 192.168.1.10   →   inside global = 203.0.113.10\n</code></pre>\n<h3>Jenis inside source NAT</h3>\n<table>\n<thead>\n<tr>\n<th>Jenis</th>\n<th>Pemetaan</th>\n<th>Keterangan</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Static NAT</strong></td>\n<td><strong>1:1 permanen</strong></td>\n<td>Satu inside local selalu ↔ satu inside global; cocok untuk server yang harus dapat diakses dari luar</td>\n</tr>\n<tr>\n<td><strong>Dynamic NAT (pool)</strong></td>\n<td><strong>1:1 sementara</strong></td>\n<td>Alamat inside global diambil dari <strong>pool</strong>; jika pool habis, host lain tidak dapat diterjemahkan</td>\n</tr>\n</tbody>\n</table>\n<h3>Konfigurasi</h3>\n<p><strong>Langkah wajib:</strong> tentukan interface <strong>inside</strong> dan <strong>outside</strong>.</p>\n<pre><code>Router(config)# interface gigabitEthernet 0/0\nRouter(config-if)# ip nat inside\nRouter(config)# interface gigabitEthernet 0/1\nRouter(config-if)# ip nat outside\n</code></pre>\n<p><strong>1) Static NAT:</strong></p>\n<pre><code>Router(config)# ip nat inside source static 192.168.1.10 203.0.113.10\n</code></pre>\n<p><strong>2) Dynamic NAT dengan pool:</strong></p>\n<pre><code>Router(config)# ip nat pool PUBLIC 203.0.113.10 203.0.113.20 netmask 255.255.255.0\nRouter(config)# access-list 1 permit 192.168.1.0 0.0.0.255          ! host inside yang boleh di-NAT\nRouter(config)# ip nat inside source list 1 pool PUBLIC\n</code></pre>\n<h3>Verifikasi</h3>\n<pre><code>Router# show ip nat translations\nRouter# show ip nat statistics\nRouter# clear ip nat translation *\n</code></pre>\n<p><strong>Contoh <code>show ip nat translations</code>:</strong></p>\n<pre><code>Pro  Inside global        Inside local        Outside local      Outside global\n---  203.0.113.10         192.168.1.10        ---                ---\n</code></pre>\n<ul>\n<li><code>show ip nat statistics</code> menampilkan interface inside/outside, jumlah translasi, <em>hits</em>, dan <em>misses</em>.</li>\n</ul>", "raw": "### Konsep\n\n- **NAT (Network Address Translation)** menerjemahkan alamat IP pada header paket, umumnya dari **alamat privat** (inside) ke **alamat publik** (outside) agar perangkat internal dapat mengakses Internet.\n- **Inside source NAT:** yang diterjemahkan adalah **alamat sumber** dari host **di dalam** jaringan (paket keluar).\n- Manfaat: menghemat alamat IPv4 publik dan menyembunyikan alamat internal.\n\n### Terminologi alamat NAT\n\n| Istilah | Arti |\n|---|---|\n| **Inside local** | Alamat host **inside** sebagaimana terlihat dari jaringan inside (biasanya IP privat) |\n| **Inside global** | Alamat host **inside** sebagaimana terlihat dari **jaringan luar** (IP publik hasil terjemahan) |\n| **Outside local** | Alamat host **outside** sebagaimana terlihat dari jaringan inside |\n| **Outside global** | Alamat **sebenarnya** dari host outside pada jaringan luar |\n\n```\n[PC 192.168.1.10] ──Gi0/0 (inside) [Router NAT] Gi0/1 (outside)── Internet\n inside local = 192.168.1.10   →   inside global = 203.0.113.10\n```\n\n### Jenis inside source NAT\n\n| Jenis | Pemetaan | Keterangan |\n|---|---|---|\n| **Static NAT** | **1:1 permanen** | Satu inside local selalu ↔ satu inside global; cocok untuk server yang harus dapat diakses dari luar |\n| **Dynamic NAT (pool)** | **1:1 sementara** | Alamat inside global diambil dari **pool**; jika pool habis, host lain tidak dapat diterjemahkan |\n\n### Konfigurasi\n\n**Langkah wajib:** tentukan interface **inside** dan **outside**.\n\n```\nRouter(config)# interface gigabitEthernet 0/0\nRouter(config-if)# ip nat inside\nRouter(config)# interface gigabitEthernet 0/1\nRouter(config-if)# ip nat outside\n```\n\n**1) Static NAT:**\n\n```\nRouter(config)# ip nat inside source static 192.168.1.10 203.0.113.10\n```\n\n**2) Dynamic NAT dengan pool:**\n\n```\nRouter(config)# ip nat pool PUBLIC 203.0.113.10 203.0.113.20 netmask 255.255.255.0\nRouter(config)# access-list 1 permit 192.168.1.0 0.0.0.255          ! host inside yang boleh di-NAT\nRouter(config)# ip nat inside source list 1 pool PUBLIC\n```\n\n### Verifikasi\n\n```\nRouter# show ip nat translations\nRouter# show ip nat statistics\nRouter# clear ip nat translation *\n```\n\n**Contoh `show ip nat translations`:**\n\n```\nPro  Inside global        Inside local        Outside local      Outside global\n---  203.0.113.10         192.168.1.10        ---                ---\n```\n\n- `show ip nat statistics` menampilkan interface inside/outside, jumlah translasi, *hits*, dan *misses*."}, {"id": "sum-4-2", "label": "4.2 NTP (client dan server mode)", "title": "4.2 NTP (client dan server mode)", "html": "<h3>Konsep</h3>\n<ul>\n<li><strong>NTP (Network Time Protocol)</strong> menyinkronkan <strong>jam</strong> antar perangkat jaringan.</li>\n<li>Penting agar <strong>timestamp</strong> pada log (syslog), sertifikat, dan troubleshooting konsisten di seluruh perangkat.</li>\n<li>Berjalan di <strong>UDP port 123</strong>.</li>\n</ul>\n<h3>Stratum</h3>\n<p>Tingkat jarak sebuah perangkat dari sumber waktu acuan; <strong>makin kecil makin akurat</strong>.</p>\n<table>\n<thead>\n<tr>\n<th>Stratum</th>\n<th>Keterangan</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>0</strong></td>\n<td>Sumber waktu acuan (jam atom, GPS)</td>\n</tr>\n<tr>\n<td><strong>1</strong></td>\n<td>Server yang terhubung langsung ke stratum 0</td>\n</tr>\n<tr>\n<td><strong>2 – 15</strong></td>\n<td>Tiap tingkat mengambil waktu dari stratum di atasnya (+1)</td>\n</tr>\n<tr>\n<td><strong>16</strong></td>\n<td><strong>Tidak tersinkron</strong></td>\n</tr>\n</tbody>\n</table>\n<h3>Mode client dan server</h3>\n<table>\n<thead>\n<tr>\n<th>Mode</th>\n<th>Fungsi</th>\n<th>Perintah</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Server</strong></td>\n<td>Menyediakan waktu bagi perangkat lain; dengan <code>ntp master</code> perangkat memakai <strong>jam internalnya</strong> sebagai sumber otoritatif</td>\n<td><code>ntp master [stratum]</code></td>\n</tr>\n<tr>\n<td><strong>Client</strong></td>\n<td>Menyinkronkan jam dari server NTP</td>\n<td><code>ntp server &lt;alamat-ip&gt;</code></td>\n</tr>\n</tbody>\n</table>\n<pre><code>! NTP client\nRouter(config)# ntp server 10.1.1.1\n\n! NTP server internal (jam lokal dijadikan sumber, stratum 3)\nRouter(config)# ntp master 3\n\n! Opsional: zona waktu\nRouter(config)# clock timezone WIB 7\n</code></pre>\n<blockquote>\n<p>Perangkat yang sudah tersinkron juga dapat melayani perangkat lain sebagai server NTP (stratum bertambah satu).</p>\n</blockquote>\n<h3>Verifikasi</h3>\n<pre><code>Router# show ntp status\nRouter# show ntp associations\nRouter# show clock\nRouter# show clock detail\n</code></pre>\n<ul>\n<li><code>show ntp status</code> → memuat <em>\"Clock is synchronized, stratum X, reference is …\"</em>.</li>\n<li><code>show ntp associations</code> → tanda <strong><code>*</code></strong> = server yang sedang dipakai untuk sinkronisasi; <strong><code>~</code></strong> = server yang dikonfigurasi.</li>\n</ul>", "raw": "### Konsep\n\n- **NTP (Network Time Protocol)** menyinkronkan **jam** antar perangkat jaringan.\n- Penting agar **timestamp** pada log (syslog), sertifikat, dan troubleshooting konsisten di seluruh perangkat.\n- Berjalan di **UDP port 123**.\n\n### Stratum\n\nTingkat jarak sebuah perangkat dari sumber waktu acuan; **makin kecil makin akurat**.\n\n| Stratum | Keterangan |\n|---|---|\n| **0** | Sumber waktu acuan (jam atom, GPS) |\n| **1** | Server yang terhubung langsung ke stratum 0 |\n| **2 – 15** | Tiap tingkat mengambil waktu dari stratum di atasnya (+1) |\n| **16** | **Tidak tersinkron** |\n\n### Mode client dan server\n\n| Mode | Fungsi | Perintah |\n|---|---|---|\n| **Server** | Menyediakan waktu bagi perangkat lain; dengan `ntp master` perangkat memakai **jam internalnya** sebagai sumber otoritatif | `ntp master [stratum]` |\n| **Client** | Menyinkronkan jam dari server NTP | `ntp server <alamat-ip>` |\n\n```\n! NTP client\nRouter(config)# ntp server 10.1.1.1\n\n! NTP server internal (jam lokal dijadikan sumber, stratum 3)\nRouter(config)# ntp master 3\n\n! Opsional: zona waktu\nRouter(config)# clock timezone WIB 7\n```\n\n> Perangkat yang sudah tersinkron juga dapat melayani perangkat lain sebagai server NTP (stratum bertambah satu).\n\n### Verifikasi\n\n```\nRouter# show ntp status\nRouter# show ntp associations\nRouter# show clock\nRouter# show clock detail\n```\n\n- `show ntp status` → memuat *\"Clock is synchronized, stratum X, reference is …\"*.\n- `show ntp associations` → tanda **`*`** = server yang sedang dipakai untuk sinkronisasi; **`~`** = server yang dikonfigurasi."}, {"id": "sum-4-3", "label": "4.3 Peran DHCP dan DNS dalam jaringan", "title": "4.3 Peran DHCP dan DNS dalam jaringan", "html": "<h3>DHCP (Dynamic Host Configuration Protocol)</h3>\n<p><strong>Peran:</strong> memberikan <strong>konfigurasi IP otomatis</strong> kepada client sehingga tidak perlu diatur manual.</p>\n<p><strong>Parameter yang diberikan:</strong> alamat IP, subnet mask, <strong>default gateway</strong>, <strong>DNS server</strong>, dan <strong>lease time</strong>.</p>\n<p><strong>Manfaat:</strong> manajemen terpusat, mengurangi kesalahan konfigurasi dan konflik IP.</p>\n<ul>\n<li>Port: <strong>UDP 67</strong> (server) dan <strong>UDP 68</strong> (client).</li>\n</ul>\n<p><strong>Proses DORA:</strong></p>\n<table>\n<thead>\n<tr>\n<th>Langkah</th>\n<th>Pesan</th>\n<th>Arah</th>\n<th>Keterangan</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td><strong>D</strong>iscover</td>\n<td>Client → <em>broadcast</em></td>\n<td>Client mencari server DHCP</td>\n</tr>\n<tr>\n<td>2</td>\n<td><strong>O</strong>ffer</td>\n<td>Server → client</td>\n<td>Server menawarkan konfigurasi IP</td>\n</tr>\n<tr>\n<td>3</td>\n<td><strong>R</strong>equest</td>\n<td>Client → server (<em>broadcast</em>)</td>\n<td>Client meminta/menerima penawaran</td>\n</tr>\n<tr>\n<td>4</td>\n<td><strong>A</strong>cknowledge</td>\n<td>Server → client</td>\n<td>Server mengonfirmasi dan memberi <em>lease</em></td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li><strong>Lease:</strong> alamat dipinjamkan untuk jangka waktu tertentu dan dapat diperbarui (<em>renew</em>) sebelum habis (pada ±50% masa lease).</li>\n</ul>\n<h3>DNS (Domain Name System)</h3>\n<p><strong>Peran:</strong> menerjemahkan <strong>nama domain</strong> (mis. <code>www.example.com</code>) menjadi <strong>alamat IP</strong>, sehingga pengguna tidak perlu menghafal alamat IP.</p>\n<ul>\n<li>Port: <strong>UDP/TCP 53</strong>.</li>\n<li>Struktur <strong>hierarkis dan terdistribusi</strong> (root → TLD → domain otoritatif).</li>\n<li>Alamat DNS server biasanya diterima client melalui <strong>DHCP</strong>.</li>\n<li>Resolver menyimpan hasil query dalam <strong>cache</strong> untuk mempercepat permintaan berikutnya.</li>\n</ul>\n<p><strong>Alur singkat:</strong></p>\n<pre><code>Client ──(1) query &quot;www.example.com&quot;──▶ DNS Server\nClient ◀──(2) jawaban: 93.184.216.34 ──── DNS Server\nClient ──(3) kirim trafik ke 93.184.216.34\n</code></pre>", "raw": "### DHCP (Dynamic Host Configuration Protocol)\n\n**Peran:** memberikan **konfigurasi IP otomatis** kepada client sehingga tidak perlu diatur manual.\n\n**Parameter yang diberikan:** alamat IP, subnet mask, **default gateway**, **DNS server**, dan **lease time**.\n\n**Manfaat:** manajemen terpusat, mengurangi kesalahan konfigurasi dan konflik IP.\n\n- Port: **UDP 67** (server) dan **UDP 68** (client).\n\n**Proses DORA:**\n\n| Langkah | Pesan | Arah | Keterangan |\n|---|---|---|---|\n| 1 | **D**iscover | Client → *broadcast* | Client mencari server DHCP |\n| 2 | **O**ffer | Server → client | Server menawarkan konfigurasi IP |\n| 3 | **R**equest | Client → server (*broadcast*) | Client meminta/menerima penawaran |\n| 4 | **A**cknowledge | Server → client | Server mengonfirmasi dan memberi *lease* |\n\n- **Lease:** alamat dipinjamkan untuk jangka waktu tertentu dan dapat diperbarui (*renew*) sebelum habis (pada ±50% masa lease).\n\n### DNS (Domain Name System)\n\n**Peran:** menerjemahkan **nama domain** (mis. `www.example.com`) menjadi **alamat IP**, sehingga pengguna tidak perlu menghafal alamat IP.\n\n- Port: **UDP/TCP 53**.\n- Struktur **hierarkis dan terdistribusi** (root → TLD → domain otoritatif).\n- Alamat DNS server biasanya diterima client melalui **DHCP**.\n- Resolver menyimpan hasil query dalam **cache** untuk mempercepat permintaan berikutnya.\n\n**Alur singkat:**\n\n```\nClient ──(1) query \"www.example.com\"──▶ DNS Server\nClient ◀──(2) jawaban: 93.184.216.34 ──── DNS Server\nClient ──(3) kirim trafik ke 93.184.216.34\n```"}, {"id": "sum-4-4", "label": "4.4 Fungsi SNMP dalam operasional jaringan", "title": "4.4 Fungsi SNMP dalam operasional jaringan", "html": "<h3>Fungsi</h3>\n<p><strong>SNMP (Simple Network Management Protocol)</strong> dipakai untuk <strong>memantau (monitoring) dan mengelola</strong> perangkat jaringan secara terpusat: kondisi perangkat, utilisasi interface, CPU/memori, dan event/kegagalan.</p>\n<h3>Komponen</h3>\n<table>\n<thead>\n<tr>\n<th>Komponen</th>\n<th>Fungsi</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>NMS</strong> (<em>Network Management Station</em>) / SNMP Manager</td>\n<td>Aplikasi pusat yang mengumpulkan dan menampilkan data</td>\n</tr>\n<tr>\n<td><strong>SNMP Agent</strong></td>\n<td>Perangkat lunak pada perangkat jaringan yang menjawab permintaan dan mengirim notifikasi</td>\n</tr>\n<tr>\n<td><strong>Managed device</strong></td>\n<td>Perangkat yang dipantau (router, switch, server, dll.)</td>\n</tr>\n<tr>\n<td><strong>MIB</strong> (<em>Management Information Base</em>)</td>\n<td><strong>Basis data</strong> informasi perangkat, terstruktur hierarkis dan diidentifikasi oleh <strong>OID</strong></td>\n</tr>\n</tbody>\n</table>\n<h3>Operasi SNMP</h3>\n<table>\n<thead>\n<tr>\n<th>Operasi</th>\n<th>Fungsi</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Get / GetNext / GetBulk</strong></td>\n<td>NMS <strong>membaca</strong> nilai variabel MIB dari agent (<em>polling</em>)</td>\n</tr>\n<tr>\n<td><strong>Set</strong></td>\n<td>NMS <strong>mengubah</strong> nilai variabel pada agent (mengubah konfigurasi)</td>\n</tr>\n<tr>\n<td><strong>Trap</strong></td>\n<td>Agent mengirim <strong>notifikasi</strong> event secara spontan ke NMS (tanpa konfirmasi)</td>\n</tr>\n<tr>\n<td><strong>Inform</strong></td>\n<td>Seperti trap tetapi <strong>dengan acknowledgement</strong> dari NMS</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li>Port: <strong>UDP 161</strong> (agent menerima permintaan), <strong>UDP 162</strong> (NMS menerima trap/inform).</li>\n</ul>", "raw": "### Fungsi\n\n**SNMP (Simple Network Management Protocol)** dipakai untuk **memantau (monitoring) dan mengelola** perangkat jaringan secara terpusat: kondisi perangkat, utilisasi interface, CPU/memori, dan event/kegagalan.\n\n### Komponen\n\n| Komponen | Fungsi |\n|---|---|\n| **NMS** (*Network Management Station*) / SNMP Manager | Aplikasi pusat yang mengumpulkan dan menampilkan data |\n| **SNMP Agent** | Perangkat lunak pada perangkat jaringan yang menjawab permintaan dan mengirim notifikasi |\n| **Managed device** | Perangkat yang dipantau (router, switch, server, dll.) |\n| **MIB** (*Management Information Base*) | **Basis data** informasi perangkat, terstruktur hierarkis dan diidentifikasi oleh **OID** |\n\n### Operasi SNMP\n\n| Operasi | Fungsi |\n|---|---|\n| **Get / GetNext / GetBulk** | NMS **membaca** nilai variabel MIB dari agent (*polling*) |\n| **Set** | NMS **mengubah** nilai variabel pada agent (mengubah konfigurasi) |\n| **Trap** | Agent mengirim **notifikasi** event secara spontan ke NMS (tanpa konfirmasi) |\n| **Inform** | Seperti trap tetapi **dengan acknowledgement** dari NMS |\n\n- Port: **UDP 161** (agent menerima permintaan), **UDP 162** (NMS menerima trap/inform)."}, {"id": "sum-4-5", "label": "4.5 Syslog: facilities dan severity levels", "title": "4.5 Syslog: facilities dan severity levels", "html": "<h3>Fungsi</h3>\n<p><strong>Syslog</strong> adalah standar untuk <strong>mengirim dan menyimpan pesan log</strong> dari perangkat ke lokasi tertentu, termasuk <strong>syslog server</strong> terpusat (<strong>UDP 514</strong>), untuk monitoring dan troubleshooting.</p>\n<p><strong>Tujuan (destination) log pada perangkat Cisco:</strong></p>\n<table>\n<thead>\n<tr>\n<th>Tujuan</th>\n<th>Keterangan</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Console</strong></td>\n<td>Ditampilkan pada console line</td>\n</tr>\n<tr>\n<td><strong>Terminal (VTY)</strong></td>\n<td>Sesi remote; perlu <code>terminal monitor</code></td>\n</tr>\n<tr>\n<td><strong>Buffer</strong></td>\n<td>Disimpan di memori (RAM)</td>\n</tr>\n<tr>\n<td><strong>Syslog server</strong></td>\n<td>Dikirim ke server eksternal</td>\n</tr>\n</tbody>\n</table>\n<h3>Severity levels</h3>\n<p><strong>Angka lebih kecil = lebih parah.</strong> Mengatur level tertentu berarti menampilkan pesan pada level itu <strong>dan semua level yang lebih parah</strong> (angka lebih kecil).</p>\n<table>\n<thead>\n<tr>\n<th>Level</th>\n<th>Nama</th>\n<th>Keterangan</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>0</strong></td>\n<td><strong>Emergency</strong></td>\n<td>Sistem tidak dapat digunakan</td>\n</tr>\n<tr>\n<td><strong>1</strong></td>\n<td><strong>Alert</strong></td>\n<td>Perlu tindakan segera</td>\n</tr>\n<tr>\n<td><strong>2</strong></td>\n<td><strong>Critical</strong></td>\n<td>Kondisi kritis</td>\n</tr>\n<tr>\n<td><strong>3</strong></td>\n<td><strong>Error</strong></td>\n<td>Kondisi error</td>\n</tr>\n<tr>\n<td><strong>4</strong></td>\n<td><strong>Warning</strong></td>\n<td>Peringatan</td>\n</tr>\n<tr>\n<td><strong>5</strong></td>\n<td><strong>Notice</strong></td>\n<td>Normal tetapi signifikan</td>\n</tr>\n<tr>\n<td><strong>6</strong></td>\n<td><strong>Informational</strong></td>\n<td>Pesan informasi</td>\n</tr>\n<tr>\n<td><strong>7</strong></td>\n<td><strong>Debugging</strong></td>\n<td>Pesan debug</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p>Mnemonik: <strong>E</strong>very <strong>A</strong>wesome <strong>C</strong>isco <strong>E</strong>ngineer <strong>W</strong>ill <strong>N</strong>eed <strong>I</strong>cecream <strong>D</strong>aily.</p>\n</blockquote>\n<h3>Facilities</h3>\n<ul>\n<li><strong>Facility</strong> adalah <strong>kategori sumber</strong> pesan syslog (jenis proses/subsistem yang menghasilkannya), mis. <em>kernel</em>, <em>user</em>, <em>mail</em>, <em>system daemons</em>, <em>auth</em>, <em>syslog</em>, <strong>local0 – local7</strong>.</li>\n<li>Bersama <strong>severity</strong> membentuk nilai <strong>priority</strong> pada pesan syslog, sehingga server dapat memilah/menyaring log.</li>\n<li>Perangkat Cisco umumnya memakai facility <strong>local7</strong> secara default saat mengirim ke syslog server.</li>\n</ul>\n<h3>Format pesan Cisco</h3>\n<pre><code>%LINK-3-UPDOWN: Interface GigabitEthernet0/1, changed state to up\n │     │   │            └─ Deskripsi pesan\n │     │   └─ Mnemonic\n │     └─ Severity (3 = Error)\n └─ Facility/subsistem Cisco (LINK)\n</code></pre>\n<blockquote>\n<p>Bagian <em>facility</em> pada format pesan Cisco (<code>LINK</code>, <code>SYS</code>, dll.) menunjukkan subsistem Cisco penghasil pesan.</p>\n</blockquote>\n<h3>Verifikasi</h3>\n<pre><code>Router# terminal monitor                               ! tampilkan log pada sesi VTY\nRouter# show logging\n</code></pre>", "raw": "### Fungsi\n\n**Syslog** adalah standar untuk **mengirim dan menyimpan pesan log** dari perangkat ke lokasi tertentu, termasuk **syslog server** terpusat (**UDP 514**), untuk monitoring dan troubleshooting.\n\n**Tujuan (destination) log pada perangkat Cisco:**\n\n| Tujuan | Keterangan |\n|---|---|\n| **Console** | Ditampilkan pada console line |\n| **Terminal (VTY)** | Sesi remote; perlu `terminal monitor` |\n| **Buffer** | Disimpan di memori (RAM) |\n| **Syslog server** | Dikirim ke server eksternal |\n\n### Severity levels\n\n**Angka lebih kecil = lebih parah.** Mengatur level tertentu berarti menampilkan pesan pada level itu **dan semua level yang lebih parah** (angka lebih kecil).\n\n| Level | Nama | Keterangan |\n|---|---|---|\n| **0** | **Emergency** | Sistem tidak dapat digunakan |\n| **1** | **Alert** | Perlu tindakan segera |\n| **2** | **Critical** | Kondisi kritis |\n| **3** | **Error** | Kondisi error |\n| **4** | **Warning** | Peringatan |\n| **5** | **Notice** | Normal tetapi signifikan |\n| **6** | **Informational** | Pesan informasi |\n| **7** | **Debugging** | Pesan debug |\n\n> Mnemonik: **E**very **A**wesome **C**isco **E**ngineer **W**ill **N**eed **I**cecream **D**aily.\n\n### Facilities\n\n- **Facility** adalah **kategori sumber** pesan syslog (jenis proses/subsistem yang menghasilkannya), mis. *kernel*, *user*, *mail*, *system daemons*, *auth*, *syslog*, **local0 – local7**.\n- Bersama **severity** membentuk nilai **priority** pada pesan syslog, sehingga server dapat memilah/menyaring log.\n- Perangkat Cisco umumnya memakai facility **local7** secara default saat mengirim ke syslog server.\n\n### Format pesan Cisco\n\n```\n%LINK-3-UPDOWN: Interface GigabitEthernet0/1, changed state to up\n │     │   │            └─ Deskripsi pesan\n │     │   └─ Mnemonic\n │     └─ Severity (3 = Error)\n └─ Facility/subsistem Cisco (LINK)\n```\n\n> Bagian *facility* pada format pesan Cisco (`LINK`, `SYS`, dll.) menunjukkan subsistem Cisco penghasil pesan.\n\n### Verifikasi\n\n```\nRouter# terminal monitor                               ! tampilkan log pada sesi VTY\nRouter# show logging\n```"}, {"id": "sum-4-6", "label": "4.6 DHCP client dan relay", "title": "4.6 DHCP client dan relay", "html": "<h3>DHCP Client pada perangkat Cisco</h3>\n<p>Interface router/switch dapat <strong>menerima alamat IP dari server DHCP</strong> (mis. interface WAN yang tersambung ke ISP).</p>\n<pre><code>Router(config)# interface gigabitEthernet 0/0\nRouter(config-if)# ip address dhcp\nRouter(config-if)# no shutdown\n</code></pre>\n<p><strong>Verifikasi:</strong></p>\n<pre><code>Router# show ip interface brief        ! kolom Method = DHCP\nRouter# show dhcp lease                ! detail lease: IP, server, waktu lease\nRouter# show interfaces gigabitEthernet 0/0\n</code></pre>\n<h3>DHCP Relay</h3>\n<p><strong>Masalah:</strong> pesan <strong>DHCP Discover</strong> berupa <em>broadcast</em> yang <strong>tidak diteruskan oleh router</strong>. Jika server DHCP berada di <strong>subnet berbeda</strong> dari client, client tidak dapat menjangkaunya.</p>\n<p><strong>Solusi:</strong> <strong>DHCP relay agent</strong> (<code>ip helper-address</code>) pada router/L3 switch mengubah broadcast DHCP menjadi <strong>unicast</strong> menuju server DHCP.</p>\n<pre><code>[Client] ─ broadcast ─▶ [Router: ip helper-address] ─ unicast ─▶ [DHCP Server 10.10.10.5]\n subnet 192.168.1.0/24                                          subnet 10.10.10.0/24\n</code></pre>\n<p><strong>Konfigurasi</strong> (pada interface yang <strong>menghadap client</strong>):</p>\n<pre><code>Router(config)# interface gigabitEthernet 0/1\nRouter(config-if)# ip address 192.168.1.1 255.255.255.0\nRouter(config-if)# ip helper-address 10.10.10.5\n</code></pre>\n<p><strong>Pada L3 switch</strong> (SVI):</p>\n<pre><code>Switch(config)# interface vlan 10\nSwitch(config-if)# ip helper-address 10.10.10.5\n</code></pre>\n<p><strong>Verifikasi:</strong></p>\n<pre><code>Router# show ip interface gigabitEthernet 0/1      ! menampilkan &quot;Helper address is 10.10.10.5&quot;\nRouter# show running-config interface gigabitEthernet 0/1\n</code></pre>\n<ul>\n<li>Relay menambahkan alamat interface-nya sebagai <strong>giaddr</strong> sehingga server mengetahui <strong>subnet</strong> asal client dan memilih alamat yang sesuai.</li>\n</ul>", "raw": "### DHCP Client pada perangkat Cisco\n\nInterface router/switch dapat **menerima alamat IP dari server DHCP** (mis. interface WAN yang tersambung ke ISP).\n\n```\nRouter(config)# interface gigabitEthernet 0/0\nRouter(config-if)# ip address dhcp\nRouter(config-if)# no shutdown\n```\n\n**Verifikasi:**\n\n```\nRouter# show ip interface brief        ! kolom Method = DHCP\nRouter# show dhcp lease                ! detail lease: IP, server, waktu lease\nRouter# show interfaces gigabitEthernet 0/0\n```\n\n### DHCP Relay\n\n**Masalah:** pesan **DHCP Discover** berupa *broadcast* yang **tidak diteruskan oleh router**. Jika server DHCP berada di **subnet berbeda** dari client, client tidak dapat menjangkaunya.\n\n**Solusi:** **DHCP relay agent** (`ip helper-address`) pada router/L3 switch mengubah broadcast DHCP menjadi **unicast** menuju server DHCP.\n\n```\n[Client] ─ broadcast ─▶ [Router: ip helper-address] ─ unicast ─▶ [DHCP Server 10.10.10.5]\n subnet 192.168.1.0/24                                          subnet 10.10.10.0/24\n```\n\n**Konfigurasi** (pada interface yang **menghadap client**):\n\n```\nRouter(config)# interface gigabitEthernet 0/1\nRouter(config-if)# ip address 192.168.1.1 255.255.255.0\nRouter(config-if)# ip helper-address 10.10.10.5\n```\n\n**Pada L3 switch** (SVI):\n\n```\nSwitch(config)# interface vlan 10\nSwitch(config-if)# ip helper-address 10.10.10.5\n```\n\n**Verifikasi:**\n\n```\nRouter# show ip interface gigabitEthernet 0/1      ! menampilkan \"Helper address is 10.10.10.5\"\nRouter# show running-config interface gigabitEthernet 0/1\n```\n\n- Relay menambahkan alamat interface-nya sebagai **giaddr** sehingga server mengetahui **subnet** asal client dan memilih alamat yang sesuai."}, {"id": "sum-4-7", "label": "4.7 Forwarding per-hop behavior (PHB) untuk QoS", "title": "4.7 Forwarding per-hop behavior (PHB) untuk QoS", "html": "<h3>Tujuan QoS</h3>\n<p><strong>QoS (Quality of Service)</strong> mengatur perlakuan terhadap jenis trafik berbeda agar trafik penting (mis. voice) mendapat layanan lebih baik saat jaringan padat.</p>\n<p><strong>Karakteristik yang dikelola:</strong></p>\n<table>\n<thead>\n<tr>\n<th>Karakteristik</th>\n<th>Arti</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Bandwidth</strong></td>\n<td>Kapasitas link</td>\n</tr>\n<tr>\n<td><strong>Delay</strong></td>\n<td>Waktu tempuh paket</td>\n</tr>\n<tr>\n<td><strong>Jitter</strong></td>\n<td>Variasi delay antar paket</td>\n</tr>\n<tr>\n<td><strong>Loss</strong></td>\n<td>Persentase paket hilang</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p>Contoh kebutuhan <strong>voice</strong> (satu arah): delay ≤ 150 ms, jitter ≤ 30 ms, loss ≤ 1%.</p>\n</blockquote>\n<h3>Per-Hop Behavior (PHB)</h3>\n<ul>\n<li><strong>PHB</strong> adalah perlakuan forwarding yang diterapkan <strong>setiap router (hop) secara independen</strong> terhadap paket, berdasarkan <strong>marking</strong> pada paket (model <strong>DiffServ</strong>).</li>\n<li>Tiap hop menerapkan alur: <strong>classification → marking → queuing → congestion management/avoidance → policing/shaping</strong>.</li>\n</ul>\n<h3>Classification</h3>\n<p>Mengidentifikasi <strong>jenis trafik</strong> dan mengelompokkannya ke dalam kelas.</p>\n<ul>\n<li>Berdasarkan: <strong>ACL</strong> (IP/port), <strong>NBAR</strong> (aplikasi), interface masuk, atau <strong>marking</strong> yang sudah ada (CoS/DSCP).</li>\n</ul>\n<h3>Marking</h3>\n<p>Memberi <strong>label prioritas</strong> pada paket agar hop berikutnya dapat mengenali kelasnya tanpa mengklasifikasi ulang.</p>\n<table>\n<thead>\n<tr>\n<th>Layer</th>\n<th>Field</th>\n<th>Keterangan</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Layer 2</strong></td>\n<td><strong>CoS</strong> (field <strong>PCP</strong> pada tag 802.1Q)</td>\n<td>3 bit, nilai 0 – 7</td>\n</tr>\n<tr>\n<td><strong>Layer 3</strong></td>\n<td><strong>IP Precedence</strong></td>\n<td>3 bit pada byte ToS (0 – 7)</td>\n</tr>\n<tr>\n<td><strong>Layer 3</strong></td>\n<td><strong>DSCP</strong></td>\n<td><strong>6 bit</strong> pada byte ToS/DS (0 – 63)</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Nilai DSCP/PHB umum:</strong></p>\n<table>\n<thead>\n<tr>\n<th>PHB</th>\n<th>DSCP</th>\n<th>Penggunaan</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Default / Best Effort (BE)</strong></td>\n<td>0</td>\n<td>Trafik biasa</td>\n</tr>\n<tr>\n<td><strong>EF</strong> (<em>Expedited Forwarding</em>)</td>\n<td><strong>46</strong></td>\n<td><strong>Voice</strong> — prioritas tertinggi, delay/jitter/loss rendah</td>\n</tr>\n<tr>\n<td><strong>AFxy</strong> (<em>Assured Forwarding</em>)</td>\n<td>AF11=10, AF21=18, AF31=26, <strong>AF41=34</strong></td>\n<td><code>x</code> = kelas (1–4), <code>y</code> = <em>drop precedence</em> (1–3; makin besar makin mudah dibuang). DSCP = 8x + 2y</td>\n</tr>\n<tr>\n<td><strong>CS</strong> (<em>Class Selector</em>)</td>\n<td>CS1=8 … CS6=48, CS7=56</td>\n<td>Kompatibel dengan IP Precedence</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p><strong>Trust boundary:</strong> titik di jaringan tempat marking dari perangkat ujung mulai dipercaya (mis. IP phone), atau di-<em>re-mark</em> oleh switch/router.</p>\n</blockquote>\n<h3>Queuing</h3>\n<ul>\n<li>Saat <strong>link padat</strong>, paket menunggu di <strong>antrean</strong> (<em>queue</em>); <strong>scheduler</strong> menentukan paket mana yang dikirim lebih dulu.</li>\n<li>Contoh mekanisme: <strong>FIFO</strong> (default, tanpa prioritas), <strong>CBWFQ</strong> (<em>Class-Based Weighted Fair Queuing</em>: bandwidth minimum per kelas), <strong>LLQ</strong> (<em>Low Latency Queuing</em>: CBWFQ + antrean <strong>prioritas ketat</strong> untuk voice).</li>\n</ul>\n<h3>Congestion (management dan avoidance)</h3>\n<ul>\n<li><strong>Congestion management:</strong> pengelolaan saat antrean penuh melalui <strong>queuing</strong> (di atas).</li>\n<li><strong>Congestion avoidance:</strong> mencegah antrean penuh dengan <strong>membuang paket lebih awal</strong>.</li>\n<li><strong>Tail drop:</strong> paket baru <strong>dibuang saat antrean penuh</strong> (semua kelas terdampak).</li>\n<li><strong>RED / WRED</strong> (<em>(Weighted) Random Early Detection</em>): membuang paket secara acak <strong>sebelum</strong> antrean penuh; WRED memilih berdasarkan <strong>marking</strong> (paket prioritas rendah dibuang lebih dulu), mengurangi sinkronisasi TCP.</li>\n</ul>\n<h3>Policing dan Shaping</h3>\n<p>Keduanya <strong>membatasi laju trafik</strong> terhadap batas tertentu (mis. CIR), tetapi memperlakukan kelebihan trafik secara berbeda.</p>\n<table>\n<thead>\n<tr>\n<th>Aspek</th>\n<th><strong>Policing</strong></th>\n<th><strong>Shaping</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Kelebihan trafik</td>\n<td><strong>Dibuang</strong> atau <strong>di-re-mark</strong></td>\n<td><strong>Ditahan (buffer)</strong> lalu dikirim saat ada kapasitas</td>\n</tr>\n<tr>\n<td>Delay</td>\n<td>Tidak menambah delay</td>\n<td><strong>Menambah delay</strong> (buffering)</td>\n</tr>\n<tr>\n<td>Efek pada trafik</td>\n<td>Trafik tampak <strong>bergerigi/bursty</strong></td>\n<td>Trafik <strong>lebih halus</strong> (smoothing)</td>\n</tr>\n<tr>\n<td>Arah penerapan</td>\n<td><strong>Inbound dan outbound</strong></td>\n<td><strong>Outbound saja</strong></td>\n</tr>\n<tr>\n<td>Contoh penggunaan</td>\n<td>Membatasi trafik dari pelanggan/ISP</td>\n<td>Menyesuaikan laju kirim dengan CIR link WAN</td>\n</tr>\n</tbody>\n</table>", "raw": "### Tujuan QoS\n\n**QoS (Quality of Service)** mengatur perlakuan terhadap jenis trafik berbeda agar trafik penting (mis. voice) mendapat layanan lebih baik saat jaringan padat.\n\n**Karakteristik yang dikelola:**\n\n| Karakteristik | Arti |\n|---|---|\n| **Bandwidth** | Kapasitas link |\n| **Delay** | Waktu tempuh paket |\n| **Jitter** | Variasi delay antar paket |\n| **Loss** | Persentase paket hilang |\n\n> Contoh kebutuhan **voice** (satu arah): delay ≤ 150 ms, jitter ≤ 30 ms, loss ≤ 1%.\n\n### Per-Hop Behavior (PHB)\n\n- **PHB** adalah perlakuan forwarding yang diterapkan **setiap router (hop) secara independen** terhadap paket, berdasarkan **marking** pada paket (model **DiffServ**).\n- Tiap hop menerapkan alur: **classification → marking → queuing → congestion management/avoidance → policing/shaping**.\n\n### Classification\n\nMengidentifikasi **jenis trafik** dan mengelompokkannya ke dalam kelas.\n\n- Berdasarkan: **ACL** (IP/port), **NBAR** (aplikasi), interface masuk, atau **marking** yang sudah ada (CoS/DSCP).\n\n### Marking\n\nMemberi **label prioritas** pada paket agar hop berikutnya dapat mengenali kelasnya tanpa mengklasifikasi ulang.\n\n| Layer | Field | Keterangan |\n|---|---|---|\n| **Layer 2** | **CoS** (field **PCP** pada tag 802.1Q) | 3 bit, nilai 0 – 7 |\n| **Layer 3** | **IP Precedence** | 3 bit pada byte ToS (0 – 7) |\n| **Layer 3** | **DSCP** | **6 bit** pada byte ToS/DS (0 – 63) |\n\n**Nilai DSCP/PHB umum:**\n\n| PHB | DSCP | Penggunaan |\n|---|---|---|\n| **Default / Best Effort (BE)** | 0 | Trafik biasa |\n| **EF** (*Expedited Forwarding*) | **46** | **Voice** — prioritas tertinggi, delay/jitter/loss rendah |\n| **AFxy** (*Assured Forwarding*) | AF11=10, AF21=18, AF31=26, **AF41=34** | `x` = kelas (1–4), `y` = *drop precedence* (1–3; makin besar makin mudah dibuang). DSCP = 8x + 2y |\n| **CS** (*Class Selector*) | CS1=8 … CS6=48, CS7=56 | Kompatibel dengan IP Precedence |\n\n> **Trust boundary:** titik di jaringan tempat marking dari perangkat ujung mulai dipercaya (mis. IP phone), atau di-*re-mark* oleh switch/router.\n\n### Queuing\n\n- Saat **link padat**, paket menunggu di **antrean** (*queue*); **scheduler** menentukan paket mana yang dikirim lebih dulu.\n- Contoh mekanisme: **FIFO** (default, tanpa prioritas), **CBWFQ** (*Class-Based Weighted Fair Queuing*: bandwidth minimum per kelas), **LLQ** (*Low Latency Queuing*: CBWFQ + antrean **prioritas ketat** untuk voice).\n\n### Congestion (management dan avoidance)\n\n- **Congestion management:** pengelolaan saat antrean penuh melalui **queuing** (di atas).\n- **Congestion avoidance:** mencegah antrean penuh dengan **membuang paket lebih awal**.\n  - **Tail drop:** paket baru **dibuang saat antrean penuh** (semua kelas terdampak).\n  - **RED / WRED** (*(Weighted) Random Early Detection*): membuang paket secara acak **sebelum** antrean penuh; WRED memilih berdasarkan **marking** (paket prioritas rendah dibuang lebih dulu), mengurangi sinkronisasi TCP.\n\n### Policing dan Shaping\n\nKeduanya **membatasi laju trafik** terhadap batas tertentu (mis. CIR), tetapi memperlakukan kelebihan trafik secara berbeda.\n\n| Aspek | **Policing** | **Shaping** |\n|---|---|---|\n| Kelebihan trafik | **Dibuang** atau **di-re-mark** | **Ditahan (buffer)** lalu dikirim saat ada kapasitas |\n| Delay | Tidak menambah delay | **Menambah delay** (buffering) |\n| Efek pada trafik | Trafik tampak **bergerigi/bursty** | Trafik **lebih halus** (smoothing) |\n| Arah penerapan | **Inbound dan outbound** | **Outbound saja** |\n| Contoh penggunaan | Membatasi trafik dari pelanggan/ISP | Menyesuaikan laju kirim dengan CIR link WAN |"}, {"id": "sum-4-8", "label": "4.8 Remote access menggunakan SSH", "title": "4.8 Remote access menggunakan SSH", "html": "<h3>Konsep</h3>\n<ul>\n<li><strong>SSH (Secure Shell)</strong> menyediakan akses CLI jarak jauh yang <strong>terenkripsi</strong> (TCP <strong>22</strong>), pengganti <strong>Telnet</strong> yang tidak aman.</li>\n<li>Disarankan memakai <strong>SSH versi 2</strong>.</li>\n</ul>\n<h3>Prasyarat</h3>\n<ol>\n<li><strong>Hostname</strong> perangkat selain default.</li>\n<li><strong>Domain name</strong> (dipakai untuk membuat kunci).</li>\n<li><strong>Kunci RSA</strong> (<em>crypto key</em>) — gunakan modulus ≥ 768 bit untuk SSHv2 (disarankan <strong>2048</strong>).</li>\n<li><strong>Akun pengguna lokal</strong> (atau server AAA).</li>\n<li><strong>Alamat IP manajemen</strong> dan konektivitas jaringan ke perangkat.</li>\n<li>IOS dengan dukungan kriptografi (image <strong>k9</strong>).</li>\n</ol>\n<h3>Konfigurasi</h3>\n<pre><code>Router(config)# hostname R1\nR1(config)# ip domain-name example.com\nR1(config)# crypto key generate rsa modulus 2048\nR1(config)# ip ssh version 2\nR1(config)# username admin secret StrongPass123\n\nR1(config)# line vty 0 15\nR1(config-line)# login local                 ! autentikasi dengan username lokal\nR1(config-line)# transport input ssh         ! hanya izinkan SSH (blok Telnet)\nR1(config-line)# exec-timeout 5 0            ! (opsional) timeout sesi idle\n</code></pre>\n<p><strong>Switch:</strong> tambahkan alamat IP manajemen pada SVI dan default gateway.</p>\n<pre><code>Switch(config)# interface vlan 1\nSwitch(config-if)# ip address 192.168.1.2 255.255.255.0\nSwitch(config-if)# no shutdown\nSwitch(config)# ip default-gateway 192.168.1.1\n</code></pre>\n<h3>Verifikasi</h3>\n<pre><code>R1# show ip ssh                       ! versi SSH dan status aktif\nR1# show ssh                          ! sesi SSH yang sedang berjalan\nR1# show crypto key mypubkey rsa      ! kunci RSA yang dibuat\n</code></pre>\n<p><strong>Uji koneksi dari klien:</strong></p>\n<pre><code>ssh admin@192.168.1.2                 ! dari PC/Linux/macOS/Windows\nR2# ssh -l admin 192.168.1.2          ! dari perangkat Cisco lain\n</code></pre>", "raw": "### Konsep\n\n- **SSH (Secure Shell)** menyediakan akses CLI jarak jauh yang **terenkripsi** (TCP **22**), pengganti **Telnet** yang tidak aman.\n- Disarankan memakai **SSH versi 2**.\n\n### Prasyarat\n\n1. **Hostname** perangkat selain default.\n2. **Domain name** (dipakai untuk membuat kunci).\n3. **Kunci RSA** (*crypto key*) — gunakan modulus ≥ 768 bit untuk SSHv2 (disarankan **2048**).\n4. **Akun pengguna lokal** (atau server AAA).\n5. **Alamat IP manajemen** dan konektivitas jaringan ke perangkat.\n6. IOS dengan dukungan kriptografi (image **k9**).\n\n### Konfigurasi\n\n```\nRouter(config)# hostname R1\nR1(config)# ip domain-name example.com\nR1(config)# crypto key generate rsa modulus 2048\nR1(config)# ip ssh version 2\nR1(config)# username admin secret StrongPass123\n\nR1(config)# line vty 0 15\nR1(config-line)# login local                 ! autentikasi dengan username lokal\nR1(config-line)# transport input ssh         ! hanya izinkan SSH (blok Telnet)\nR1(config-line)# exec-timeout 5 0            ! (opsional) timeout sesi idle\n```\n\n**Switch:** tambahkan alamat IP manajemen pada SVI dan default gateway.\n\n```\nSwitch(config)# interface vlan 1\nSwitch(config-if)# ip address 192.168.1.2 255.255.255.0\nSwitch(config-if)# no shutdown\nSwitch(config)# ip default-gateway 192.168.1.1\n```\n\n### Verifikasi\n\n```\nR1# show ip ssh                       ! versi SSH dan status aktif\nR1# show ssh                          ! sesi SSH yang sedang berjalan\nR1# show crypto key mypubkey rsa      ! kunci RSA yang dibuat\n```\n\n**Uji koneksi dari klien:**\n\n```\nssh admin@192.168.1.2                 ! dari PC/Linux/macOS/Windows\nR2# ssh -l admin 192.168.1.2          ! dari perangkat Cisco lain\n```"}, {"id": "sum-4-9", "label": "4.9 Kemampuan dan fungsi TFTP/FTP", "title": "4.9 Kemampuan dan fungsi TFTP/FTP", "html": "<h3>Fungsi dalam jaringan</h3>\n<p>Protokol <strong>transfer file</strong> yang dipakai untuk:</p>\n<ul>\n<li><strong>Backup dan restore</strong> konfigurasi perangkat (running/startup config)</li>\n<li><strong>Upgrade/menyimpan IOS image</strong> pada flash perangkat</li>\n<li>Memindahkan file antara perangkat jaringan dan server</li>\n</ul>\n<h3>Perbandingan TFTP vs FTP</h3>\n<table>\n<thead>\n<tr>\n<th>Aspek</th>\n<th><strong>TFTP</strong></th>\n<th><strong>FTP</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Kepanjangan</td>\n<td>Trivial File Transfer Protocol</td>\n<td>File Transfer Protocol</td>\n</tr>\n<tr>\n<td>Transport</td>\n<td><strong>UDP</strong> (port <strong>69</strong>)</td>\n<td><strong>TCP</strong> (port <strong>21</strong> kontrol, <strong>20</strong> data)</td>\n</tr>\n<tr>\n<td>Reliabilitas</td>\n<td>Ringan; keandalan ditangani aplikasi (ACK per blok)</td>\n<td>Andal (memakai TCP)</td>\n</tr>\n<tr>\n<td>Autentikasi</td>\n<td><strong>Tidak ada</strong></td>\n<td><strong>Ada</strong> (username dan password)</td>\n</tr>\n<tr>\n<td>Enkripsi</td>\n<td>Tidak</td>\n<td>Tidak (data dan kredensial <strong>plaintext</strong>)</td>\n</tr>\n<tr>\n<td>Fitur</td>\n<td>Sangat sederhana: hanya kirim/ambil file; tanpa daftar direktori</td>\n<td>Lebih lengkap: daftar direktori, kelola file, mode aktif/pasif</td>\n</tr>\n<tr>\n<td>Beban/overhead</td>\n<td>Rendah</td>\n<td>Lebih tinggi</td>\n</tr>\n<tr>\n<td>Penggunaan khas</td>\n<td>Transfer sederhana ke/dari perangkat (backup config, boot image)</td>\n<td>Transfer file lebih besar/lebih terkontrol</td>\n</tr>\n</tbody>\n</table>", "raw": "### Fungsi dalam jaringan\n\nProtokol **transfer file** yang dipakai untuk:\n\n- **Backup dan restore** konfigurasi perangkat (running/startup config)\n- **Upgrade/menyimpan IOS image** pada flash perangkat\n- Memindahkan file antara perangkat jaringan dan server\n\n### Perbandingan TFTP vs FTP\n\n| Aspek | **TFTP** | **FTP** |\n|---|---|---|\n| Kepanjangan | Trivial File Transfer Protocol | File Transfer Protocol |\n| Transport | **UDP** (port **69**) | **TCP** (port **21** kontrol, **20** data) |\n| Reliabilitas | Ringan; keandalan ditangani aplikasi (ACK per blok) | Andal (memakai TCP) |\n| Autentikasi | **Tidak ada** | **Ada** (username dan password) |\n| Enkripsi | Tidak | Tidak (data dan kredensial **plaintext**) |\n| Fitur | Sangat sederhana: hanya kirim/ambil file; tanpa daftar direktori | Lebih lengkap: daftar direktori, kelola file, mode aktif/pasif |\n| Beban/overhead | Rendah | Lebih tinggi |\n| Penggunaan khas | Transfer sederhana ke/dari perangkat (backup config, boot image) | Transfer file lebih besar/lebih terkontrol |"}, {"id": "sum-4-checklist", "label": "Checklist Review 4.0", "title": "Checklist Review Cepat — 4.0 IP Services (10%)", "html": "<table>\n<thead>\n<tr>\n<th>No.</th>\n<th>Topik</th>\n<th>Poin kunci</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>4.1</td>\n<td>Inside source NAT</td>\n<td>Inside/outside local/global; static (1:1), pool (dynamic); <code>ip nat inside/outside</code>, <code>ip nat inside source …</code>; <code>show ip nat translations</code></td>\n</tr>\n<tr>\n<td>4.2</td>\n<td>NTP</td>\n<td>UDP 123; stratum (0–15, 16 = tidak sinkron); client <code>ntp server</code>, server <code>ntp master</code>; <code>show ntp status/associations</code></td>\n</tr>\n<tr>\n<td>4.3</td>\n<td>DHCP &amp; DNS</td>\n<td>DHCP: DORA, UDP 67/68, memberi IP/mask/gateway/DNS; DNS: nama → IP, port 53</td>\n</tr>\n<tr>\n<td>4.4</td>\n<td>SNMP</td>\n<td>NMS, agent, MIB (OID); Get/Set/Trap/Inform; UDP 161/162</td>\n</tr>\n<tr>\n<td>4.5</td>\n<td>Syslog</td>\n<td>Severity 0–7 (Emergency → Debugging); facility (local0–7); UDP 514; <code>show logging</code></td>\n</tr>\n<tr>\n<td>4.6</td>\n<td>DHCP client &amp; relay</td>\n<td><code>ip address dhcp</code>; relay <code>ip helper-address</code> (broadcast → unicast, giaddr); <code>show dhcp lease</code></td>\n</tr>\n<tr>\n<td>4.7</td>\n<td>QoS PHB</td>\n<td>Classification, marking (CoS, IP Prec, DSCP: EF=46, AF41=34), queuing (CBWFQ/LLQ), congestion (tail drop, WRED), policing (drop/re-mark) vs shaping (buffer)</td>\n</tr>\n<tr>\n<td>4.8</td>\n<td>SSH</td>\n<td>Hostname + domain + RSA key; <code>ip ssh version 2</code>; user lokal; <code>login local</code>, <code>transport input ssh</code>; <code>show ip ssh</code></td>\n</tr>\n<tr>\n<td>4.9</td>\n<td>TFTP/FTP</td>\n<td>TFTP: UDP 69, tanpa autentikasi; FTP: TCP 20/21, dengan autentikasi</td>\n</tr>\n</tbody>\n</table>", "raw": "| No. | Topik | Poin kunci |\n|---|---|---|\n| 4.1 | Inside source NAT | Inside/outside local/global; static (1:1), pool (dynamic); `ip nat inside/outside`, `ip nat inside source …`; `show ip nat translations` |\n| 4.2 | NTP | UDP 123; stratum (0–15, 16 = tidak sinkron); client `ntp server`, server `ntp master`; `show ntp status/associations` |\n| 4.3 | DHCP & DNS | DHCP: DORA, UDP 67/68, memberi IP/mask/gateway/DNS; DNS: nama → IP, port 53 |\n| 4.4 | SNMP | NMS, agent, MIB (OID); Get/Set/Trap/Inform; UDP 161/162 |\n| 4.5 | Syslog | Severity 0–7 (Emergency → Debugging); facility (local0–7); UDP 514; `show logging` |\n| 4.6 | DHCP client & relay | `ip address dhcp`; relay `ip helper-address` (broadcast → unicast, giaddr); `show dhcp lease` |\n| 4.7 | QoS PHB | Classification, marking (CoS, IP Prec, DSCP: EF=46, AF41=34), queuing (CBWFQ/LLQ), congestion (tail drop, WRED), policing (drop/re-mark) vs shaping (buffer) |\n| 4.8 | SSH | Hostname + domain + RSA key; `ip ssh version 2`; user lokal; `login local`, `transport input ssh`; `show ip ssh` |\n| 4.9 | TFTP/FTP | TFTP: UDP 69, tanpa autentikasi; FTP: TCP 20/21, dengan autentikasi |"}]}, {"category": "5.0 SECURITY FUNDAMENTALS", "items": [{"id": "sum-5-1", "label": "5.1 Konsep keamanan utama", "title": "5.1 Konsep keamanan utama", "html": "<h3>Definisi inti</h3>\n<table>\n<thead>\n<tr>\n<th>Istilah</th>\n<th>Definisi</th>\n<th>Contoh</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Threat (ancaman)</strong></td>\n<td><strong>Potensi bahaya</strong> yang dapat merusak aset atau mengganggu layanan; berasal dari pelaku atau kejadian</td>\n<td>Hacker, malware, penyalahgunaan oleh orang dalam</td>\n</tr>\n<tr>\n<td><strong>Vulnerability (kerentanan)</strong></td>\n<td><strong>Kelemahan</strong> pada sistem, perangkat lunak, konfigurasi, atau prosedur yang dapat dimanfaatkan</td>\n<td>Software belum di-patch, password default, port terbuka</td>\n</tr>\n<tr>\n<td><strong>Exploit</strong></td>\n<td><strong>Kode atau teknik</strong> yang <strong>memanfaatkan</strong> kerentanan untuk menembus atau merusak sistem</td>\n<td>Skrip yang menjalankan buffer overflow pada layanan yang rentan</td>\n</tr>\n<tr>\n<td><strong>Mitigation (mitigasi)</strong></td>\n<td><strong>Tindakan untuk mengurangi</strong> risiko atau dampak ancaman/kerentanan</td>\n<td>Patching, firewall, enkripsi, pelatihan pengguna</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Hubungan:</strong> <em>Threat</em> memanfaatkan <em>vulnerability</em> melalui <em>exploit</em>; <em>mitigation</em> dipasang untuk menutup celah atau mengurangi dampak.</p>\n<h3>Contoh ancaman umum</h3>\n<table>\n<thead>\n<tr>\n<th>Ancaman</th>\n<th>Penjelasan</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Malware</strong></td>\n<td>Perangkat lunak berbahaya: <em>virus</em>, <em>worm</em>, <em>trojan</em>, <em>ransomware</em></td>\n</tr>\n<tr>\n<td><strong>DoS / DDoS</strong></td>\n<td>Membanjiri layanan sehingga tidak tersedia (DDoS dari banyak sumber)</td>\n</tr>\n<tr>\n<td><strong>Spoofing</strong></td>\n<td>Memalsukan identitas/alamat (IP, MAC, ARP)</td>\n</tr>\n<tr>\n<td><strong>Man-in-the-Middle (MITM)</strong></td>\n<td>Penyerang menyadap/mengubah komunikasi antara dua pihak</td>\n</tr>\n<tr>\n<td><strong>Reconnaissance</strong></td>\n<td>Pengumpulan informasi target (mis. port scanning)</td>\n</tr>\n<tr>\n<td><strong>Social engineering / Phishing</strong></td>\n<td>Memanipulasi manusia agar membocorkan informasi atau menjalankan tindakan berbahaya</td>\n</tr>\n<tr>\n<td><strong>Password attack</strong></td>\n<td><em>Brute force</em>, <em>dictionary attack</em> untuk menebak password</td>\n</tr>\n<tr>\n<td><strong>Zero-day</strong></td>\n<td>Serangan memanfaatkan kerentanan yang belum memiliki patch</td>\n</tr>\n</tbody>\n</table>\n<h3>Teknik mitigasi umum</h3>\n<table>\n<thead>\n<tr>\n<th>Teknik</th>\n<th>Fungsi</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Patching &amp; update</strong></td>\n<td>Menutup kerentanan yang sudah diketahui</td>\n</tr>\n<tr>\n<td><strong>Firewall / NGFW / IPS</strong></td>\n<td>Memfilter dan memblokir trafik berbahaya</td>\n</tr>\n<tr>\n<td><strong>ACL</strong></td>\n<td>Membatasi trafik pada router/switch</td>\n</tr>\n<tr>\n<td><strong>AAA &amp; kontrol akses</strong></td>\n<td>Memastikan hanya pengguna sah yang mengakses</td>\n</tr>\n<tr>\n<td><strong>Enkripsi / VPN</strong></td>\n<td>Melindungi kerahasiaan data saat transit</td>\n</tr>\n<tr>\n<td><strong>Endpoint protection (antivirus/antimalware)</strong></td>\n<td>Melindungi perangkat ujung</td>\n</tr>\n<tr>\n<td><strong>Segmentasi jaringan (VLAN)</strong></td>\n<td>Membatasi penyebaran serangan</td>\n</tr>\n<tr>\n<td><strong>Fitur keamanan Layer 2</strong></td>\n<td>Port security, DHCP snooping, DAI (lihat 5.7)</td>\n</tr>\n<tr>\n<td><strong>Edukasi pengguna</strong></td>\n<td>Mengurangi risiko social engineering (lihat 5.2)</td>\n</tr>\n</tbody>\n</table>", "raw": "### Definisi inti\n\n| Istilah | Definisi | Contoh |\n|---|---|---|\n| **Threat (ancaman)** | **Potensi bahaya** yang dapat merusak aset atau mengganggu layanan; berasal dari pelaku atau kejadian | Hacker, malware, penyalahgunaan oleh orang dalam |\n| **Vulnerability (kerentanan)** | **Kelemahan** pada sistem, perangkat lunak, konfigurasi, atau prosedur yang dapat dimanfaatkan | Software belum di-patch, password default, port terbuka |\n| **Exploit** | **Kode atau teknik** yang **memanfaatkan** kerentanan untuk menembus atau merusak sistem | Skrip yang menjalankan buffer overflow pada layanan yang rentan |\n| **Mitigation (mitigasi)** | **Tindakan untuk mengurangi** risiko atau dampak ancaman/kerentanan | Patching, firewall, enkripsi, pelatihan pengguna |\n\n**Hubungan:** *Threat* memanfaatkan *vulnerability* melalui *exploit*; *mitigation* dipasang untuk menutup celah atau mengurangi dampak.\n\n### Contoh ancaman umum\n\n| Ancaman | Penjelasan |\n|---|---|\n| **Malware** | Perangkat lunak berbahaya: *virus*, *worm*, *trojan*, *ransomware* |\n| **DoS / DDoS** | Membanjiri layanan sehingga tidak tersedia (DDoS dari banyak sumber) |\n| **Spoofing** | Memalsukan identitas/alamat (IP, MAC, ARP) |\n| **Man-in-the-Middle (MITM)** | Penyerang menyadap/mengubah komunikasi antara dua pihak |\n| **Reconnaissance** | Pengumpulan informasi target (mis. port scanning) |\n| **Social engineering / Phishing** | Memanipulasi manusia agar membocorkan informasi atau menjalankan tindakan berbahaya |\n| **Password attack** | *Brute force*, *dictionary attack* untuk menebak password |\n| **Zero-day** | Serangan memanfaatkan kerentanan yang belum memiliki patch |\n\n### Teknik mitigasi umum\n\n| Teknik | Fungsi |\n|---|---|\n| **Patching & update** | Menutup kerentanan yang sudah diketahui |\n| **Firewall / NGFW / IPS** | Memfilter dan memblokir trafik berbahaya |\n| **ACL** | Membatasi trafik pada router/switch |\n| **AAA & kontrol akses** | Memastikan hanya pengguna sah yang mengakses |\n| **Enkripsi / VPN** | Melindungi kerahasiaan data saat transit |\n| **Endpoint protection (antivirus/antimalware)** | Melindungi perangkat ujung |\n| **Segmentasi jaringan (VLAN)** | Membatasi penyebaran serangan |\n| **Fitur keamanan Layer 2** | Port security, DHCP snooping, DAI (lihat 5.7) |\n| **Edukasi pengguna** | Mengurangi risiko social engineering (lihat 5.2) |"}, {"id": "sum-5-2", "label": "5.2 Elemen program keamanan", "title": "5.2 Elemen program keamanan", "html": "<p>Program keamanan organisasi tidak hanya teknologi, tetapi juga <strong>manusia dan lingkungan fisik</strong>.</p>\n<h3>User awareness (kesadaran pengguna)</h3>\n<ul>\n<li>Upaya <strong>berkelanjutan</strong> untuk membuat seluruh pengguna <strong>sadar</strong> akan ancaman dan perilaku aman.</li>\n<li>Contoh: kampanye dan poster keamanan, email pengingat, simulasi phishing, kebiasaan melaporkan insiden.</li>\n<li>Topik: mengenali <strong>phishing</strong>, bahaya lampiran/tautan mencurigakan, kebersihan password, tidak membagikan kredensial.</li>\n</ul>\n<h3>Training (pelatihan)</h3>\n<ul>\n<li>Pelatihan <strong>terstruktur dan formal</strong> yang memberi <strong>keterampilan spesifik</strong> (umumnya wajib dan berkala).</li>\n<li>Dapat berbasis <strong>peran</strong> (mis. administrator jaringan mendapat pelatihan lebih mendalam).</li>\n<li>Contoh: pelatihan penanganan data sensitif, prosedur respons insiden, kebijakan penggunaan yang dapat diterima.</li>\n</ul>\n<h3>Physical access control (kontrol akses fisik)</h3>\n<p>Membatasi <strong>akses fisik</strong> ke perangkat dan fasilitas, karena akses fisik dapat melewati banyak kontrol logis.</p>\n<table>\n<thead>\n<tr>\n<th>Kontrol</th>\n<th>Contoh</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Pencegahan</strong></td>\n<td>Kunci pintu/rak, ruang server terkunci, pagar, penjaga keamanan</td>\n</tr>\n<tr>\n<td><strong>Identifikasi/otentikasi</strong></td>\n<td>Kartu ID/badge, PIN, <strong>biometrik</strong> (sidik jari, wajah)</td>\n</tr>\n<tr>\n<td><strong>Pemantauan</strong></td>\n<td><strong>CCTV</strong>, log pengunjung, alarm</td>\n</tr>\n<tr>\n<td><strong>Pembatasan alur masuk</strong></td>\n<td><em>Mantrap</em> / turnstile, pengawalan tamu</td>\n</tr>\n</tbody>\n</table>", "raw": "Program keamanan organisasi tidak hanya teknologi, tetapi juga **manusia dan lingkungan fisik**.\n\n### User awareness (kesadaran pengguna)\n\n- Upaya **berkelanjutan** untuk membuat seluruh pengguna **sadar** akan ancaman dan perilaku aman.\n- Contoh: kampanye dan poster keamanan, email pengingat, simulasi phishing, kebiasaan melaporkan insiden.\n- Topik: mengenali **phishing**, bahaya lampiran/tautan mencurigakan, kebersihan password, tidak membagikan kredensial.\n\n### Training (pelatihan)\n\n- Pelatihan **terstruktur dan formal** yang memberi **keterampilan spesifik** (umumnya wajib dan berkala).\n- Dapat berbasis **peran** (mis. administrator jaringan mendapat pelatihan lebih mendalam).\n- Contoh: pelatihan penanganan data sensitif, prosedur respons insiden, kebijakan penggunaan yang dapat diterima.\n\n### Physical access control (kontrol akses fisik)\n\nMembatasi **akses fisik** ke perangkat dan fasilitas, karena akses fisik dapat melewati banyak kontrol logis.\n\n| Kontrol | Contoh |\n|---|---|\n| **Pencegahan** | Kunci pintu/rak, ruang server terkunci, pagar, penjaga keamanan |\n| **Identifikasi/otentikasi** | Kartu ID/badge, PIN, **biometrik** (sidik jari, wajah) |\n| **Pemantauan** | **CCTV**, log pengunjung, alarm |\n| **Pembatasan alur masuk** | *Mantrap* / turnstile, pengawalan tamu |"}, {"id": "sum-5-3", "label": "5.3 Device access control dengan local passwords", "title": "5.3 Device access control dengan local passwords", "html": "<p>Mengamankan akses ke <strong>CLI perangkat Cisco</strong> menggunakan password yang disimpan <strong>secara lokal</strong> pada perangkat.</p>\n<h3>Jenis password dan akses</h3>\n<table>\n<thead>\n<tr>\n<th>Akses</th>\n<th>Perintah utama</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Privileged EXEC</strong></td>\n<td><code>enable secret</code> (disarankan)</td>\n</tr>\n<tr>\n<td><strong>Console</strong></td>\n<td><code>line console 0</code> + <code>password</code> + <code>login</code></td>\n</tr>\n<tr>\n<td><strong>VTY (remote)</strong></td>\n<td><code>line vty 0 15</code> + <code>password</code> + <code>login</code></td>\n</tr>\n<tr>\n<td><strong>Akun lokal (username)</strong></td>\n<td><code>username &lt;nama&gt; secret &lt;password&gt;</code> + <code>login local</code></td>\n</tr>\n</tbody>\n</table>\n<h3>Konfigurasi</h3>\n<pre><code>! Privileged EXEC (di-hash, mengalahkan &quot;enable password&quot;)\nRouter(config)# enable secret Str0ngEnableP@ss\n\n! Console\nRouter(config)# line console 0\nRouter(config-line)# password ConsoleP@ss\nRouter(config-line)# login\nRouter(config-line)# exec-timeout 5 0\n\n! VTY dengan password line\nRouter(config)# line vty 0 15\nRouter(config-line)# password VtyP@ss\nRouter(config-line)# login\n\n! VTY dengan database user lokal (lebih baik: tiap admin punya akun sendiri)\nRouter(config)# username admin secret AdminP@ss\nRouter(config)# line vty 0 15\nRouter(config-line)# login local\n\n! Enkripsi password plaintext di konfigurasi\nRouter(config)# service password-encryption\n\n! Panjang password minimum\nRouter(config)# security passwords min-length 10\n</code></pre>\n<h3>Perbandingan penting</h3>\n<table>\n<thead>\n<tr>\n<th>Perintah</th>\n<th>Penyimpanan di config</th>\n<th>Keterangan</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>enable password</code></td>\n<td><strong>Plaintext</strong> (atau type 7 bila <code>service password-encryption</code> aktif)</td>\n<td>Lemah; <strong>diabaikan</strong> jika <code>enable secret</code> ada</td>\n</tr>\n<tr>\n<td><code>enable secret</code></td>\n<td><strong>Hash</strong> (type 5 MD5; type 8/9 lebih kuat)</td>\n<td><strong>Disarankan</strong></td>\n</tr>\n<tr>\n<td><code>username … password</code></td>\n<td>Plaintext / type 7</td>\n<td>Lemah</td>\n</tr>\n<tr>\n<td><code>username … secret</code></td>\n<td><strong>Hash</strong></td>\n<td><strong>Disarankan</strong></td>\n</tr>\n<tr>\n<td><code>service password-encryption</code></td>\n<td>Type 7</td>\n<td>Enkripsi <strong>lemah (reversibel)</strong>, hanya mencegah dibaca sekilas</td>\n</tr>\n</tbody>\n</table>\n<table>\n<thead>\n<tr>\n<th>Perintah <code>login</code></th>\n<th>Perilaku</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>login</code></td>\n<td>Meminta <strong>password pada line</strong> itu sendiri</td>\n</tr>\n<tr>\n<td><code>login local</code></td>\n<td>Memeriksa <strong>username dan password</strong> di database lokal</td>\n</tr>\n</tbody>\n</table>\n<h3>Verifikasi</h3>\n<pre><code>Router# show running-config | include enable\nRouter# show running-config | section line\nRouter# show running-config | include username\nRouter# show users\nRouter# show line\n</code></pre>\n<blockquote>\n<p>Uji dengan membuka sesi baru (console atau remote) dan memastikan prompt password muncul sesuai konfigurasi.</p>\n</blockquote>", "raw": "Mengamankan akses ke **CLI perangkat Cisco** menggunakan password yang disimpan **secara lokal** pada perangkat.\n\n### Jenis password dan akses\n\n| Akses | Perintah utama |\n|---|---|\n| **Privileged EXEC** | `enable secret` (disarankan) |\n| **Console** | `line console 0` + `password` + `login` |\n| **VTY (remote)** | `line vty 0 15` + `password` + `login` |\n| **Akun lokal (username)** | `username <nama> secret <password>` + `login local` |\n\n### Konfigurasi\n\n```\n! Privileged EXEC (di-hash, mengalahkan \"enable password\")\nRouter(config)# enable secret Str0ngEnableP@ss\n\n! Console\nRouter(config)# line console 0\nRouter(config-line)# password ConsoleP@ss\nRouter(config-line)# login\nRouter(config-line)# exec-timeout 5 0\n\n! VTY dengan password line\nRouter(config)# line vty 0 15\nRouter(config-line)# password VtyP@ss\nRouter(config-line)# login\n\n! VTY dengan database user lokal (lebih baik: tiap admin punya akun sendiri)\nRouter(config)# username admin secret AdminP@ss\nRouter(config)# line vty 0 15\nRouter(config-line)# login local\n\n! Enkripsi password plaintext di konfigurasi\nRouter(config)# service password-encryption\n\n! Panjang password minimum\nRouter(config)# security passwords min-length 10\n```\n\n### Perbandingan penting\n\n| Perintah | Penyimpanan di config | Keterangan |\n|---|---|---|\n| `enable password` | **Plaintext** (atau type 7 bila `service password-encryption` aktif) | Lemah; **diabaikan** jika `enable secret` ada |\n| `enable secret` | **Hash** (type 5 MD5; type 8/9 lebih kuat) | **Disarankan** |\n| `username … password` | Plaintext / type 7 | Lemah |\n| `username … secret` | **Hash** | **Disarankan** |\n| `service password-encryption` | Type 7 | Enkripsi **lemah (reversibel)**, hanya mencegah dibaca sekilas |\n\n| Perintah `login` | Perilaku |\n|---|---|\n| `login` | Meminta **password pada line** itu sendiri |\n| `login local` | Memeriksa **username dan password** di database lokal |\n\n### Verifikasi\n\n```\nRouter# show running-config | include enable\nRouter# show running-config | section line\nRouter# show running-config | include username\nRouter# show users\nRouter# show line\n```\n\n> Uji dengan membuka sesi baru (console atau remote) dan memastikan prompt password muncul sesuai konfigurasi."}, {"id": "sum-5-4", "label": "5.4 Elemen kebijakan password", "title": "5.4 Elemen kebijakan password", "html": "<h3>Management (pengelolaan password)</h3>\n<ul>\n<li>Password <strong>unik</strong> untuk tiap akun/sistem; <strong>jangan dibagikan</strong> atau ditulis di tempat terbuka.</li>\n<li>Gunakan <strong>password manager</strong> untuk penyimpanan aman.</li>\n<li><strong>Batasi percobaan login</strong> (account lockout) dan sediakan prosedur reset yang aman.</li>\n<li>Penggantian password: <strong>berkala</strong> menurut kebijakan organisasi, dan <strong>segera</strong> bila ada indikasi kebocoran. <em>(Pedoman modern, mis. NIST, lebih menekankan panjang password dan penggantian saat ada kompromi dibanding pergantian paksa rutin.)</em></li>\n</ul>\n<h3>Complexity (kompleksitas)</h3>\n<table>\n<thead>\n<tr>\n<th>Aspek</th>\n<th>Ketentuan</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Panjang</strong></td>\n<td>Semakin panjang semakin kuat (mis. minimal 10–12 karakter, atau <em>passphrase</em> panjang)</td>\n</tr>\n<tr>\n<td><strong>Variasi karakter</strong></td>\n<td>Kombinasi huruf besar, huruf kecil, angka, simbol</td>\n</tr>\n<tr>\n<td><strong>Hindari</strong></td>\n<td>Kata kamus, nama/tanggal lahir, pola mudah ditebak (<code>123456</code>, <code>qwerty</code>), password default</td>\n</tr>\n<tr>\n<td><strong>Pemakaian ulang</strong></td>\n<td>Hindari memakai ulang password lama atau yang sama di banyak layanan</td>\n</tr>\n</tbody>\n</table>\n<h3>Password alternatives (alternatif/pelengkap password)</h3>\n<table>\n<thead>\n<tr>\n<th>Alternatif</th>\n<th>Penjelasan</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Multifactor Authentication (MFA)</strong></td>\n<td>Menggabungkan <strong>≥ 2 faktor</strong> dari: <strong>yang diketahui</strong> (password/PIN), <strong>yang dimiliki</strong> (token, aplikasi authenticator, kartu, HP), <strong>yang melekat</strong> (biometrik). Contoh: password + kode OTP</td>\n</tr>\n<tr>\n<td><strong>Certificates</strong></td>\n<td><strong>Sertifikat digital</strong> (X.509, PKI) membuktikan identitas pengguna/perangkat tanpa mengetik password; berbasis pasangan kunci publik/privat dan diterbitkan oleh CA</td>\n</tr>\n<tr>\n<td><strong>Biometrics</strong></td>\n<td>Autentikasi berdasarkan ciri fisik/perilaku: <strong>sidik jari, wajah, iris, suara</strong>. Nyaman, tetapi dapat salah menerima/menolak dan data biometrik tidak dapat \"diganti\" jika bocor</td>\n</tr>\n</tbody>\n</table>", "raw": "### Management (pengelolaan password)\n\n- Password **unik** untuk tiap akun/sistem; **jangan dibagikan** atau ditulis di tempat terbuka.\n- Gunakan **password manager** untuk penyimpanan aman.\n- **Batasi percobaan login** (account lockout) dan sediakan prosedur reset yang aman.\n- Penggantian password: **berkala** menurut kebijakan organisasi, dan **segera** bila ada indikasi kebocoran. *(Pedoman modern, mis. NIST, lebih menekankan panjang password dan penggantian saat ada kompromi dibanding pergantian paksa rutin.)*\n\n### Complexity (kompleksitas)\n\n| Aspek | Ketentuan |\n|---|---|\n| **Panjang** | Semakin panjang semakin kuat (mis. minimal 10–12 karakter, atau *passphrase* panjang) |\n| **Variasi karakter** | Kombinasi huruf besar, huruf kecil, angka, simbol |\n| **Hindari** | Kata kamus, nama/tanggal lahir, pola mudah ditebak (`123456`, `qwerty`), password default |\n| **Pemakaian ulang** | Hindari memakai ulang password lama atau yang sama di banyak layanan |\n\n### Password alternatives (alternatif/pelengkap password)\n\n| Alternatif | Penjelasan |\n|---|---|\n| **Multifactor Authentication (MFA)** | Menggabungkan **≥ 2 faktor** dari: **yang diketahui** (password/PIN), **yang dimiliki** (token, aplikasi authenticator, kartu, HP), **yang melekat** (biometrik). Contoh: password + kode OTP |\n| **Certificates** | **Sertifikat digital** (X.509, PKI) membuktikan identitas pengguna/perangkat tanpa mengetik password; berbasis pasangan kunci publik/privat dan diterbitkan oleh CA |\n| **Biometrics** | Autentikasi berdasarkan ciri fisik/perilaku: **sidik jari, wajah, iris, suara**. Nyaman, tetapi dapat salah menerima/menolak dan data biometrik tidak dapat \"diganti\" jika bocor |"}, {"id": "sum-5-5", "label": "5.5 IPsec remote access dan site-to-site VPN", "title": "5.5 IPsec remote access dan site-to-site VPN", "html": "<h3>Konsep VPN</h3>\n<p><strong>VPN (Virtual Private Network)</strong> membuat <strong>terowongan (tunnel) terenkripsi</strong> melintasi jaringan yang tidak tepercaya (mis. Internet) sehingga data tetap <strong>rahasia, utuh, dan terautentikasi</strong>.</p>\n<h3>Jenis VPN</h3>\n<table>\n<thead>\n<tr>\n<th>Aspek</th>\n<th><strong>Site-to-Site VPN</strong></th>\n<th><strong>Remote Access VPN</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Menghubungkan</td>\n<td><strong>Dua jaringan/lokasi</strong> (kantor pusat ↔ cabang)</td>\n<td><strong>Satu pengguna/perangkat</strong> ↔ jaringan perusahaan</td>\n</tr>\n<tr>\n<td>Ujung tunnel</td>\n<td><strong>Gateway</strong> (router/firewall) di kedua sisi</td>\n<td><strong>Perangkat pengguna</strong> (dengan VPN client) ↔ gateway VPN</td>\n</tr>\n<tr>\n<td>Bagi pengguna</td>\n<td><strong>Transparan</strong> (host tidak menjalankan software VPN)</td>\n<td>Pengguna <strong>menjalankan VPN client</strong> (mis. Cisco Secure Client/AnyConnect)</td>\n</tr>\n<tr>\n<td>Sifat koneksi</td>\n<td>Umumnya <strong>permanen</strong> (always-on)</td>\n<td><strong>Sesuai kebutuhan</strong> (on-demand)</td>\n</tr>\n<tr>\n<td>Contoh</td>\n<td>Router cabang ↔ router pusat</td>\n<td>Karyawan WFH terhubung ke kantor</td>\n</tr>\n</tbody>\n</table>\n<h3>Layanan yang diberikan IPsec</h3>\n<table>\n<thead>\n<tr>\n<th>Layanan</th>\n<th>Penjelasan</th>\n<th>Mekanisme</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Confidentiality</strong></td>\n<td>Data dienkripsi</td>\n<td>AES (disarankan), 3DES, DES (usang)</td>\n</tr>\n<tr>\n<td><strong>Integrity</strong></td>\n<td>Data tidak diubah</td>\n<td>Hash/HMAC (SHA; MD5 usang)</td>\n</tr>\n<tr>\n<td><strong>Authentication</strong></td>\n<td>Memastikan identitas peer</td>\n<td><strong>Pre-shared key</strong> atau <strong>sertifikat digital</strong></td>\n</tr>\n<tr>\n<td><strong>Anti-replay</strong></td>\n<td>Menolak paket yang diputar ulang</td>\n<td>Nomor urut</td>\n</tr>\n<tr>\n<td><strong>Key exchange</strong></td>\n<td>Pertukaran kunci aman</td>\n<td><strong>Diffie-Hellman</strong></td>\n</tr>\n</tbody>\n</table>\n<h3>Komponen protokol IPsec</h3>\n<table>\n<thead>\n<tr>\n<th>Protokol</th>\n<th>Fungsi</th>\n<th>Detail</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>IKE</strong> (IKEv1/IKEv2)</td>\n<td>Negosiasi parameter dan <strong>membangun Security Association (SA)</strong> serta mengelola kunci</td>\n<td><strong>UDP 500</strong> (UDP 4500 untuk NAT-T)</td>\n</tr>\n<tr>\n<td><strong>ESP</strong> (<em>Encapsulating Security Payload</em>)</td>\n<td><strong>Enkripsi + integritas + autentikasi</strong></td>\n<td>IP protocol <strong>50</strong> (paling umum dipakai)</td>\n</tr>\n<tr>\n<td><strong>AH</strong> (<em>Authentication Header</em>)</td>\n<td><strong>Integritas + autentikasi</strong>, <strong>tanpa enkripsi</strong></td>\n<td>IP protocol <strong>51</strong></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Tahapan IKE (IKEv1):</strong></p>\n<ol>\n<li><strong>Phase 1</strong> — membangun <strong>IKE SA</strong> (kanal aman antar peer; autentikasi peer dan pertukaran kunci).</li>\n<li><strong>Phase 2</strong> — membangun <strong>IPsec SA</strong> (parameter yang melindungi data pengguna).</li>\n</ol>\n<h3>Mode IPsec</h3>\n<table>\n<thead>\n<tr>\n<th>Mode</th>\n<th>Perilaku</th>\n<th>Penggunaan</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Tunnel mode</strong></td>\n<td><strong>Seluruh paket asli</strong> dienkapsulasi dan diberi <strong>header IP baru</strong></td>\n<td><strong>Site-to-site</strong> (antar gateway), umum pada remote access</td>\n</tr>\n<tr>\n<td><strong>Transport mode</strong></td>\n<td>Hanya <strong>payload</strong> dilindungi; <strong>header IP asli</strong> dipertahankan</td>\n<td>Komunikasi <strong>host-to-host</strong> langsung</td>\n</tr>\n</tbody>\n</table>", "raw": "### Konsep VPN\n\n**VPN (Virtual Private Network)** membuat **terowongan (tunnel) terenkripsi** melintasi jaringan yang tidak tepercaya (mis. Internet) sehingga data tetap **rahasia, utuh, dan terautentikasi**.\n\n### Jenis VPN\n\n| Aspek | **Site-to-Site VPN** | **Remote Access VPN** |\n|---|---|---|\n| Menghubungkan | **Dua jaringan/lokasi** (kantor pusat ↔ cabang) | **Satu p
