<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CCNA 200-301 v1.1 — Command & Rangkuman Materi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-sidebar: #0c0c0c;
      --bg-main: #080808;
      --bg-code: #121212;
      --bg-input: #0e0e0e;
      --bg-segment: #0e0e0e;
      --bg-segment-active: #1a1a1a;
      --bg-item-active: #181818;
      --bg-item-hover: #131313;
      --border-subtle: #1a1a1a;
      --border-active: #2c2c2c;
      --border-code: #1f1f1f;
      --text-primary: #efefef;
      --text-secondary: #a1a1a1;
      --text-muted: #767676;
      --text-code: #dedede;
      --accent: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
      background-color: var(--bg-main);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* App Layout */
    .app-layout {
      display: flex;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 266px;
      min-width: 266px;
      height: 100vh;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      user-select: none;
      z-index: 30;
      transition: transform 0.25s ease;
    }

    .sidebar-top {
      padding: 18px 16px 14px 16px;
      border-bottom: 1px solid var(--border-subtle);
      flex-shrink: 0;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.01em;
    }

    .brand-badge {
      font-size: 11px;
      font-weight: 500;
      color: #b0b0b0;
      background-color: #141414;
      border: 1px solid #222222;
      padding: 1px 6px;
      border-radius: 4px;
      line-height: 1.4;
    }

    .search-wrapper {
      position: relative;
      margin-bottom: 10px;
    }

    .search-input {
      width: 100%;
      background-color: var(--bg-input);
      border: 1px solid #1e1e1e;
      border-radius: 6px;
      padding: 7px 28px 7px 11px;
      color: var(--text-primary);
      font-size: 12.5px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .search-input::placeholder {
      color: #6e6e6e;
    }

    .search-input:focus {
      border-color: #333333;
    }

    .clear-search-btn {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: #777;
      cursor: pointer;
      font-size: 14px;
      padding: 2px 4px;
      display: none;
      line-height: 1;
    }

    .clear-search-btn:hover {
      color: #ccc;
    }

    /* Segmented Toggle */
    .mode-switcher {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background-color: var(--bg-segment);
      border: 1px solid #1c1c1c;
      border-radius: 6px;
      padding: 2px;
      gap: 2px;
    }

    .mode-btn {
      background: transparent;
      border: 1px solid transparent;
      color: #8c8c8c;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 8px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: center;
    }

    .mode-btn:hover {
      color: #d4d4d4;
    }

    .mode-btn.active {
      background-color: var(--bg-segment-active);
      border-color: #383838;
      color: #ffffff;
    }

    /* Sidebar Navigation List */
    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      padding: 12px 10px 28px 10px;
    }

    .sidebar-nav::-webkit-scrollbar {
      width: 5px;
    }

    .sidebar-nav::-webkit-scrollbar-track {
      background: transparent;
    }

    .sidebar-nav::-webkit-scrollbar-thumb {
      background: #1e1e1e;
      border-radius: 3px;
    }

    .nav-group {
      margin-bottom: 18px;
    }

    .nav-category {
      font-size: 10.5px;
      font-weight: 700;
      color: #8a8a8a;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0 8px;
      margin-bottom: 5px;
    }

    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .nav-item-btn {
      width: 100%;
      text-align: left;
      background: transparent;
      border: 1px solid transparent;
      color: #b4b4b4;
      font-family: inherit;
      font-size: 13px;
      font-weight: 400;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background-color 0.12s ease, color 0.12s ease, border-color 0.12s ease;
      display: block;
    }

    .nav-item-btn:hover {
      background-color: var(--bg-item-hover);
      color: #e4e4e4;
    }

    .nav-item-btn.active {
      background-color: var(--bg-item-active);
      border-color: var(--border-active);
      color: #ffffff;
      font-weight: 600;
    }

    .empty-filter-msg {
      padding: 16px 10px;
      color: #777;
      font-size: 12.5px;
      text-align: center;
    }

    /* Main Content Area */
    .main-area {
      flex: 1;
      height: 100vh;
      overflow-y: auto;
      background-color: var(--bg-main);
      position: relative;
    }

    .main-area::-webkit-scrollbar {
      width: 8px;
    }

    .main-area::-webkit-scrollbar-track {
      background: var(--bg-main);
    }

    .main-area::-webkit-scrollbar-thumb {
      background: #202020;
      border-radius: 4px;
    }

    .main-area::-webkit-scrollbar-thumb:hover {
      background: #2e2e2e;
    }

    .content-container {
      max-width: 820px;
      margin: 0 auto;
      padding: 40px 48px 80px 48px;
    }

    /* Topic Title */
    .topic-header-title {
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.015em;
      margin-bottom: 22px;
      line-height: 1.3;
    }

    /* Markdown Content Styling matching Screenshot */
    .md-body h2 {
      font-size: 19px;
      font-weight: 700;
      color: #ffffff;
      margin-top: 32px;
      margin-bottom: 14px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .md-body h3 {
      font-size: 15.5px;
      font-weight: 700;
      color: #efefef;
      margin-top: 26px;
      margin-bottom: 10px;
    }

    .md-body p {
      color: #d0d0d0;
      margin-bottom: 12px;
      font-size: 14px;
      line-height: 1.65;
    }

    /* Bold standalone subheadings like "Konfigurasi Dasar VLAN" or "2.1.a — Access Ports (Data and Voice)" */
    .md-body p > strong:only-child {
      display: inline-block;
      color: #e8e8e8;
      font-size: 14px;
      font-weight: 700;
      margin-top: 10px;
      margin-bottom: 0px;
    }

    /* Italic sub-labels like "Router-on-a-Stick:" */
    .md-body p > em:only-child {
      display: inline-block;
      color: #b5b5b5;
      font-size: 13.5px;
      margin-top: 2px;
      margin-bottom: 0px;
    }

    .md-body ul, .md-body ol {
      margin-bottom: 16px;
      padding-left: 22px;
      color: #d0d0d0;
    }

    .md-body li {
      margin-bottom: 6px;
      line-height: 1.6;
    }

    .md-body li strong {
      color: #efefef;
    }

    .md-body a {
      color: #60a5fa;
      text-decoration: none;
    }

    .md-body a:hover {
      text-decoration: underline;
    }

    .md-body blockquote {
      border-left: 3px solid #333333;
      background-color: #0e0e0e;
      padding: 10px 16px;
      margin: 14px 0 18px 0;
      border-radius: 0 6px 6px 0;
      color: #b8b8b8;
      font-size: 13.5px;
    }

    .md-body blockquote p {
      margin-bottom: 0;
      color: inherit;
    }

    /* Code Blocks — matching screenshot dark grey rounded cards */
    .code-block-wrapper {
      position: relative;
      margin-top: 6px;
      margin-bottom: 22px;
    }

    .md-body pre {
      background-color: var(--bg-code);
      border: 1px solid var(--border-code);
      border-radius: 6px;
      padding: 14px 18px;
      overflow-x: auto;
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      line-height: 1.65;
      color: var(--text-code);
    }

    .md-body pre code {
      background: transparent;
      padding: 0;
      border: none;
      color: inherit;
      font-size: inherit;
      font-family: inherit;
    }

    .md-body :not(pre) > code {
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
      font-size: 12.5px;
      background-color: #141414;
      border: 1px solid #202020;
      color: #e6e6e6;
      padding: 1.5px 5px;
      border-radius: 4px;
    }

    /* Copy Button on Hover */
    .copy-code-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background-color: #1a1a1a;
      border: 1px solid #282828;
      color: #bdbdbd;
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 500;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s ease, background-color 0.15s ease, color 0.15s ease;
    }

    .code-block-wrapper:hover .copy-code-btn {
      opacity: 1;
    }

    .copy-code-btn:hover {
      background-color: #242424;
      color: #ffffff;
    }

    .copy-code-btn.copied {
      background-color: #1f3a29;
      border-color: #2e6040;
      color: #86efac;
      opacity: 1;
    }

    /* Tables */
    .table-responsive {
      width: 100%;
      overflow-x: auto;
      margin: 14px 0 22px 0;
      border: 1px solid var(--border-code);
      border-radius: 6px;
    }

    .md-body table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
      text-align: left;
      background-color: #0d0d0d;
    }

    .md-body th {
      background-color: #131313;
      color: #f0f0f0;
      font-weight: 600;
      padding: 10px 14px;
      border-bottom: 1px solid #1f1f1f;
    }

    .md-body td {
      padding: 9px 14px;
      border-bottom: 1px solid #181818;
      color: #d0d0d0;
      vertical-align: top;
    }

    .md-body tr:last-child td {
      border-bottom: none;
    }

    .md-body tr:hover td {
      background-color: #121212;
    }

    /* Prev / Next Navigation Footer */
    .topic-footer-nav {
      margin-top: 48px;
      padding-top: 20px;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-between;
      gap: 16px;
    }

    .pager-btn {
      background-color: #0e0e0e;
      border: 1px solid #1c1c1c;
      border-radius: 6px;
      padding: 10px 14px;
      color: #d4d4d4;
      cursor: pointer;
      font-family: inherit;
      text-align: left;
      transition: all 0.15s ease;
      max-width: 48%;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .pager-btn.next {
      text-align: right;
      margin-left: auto;
    }

    .pager-btn:hover {
      background-color: #141414;
      border-color: #2b2b2b;
      color: #ffffff;
    }

    .pager-hint {
      font-size: 11px;
      color: #808080;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-weight: 600;
    }

    .pager-label {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Mobile Header & Drawer Overlay */
    .mobile-topbar {
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background-color: var(--bg-sidebar);
      border-bottom: 1px solid var(--border-subtle);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .mobile-menu-btn {
      background: #141414;
      border: 1px solid #222222;
      color: #eee;
      border-radius: 5px;
      padding: 5px 10px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
    }

    .sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 25;
    }

    @media (max-width: 820px) {
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        transform: translateX(-100%);
      }
      .sidebar.open {
        transform: translateX(0);
      }
      .sidebar-backdrop.open {
        display: block;
      }
      .mobile-topbar {
        display: flex;
      }
      .content-container {
        padding: 24px 20px 64px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- Left Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="brand-row">
          <span class="brand-title">CCNA 200-301</span>
          <span class="brand-badge">v1.1</span>
        </div>

        <div class="search-wrapper">
          <input
            type="text"
            id="searchInput"
            class="search-input"
            placeholder="Filter topik (mis. OSPF, VLAN)..."
            autocomplete="off"
          />
          <button type="button" id="clearSearchBtn" class="clear-search-btn" title="Hapus filter">&times;</button>
        </div>

        <div class="mode-switcher" role="tablist">
          <button type="button" id="tabCommand" class="mode-btn active" role="tab" aria-selected="true">Command</button>
          <button type="button" id="tabSummary" class="mode-btn" role="tab" aria-selected="false">Rangkuman</button>
        </div>
      </div>

      <nav class="sidebar-nav" id="sidebarNav" aria-label="Daftar Topik"></nav>
    </aside>

    <!-- Right Content Area -->
    <main class="main-area" id="mainArea">
      <div class="mobile-topbar">
        <div class="brand-row" style="margin-bottom: 0;">
          <span class="brand-title">CCNA 200-301</span>
          <span class="brand-badge">v1.1</span>
        </div>
        <button type="button" class="mobile-menu-btn" id="mobileMenuBtn">&#9776; Topik</button>
      </div>

      <div class="content-container">
        <h1 class="topic-header-title" id="topicTitle"></h1>
        <div class="md-body" id="topicBody"></div>
        <div class="topic-footer-nav" id="topicFooterNav"></div>
      </div>
    </main>
  </div>

  <script>
    const APP_DATA = {"command": [{"category": "RINGKASAN", "items": [{"id": "cmd-toc", "label": "Daftar Isi", "title": "CCNA 200-301 v1.1 — Command Cheat Sheet", "html": "<blockquote>\n<p>Ringkasan command Cisco IOS berdasarkan kurikulum CCNA Exam v1.1 (200-301).</p>\n</blockquote>\n<p><strong>Network Fundamentals — Topik 1.0 (20%)</strong></p>\n<ul>\n<li><a href=\"#cmd-1-6\">1.6 IPv4 Addressing &amp; Subnetting</a></li>\n<li><a href=\"#cmd-1-8\">1.8 IPv6 Addressing &amp; Prefix</a></li>\n</ul>\n<p><strong>Network Access — Topik 2.0 (20%)</strong></p>\n<ul>\n<li><a href=\"#cmd-2-1\">2.1 VLAN (Normal Range)</a></li>\n<li><a href=\"#cmd-2-2\">2.2 Konektivitas Interswitch (Trunk)</a></li>\n<li><a href=\"#cmd-2-3\">2.3 CDP &amp; LLDP</a></li>\n<li><a href=\"#cmd-2-4\">2.4 EtherChannel</a></li>\n<li><a href=\"#cmd-2-5\">2.5 Spanning Tree – Rapid PVST+</a></li>\n<li><a href=\"#cmd-2-8\">2.8 Akses Manajemen (TACACS+/RADIUS)</a></li>\n</ul>\n<p><strong>IP Connectivity — Topik 3.0 (25%)</strong></p>\n<ul>\n<li><a href=\"#cmd-3-3\">3.3 Static Routing</a></li>\n<li><a href=\"#cmd-3-4\">3.4 OSPFv2 – Single Area</a></li>\n<li><a href=\"#cmd-3-5\">3.5 First Hop Redundancy Protocol</a></li>\n</ul>\n<p><strong>IP Services — Topik 4.0 (10%)</strong></p>\n<ul>\n<li><a href=\"#cmd-4-1\">4.1 NAT</a></li>\n<li><a href=\"#cmd-4-2\">4.2 NTP</a></li>\n<li><a href=\"#cmd-4-3\">4.3 DHCP Server</a></li>\n<li><a href=\"#cmd-4-6\">4.6 DHCP Client &amp; Relay</a></li>\n<li><a href=\"#cmd-4-8\">4.8 SSH</a></li>\n</ul>\n<p><strong>Security Fundamentals — Topik 5.0 (15%)</strong></p>\n<ul>\n<li><a href=\"#cmd-5-3\">5.3 Device Access Control</a></li>\n<li><a href=\"#cmd-5-6\">5.6 Access Control List</a></li>\n<li><a href=\"#cmd-5-7\">5.7 Layer 2 Security</a></li>\n<li><a href=\"#cmd-5-8\">5.8 AAA — TACACS+/RADIUS</a></li>\n</ul>", "raw": "\n> Ringkasan command Cisco IOS berdasarkan kurikulum CCNA Exam v1.1 (200-301).\n\n**Network Fundamentals — Topik 1.0 (20%)**\n\n- [1.6 IPv4 Addressing & Subnetting](#cmd-1-6)\n- [1.8 IPv6 Addressing & Prefix](#cmd-1-8)\n\n**Network Access — Topik 2.0 (20%)**\n\n- [2.1 VLAN (Normal Range)](#cmd-2-1)\n- [2.2 Konektivitas Interswitch (Trunk)](#cmd-2-2)\n- [2.3 CDP & LLDP](#cmd-2-3)\n- [2.4 EtherChannel](#cmd-2-4)\n- [2.5 Spanning Tree – Rapid PVST+](#cmd-2-5)\n- [2.8 Akses Manajemen (TACACS+/RADIUS)](#cmd-2-8)\n\n**IP Connectivity — Topik 3.0 (25%)**\n\n- [3.3 Static Routing](#cmd-3-3)\n- [3.4 OSPFv2 – Single Area](#cmd-3-4)\n- [3.5 First Hop Redundancy Protocol](#cmd-3-5)\n\n**IP Services — Topik 4.0 (10%)**\n\n- [4.1 NAT](#cmd-4-1)\n- [4.2 NTP](#cmd-4-2)\n- [4.3 DHCP Server](#cmd-4-3)\n- [4.6 DHCP Client & Relay](#cmd-4-6)\n- [4.8 SSH](#cmd-4-8)\n\n**Security Fundamentals — Topik 5.0 (15%)**\n\n- [5.3 Device Access Control](#cmd-5-3)\n- [5.6 Access Control List](#cmd-5-6)\n- [5.7 Layer 2 Security](#cmd-5-7)\n- [5.8 AAA — TACACS+/RADIUS](#cmd-5-8)\n"}]}, {"category": "1.0 NETWORK FUNDAMENTALS", "items": [{"id": "cmd-1-6", "label": "1.6 IPv4 Addressing & Subnetting", "title": "1.6 IPv4 Addressing & Subnetting", "html": "<p><strong>Konfigurasi IPv4 Address</strong></p>\n<pre><code>Router(config)# interface &lt;interface&gt;\nRouter(config-if)# ip address &lt;ip-address&gt; &lt;subnet-mask&gt;\nRouter(config-if)# ip address &lt;ip-address&gt; &lt;subnet-mask&gt; secondary\nRouter(config-if)# no ip address\nRouter(config-if)# no shutdown\n</code></pre>\n<p><strong>Verifikasi Umum</strong></p>\n<pre><code>Router# show ip interface brief\nRouter# show ip interface &lt;interface&gt;\nRouter# show interfaces &lt;interface&gt;\nRouter# show running-config interface &lt;interface&gt;\nRouter# show ip route connected\n</code></pre>", "raw": "**Konfigurasi IPv4 Address**\n```\nRouter(config)# interface <interface>\nRouter(config-if)# ip address <ip-address> <subnet-mask>\nRouter(config-if)# ip address <ip-address> <subnet-mask> secondary\nRouter(config-if)# no ip address\nRouter(config-if)# no shutdown\n```\n\n**Verifikasi Umum**\n```\nRouter# show ip interface brief\nRouter# show ip interface <interface>\nRouter# show interfaces <interface>\nRouter# show running-config interface <interface>\nRouter# show ip route connected\n```"}, {"id": "cmd-1-8", "label": "1.8 IPv6 Addressing & Prefix", "title": "1.8 IPv6 Addressing & Prefix", "html": "<p><strong>Mengaktifkan IPv6 Routing</strong></p>\n<pre><code>Router(config)# ipv6 unicast-routing\n</code></pre>\n<p><strong>Konfigurasi IPv6 Address</strong></p>\n<pre><code>Router(config-if)# ipv6 address &lt;ipv6-address&gt;/&lt;prefix-length&gt;\nRouter(config-if)# ipv6 address &lt;prefix&gt;/&lt;prefix-length&gt; eui-64\nRouter(config-if)# ipv6 address autoconfig\nRouter(config-if)# ipv6 enable\nRouter(config-if)# no ipv6 address &lt;ipv6-address&gt;/&lt;prefix-length&gt;\n</code></pre>\n<p><strong>Link-Local Address</strong></p>\n<pre><code>Router(config-if)# ipv6 address &lt;link-local-address&gt; link-local\n</code></pre>\n<p><strong>Verifikasi Umum</strong></p>\n<pre><code>Router# show ipv6 interface brief\nRouter# show ipv6 interface &lt;interface&gt;\nRouter# show ipv6 route connected\nRouter# show running-config interface &lt;interface&gt;\n</code></pre>", "raw": "**Mengaktifkan IPv6 Routing**\n```\nRouter(config)# ipv6 unicast-routing\n```\n\n**Konfigurasi IPv6 Address**\n```\nRouter(config-if)# ipv6 address <ipv6-address>/<prefix-length>\nRouter(config-if)# ipv6 address <prefix>/<prefix-length> eui-64\nRouter(config-if)# ipv6 address autoconfig\nRouter(config-if)# ipv6 enable\nRouter(config-if)# no ipv6 address <ipv6-address>/<prefix-length>\n```\n\n**Link-Local Address**\n```\nRouter(config-if)# ipv6 address <link-local-address> link-local\n```\n\n**Verifikasi Umum**\n```\nRouter# show ipv6 interface brief\nRouter# show ipv6 interface <interface>\nRouter# show ipv6 route connected\nRouter# show running-config interface <interface>\n```"}]}, {"category": "2.0 NETWORK ACCESS", "items": [{"id": "cmd-2-1", "label": "2.1 VLAN (Normal Range)", "title": "2.1 VLAN (Normal Range)", "html": "<p><strong>Konfigurasi Dasar VLAN</strong></p>\n<pre><code>Switch(config)# vlan &lt;vlan-id&gt;\nSwitch(config-vlan)# name &lt;vlan-name&gt;\nSwitch(config)# no vlan &lt;vlan-id&gt;\n</code></pre>\n<p><strong>2.1.a — Access Ports (Data and Voice)</strong></p>\n<pre><code>Switch(config-if)# switchport mode access\nSwitch(config-if)# switchport access vlan &lt;vlan-id&gt;\nSwitch(config-if)# switchport voice vlan &lt;vlan-id&gt;\nSwitch(config-if)# switchport nonegotiate\n</code></pre>\n<p><strong>2.1.b — Default VLAN</strong></p>\n<pre><code>Switch# show vlan brief\nSwitch(config-if)# switchport access vlan 1\n</code></pre>\n<p><strong>2.1.c — InterVLAN Connectivity</strong></p>\n<p><em>Router-on-a-Stick:</em></p>\n<pre><code>Router(config)# interface &lt;interface&gt;.&lt;subinterface&gt;\nRouter(config-subif)# encapsulation dot1Q &lt;vlan-id&gt;\nRouter(config-subif)# ip address &lt;address&gt; &lt;mask&gt;\n</code></pre>\n<p><em>SVI (Multilayer Switch):</em></p>\n<pre><code>Switch(config)# ip routing\nSwitch(config)# interface vlan &lt;vlan-id&gt;\nSwitch(config-if)# ip address &lt;address&gt; &lt;mask&gt;\nSwitch(config-if)# no shutdown\n</code></pre>\n<p><strong>Verifikasi Umum</strong></p>\n<pre><code>Switch# show vlan\nSwitch# show vlan id &lt;vlan-id&gt;\nSwitch# show interfaces trunk\nSwitch# show interfaces &lt;interface&gt; switchport\nSwitch# show interfaces status\nSwitch# show mac address-table\nSwitch# show running-config interface &lt;interface&gt;\n</code></pre>", "raw": "**Konfigurasi Dasar VLAN**\n```\nSwitch(config)# vlan <vlan-id>\nSwitch(config-vlan)# name <vlan-name>\nSwitch(config)# no vlan <vlan-id>\n```\n\n**2.1.a — Access Ports (Data and Voice)**\n```\nSwitch(config-if)# switchport mode access\nSwitch(config-if)# switchport access vlan <vlan-id>\nSwitch(config-if)# switchport voice vlan <vlan-id>\nSwitch(config-if)# switchport nonegotiate\n```\n\n**2.1.b — Default VLAN**\n```\nSwitch# show vlan brief\nSwitch(config-if)# switchport access vlan 1\n```\n\n**2.1.c — InterVLAN Connectivity**\n\n*Router-on-a-Stick:*\n```\nRouter(config)# interface <interface>.<subinterface>\nRouter(config-subif)# encapsulation dot1Q <vlan-id>\nRouter(config-subif)# ip address <address> <mask>\n```\n\n*SVI (Multilayer Switch):*\n```\nSwitch(config)# ip routing\nSwitch(config)# interface vlan <vlan-id>\nSwitch(config-if)# ip address <address> <mask>\nSwitch(config-if)# no shutdown\n```\n\n**Verifikasi Umum**\n```\nSwitch# show vlan\nSwitch# show vlan id <vlan-id>\nSwitch# show interfaces trunk\nSwitch# show interfaces <interface> switchport\nSwitch# show interfaces status\nSwitch# show mac address-table\nSwitch# show running-config interface <interface>\n```"}, {"id": "cmd-2-2", "label": "2.2 Konektivitas Interswitch (Trunk)", "title": "2.2 Konektivitas Interswitch (Trunk)", "html": "<p><strong>2.2.a — Trunk Ports</strong></p>\n<pre><code>Switch(config-if)# switchport mode trunk\nSwitch(config-if)# switchport trunk allowed vlan &lt;vlan-list&gt;\nSwitch(config-if)# switchport trunk allowed vlan add &lt;vlan-list&gt;\nSwitch(config-if)# switchport trunk allowed vlan remove &lt;vlan-list&gt;\n</code></pre>\n<p><strong>2.2.b — 802.1Q</strong></p>\n<pre><code>Switch(config-if)# switchport trunk encapsulation dot1q\n</code></pre>\n<p><strong>2.2.c — Native VLAN</strong></p>\n<pre><code>Switch(config-if)# switchport trunk native vlan &lt;vlan-id&gt;\n</code></pre>\n<p><strong>Verifikasi Umum</strong></p>\n<pre><code>Switch# show vlan\nSwitch# show vlan id &lt;vlan-id&gt;\nSwitch# show interfaces trunk\nSwitch# show interfaces &lt;interface&gt; switchport\nSwitch# show interfaces status\nSwitch# show mac address-table\nSwitch# show running-config interface &lt;interface&gt;\n</code></pre>", "raw": "**2.2.a — Trunk Ports**\n```\nSwitch(config-if)# switchport mode trunk\nSwitch(config-if)# switchport trunk allowed vlan <vlan-list>\nSwitch(config-if)# switchport trunk allowed vlan add <vlan-list>\nSwitch(config-if)# switchport trunk allowed vlan remove <vlan-list>\n```\n\n**2.2.b — 802.1Q**\n```\nSwitch(config-if)# switchport trunk encapsulation dot1q\n```\n\n**2.2.c — Native VLAN**\n```\nSwitch(config-if)# switchport trunk native vlan <vlan-id>\n```\n\n**Verifikasi Umum**\n```\nSwitch# show vlan\nSwitch# show vlan id <vlan-id>\nSwitch# show interfaces trunk\nSwitch# show interfaces <interface> switchport\nSwitch# show interfaces status\nSwitch# show mac address-table\nSwitch# show running-config interface <interface>\n```"}, {"id": "cmd-2-3", "label": "2.3 CDP & LLDP", "title": "2.3 CDP & LLDP", "html": "<p><strong>CDP (Cisco Discovery Protocol) — Global</strong></p>\n<pre><code>Switch(config)# cdp run\nSwitch(config)# no cdp run\nSwitch(config)# cdp timer &lt;seconds&gt;\nSwitch(config)# cdp holdtime &lt;seconds&gt;\n</code></pre>\n<p><strong>CDP — Per Interface</strong></p>\n<pre><code>Switch(config-if)# cdp enable\nSwitch(config-if)# no cdp enable\n</code></pre>\n<p><strong>CDP — Verifikasi</strong></p>\n<pre><code>Switch# show cdp\nSwitch# show cdp neighbors\nSwitch# show cdp neighbors detail\nSwitch# show cdp interface\nSwitch# show cdp entry *\nSwitch# show cdp entry &lt;device-name&gt;\nSwitch# show cdp traffic\n</code></pre>\n<p><strong>LLDP (Link Layer Discovery Protocol) — Global</strong></p>\n<pre><code>Switch(config)# lldp run\nSwitch(config)# no lldp run\nSwitch(config)# lldp timer &lt;seconds&gt;\nSwitch(config)# lldp holdtime &lt;seconds&gt;\nSwitch(config)# lldp reinit &lt;seconds&gt;\n</code></pre>\n<p><strong>LLDP — Per Interface</strong></p>\n<pre><code>Switch(config-if)# lldp transmit\nSwitch(config-if)# lldp receive\nSwitch(config-if)# no lldp transmit\nSwitch(config-if)# no lldp receive\n</code></pre>\n<p><strong>LLDP — Verifikasi</strong></p>\n<pre><code>Switch# show lldp\nSwitch# show lldp neighbors\nSwitch# show lldp neighbors detail\nSwitch# show lldp interface\nSwitch# show lldp entry &lt;device-name&gt;\nSwitch# show lldp traffic\n</code></pre>\n<p><strong>Verifikasi Umum</strong></p>\n<pre><code>Switch# show run | include cdp\nSwitch# show run | include lldp\nSwitch# show run | section cdp\nSwitch# show run | section lldp\n</code></pre>", "raw": "**CDP (Cisco Discovery Protocol) — Global**\n```\nSwitch(config)# cdp run\nSwitch(config)# no cdp run\nSwitch(config)# cdp timer <seconds>\nSwitch(config)# cdp holdtime <seconds>\n```\n\n**CDP — Per Interface**\n```\nSwitch(config-if)# cdp enable\nSwitch(config-if)# no cdp enable\n```\n\n**CDP — Verifikasi**\n```\nSwitch# show cdp\nSwitch# show cdp neighbors\nSwitch# show cdp neighbors detail\nSwitch# show cdp interface\nSwitch# show cdp entry *\nSwitch# show cdp entry <device-name>\nSwitch# show cdp traffic\n```\n\n**LLDP (Link Layer Discovery Protocol) — Global**\n```\nSwitch(config)# lldp run\nSwitch(config)# no lldp run\nSwitch(config)# lldp timer <seconds>\nSwitch(config)# lldp holdtime <seconds>\nSwitch(config)# lldp reinit <seconds>\n```\n\n**LLDP — Per Interface**\n```\nSwitch(config-if)# lldp transmit\nSwitch(config-if)# lldp receive\nSwitch(config-if)# no lldp transmit\nSwitch(config-if)# no lldp receive\n```\n\n**LLDP — Verifikasi**\n```\nSwitch# show lldp\nSwitch# show lldp neighbors\nSwitch# show lldp neighbors detail\nSwitch# show lldp interface\nSwitch# show lldp entry <device-name>\nSwitch# show lldp traffic\n```\n\n**Verifikasi Umum**\n```\nSwitch# show run | include cdp\nSwitch# show run | include lldp\nSwitch# show run | section cdp\nSwitch# show run | section lldp\n```"}, {"id": "cmd-2-4", "label": "2.4 EtherChannel", "title": "2.4 EtherChannel", "html": "<p><strong>Layer 2 EtherChannel — Konfigurasi Dasar</strong></p>\n<pre><code>Switch(config)# interface range &lt;interface-range&gt;\nSwitch(config-if-range)# channel-group &lt;number&gt; mode &lt;active | passive | on&gt;\nSwitch(config-if-range)# channel-protocol lacp\n</code></pre>\n<p><strong>Layer 2 EtherChannel — Port-Channel Interface</strong></p>\n<pre><code>Switch(config)# interface port-channel &lt;number&gt;\nSwitch(config-if)# switchport mode trunk\nSwitch(config-if)# switchport trunk allowed vlan &lt;vlan-list&gt;\nSwitch(config-if)# switchport trunk native vlan &lt;vlan-id&gt;\n</code></pre>\n<p><strong>Layer 3 EtherChannel — Konfigurasi</strong></p>\n<pre><code>Router(config)# interface range &lt;interface-range&gt;\nRouter(config-if-range)# no switchport\nRouter(config-if-range)# channel-group &lt;number&gt; mode &lt;active | passive | on&gt;\n\nRouter(config)# interface port-channel &lt;number&gt;\nRouter(config-if)# no switchport\nRouter(config-if)# ip address &lt;address&gt; &lt;mask&gt;\n</code></pre>\n<p><strong>LACP — Mode</strong></p>\n<pre><code>mode active    ! inisiasi negosiasi LACP\nmode passive   ! menunggu negosiasi LACP\nmode on        ! manual, tanpa protokol negosiasi\n</code></pre>\n<p><strong>LACP — Priority &amp; Load Balancing</strong></p>\n<pre><code>Switch(config)# lacp system-priority &lt;1-65535&gt;\nSwitch(config-if)# lacp port-priority &lt;1-65535&gt;\nSwitch(config)# port-channel load-balance &lt;method&gt;\n</code></pre>\n<p><strong>Verifikasi Umum</strong></p>\n<pre><code>Switch# show etherchannel summary\nSwitch# show etherchannel &lt;number&gt; port-detail\nSwitch# show etherchannel port-channel\nSwitch# show interfaces port-channel &lt;number&gt;\nSwitch# show interfaces &lt;interface&gt; etherchannel\nSwitch# show lacp neighbor\nSwitch# show lacp internal\nSwitch# show lacp counters\nSwitch# show run | include channel-group\nSwitch# show run interface port-channel &lt;number&gt;\n</code></pre>", "raw": "**Layer 2 EtherChannel — Konfigurasi Dasar**\n```\nSwitch(config)# interface range <interface-range>\nSwitch(config-if-range)# channel-group <number> mode <active | passive | on>\nSwitch(config-if-range)# channel-protocol lacp\n```\n\n**Layer 2 EtherChannel — Port-Channel Interface**\n```\nSwitch(config)# interface port-channel <number>\nSwitch(config-if)# switchport mode trunk\nSwitch(config-if)# switchport trunk allowed vlan <vlan-list>\nSwitch(config-if)# switchport trunk native vlan <vlan-id>\n```\n\n**Layer 3 EtherChannel — Konfigurasi**\n```\nRouter(config)# interface range <interface-range>\nRouter(config-if-range)# no switchport\nRouter(config-if-range)# channel-group <number> mode <active | passive | on>\n\nRouter(config)# interface port-channel <number>\nRouter(config-if)# no switchport\nRouter(config-if)# ip address <address> <mask>\n```\n\n**LACP — Mode**\n```\nmode active    ! inisiasi negosiasi LACP\nmode passive   ! menunggu negosiasi LACP\nmode on        ! manual, tanpa protokol negosiasi\n```\n\n**LACP — Priority & Load Balancing**\n```\nSwitch(config)# lacp system-priority <1-65535>\nSwitch(config-if)# lacp port-priority <1-65535>\nSwitch(config)# port-channel load-balance <method>\n```\n\n**Verifikasi Umum**\n```\nSwitch# show etherchannel summary\nSwitch# show etherchannel <number> port-detail\nSwitch# show etherchannel port-channel\nSwitch# show interfaces port-channel <number>\nSwitch# show interfaces <interface> etherchannel\nSwitch# show lacp neighbor\nSwitch# show lacp internal\nSwitch# show lacp counters\nSwitch# show run | include channel-group\nSwitch# show run interface port-channel <number>\n```"}, {"id": "cmd-2-5", "label": "2.5 Spanning Tree – Rapid PVST+", "title": "2.5 Spanning Tree – Rapid PVST+", "html": "<p><strong>Konfigurasi Dasar</strong></p>\n<pre><code>Switch(config)# spanning-tree mode rapid-pvst\nSwitch(config)# spanning-tree vlan &lt;vlan-id&gt; priority &lt;0-61440&gt;\n</code></pre>\n<p><strong>2.5.a — Root Bridge (Primary/Secondary) &amp; Port Names</strong></p>\n<pre><code>Switch(config)# spanning-tree vlan &lt;vlan-id&gt; root primary\nSwitch(config)# spanning-tree vlan &lt;vlan-id&gt; root secondary\nSwitch# show spanning-tree vlan &lt;vlan-id&gt;\nSwitch# show spanning-tree root\n</code></pre>\n<p><strong>2.5.b — Port States and Roles</strong></p>\n<pre><code>Switch# show spanning-tree interface &lt;interface&gt;\nSwitch# show spanning-tree vlan &lt;vlan-id&gt;\nSwitch# show spanning-tree summary\n</code></pre>\n<p><strong>2.5.c — PortFast</strong></p>\n<pre><code>Switch(config-if)# spanning-tree portfast\nSwitch(config-if)# spanning-tree portfast trunk\nSwitch(config)# spanning-tree portfast default\nSwitch(config-if)# no spanning-tree portfast\n</code></pre>\n<p><strong>2.5.d — Root Guard, Loop Guard, BPDU Filter, BPDU Guard</strong></p>\n<pre><code>Switch(config-if)# spanning-tree guard root\nSwitch(config-if)# spanning-tree guard loop\nSwitch(config-if)# no spanning-tree guard\nSwitch(config-if)# spanning-tree bpduguard enable\nSwitch(config)# spanning-tree portfast bpduguard default\nSwitch(config-if)# spanning-tree bpdufilter enable\nSwitch(config)# spanning-tree portfast bpdufilter default\n</code></pre>\n<p><strong>Cost &amp; Port Priority</strong></p>\n<pre><code>Switch(config-if)# spanning-tree cost &lt;cost&gt;\nSwitch(config-if)# spanning-tree vlan &lt;vlan-id&gt; cost &lt;cost&gt;\nSwitch(config-if)# spanning-tree port-priority &lt;priority&gt;\nSwitch(config-if)# spanning-tree vlan &lt;vlan-id&gt; port-priority &lt;priority&gt;\n</code></pre>\n<p><strong>Verifikasi Umum</strong></p>\n<pre><code>Switch# show spanning-tree\nSwitch# show spanning-tree vlan &lt;vlan-id&gt;\nSwitch# show spanning-tree interface &lt;interface&gt; detail\nSwitch# show spanning-tree summary\nSwitch# show spanning-tree root\nSwitch# show run | section spanning-tree\n</code></pre>", "raw": "**Konfigurasi Dasar**\n```\nSwitch(config)# spanning-tree mode rapid-pvst\nSwitch(config)# spanning-tree vlan <vlan-id> priority <0-61440>\n```\n\n**2.5.a — Root Bridge (Primary/Secondary) & Port Names**\n```\nSwitch(config)# spanning-tree vlan <vlan-id> root primary\nSwitch(config)# spanning-tree vlan <vlan-id> root secondary\nSwitch# show spanning-tree vlan <vlan-id>\nSwitch# show spanning-tree root\n```\n\n**2.5.b — Port States and Roles**\n```\nSwitch# show spanning-tree interface <interface>\nSwitch# show spanning-tree vlan <vlan-id>\nSwitch# show spanning-tree summary\n```\n\n**2.5.c — PortFast**\n```\nSwitch(config-if)# spanning-tree portfast\nSwitch(config-if)# spanning-tree portfast trunk\nSwitch(config)# spanning-tree portfast default\nSwitch(config-if)# no spanning-tree portfast\n```\n\n**2.5.d — Root Guard, Loop Guard, BPDU Filter, BPDU Guard**\n```\nSwitch(config-if)# spanning-tree guard root\nSwitch(config-if)# spanning-tree guard loop\nSwitch(config-if)# no spanning-tree guard\nSwitch(config-if)# spanning-tree bpduguard enable\nSwitch(config)# spanning-tree portfast bpduguard default\nSwitch(config-if)# spanning-tree bpdufilter enable\nSwitch(config)# spanning-tree portfast bpdufilter default\n```\n\n**Cost & Port Priority**\n```\nSwitch(config-if)# spanning-tree cost <cost>\nSwitch(config-if)# spanning-tree vlan <vlan-id> cost <cost>\nSwitch(config-if)# spanning-tree port-priority <priority>\nSwitch(config-if)# spanning-tree vlan <vlan-id> port-priority <priority>\n```\n\n**Verifikasi Umum**\n```\nSwitch# show spanning-tree\nSwitch# show spanning-tree vlan <vlan-id>\nSwitch# show spanning-tree interface <interface> detail\nSwitch# show spanning-tree summary\nSwitch# show spanning-tree root\nSwitch# show run | section spanning-tree\n```"}, {"id": "cmd-2-8", "label": "2.8 Akses Manajemen (TACACS+/RADIUS)", "title": "2.8 Akses Manajemen (TACACS+/RADIUS)", "html": "<p><em>Catatan: pada exam blueprint, 5.8 bersifat konseptual (\"compare\"), bukan \"configure and verify\". Command berikut disertakan karena berkaitan langsung dengan 2.8 (device management access via TACACS+/RADIUS) dan umum diuji dalam bentuk konfigurasi praktis/simulasi.</em></p>\n<p><strong>Perbandingan TACACS+ vs RADIUS</strong></p>\n<table>\n<thead>\n<tr>\n<th>Aspek</th>\n<th>TACACS+</th>\n<th>RADIUS</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Transport</td>\n<td>TCP port 49</td>\n<td>UDP port 1812 (auth) / 1813 (acct)</td>\n</tr>\n<tr>\n<td>Enkripsi</td>\n<td>Seluruh body paket</td>\n<td>Hanya field password</td>\n</tr>\n<tr>\n<td>Proses AAA</td>\n<td>Autentikasi &amp; otorisasi terpisah</td>\n<td>Autentikasi &amp; otorisasi digabung</td>\n</tr>\n<tr>\n<td>Command authorization</td>\n<td>Didukung (per privilege level)</td>\n<td>Tidak didukung</td>\n</tr>\n<tr>\n<td>Standar</td>\n<td>Cisco proprietary</td>\n<td>Open standard (IETF)</td>\n</tr>\n<tr>\n<td>Umum dipakai untuk</td>\n<td>Administrasi perangkat (device admin)</td>\n<td>Akses jaringan (802.1X, VPN)</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Mengaktifkan AAA</strong></p>\n<pre><code>Router(config)# aaa new-model\n</code></pre>\n<p><strong>Konfigurasi RADIUS Server</strong></p>\n<pre><code>Router(config)# radius server &lt;name&gt;\nRouter(config-radius-server)# address ipv4 &lt;ip-address&gt; auth-port &lt;port&gt; acct-port &lt;port&gt;\nRouter(config-radius-server)# key &lt;shared-key&gt;\n</code></pre>\n<p><em>Sintaks lama (single-line, masih umum dipakai di Packet Tracer):</em></p>\n<pre><code>Router(config)# radius-server host &lt;ip-address&gt; auth-port &lt;port&gt; acct-port &lt;port&gt; key &lt;shared-key&gt;\n</code></pre>\n<p><strong>Konfigurasi TACACS+ Server</strong></p>\n<pre><code>Router(config)# tacacs server &lt;name&gt;\nRouter(config-server-tacacs)# address ipv4 &lt;ip-address&gt;\nRouter(config-server-tacacs)# key &lt;shared-key&gt;\n</code></pre>\n<p><em>Sintaks lama (single-line):</em></p>\n<pre><code>Router(config)# tacacs-server host &lt;ip-address&gt; key &lt;shared-key&gt;\n</code></pre>\n<p><strong>AAA Server Group (mengelompokkan beberapa server)</strong></p>\n<pre><code>Router(config)# aaa group server radius &lt;group-name&gt;\nRouter(config-sg-radius)# server name &lt;name&gt;\n\nRouter(config)# aaa group server tacacs+ &lt;group-name&gt;\nRouter(config-sg-tacacs+)# server name &lt;name&gt;\n</code></pre>\n<p><strong>AAA Authentication (Login)</strong></p>\n<pre><code>Router(config)# aaa authentication login default group tacacs+ local\nRouter(config)# aaa authentication login default group radius local\nRouter(config)# aaa authentication login &lt;list-name&gt; group &lt;group-name&gt; local\n</code></pre>\n<p><em>Menerapkan named list ke line (jika bukan default):</em></p>\n<pre><code>Router(config-line)# login authentication &lt;list-name&gt;\n</code></pre>\n<p><strong>AAA Authorization</strong></p>\n<pre><code>Router(config)# aaa authorization exec default group tacacs+ local\nRouter(config)# aaa authorization commands &lt;privilege-level&gt; default group tacacs+ local\nRouter(config)# aaa authorization network default group radius local\n</code></pre>\n<p><strong>AAA Accounting</strong></p>\n<pre><code>Router(config)# aaa accounting exec default start-stop group tacacs+\nRouter(config)# aaa accounting commands &lt;privilege-level&gt; default start-stop group tacacs+\nRouter(config)# aaa accounting network default start-stop group radius\n</code></pre>\n<p><strong>Verifikasi Umum</strong></p>\n<pre><code>Router# show aaa servers\nRouter# show aaa method-lists all\nRouter# show tacacs\nRouter# show radius server-group all\nRouter# test aaa group &lt;group-name&gt; &lt;username&gt; &lt;password&gt; legacy\nRouter# debug aaa authentication\nRouter# debug tacacs\nRouter# debug radius\nRouter# show run | section aaa\nRouter# show run | include tacacs\nRouter# show run | include radius\n</code></pre>", "raw": "*Catatan: pada exam blueprint, 5.8 bersifat konseptual (\"compare\"), bukan \"configure and verify\". Command berikut disertakan karena berkaitan langsung dengan 2.8 (device management access via TACACS+/RADIUS) dan umum diuji dalam bentuk konfigurasi praktis/simulasi.*\n\n**Perbandingan TACACS+ vs RADIUS**\n\n| Aspek | TACACS+ | RADIUS |\n|---|---|---|\n| Transport | TCP port 49 | UDP port 1812 (auth) / 1813 (acct) |\n| Enkripsi | Seluruh body paket | Hanya field password |\n| Proses AAA | Autentikasi & otorisasi terpisah | Autentikasi & otorisasi digabung |\n| Command authorization | Didukung (per privilege level) | Tidak didukung |\n| Standar | Cisco proprietary | Open standard (IETF) |\n| Umum dipakai untuk | Administrasi perangkat (device admin) | Akses jaringan (802.1X, VPN) |\n\n**Mengaktifkan AAA**\n```\nRouter(config)# aaa new-model\n```\n\n**Konfigurasi RADIUS Server**\n```\nRouter(config)# radius server <name>\nRouter(config-radius-server)# address ipv4 <ip-address> auth-port <port> acct-port <port>\nRouter(config-radius-server)# key <shared-key>\n```\n\n*Sintaks lama (single-line, masih umum dipakai di Packet Tracer):*\n```\nRouter(config)# radius-server host <ip-address> auth-port <port> acct-port <port> key <shared-key>\n```\n\n**Konfigurasi TACACS+ Server**\n```\nRouter(config)# tacacs server <name>\nRouter(config-server-tacacs)# address ipv4 <ip-address>\nRouter(config-server-tacacs)# key <shared-key>\n```\n\n*Sintaks lama (single-line):*\n```\nRouter(config)# tacacs-server host <ip-address> key <shared-key>\n```\n\n**AAA Server Group (mengelompokkan beberapa server)**\n```\nRouter(config)# aaa group server radius <group-name>\nRouter(config-sg-radius)# server name <name>\n\nRouter(config)# aaa group server tacacs+ <group-name>\nRouter(config-sg-tacacs+)# server name <name>\n```\n\n**AAA Authentication (Login)**\n```\nRouter(config)# aaa authentication login default group tacacs+ local\nRouter(config)# aaa authentication login default group radius local\nRouter(config)# aaa authentication login <list-name> group <group-name> local\n```\n\n*Menerapkan named list ke line (jika bukan default):*\n```\nRouter(config-line)# login authentication <list-name>\n```\n\n**AAA Authorization**\n```\nRouter(config)# aaa authorization exec default group tacacs+ local\nRouter(config)# aaa authorization commands <privilege-level> default group tacacs+ local\nRouter(config)# aaa authorization network default group radius local\n```\n\n**AAA Accounting**\n```\nRouter(config)# aaa accounting exec default start-stop group tacacs+\nRouter(config)# aaa accounting commands <privilege-level> default start-stop group tacacs+\nRouter(config)# aaa accounting network default start-stop group radius\n```\n\n**Verifikasi Umum**\n```\nRouter# show aaa servers\nRouter# show aaa method-lists all\nRouter# show tacacs\nRouter# show radius server-group all\nRouter# test aaa group <group-name> <username> <password> legacy\nRouter# debug aaa authentication\nRouter# debug tacacs\nRouter# debug radius\nRouter# show run | section aaa\nRouter# show run | include tacacs\nRouter# show run | include radius\n```"}]}, {"category": "3.0 IP CONNECTIVITY", "items": [{"id": "cmd-3-3", "label": "3.3 Static Routing", "title": "3.3 Static Routing", "html": "<p><strong>Konfigurasi Dasar (IPv4)</strong></p>\n<pre><code>Router(config)# ip route &lt;network-address&gt; &lt;subnet-mask&gt; &lt;next-hop-ip | exit-interface&gt;\n</code></pre>\n<p><strong>Konfigurasi Dasar (IPv6)</strong></p>\n<pre><code>Router(config)# ipv6 unicast-routing\nRouter(config)# ipv6 route &lt;prefix&gt;/&lt;prefix-length&gt; &lt;next-hop-ipv6 | exit-interface&gt;\n</code></pre>\n<p><strong>3.3.a — Default Route</strong></p>\n<pre><code>Router(config)# ip route 0.0.0.0 0.0.0.0 &lt;next-hop-ip&gt;\nRouter(config)# ip route 0.0.0.0 0.0.0.0 &lt;exit-interface&gt;\nRouter(config)# ipv6 route ::/0 &lt;next-hop-ipv6&gt;\nRouter(config)# ipv6 route ::/0 &lt;exit-interface&gt;\n</code></pre>\n<p><strong>3.3.b — Network Route</strong></p>\n<pre><code>Router(config)# ip route &lt;network-address&gt; &lt;subnet-mask&gt; &lt;next-hop-ip&gt;\nRouter(config)# ipv6 route &lt;network-prefix&gt;/&lt;prefix-length&gt; &lt;next-hop-ipv6&gt;\n</code></pre>\n<p><strong>3.3.c — Host Route</strong></p>\n<pre><code>Router(config)# ip route &lt;host-ip&gt; 255.255.255.255 &lt;next-hop-ip&gt;\nRouter(config)# ipv6 route &lt;host-ipv6&gt;/128 &lt;next-hop-ipv6&gt;\n</code></pre>\n<p><strong>3.3.d — Floating Static</strong></p>\n<pre><code>Router(config)# ip route &lt;network-address&gt; &lt;subnet-mask&gt; &lt;next-hop-ip&gt; &lt;administrative-distance&gt;\nRouter(config)# ipv6 route &lt;prefix&gt;/&lt;prefix-length&gt; &lt;next-hop-ipv6&gt; &lt;administrative-distance&gt;\n</code></pre>\n<p><strong>Verifikasi Umum</strong></p>\n<pre><code>Router# show ip route\nRouter# show ip route static\nRouter# show ipv6 route\nRouter# show ipv6 route static\nRouter# show run | section ip route\nRouter# show run | include ip route\n</code></pre>", "raw": "**Konfigurasi Dasar (IPv4)**\n```\nRouter(config)# ip route <network-address> <subnet-mask> <next-hop-ip | exit-interface>\n```\n\n**Konfigurasi Dasar (IPv6)**\n```\nRouter(config)# ipv6 unicast-routing\nRouter(config)# ipv6 route <prefix>/<prefix-length> <next-hop-ipv6 | exit-interface>\n```\n\n**3.3.a — Default Route**\n```\nRouter(config)# ip route 0.0.0.0 0.0.0.0 <next-hop-ip>\nRouter(config)# ip route 0.0.0.0 0.0.0.0 <exit-interface>\nRouter(config)# ipv6 route ::/0 <next-hop-ipv6>\nRouter(config)# ipv6 route ::/0 <exit-interface>\n```\n\n**3.3.b — Network Route**\n```\nRouter(config)# ip route <network-address> <subnet-mask> <next-hop-ip>\nRouter(config)# ipv6 route <network-prefix>/<prefix-length> <next-hop-ipv6>\n```\n\n**3.3.c — Host Route**\n```\nRouter(config)# ip route <host-ip> 255.255.255.255 <next-hop-ip>\nRouter(config)# ipv6 route <host-ipv6>/128 <next-hop-ipv6>\n```\n\n**3.3.d — Floating Static**\n```\nRouter(config)# ip route <network-address> <subnet-mask> <next-hop-ip> <administrative-distance>\nRouter(config)# ipv6 route <prefix>/<prefix-length> <next-hop-ipv6> <administrative-distance>\n```\n\n**Verifikasi Umum**\n```\nRouter# show ip route\nRouter# show ip route static\nRouter# show ipv6 route\nRouter# show ipv6 route static\nRouter# show run | section ip route\nRouter# show run | include ip route\n```"}, {"id": "cmd-3-4", "label": "3.4 OSPFv2 – Single Area", "title": "3.4 OSPFv2 – Single Area", "html": "<p><strong>Konfigurasi Dasar</strong></p>\n<pre><code>Router(config)# router ospf &lt;process-id&gt;\nRouter(config-router)# router-id &lt;A.B.C.D&gt;\nRouter(config-router)# network &lt;network-address&gt; &lt;wildcard-mask&gt; area &lt;area-id&gt;\nRouter(config-router)# passive-interface &lt;interface&gt;\nRouter(config-router)# passive-interface default\nRouter(config-router)# no passive-interface &lt;interface&gt;\n</code></pre>\n<p><strong>Konfigurasi via Interface (alternatif network statement)</strong></p>\n<pre><code>Router(config-if)# ip ospf &lt;process-id&gt; area &lt;area-id&gt;\n</code></pre>\n<p><strong>3.4.a — Neighbor Adjacencies</strong></p>\n<pre><code>Router(config-if)# ip ospf hello-interval &lt;seconds&gt;\nRouter(config-if)# ip ospf dead-interval &lt;seconds&gt;\nRouter# show ip ospf neighbor\nRouter# show ip ospf neighbor detail\nRouter# show ip protocols\n</code></pre>\n<p><strong>3.4.b — Point-to-Point</strong></p>\n<pre><code>Router(config-if)# ip ospf network point-to-point\nRouter# show ip ospf interface &lt;interface&gt;\n</code></pre>\n<p><strong>3.4.c — Broadcast (DR/BDR Selection)</strong></p>\n<pre><code>Router(config-if)# ip ospf network broadcast\nRouter(config-if)# ip ospf priority &lt;0-255&gt;\nRouter# show ip ospf neighbor\nRouter# show ip ospf interface &lt;interface&gt;\n</code></pre>\n<p><strong>3.4.d — Router ID</strong></p>\n<pre><code>Router(config-router)# router-id &lt;A.B.C.D&gt;\nRouter# clear ip ospf process\nRouter# show ip ospf\nRouter# show ip protocols\n</code></pre>\n<p><strong>Verifikasi Umum</strong></p>\n<pre><code>Router# show ip route ospf\nRouter# show ip ospf database\nRouter# show ip ospf interface brief\nRouter# show run | section ospf\n</code></pre>", "raw": "**Konfigurasi Dasar**\n```\nRouter(config)# router ospf <process-id>\nRouter(config-router)# router-id <A.B.C.D>\nRouter(config-router)# network <network-address> <wildcard-mask> area <area-id>\nRouter(config-router)# passive-interface <interface>\nRouter(config-router)# passive-interface default\nRouter(config-router)# no passive-interface <interface>\n```\n\n**Konfigurasi via Interface (alternatif network statement)**\n```\nRouter(config-if)# ip ospf <process-id> area <area-id>\n```\n\n**3.4.a — Neighbor Adjacencies**\n```\nRouter(config-if)# ip ospf hello-interval <seconds>\nRouter(config-if)# ip ospf dead-interval <seconds>\nRouter# show ip ospf neighbor\nRouter# show ip ospf neighbor detail\nRouter# show ip protocols\n```\n\n**3.4.b — Point-to-Point**\n```\nRouter(config-if)# ip ospf network point-to-point\nRouter# show ip ospf interface <interface>\n```\n\n**3.4.c — Broadcast (DR/BDR Selection)**\n```\nRouter(config-if)# ip ospf network broadcast\nRouter(config-if)# ip ospf priority <0-255>\nRouter# show ip ospf neighbor\nRouter# show ip ospf interface <interface>\n```\n\n**3.4.d — Router ID**\n```\nRouter(config-router)# router-id <A.B.C.D>\nRouter# clear ip ospf process\nRouter# show ip ospf\nRouter# show ip protocols\n```\n\n**Verifikasi Umum**\n```\nRouter# show ip route ospf\nRouter# show ip ospf database\nRouter# show ip ospf interface brief\nRouter# show run | section ospf\n```"}, {"id": "cmd-3-5", "label": "3.5 First Hop Redundancy Protocol", "title": "3.5 First Hop Redundancy Protocol", "html": "<p><em>Catatan: pada exam blueprint, topik ini bersifat konseptual (\"describe\"), bukan \"configure and verify\" seperti topik lainnya. Command berikut disertakan sebagai referensi praktis.</em></p>\n<p><strong>HSRP (Hot Standby Router Protocol)</strong></p>\n<pre><code>Router(config-if)# standby &lt;group-number&gt; ip &lt;virtual-ip&gt;\nRouter(config-if)# standby &lt;group-number&gt; priority &lt;0-255&gt;\nRouter(config-if)# standby &lt;group-number&gt; preempt\nRouter(config-if)# standby &lt;group-number&gt; timers &lt;hello&gt; &lt;hold&gt;\nRouter(config-if)# standby version 2\nRouter(config-if)# standby &lt;group-number&gt; track &lt;interface&gt; decrement &lt;value&gt;\n</code></pre>\n<p><strong>VRRP (Virtual Router Redundancy Protocol)</strong></p>\n<pre><code>Router(config-if)# vrrp &lt;group-number&gt; ip &lt;virtual-ip&gt;\nRouter(config-if)# vrrp &lt;group-number&gt; priority &lt;1-254&gt;\nRouter(config-if)# vrrp &lt;group-number&gt; preempt\nRouter(config-if)# vrrp &lt;group-number&gt; timers advertise &lt;seconds&gt;\n</code></pre>\n<p><strong>GLBP (Gateway Load Balancing Protocol)</strong></p>\n<pre><code>Router(config-if)# glbp &lt;group-number&gt; ip &lt;virtual-ip&gt;\nRouter(config-if)# glbp &lt;group-number&gt; priority &lt;0-255&gt;\nRouter(config-if)# glbp &lt;group-number&gt; preempt\nRouter(config-if)# glbp &lt;group-number&gt; load-balancing &lt;method&gt;\n</code></pre>\n<p><strong>Verifikasi Umum</strong></p>\n<pre><code>Router# show standby brief\nRouter# show standby &lt;interface&gt;\nRouter# show vrrp brief\nRouter# show vrrp &lt;interface&gt;\nRouter# show glbp brief\nRouter# show glbp &lt;interface&gt;\nRouter# show running-config interface &lt;interface&gt;\n</code></pre>", "raw": "*Catatan: pada exam blueprint, topik ini bersifat konseptual (\"describe\"), bukan \"configure and verify\" seperti topik lainnya. Command berikut disertakan sebagai referensi praktis.*\n\n**HSRP (Hot Standby Router Protocol)**\n```\nRouter(config-if)# standby <group-number> ip <virtual-ip>\nRouter(config-if)# standby <group-number> priority <0-255>\nRouter(config-if)# standby <group-number> preempt\nRouter(config-if)# standby <group-number> timers <hello> <hold>\nRouter(config-if)# standby version 2\nRouter(config-if)# standby <group-number> track <interface> decrement <value>\n```\n\n**VRRP (Virtual Router Redundancy Protocol)**\n```\nRouter(config-if)# vrrp <group-number> ip <virtual-ip>\nRouter(config-if)# vrrp <group-number> priority <1-254>\nRouter(config-if)# vrrp <group-number> preempt\nRouter(config-if)# vrrp <group-number> timers advertise <seconds>\n```\n\n**GLBP (Gateway Load Balancing Protocol)**\n```\nRouter(config-if)# glbp <group-number> ip <virtual-ip>\nRouter(config-if)# glbp <group-number> priority <0-255>\nRouter(config-if)# glbp <group-number> preempt\nRouter(config-if)# glbp <group-number> load-balancing <method>\n```\n\n**Verifikasi Umum**\n```\nRouter# show standby brief\nRouter# show standby <interface>\nRouter# show vrrp brief\nRouter# show vrrp <interface>\nRouter# show glbp brief\nRouter# show glbp <interface>\nRouter# show running-config interface <interface>\n```"}]}, {"category": "4.0 IP SERVICES", "items": [{"id": "cmd-4-1", "label": "4.1 NAT", "title": "4.1 NAT", "html": "<p><strong>Konfigurasi Interface (Inside/Outside)</strong></p>\n<pre><code>Router(config)# interface &lt;interface&gt;\nRouter(config-if)# ip nat inside\n\nRouter(config)# interface &lt;interface&gt;\nRouter(config-if)# ip nat outside\n</code></pre>\n<p><strong>Static NAT</strong></p>\n<pre><code>Router(config)# ip nat inside source static &lt;inside-local-ip&gt; &lt;inside-global-ip&gt;\nRouter(config)# no ip nat inside source static &lt;inside-local-ip&gt; &lt;inside-global-ip&gt;\n</code></pre>\n<p><strong>Dynamic NAT (Pool)</strong></p>\n<pre><code>Router(config)# ip nat pool &lt;pool-name&gt; &lt;start-ip&gt; &lt;end-ip&gt; netmask &lt;subnet-mask&gt;\nRouter(config)# access-list &lt;acl-number&gt; permit &lt;source-network&gt; &lt;wildcard-mask&gt;\nRouter(config)# ip nat inside source list &lt;acl-number&gt; pool &lt;pool-name&gt;\n</code></pre>\n<p><strong>NAT Overload / PAT</strong></p>\n<pre><code>Router(config)# ip nat inside source list &lt;acl-number&gt; pool &lt;pool-name&gt; overload\nRouter(config)# ip nat inside source list &lt;acl-number&gt; interface &lt;interface&gt; overload\n</code></pre>\n<p><strong>Verifikasi Umum</strong></p>\n<pre><code>Router# show ip nat translations\nRouter# show ip nat statistics\nRouter# clear ip nat translation *\nRouter# clear ip nat statistics\nRouter# debug ip nat\nRouter# show run | include ip nat\nRouter# show run | section ip nat\n</code></pre>", "raw": "**Konfigurasi Interface (Inside/Outside)**\n```\nRouter(config)# interface <interface>\nRouter(config-if)# ip nat inside\n\nRouter(config)# interface <interface>\nRouter(config-if)# ip nat outside\n```\n\n**Static NAT**\n```\nRouter(config)# ip nat inside source static <inside-local-ip> <inside-global-ip>\nRouter(config)# no ip nat inside source static <inside-local-ip> <inside-global-ip>\n```\n\n**Dynamic NAT (Pool)**\n```\nRouter(config)# ip nat pool <pool-name> <start-ip> <end-ip> netmask <subnet-mask>\nRouter(config)# access-list <acl-number> permit <source-network> <wildcard-mask>\nRouter(config)# ip nat inside source list <acl-number> pool <pool-name>\n```\n\n**NAT Overload / PAT**\n```\nRouter(config)# ip nat inside source list <acl-number> pool <pool-name> overload\nRouter(config)# ip nat inside source list <acl-number> interface <interface> overload\n```\n\n**Verifikasi Umum**\n```\nRouter# show ip nat translations\nRouter# show ip nat statistics\nRouter# clear ip nat translation *\nRouter# clear ip nat statistics\nRouter# debug ip nat\nRouter# show run | include ip nat\nRouter# show run | section ip nat\n```"}, {"id": "cmd-4-2", "label": "4.2 NTP", "title": "4.2 NTP", "html": "<p><strong>NTP Server Mode</strong></p>\n<pre><code>Router(config)# ntp master &lt;stratum-number&gt;\n</code></pre>\n<p><strong>NTP Client Mode</strong></p>\n<pre><code>Router(config)# ntp server &lt;ip-address&gt;\nRouter(config)# ntp server &lt;ip-address&gt; prefer\nRouter(config)# ntp source &lt;interface&gt;\nRouter(config)# no ntp server &lt;ip-address&gt;\n</code></pre>\n<p><strong>NTP Authentication</strong></p>\n<pre><code>Router(config)# ntp authenticate\nRouter(config)# ntp authentication-key &lt;key-number&gt; md5 &lt;key-string&gt;\nRouter(config)# ntp trusted-key &lt;key-number&gt;\nRouter(config)# ntp server &lt;ip-address&gt; key &lt;key-number&gt;\nRouter(config)# no ntp authenticate\n</code></pre>\n<p><strong>Konfigurasi Terkait Waktu</strong></p>\n<pre><code>Router(config)# clock timezone &lt;zone&gt; &lt;hour-offset&gt; &lt;minute-offset&gt;\nRouter(config)# clock summer-time &lt;zone&gt; recurring\nRouter(config)# ntp update-calendar\nRouter# clock set &lt;hh:mm:ss&gt; &lt;day&gt; &lt;month&gt; &lt;year&gt;\n</code></pre>\n<p><strong>Verifikasi Umum</strong></p>\n<pre><code>Router# show ntp associations\nRouter# show ntp associations detail\nRouter# show ntp status\nRouter# show clock\nRouter# show clock detail\nRouter# debug ntp all\nRouter# show run | include ntp\nRouter# show run | section ntp\n</code></pre>", "raw": "**NTP Server Mode**\n```\nRouter(config)# ntp master <stratum-number>\n```\n\n**NTP Client Mode**\n```\nRouter(config)# ntp server <ip-address>\nRouter(config)# ntp server <ip-address> prefer\nRouter(config)# ntp source <interface>\nRouter(config)# no ntp server <ip-address>\n```\n\n**NTP Authentication**\n```\nRouter(config)# ntp authenticate\nRouter(config)# ntp authentication-key <key-number> md5 <key-string>\nRouter(config)# ntp trusted-key <key-number>\nRouter(config)# ntp server <ip-address> key <key-number>\nRouter(config)# no ntp authenticate\n```\n\n**Konfigurasi Terkait Waktu**\n```\nRouter(config)# clock timezone <zone> <hour-offset> <minute-offset>\nRouter(config)# clock summer-time <zone> recurring\nRouter(config)# ntp update-calendar\nRouter# clock set <hh:mm:ss> <day> <month> <year>\n```\n\n**Verifikasi Umum**\n```\nRouter# show ntp associations\nRouter# show ntp associations detail\nRouter# show ntp status\nRouter# show clock\nRouter# show clock detail\nRouter# debug ntp all\nRouter# show run | include ntp\nRouter# show run | section ntp\n```"}, {"id": "cmd-4-3", "label": "4.3 DHCP Server", "title": "4.3 DHCP Server", "html": "<p><strong>DHCP Server — Pool Configuration</strong></p>\n<pre><code>Router(config)# ip dhcp pool &lt;pool-name&gt;\nRouter(dhcp-config)# network &lt;network-address&gt; &lt;subnet-mask&gt;\nRouter(dhcp-config)# default-router &lt;ip-address&gt;\nRouter(dhcp-config)# dns-server &lt;ip-address&gt;\nRouter(dhcp-config)# domain-name &lt;domain-name&gt;\nRouter(dhcp-config)# lease &lt;days&gt; &lt;hours&gt; &lt;minutes&gt;\nRouter(dhcp-config)# lease infinite\n</code></pre>\n<p><strong>DHCP Server — Exclude Address</strong></p>\n<pre><code>Router(config)# ip dhcp excluded-address &lt;start-ip&gt; &lt;end-ip&gt;\n</code></pre>\n<p><strong>DHCP Server — Enable/Disable</strong></p>\n<pre><code>Router(config)# service dhcp\nRouter(config)# no service dhcp\n</code></pre>\n<p><strong>Verifikasi Umum</strong></p>\n<pre><code>Router# show ip dhcp binding\nRouter# show ip dhcp pool\nRouter# show ip dhcp conflict\nRouter# show ip dhcp server statistics\nRouter# debug ip dhcp server events\nRouter# show run | include ip helper-address\nRouter# show run | section dhcp\n</code></pre>", "raw": "**DHCP Server — Pool Configuration**\n```\nRouter(config)# ip dhcp pool <pool-name>\nRouter(dhcp-config)# network <network-address> <subnet-mask>\nRouter(dhcp-config)# default-router <ip-address>\nRouter(dhcp-config)# dns-server <ip-address>\nRouter(dhcp-config)# domain-name <domain-name>\nRouter(dhcp-config)# lease <days> <hours> <minutes>\nRouter(dhcp-config)# lease infinite\n```\n\n**DHCP Server — Exclude Address**\n```\nRouter(config)# ip dhcp excluded-address <start-ip> <end-ip>\n```\n\n**DHCP Server — Enable/Disable**\n```\nRouter(config)# service dhcp\nRouter(config)# no service dhcp\n```\n\n**Verifikasi Umum**\n```\nRouter# show ip dhcp binding\nRouter# show ip dhcp pool\nRouter# show ip dhcp conflict\nRouter# show ip dhcp server statistics\nRouter# debug ip dhcp server events\nRouter# show run | include ip helper-address\nRouter# show run | section dhcp\n```"}, {"id": "cmd-4-6", "label": "4.6 DHCP Client & Relay", "title": "4.6 DHCP Client & Relay", "html": "<p><strong>4.6 — DHCP Client</strong></p>\n<pre><code>Router(config-if)# ip address dhcp\nRouter(config-if)# ipv6 address dhcp\n</code></pre>\n<p><strong>4.6 — DHCP Relay</strong></p>\n<pre><code>Router(config-if)# ip helper-address &lt;dhcp-server-ip&gt;\nRouter(config)# ipv6 dhcp relay destination &lt;ipv6-address&gt;\n</code></pre>\n<p><strong>Verifikasi Umum</strong></p>\n<pre><code>Router# show ip dhcp binding\nRouter# show ip dhcp pool\nRouter# show ip dhcp conflict\nRouter# show ip dhcp server statistics\nRouter# debug ip dhcp server events\nRouter# show run | include ip helper-address\nRouter# show run | section dhcp\n</code></pre>", "raw": "**4.6 — DHCP Client**\n```\nRouter(config-if)# ip address dhcp\nRouter(config-if)# ipv6 address dhcp\n```\n\n**4.6 — DHCP Relay**\n```\nRouter(config-if)# ip helper-address <dhcp-server-ip>\nRouter(config)# ipv6 dhcp relay destination <ipv6-address>\n```\n\n**Verifikasi Umum**\n```\nRouter# show ip dhcp binding\nRouter# show ip dhcp pool\nRouter# show ip dhcp conflict\nRouter# show ip dhcp server statistics\nRouter# debug ip dhcp server events\nRouter# show run | include ip helper-address\nRouter# show run | section dhcp\n```"}, {"id": "cmd-4-8", "label": "4.8 SSH", "title": "4.8 SSH", "html": "<p><strong>Prasyarat</strong></p>\n<pre><code>Router(config)# hostname &lt;hostname&gt;\nRouter(config)# ip domain-name &lt;domain-name&gt;\nRouter(config)# username &lt;username&gt; privilege &lt;level&gt; secret &lt;password&gt;\nRouter(config)# crypto key generate rsa\nRouter(config)# crypto key generate rsa modulus &lt;bits&gt;\n</code></pre>\n<p><strong>Konfigurasi SSH</strong></p>\n<pre><code>Router(config)# ip ssh version 2\nRouter(config)# ip ssh time-out &lt;seconds&gt;\nRouter(config)# ip ssh authentication-retries &lt;number&gt;\n</code></pre>\n<p><strong>Konfigurasi VTY Lines</strong></p>\n<pre><code>Router(config)# line vty 0 15\nRouter(config-line)# transport input ssh\nRouter(config-line)# transport input ssh telnet\nRouter(config-line)# login local\nRouter(config-line)# exec-timeout &lt;minutes&gt; &lt;seconds&gt;\n</code></pre>\n<p><strong>Menghapus RSA Key</strong></p>\n<pre><code>Router(config)# crypto key zeroize rsa\n</code></pre>\n<p><strong>Verifikasi Umum</strong></p>\n<pre><code>Router# show ip ssh\nRouter# show ssh\nRouter# show crypto key mypubkey rsa\nRouter# show run | include ip ssh\nRouter# show run | section line vty\n</code></pre>", "raw": "**Prasyarat**\n```\nRouter(config)# hostname <hostname>\nRouter(config)# ip domain-name <domain-name>\nRouter(config)# username <username> privilege <level> secret <password>\nRouter(config)# crypto key generate rsa\nRouter(config)# crypto key generate rsa modulus <bits>\n```\n\n**Konfigurasi SSH**\n```\nRouter(config)# ip ssh version 2\nRouter(config)# ip ssh time-out <seconds>\nRouter(config)# ip ssh authentication-retries <number>\n```\n\n**Konfigurasi VTY Lines**\n```\nRouter(config)# line vty 0 15\nRouter(config-line)# transport input ssh\nRouter(config-line)# transport input ssh telnet\nRouter(config-line)# login local\nRouter(config-line)# exec-timeout <minutes> <seconds>\n```\n\n**Menghapus RSA Key**\n```\nRouter(config)# crypto key zeroize rsa\n```\n\n**Verifikasi Umum**\n```\nRouter# show ip ssh\nRouter# show ssh\nRouter# show crypto key mypubkey rsa\nRouter# show run | include ip ssh\nRouter# show run | section line vty\n```"}]}, {"category": "5.0 SECURITY FUNDAMENTALS", "items": [{"id": "cmd-5-3", "label": "5.3 Device Access Control", "title": "5.3 Device Access Control", "html": "<p><strong>Enable Password / Secret</strong></p>\n<pre><code>Router(config)# enable password &lt;password&gt;\nRouter(config)# enable secret &lt;password&gt;\nRouter(config)# no enable password\n</code></pre>\n<p><strong>Console Line</strong></p>\n<pre><code>Router(config)# line console 0\nRouter(config-line)# password &lt;password&gt;\nRouter(config-line)# login\nRouter(config-line)# exec-timeout &lt;minutes&gt; &lt;seconds&gt;\nRouter(config-line)# logging synchronous\n</code></pre>\n<p><strong>VTY Line</strong></p>\n<pre><code>Router(config)# line vty 0 15\nRouter(config-line)# password &lt;password&gt;\nRouter(config-line)# login\nRouter(config-line)# login local\nRouter(config-line)# exec-timeout &lt;minutes&gt; &lt;seconds&gt;\n</code></pre>\n<p><strong>AUX Line</strong></p>\n<pre><code>Router(config)# line aux 0\nRouter(config-line)# password &lt;password&gt;\nRouter(config-line)# login\nRouter(config-line)# no exec\n</code></pre>\n<p><strong>Local Username Database</strong></p>\n<pre><code>Router(config)# username &lt;username&gt; password &lt;password&gt;\nRouter(config)# username &lt;username&gt; secret &lt;password&gt;\nRouter(config)# username &lt;username&gt; privilege &lt;level&gt; secret &lt;password&gt;\n</code></pre>\n<p><strong>Password Encryption</strong></p>\n<pre><code>Router(config)# service password-encryption\nRouter(config)# no service password-encryption\n</code></pre>\n<p><strong>Privilege Level</strong></p>\n<pre><code>Router(config)# privilege exec level &lt;level&gt; &lt;command&gt;\nRouter(config)# enable secret level &lt;level&gt; &lt;password&gt;\nRouter# enable &lt;level&gt;\nRouter# disable\n</code></pre>\n<p><strong>Verifikasi Umum</strong></p>\n<pre><code>Router# show running-config\nRouter# show run | section line\nRouter# show run | include password\nRouter# show privilege\nRouter# show users\nRouter# show sessions\n</code></pre>", "raw": "**Enable Password / Secret**\n```\nRouter(config)# enable password <password>\nRouter(config)# enable secret <password>\nRouter(config)# no enable password\n```\n\n**Console Line**\n```\nRouter(config)# line console 0\nRouter(config-line)# password <password>\nRouter(config-line)# login\nRouter(config-line)# exec-timeout <minutes> <seconds>\nRouter(config-line)# logging synchronous\n```\n\n**VTY Line**\n```\nRouter(config)# line vty 0 15\nRouter(config-line)# password <password>\nRouter(config-line)# login\nRouter(config-line)# login local\nRouter(config-line)# exec-timeout <minutes> <seconds>\n```\n\n**AUX Line**\n```\nRouter(config)# line aux 0\nRouter(config-line)# password <password>\nRouter(config-line)# login\nRouter(config-line)# no exec\n```\n\n**Local Username Database**\n```\nRouter(config)# username <username> password <password>\nRouter(config)# username <username> secret <password>\nRouter(config)# username <username> privilege <level> secret <password>\n```\n\n**Password Encryption**\n```\nRouter(config)# service password-encryption\nRouter(config)# no service password-encryption\n```\n\n**Privilege Level**\n```\nRouter(config)# privilege exec level <level> <command>\nRouter(config)# enable secret level <level> <password>\nRouter# enable <level>\nRouter# disable\n```\n\n**Verifikasi Umum**\n```\nRouter# show running-config\nRouter# show run | section line\nRouter# show run | include password\nRouter# show privilege\nRouter# show users\nRouter# show sessions\n```"}, {"id": "cmd-5-6", "label": "5.6 Access Control List", "title": "5.6 Access Control List", "html": "<p><strong>Standard Numbered ACL</strong></p>\n<pre><code>Router(config)# access-list &lt;1-99&gt; permit &lt;source&gt; &lt;wildcard-mask&gt;\nRouter(config)# access-list &lt;1-99&gt; deny &lt;source&gt; &lt;wildcard-mask&gt;\nRouter(config)# access-list &lt;1-99&gt; permit host &lt;source-ip&gt;\nRouter(config)# access-list &lt;1-99&gt; permit any\nRouter(config)# no access-list &lt;1-99&gt;\n</code></pre>\n<p><strong>Extended Numbered ACL</strong></p>\n<pre><code>Router(config)# access-list &lt;100-199&gt; permit &lt;protocol&gt; &lt;source&gt; &lt;wildcard&gt; &lt;destination&gt; &lt;wildcard&gt;\nRouter(config)# access-list &lt;100-199&gt; deny &lt;protocol&gt; &lt;source&gt; &lt;wildcard&gt; &lt;destination&gt; &lt;wildcard&gt; eq &lt;port&gt;\nRouter(config)# access-list &lt;100-199&gt; permit tcp any any eq 80\nRouter(config)# no access-list &lt;100-199&gt;\n</code></pre>\n<p><strong>Standard Named ACL</strong></p>\n<pre><code>Router(config)# ip access-list standard &lt;name&gt;\nRouter(config-std-nacl)# permit &lt;source&gt; &lt;wildcard-mask&gt;\nRouter(config-std-nacl)# deny &lt;source&gt; &lt;wildcard-mask&gt;\nRouter(config-std-nacl)# &lt;sequence-number&gt; permit &lt;source&gt; &lt;wildcard-mask&gt;\nRouter(config-std-nacl)# no &lt;sequence-number&gt;\n</code></pre>\n<p><strong>Extended Named ACL</strong></p>\n<pre><code>Router(config)# ip access-list extended &lt;name&gt;\nRouter(config-ext-nacl)# permit &lt;protocol&gt; &lt;source&gt; &lt;wildcard&gt; &lt;destination&gt; &lt;wildcard&gt; eq &lt;port&gt;\nRouter(config-ext-nacl)# deny &lt;protocol&gt; &lt;source&gt; &lt;wildcard&gt; &lt;destination&gt; &lt;wildcard&gt;\nRouter(config-ext-nacl)# &lt;sequence-number&gt; permit &lt;protocol&gt; ...\nRouter(config-ext-nacl)# no &lt;sequence-number&gt;\n</code></pre>\n<p><strong>Menerapkan ACL ke Interface</strong></p>\n<pre><code>Router(config-if)# ip access-group &lt;number | name&gt; in\nRouter(config-if)# ip access-group &lt;number | name&gt; out\nRouter(config-if)# no ip access-group &lt;number | name&gt; in\n</code></pre>\n<p><strong>Menerapkan ACL ke VTY Line</strong></p>\n<pre><code>Router(config-line)# access-class &lt;number | name&gt; in\nRouter(config-line)# access-class &lt;number | name&gt; out\n</code></pre>\n<p><strong>IPv6 ACL</strong></p>\n<pre><code>Router(config)# ipv6 access-list &lt;name&gt;\nRouter(config-ipv6-acl)# permit &lt;protocol&gt; &lt;source&gt;/&lt;prefix-length&gt; &lt;destination&gt;/&lt;prefix-length&gt;\nRouter(config-ipv6-acl)# deny &lt;protocol&gt; &lt;source&gt;/&lt;prefix-length&gt; &lt;destination&gt;/&lt;prefix-length&gt; eq &lt;port&gt;\nRouter(config-if)# ipv6 traffic-filter &lt;name&gt; in\nRouter(config-if)# ipv6 traffic-filter &lt;name&gt; out\n</code></pre>\n<p><strong>Menghapus ACL</strong></p>\n<pre><code>Router(config)# no ip access-list standard &lt;name&gt;\nRouter(config)# no ip access-list extended &lt;name&gt;\n</code></pre>\n<p><strong>Verifikasi Umum</strong></p>\n<pre><code>Router# show access-lists\nRouter# show access-lists &lt;number | name&gt;\nRouter# show ip access-lists\nRouter# show ipv6 access-lists\nRouter# show ip interface &lt;interface&gt; | include access list\nRouter# show run | include access-list\nRouter# show run | section access-list\n</code></pre>", "raw": "**Standard Numbered ACL**\n```\nRouter(config)# access-list <1-99> permit <source> <wildcard-mask>\nRouter(config)# access-list <1-99> deny <source> <wildcard-mask>\nRouter(config)# access-list <1-99> permit host <source-ip>\nRouter(config)# access-list <1-99> permit any\nRouter(config)# no access-list <1-99>\n```\n\n**Extended Numbered ACL**\n```\nRouter(config)# access-list <100-199> permit <protocol> <source> <wildcard> <destination> <wildcard>\nRouter(config)# access-list <100-199> deny <protocol> <source> <wildcard> <destination> <wildcard> eq <port>\nRouter(config)# access-list <100-199> permit tcp any any eq 80\nRouter(config)# no access-list <100-199>\n```\n\n**Standard Named ACL**\n```\nRouter(config)# ip access-list standard <name>\nRouter(config-std-nacl)# permit <source> <wildcard-mask>\nRouter(config-std-nacl)# deny <source> <wildcard-mask>\nRouter(config-std-nacl)# <sequence-number> permit <source> <wildcard-mask>\nRouter(config-std-nacl)# no <sequence-number>\n```\n\n**Extended Named ACL**\n```\nRouter(config)# ip access-list extended <name>\nRouter(config-ext-nacl)# permit <protocol> <source> <wildcard> <destination> <wildcard> eq <port>\nRouter(config-ext-nacl)# deny <protocol> <source> <wildcard> <destination> <wildcard>\nRouter(config-ext-nacl)# <sequence-number> permit <protocol> ...\nRouter(config-ext-nacl)# no <sequence-number>\n```\n\n**Menerapkan ACL ke Interface**\n```\nRouter(config-if)# ip access-group <number | name> in\nRouter(config-if)# ip access-group <number | name> out\nRouter(config-if)# no ip access-group <number | name> in\n```\n\n**Menerapkan ACL ke VTY Line**\n```\nRouter(config-line)# access-class <number | name> in\nRouter(config-line)# access-class <number | name> out\n```\n\n**IPv6 ACL**\n```\nRouter(config)# ipv6 access-list <name>\nRouter(config-ipv6-acl)# permit <protocol> <source>/<prefix-length> <destination>/<prefix-length>\nRouter(config-ipv6-acl)# deny <protocol> <source>/<prefix-length> <destination>/<prefix-length> eq <port>\nRouter(config-if)# ipv6 traffic-filter <name> in\nRouter(config-if)# ipv6 traffic-filter <name> out\n```\n\n**Menghapus ACL**\n```\nRouter(config)# no ip access-list standard <name>\nRouter(config)# no ip access-list extended <name>\n```\n\n**Verifikasi Umum**\n```\nRouter# show access-lists\nRouter# show access-lists <number | name>\nRouter# show ip access-lists\nRouter# show ipv6 access-lists\nRouter# show ip interface <interface> | include access list\nRouter# show run | include access-list\nRouter# show run | section access-list\n```"}, {"id": "cmd-5-7", "label": "5.7 Layer 2 Security", "title": "5.7 Layer 2 Security", "html": "<p><strong>DHCP Snooping — Global</strong></p>\n<pre><code>Switch(config)# ip dhcp snooping\nSwitch(config)# ip dhcp snooping vlan &lt;vlan-id&gt;\nSwitch(config)# ip dhcp snooping vlan &lt;vlan-range&gt;\nSwitch(config)# no ip dhcp snooping information option\nSwitch(config)# ip dhcp snooping database &lt;url&gt;\n</code></pre>\n<p><strong>DHCP Snooping — Per Interface</strong></p>\n<pre><code>Switch(config-if)# ip dhcp snooping trust\nSwitch(config-if)# ip dhcp snooping limit rate &lt;rate&gt;\nSwitch(config-if)# no ip dhcp snooping trust\n</code></pre>\n<p><strong>Dynamic ARP Inspection (DAI) — Global</strong></p>\n<pre><code>Switch(config)# ip arp inspection vlan &lt;vlan-id&gt;\nSwitch(config)# ip arp inspection vlan &lt;vlan-range&gt;\nSwitch(config)# ip arp inspection validate src-mac dst-mac ip\n</code></pre>\n<p><strong>DHCP Relay: Trust Option 82</strong></p>\n<pre><code>Switch(config)# no ip dhcp snooping information option\n</code></pre>\n<p><strong>DHCP Snooping: Disable Option 82</strong></p>\n<pre><code>Router(config-if)# ip dhcp relay information trusted\n</code></pre>\n<p><strong>DAI — Per Interface</strong></p>\n<pre><code>Switch(config-if)# ip arp inspection trust\nSwitch(config-if)# ip arp inspection limit rate &lt;rate&gt;\nSwitch(config-if)# no ip arp inspection trust\n</code></pre>\n<p><strong>Port Security — Konfigurasi Dasar</strong></p>\n<pre><code>Switch(config-if)# switchport mode access\nSwitch(config-if)# switchport port-security\nSwitch(config-if)# switchport port-security maximum &lt;number&gt;\n</code></pre>\n<p><strong>Port Security — MAC Address</strong></p>\n<pre><code>Switch(config-if)# switchport port-security mac-address &lt;mac-address&gt;\nSwitch(config-if)# switchport port-security mac-address sticky\n</code></pre>\n<p><strong>Port Security — Violation Mode</strong></p>\n<pre><code>Switch(config-if)# switchport port-security violation protect\nSwitch(config-if)# switchport port-security violation restrict\nSwitch(config-if)# switchport port-security violation shutdown\n</code></pre>\n<p><strong>Port Security — Error-Disabled Recovery</strong></p>\n<pre><code>Switch(config)# errdisable recovery cause psecure-violation\nSwitch(config)# errdisable recovery interval &lt;seconds&gt;\nSwitch(config-if)# shutdown\nSwitch(config-if)# no shutdown\n</code></pre>\n<p><strong>Verifikasi Umum</strong></p>\n<pre><code>Switch# show ip dhcp snooping\nSwitch# show ip dhcp snooping binding\nSwitch# show ip dhcp snooping statistics\nSwitch# show ip arp inspection\nSwitch# show ip arp inspection interfaces\nSwitch# show ip arp inspection vlan &lt;vlan-id&gt;\nSwitch# show ip arp inspection statistics\nSwitch# show port-security\nSwitch# show port-security interface &lt;interface&gt;\nSwitch# show port-security address\nSwitch# show run | section dhcp snooping\nSwitch# show run | section arp inspection\nSwitch# show run | include port-security\n</code></pre>", "raw": "**DHCP Snooping — Global**\n```\nSwitch(config)# ip dhcp snooping\nSwitch(config)# ip dhcp snooping vlan <vlan-id>\nSwitch(config)# ip dhcp snooping vlan <vlan-range>\nSwitch(config)# no ip dhcp snooping information option\nSwitch(config)# ip dhcp snooping database <url>\n```\n\n**DHCP Snooping — Per Interface**\n```\nSwitch(config-if)# ip dhcp snooping trust\nSwitch(config-if)# ip dhcp snooping limit rate <rate>\nSwitch(config-if)# no ip dhcp snooping trust\n```\n\n**Dynamic ARP Inspection (DAI) — Global**\n```\nSwitch(config)# ip arp inspection vlan <vlan-id>\nSwitch(config)# ip arp inspection vlan <vlan-range>\nSwitch(config)# ip arp inspection validate src-mac dst-mac ip\n```\n\n**DHCP Relay: Trust Option 82**\n```\nSwitch(config)# no ip dhcp snooping information option\n```\n\n**DHCP Snooping: Disable Option 82**\n```\nRouter(config-if)# ip dhcp relay information trusted\n```\n\n**DAI — Per Interface**\n```\nSwitch(config-if)# ip arp inspection trust\nSwitch(config-if)# ip arp inspection limit rate <rate>\nSwitch(config-if)# no ip arp inspection trust\n```\n\n**Port Security — Konfigurasi Dasar**\n```\nSwitch(config-if)# switchport mode access\nSwitch(config-if)# switchport port-security\nSwitch(config-if)# switchport port-security maximum <number>\n```\n\n**Port Security — MAC Address**\n```\nSwitch(config-if)# switchport port-security mac-address <mac-address>\nSwitch(config-if)# switchport port-security mac-address sticky\n```\n\n**Port Security — Violation Mode**\n```\nSwitch(config-if)# switchport port-security violation protect\nSwitch(config-if)# switchport port-security violation restrict\nSwitch(config-if)# switchport port-security violation shutdown\n```\n\n**Port Security — Error-Disabled Recovery**\n```\nSwitch(config)# errdisable recovery cause psecure-violation\nSwitch(config)# errdisable recovery interval <seconds>\nSwitch(config-if)# shutdown\nSwitch(config-if)# no shutdown\n```\n\n**Verifikasi Umum**\n```\nSwitch# show ip dhcp snooping\nSwitch# show ip dhcp snooping binding\nSwitch# show ip dhcp snooping statistics\nSwitch# show ip arp inspection\nSwitch# show ip arp inspection interfaces\nSwitch# show ip arp inspection vlan <vlan-id>\nSwitch# show ip arp inspection statistics\nSwitch# show port-security\nSwitch# show port-security interface <interface>\nSwitch
