        summary: 'sum-1-1'
      },
      filterQuery: ''
    };

    const sidebarEl = document.getElementById('sidebar');
    const sidebarBackdropEl = document.getElementById('sidebarBackdrop');
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    const sidebarNavEl = document.getElementById('sidebarNav');
    const searchInputEl = document.getElementById('searchInput');
    const clearSearchBtnEl = document.getElementById('clearSearchBtn');
    const tabCommandEl = document.getElementById('tabCommand');
    const tabSummaryEl = document.getElementById('tabSummary');
    const topicTitleEl = document.getElementById('topicTitle');
    const topicBodyEl = document.getElementById('topicBody');
    const topicFooterNavEl = document.getElementById('topicFooterNav');
    const mainAreaEl = document.getElementById('mainArea');

    function getGroupsForMode(mode) {
      return APP_DATA[mode] || [];
    }

    function getFlatItems(mode) {
      const groups = getGroupsForMode(mode);
      const list = [];
      groups.forEach(g => {
        g.items.forEach(item => {
          list.push({ ...item, category: g.category });
        });
      });
      return list;
    }

    function findItemById(mode, id) {
      const list = getFlatItems(mode);
      return list.find(item => item.id === id) || list[0] || null;
    }

    function closeMobileMenu() {
      sidebarEl.classList.remove('open');
      sidebarBackdropEl.classList.remove('open');
    }

    function renderSidebar() {
      const groups = getGroupsForMode(state.mode);
      const activeId = state.selectedId[state.mode];
      const q = state.filterQuery.trim().toLowerCase();

      clearSearchBtnEl.style.display = q.length > 0 ? 'block' : 'none';
      sidebarNavEl.innerHTML = '';

      let totalMatched = 0;

      groups.forEach(group => {
        const matchedItems = group.items.filter(item => {
          if (!q) return true;
          const inLabel = item.label.toLowerCase().includes(q);
          const inTitle = item.title.toLowerCase().includes(q);
          const inCat = group.category.toLowerCase().includes(q);
          const inRaw = item.raw.toLowerCase().includes(q);
          return inLabel || inTitle || inCat || inRaw;
        });

        if (matchedItems.length === 0) return;
        totalMatched += matchedItems.length;

        const groupDiv = document.createElement('div');
        groupDiv.className = 'nav-group';

        const catHeader = document.createElement('div');
        catHeader.className = 'nav-category';
        catHeader.textContent = group.category;
        groupDiv.appendChild(catHeader);

        const ul = document.createElement('ul');
        ul.className = 'nav-list';

        matchedItems.forEach(item => {
          const li = document.createElement('li');
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'nav-item-btn' + (item.id === activeId ? ' active' : '');
          btn.textContent = item.label;
          btn.title = item.label;
          btn.addEventListener('click', () => {
            selectTopic(state.mode, item.id);
            closeMobileMenu();
          });
          li.appendChild(btn);
          ul.appendChild(li);
        });

        groupDiv.appendChild(ul);
        sidebarNavEl.appendChild(groupDiv);
      });

      if (totalMatched === 0) {
        const emptyDiv = document.createElement('div');
        emptyDiv.className = 'empty-filter-msg';
        emptyDiv.textContent = 'Tidak ada topik atau command yang cocok dengan "' + state.filterQuery + '".';
        sidebarNavEl.appendChild(emptyDiv);
      }
    }

    function enhanceRenderedContent() {
      // Wrap tables in responsive wrapper
      const tables = topicBodyEl.querySelectorAll('table');
      tables.forEach(table => {
        if (!table.parentElement.classList.contains('table-responsive')) {
          const wrapper = document.createElement('div');
          wrapper.className = 'table-responsive';
          table.parentNode.insertBefore(wrapper, table);
          wrapper.appendChild(table);
        }
      });

      // Add copy button to <pre> blocks
      const preBlocks = topicBodyEl.querySelectorAll('pre');
      preBlocks.forEach(pre => {
        if (pre.parentElement.classList.contains('code-block-wrapper')) return;
        const wrapper = document.createElement('div');
        wrapper.className = 'code-block-wrapper';
        pre.parentNode.insertBefore(wrapper, pre);
        wrapper.appendChild(pre);

        const copyBtn = document.createElement('button');
        copyBtn.type = 'button';
        copyBtn.className = 'copy-code-btn';
        copyBtn.textContent = 'Copy';
        copyBtn.addEventListener('click', () => {
          const codeText = pre.innerText;
          copyTextToClipboard(codeText, copyBtn);
        });
        wrapper.appendChild(copyBtn);
      });

      // Attach internal hash links inside Daftar Isi
      const links = topicBodyEl.querySelectorAll('a[href^="#"]');
      links.forEach(link => {
        link.addEventListener('click', (e) => {
          e.preventDefault();
          const targetId = link.getAttribute('href').slice(1);
          if (targetId.startsWith('cmd-')) {
            selectTopic('command', targetId);
          } else if (targetId.startsWith('sum-')) {
            selectTopic('summary', targetId);
          }
        });
      });
    }

    function copyTextToClipboard(text, btnEl) {
      const markCopied = () => {
        btnEl.textContent = 'Copied!';
        btnEl.classList.add('copied');
        setTimeout(() => {
          btnEl.textContent = 'Copy';
          btnEl.classList.remove('copied');
        }, 1600);
      };

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(markCopied).catch(() => {
          fallbackCopy(text, markCopied);
        });
      } else {
        fallbackCopy(text, markCopied);
      }
    }

    function fallbackCopy(text, callback) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        callback();
      } catch (err) {}
      document.body.removeChild(ta);
    }

    function renderMainContent() {
      const currentItem = findItemById(state.mode, state.selectedId[state.mode]);
      if (!currentItem) return;

      topicTitleEl.textContent = currentItem.title;
      topicBodyEl.innerHTML = currentItem.html;
      enhanceRenderedContent();

      // Render Prev / Next Footer
      const flatList = getFlatItems(state.mode);
      const idx = flatList.findIndex(i => i.id === currentItem.id);
      topicFooterNavEl.innerHTML = '';

      if (idx > 0) {
        const prevItem = flatList[idx - 1];
        const prevBtn = document.createElement('button');
        prevBtn.type = 'button';
        prevBtn.className = 'pager-btn prev';
        prevBtn.innerHTML = '<span class="pager-hint">&larr; Sebelumnya</span><span class="pager-label"></span>';
        prevBtn.querySelector('.pager-label').textContent = prevItem.label;
        prevBtn.addEventListener('click', () => selectTopic(state.mode, prevItem.id));
        topicFooterNavEl.appendChild(prevBtn);
      }

      if (idx !== -1 && idx < flatList.length - 1) {
        const nextItem = flatList[idx + 1];
        const nextBtn = document.createElement('button');
        nextBtn.type = 'button';
        nextBtn.className = 'pager-btn next';
        nextBtn.innerHTML = '<span class="pager-hint">Selanjutnya &rarr;</span><span class="pager-label"></span>';
        nextBtn.querySelector('.pager-label').textContent = nextItem.label;
        nextBtn.addEventListener('click', () => selectTopic(state.mode, nextItem.id));
        topicFooterNavEl.appendChild(nextBtn);
      }

      mainAreaEl.scrollTop = 0;
    }

    function updateModeTabs() {
      if (state.mode === 'command') {
        tabCommandEl.classList.add('active');
        tabCommandEl.setAttribute('aria-selected', 'true');
        tabSummaryEl.classList.remove('active');
        tabSummaryEl.setAttribute('aria-selected', 'false');
      } else {
        tabSummaryEl.classList.add('active');
        tabSummaryEl.setAttribute('aria-selected', 'true');
        tabCommandEl.classList.remove('active');
        tabCommandEl.setAttribute('aria-selected', 'false');
      }
    }

    function selectTopic(mode, itemId) {
      state.mode = mode;
      state.selectedId[mode] = itemId;
      updateModeTabs();
      renderSidebar();
      renderMainContent();
    }

    // Event Listeners
    tabCommandEl.addEventListener('click', () => {
      if (state.mode !== 'command') {
        state.mode = 'command';
        updateModeTabs();
        renderSidebar();
        renderMainContent();
      }
    });

    tabSummaryEl.addEventListener('click', () => {
      if (state.mode !== 'summary') {
        state.mode = 'summary';
        updateModeTabs();
        renderSidebar();
        renderMainContent();
      }
    });

    searchInputEl.addEventListener('input', (e) => {
      state.filterQuery = e.target.value;
      renderSidebar();
      // If active item is filtered out and there are matching items, keep main view or auto-select first match on Enter
    });

    searchInputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const firstBtn = sidebarNavEl.querySelector('.nav-item-btn');
        if (firstBtn) firstBtn.click();
      }
    });

    clearSearchBtnEl.addEventListener('click', () => {
      state.filterQuery = '';
      searchInputEl.value = '';
      renderSidebar();
      searchInputEl.focus();
    });

    mobileMenuBtn.addEventListener('click', () => {
      sidebarEl.classList.add('open');
      sidebarBackdropEl.classList.add('open');
    });

    sidebarBackdropEl.addEventListener('click', closeMobileMenu);

    // Initial render
    updateModeTabs();
    renderSidebar();
    renderMainContent();
  </script>
</body>
</html>
