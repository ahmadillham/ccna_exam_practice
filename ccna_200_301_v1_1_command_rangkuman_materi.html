# show port-security address\nSwitch# show run | section dhcp snooping\nSwitch# show run | section arp inspection\nSwitch# show run | include port-security\n```"}, {"id": "cmd-5-8", "label": "5.8 AAA — TACACS+/RADIUS", "title": "5.8 AAA (Authentication, Authorization, Accounting) — TACACS+/RADIUS", "html": "<p><em>Catatan: pada exam blueprint, 5.8 bersifat konseptual (\"compare\"), bukan \"configure and verify\". Command berikut disertakan karena berkaitan langsung dengan 2.8 (device management access via TACACS+/RADIUS) dan umum diuji dalam bentuk konfigurasi praktis/simulasi.</em></p>\n<p><strong>Perbandingan TACACS+ vs RADIUS</strong></p>\n<table>\n<thead>\n<tr>\n<th>Aspek</th>\n<th>TACACS+</th>\n<th>RADIUS</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Transport</td>\n<td>TCP port 49</td>\n<td>UDP port 1812 (auth) / 1813 (acct)</td>\n</tr>\n<tr>\n<td>Enkripsi</td>\n<td>Seluruh body paket</td>\n<td>Hanya field password</td>\n</tr>\n<tr>\n<td>Proses AAA</td>\n<td>Autentikasi &amp; otorisasi terpisah</td>\n<td>Autentikasi &amp; otorisasi digabung</td>\n</tr>\n<tr>\n<td>Command authorization</td>\n<td>Didukung (per privilege level)</td>\n<td>Tidak didukung</td>\n</tr>\n<tr>\n<td>Standar</td>\n<td>Cisco proprietary</td>\n<td>Open standard (IETF)</td>\n</tr>\n<tr>\n<td>Umum dipakai untuk</td>\n<td>Administrasi perangkat (device admin)</td>\n<td>Akses jaringan (802.1X, VPN)</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Mengaktifkan AAA</strong></p>\n<pre><code>Router(config)# aaa new-model\n</code></pre>\n<p><strong>Konfigurasi RADIUS Server</strong></p>\n<pre><code>Router(config)# radius server &lt;name&gt;\nRouter(config-radius-server)# address ipv4 &lt;ip-address&gt; auth-port &lt;port&gt; acct-port &lt;port&gt;\nRouter(config-radius-server)# key &lt;shared-key&gt;\n</code></pre>\n<p><em>Sintaks lama (single-line, masih umum dipakai di Packet Tracer):</em></p>\n<pre><code>Router(config)# radius-server host &lt;ip-address&gt; auth-port &lt;port&gt; acct-port &lt;port&gt; key &lt;shared-key&gt;\n</code></pre>\n<p><strong>Konfigurasi TACACS+ Server</strong></p>\n<pre><code>Router(config)# tacacs server &lt;name&gt;\nRouter(config-server-tacacs)# address ipv4 &lt;ip-address&gt;\nRouter(config-server-tacacs)# key &lt;shared-key&gt;\n</code></pre>\n<p><em>Sintaks lama (single-line):</em></p>\n<pre><code>Router(config)# tacacs-server host &lt;ip-address&gt; key &lt;shared-key&gt;\n</code></pre>\n<p><strong>AAA Server Group (mengelompokkan beberapa server)</strong></p>\n<pre><code>Router(config)# aaa group server radius &lt;group-name&gt;\nRouter(config-sg-radius)# server name &lt;name&gt;\n\nRouter(config)# aaa group server tacacs+ &lt;group-name&gt;\nRouter(config-sg-tacacs+)# server name &lt;name&gt;\n</code></pre>\n<p><strong>AAA Authentication (Login)</strong></p>\n<pre><code>Router(config)# aaa authentication login default group tacacs+ local\nRouter(config)# aaa authentication login default group radius local\nRouter(config)# aaa authentication login &lt;list-name&gt; group &lt;group-name&gt; local\n</code></pre>\n<p><em>Menerapkan named list ke line (jika bukan default):</em></p>\n<pre><code>Router(config-line)# login authentication &lt;list-name&gt;\n</code></pre>\n<p><strong>AAA Authorization</strong></p>\n<pre><code>Router(config)# aaa authorization exec default group tacacs+ local\nRouter(config)# aaa authorization commands &lt;privilege-level&gt; default group tacacs+ local\nRouter(config)# aaa authorization network default group radius local\n</code></pre>\n<p><strong>AAA Accounting</strong></p>\n<pre><code>Router(config)# aaa accounting exec default start-stop group tacacs+\nRouter(config)# aaa accounting commands &lt;privilege-level&gt; default start-stop group tacacs+\nRouter(config)# aaa accounting network default start-stop group radius\n</code></pre>\n<p><strong>Verifikasi Umum</strong></p>\n<pre><code>Router# show aaa servers\nRouter# show aaa method-lists all\nRouter# show tacacs\nRouter# show radius server-group all\nRouter# test aaa group &lt;group-name&gt; &lt;username&gt; &lt;password&gt; legacy\nRouter# debug aaa authentication\nRouter# debug tacacs\nRouter# debug radius\nRouter# show run | section aaa\nRouter# show run | include tacacs\nRouter# show run | include radius\n</code></pre>", "raw": "*Catatan: pada exam blueprint, 5.8 bersifat konseptual (\"compare\"), bukan \"configure and verify\". Command berikut disertakan karena berkaitan langsung dengan 2.8 (device management access via TACACS+/RADIUS) dan umum diuji dalam bentuk konfigurasi praktis/simulasi.*\n\n**Perbandingan TACACS+ vs RADIUS**\n\n| Aspek | TACACS+ | RADIUS |\n|---|---|---|\n| Transport | TCP port 49 | UDP port 1812 (auth) / 1813 (acct) |\n| Enkripsi | Seluruh body paket | Hanya field password |\n| Proses AAA | Autentikasi & otorisasi terpisah | Autentikasi & otorisasi digabung |\n| Command authorization | Didukung (per privilege level) | Tidak didukung |\n| Standar | Cisco proprietary | Open standard (IETF) |\n| Umum dipakai untuk | Administrasi perangkat (device admin) | Akses jaringan (802.1X, VPN) |\n\n**Mengaktifkan AAA**\n```\nRouter(config)# aaa new-model\n```\n\n**Konfigurasi RADIUS Server**\n```\nRouter(config)# radius server <name>\nRouter(config-radius-server)# address ipv4 <ip-address> auth-port <port> acct-port <port>\nRouter(config-radius-server)# key <shared-key>\n```\n\n*Sintaks lama (single-line, masih umum dipakai di Packet Tracer):*\n```\nRouter(config)# radius-server host <ip-address> auth-port <port> acct-port <port> key <shared-key>\n```\n\n**Konfigurasi TACACS+ Server**\n```\nRouter(config)# tacacs server <name>\nRouter(config-server-tacacs)# address ipv4 <ip-address>\nRouter(config-server-tacacs)# key <shared-key>\n```\n\n*Sintaks lama (single-line):*\n```\nRouter(config)# tacacs-server host <ip-address> key <shared-key>\n```\n\n**AAA Server Group (mengelompokkan beberapa server)**\n```\nRouter(config)# aaa group server radius <group-name>\nRouter(config-sg-radius)# server name <name>\n\nRouter(config)# aaa group server tacacs+ <group-name>\nRouter(config-sg-tacacs+)# server name <name>\n```\n\n**AAA Authentication (Login)**\n```\nRouter(config)# aaa authentication login default group tacacs+ local\nRouter(config)# aaa authentication login default group radius local\nRouter(config)# aaa authentication login <list-name> group <group-name> local\n```\n\n*Menerapkan named list ke line (jika bukan default):*\n```\nRouter(config-line)# login authentication <list-name>\n```\n\n**AAA Authorization**\n```\nRouter(config)# aaa authorization exec default group tacacs+ local\nRouter(config)# aaa authorization commands <privilege-level> default group tacacs+ local\nRouter(config)# aaa authorization network default group radius local\n```\n\n**AAA Accounting**\n```\nRouter(config)# aaa accounting exec default start-stop group tacacs+\nRouter(config)# aaa accounting commands <privilege-level> default start-stop group tacacs+\nRouter(config)# aaa accounting network default start-stop group radius\n```\n\n**Verifikasi Umum**\n```\nRouter# show aaa servers\nRouter# show aaa method-lists all\nRouter# show tacacs\nRouter# show radius server-group all\nRouter# test aaa group <group-name> <username> <password> legacy\nRouter# debug aaa authentication\nRouter# debug tacacs\nRouter# debug radius\nRouter# show run | section aaa\nRouter# show run | include tacacs\nRouter# show run | include radius\n```"}]}], "summary": [{"category": "RINGKASAN", "items": [{"id": "sum-toc", "label": "Daftar Isi", "title": "Rangkuman Materi CCNA 200-301 v1.1", "html": "<blockquote>\n<p>Ringkasan materi lengkap berdasarkan kurikulum CCNA Exam v1.1 (200-301).</p>\n</blockquote>\n<p><strong>1.0 Network Fundamentals (20%)</strong></p>\n<ul>\n<li><a href=\"#sum-1-1\">1.1 Peran dan fungsi komponen jaringan</a></li>\n<li><a href=\"#sum-1-2\">1.2 Arsitektur topologi jaringan</a></li>\n<li><a href=\"#sum-1-3\">1.3 Tipe interface dan kabel fisik</a></li>\n<li><a href=\"#sum-1-4\">1.4 Masalah interface dan kabel</a></li>\n<li><a href=\"#sum-1-5\">1.5 TCP vs UDP</a></li>\n<li><a href=\"#sum-1-6\">1.6 Konfigurasi dan verifikasi IPv4 addressing dan subnetting</a></li>\n<li><a href=\"#sum-1-7\">1.7 Private IPv4 addressing</a></li>\n<li><a href=\"#sum-1-8\">1.8 Konfigurasi dan verifikasi IPv6 addressing dan prefix</a></li>\n<li><a href=\"#sum-1-9\">1.9 Tipe alamat IPv6</a></li>\n<li><a href=\"#sum-1-10\">1.10 Verifikasi parameter IP pada Client OS</a></li>\n<li><a href=\"#sum-1-11\">1.11 Prinsip wireless</a></li>\n<li><a href=\"#sum-1-12\">1.12 Dasar virtualisasi</a></li>\n<li><a href=\"#sum-1-13\">1.13 Konsep switching</a></li>\n<li><a href=\"#sum-1-checklist\">Checklist Review 1.0</a></li>\n</ul>\n<p><strong>2.0 Network Access (20%)</strong></p>\n<ul>\n<li><a href=\"#sum-2-1\">2.1 VLAN (normal range) yang melintasi beberapa switch</a></li>\n<li><a href=\"#sum-2-2\">2.2 Konektivitas interswitch</a></li>\n<li><a href=\"#sum-2-3\">2.3 Layer 2 discovery protocols (CDP dan LLDP)</a></li>\n<li><a href=\"#sum-2-4\">2.4 EtherChannel (Layer 2/Layer 3) dengan LACP</a></li>\n<li><a href=\"#sum-2-5\">2.5 Operasi dasar Rapid PVST+ Spanning Tree Protocol</a></li>\n<li><a href=\"#sum-2-6\">2.6 Arsitektur Cisco Wireless dan AP modes</a></li>\n<li><a href=\"#sum-2-7\">2.7 Koneksi infrastruktur fisik komponen WLAN</a></li>\n<li><a href=\"#sum-2-8\">2.8 Akses manajemen perangkat jaringan</a></li>\n<li><a href=\"#sum-2-9\">2.9 Interpretasi konfigurasi GUI wireless LAN</a></li>\n<li><a href=\"#sum-2-checklist\">Checklist Review 2.0</a></li>\n</ul>\n<p><strong>3.0 IP Connectivity (25%)</strong></p>\n<ul>\n<li><a href=\"#sum-3-1\">3.1 Komponen routing table</a></li>\n<li><a href=\"#sum-3-2\">3.2 Keputusan forwarding router secara default</a></li>\n<li><a href=\"#sum-3-3\">3.3 Static routing IPv4 dan IPv6</a></li>\n<li><a href=\"#sum-3-4\">3.4 Single area OSPFv2</a></li>\n<li><a href=\"#sum-3-5\">3.5 First hop redundancy protocols (FHRP)</a></li>\n<li><a href=\"#sum-3-checklist\">Checklist Review 3.0</a></li>\n</ul>\n<p><strong>4.0 IP Services (10%)</strong></p>\n<ul>\n<li><a href=\"#sum-4-1\">4.1 Inside source NAT (static dan pool)</a></li>\n<li><a href=\"#sum-4-2\">4.2 NTP (client dan server mode)</a></li>\n<li><a href=\"#sum-4-3\">4.3 Peran DHCP dan DNS dalam jaringan</a></li>\n<li><a href=\"#sum-4-4\">4.4 Fungsi SNMP dalam operasional jaringan</a></li>\n<li><a href=\"#sum-4-5\">4.5 Syslog: facilities dan severity levels</a></li>\n<li><a href=\"#sum-4-6\">4.6 DHCP client dan relay</a></li>\n<li><a href=\"#sum-4-7\">4.7 Forwarding per-hop behavior (PHB) untuk QoS</a></li>\n<li><a href=\"#sum-4-8\">4.8 Remote access menggunakan SSH</a></li>\n<li><a href=\"#sum-4-9\">4.9 Kemampuan dan fungsi TFTP/FTP</a></li>\n<li><a href=\"#sum-4-checklist\">Checklist Review 4.0</a></li>\n</ul>\n<p><strong>5.0 Security Fundamentals (15%)</strong></p>\n<ul>\n<li><a href=\"#sum-5-1\">5.1 Konsep keamanan utama</a></li>\n<li><a href=\"#sum-5-2\">5.2 Elemen program keamanan</a></li>\n<li><a href=\"#sum-5-3\">5.3 Device access control dengan local passwords</a></li>\n<li><a href=\"#sum-5-4\">5.4 Elemen kebijakan password</a></li>\n<li><a href=\"#sum-5-5\">5.5 IPsec remote access dan site-to-site VPN</a></li>\n<li><a href=\"#sum-5-6\">5.6 Access Control List (ACL)</a></li>\n<li><a href=\"#sum-5-7\">5.7 Fitur keamanan Layer 2</a></li>\n<li><a href=\"#sum-5-8\">5.8 Authentication, Authorization, Accounting (AAA)</a></li>\n<li><a href=\"#sum-5-9\">5.9 Protokol keamanan wireless</a></li>\n<li><a href=\"#sum-5-10\">5.10 Konfigurasi WLAN di GUI dengan WPA2 PSK</a></li>\n<li><a href=\"#sum-5-checklist\">Checklist Review 5.0</a></li>\n</ul>\n<p><strong>6.0 Automation and Programmability (10%)</strong></p>\n<ul>\n<li><a href=\"#sum-6-1\">6.1 Dampak otomasi terhadap manajemen jaringan</a></li>\n<li><a href=\"#sum-6-2\">6.2 Traditional networks vs controller-based networking</a></li>\n<li><a href=\"#sum-6-3\">6.3 Arsitektur controller-based (software defined)</a></li>\n<li><a href=\"#sum-6-4\">6.4 AI (generative dan predictive) dan machine learning dalam operasional jaringan</a></li>\n<li><a href=\"#sum-6-5\">6.5 Karakteristik REST-based API</a></li>\n<li><a href=\"#sum-6-6\">6.6 Configuration management: Ansible dan Terraform</a></li>\n<li><a href=\"#sum-6-7\">6.7 Komponen data JSON</a></li>\n<li><a href=\"#sum-6-checklist\">Checklist Review 6.0</a></li>\n</ul>", "raw": "> Ringkasan materi lengkap berdasarkan kurikulum CCNA Exam v1.1 (200-301).\n\n**1.0 Network Fundamentals (20%)**\n\n- [1.1 Peran dan fungsi komponen jaringan](#sum-1-1)\n- [1.2 Arsitektur topologi jaringan](#sum-1-2)\n- [1.3 Tipe interface dan kabel fisik](#sum-1-3)\n- [1.4 Masalah interface dan kabel](#sum-1-4)\n- [1.5 TCP vs UDP](#sum-1-5)\n- [1.6 Konfigurasi dan verifikasi IPv4 addressing dan subnetting](#sum-1-6)\n- [1.7 Private IPv4 addressing](#sum-1-7)\n- [1.8 Konfigurasi dan verifikasi IPv6 addressing dan prefix](#sum-1-8)\n- [1.9 Tipe alamat IPv6](#sum-1-9)\n- [1.10 Verifikasi parameter IP pada Client OS](#sum-1-10)\n- [1.11 Prinsip wireless](#sum-1-11)\n- [1.12 Dasar virtualisasi](#sum-1-12)\n- [1.13 Konsep switching](#sum-1-13)\n- [Checklist Review 1.0](#sum-1-checklist)\n\n**2.0 Network Access (20%)**\n\n- [2.1 VLAN (normal range) yang melintasi beberapa switch](#sum-2-1)\n- [2.2 Konektivitas interswitch](#sum-2-2)\n- [2.3 Layer 2 discovery protocols (CDP dan LLDP)](#sum-2-3)\n- [2.4 EtherChannel (Layer 2/Layer 3) dengan LACP](#sum-2-4)\n- [2.5 Operasi dasar Rapid PVST+ Spanning Tree Protocol](#sum-2-5)\n- [2.6 Arsitektur Cisco Wireless dan AP modes](#sum-2-6)\n- [2.7 Koneksi infrastruktur fisik komponen WLAN](#sum-2-7)\n- [2.8 Akses manajemen perangkat jaringan](#sum-2-8)\n- [2.9 Interpretasi konfigurasi GUI wireless LAN](#sum-2-9)\n- [Checklist Review 2.0](#sum-2-checklist)\n\n**3.0 IP Connectivity (25%)**\n\n- [3.1 Komponen routing table](#sum-3-1)\n- [3.2 Keputusan forwarding router secara default](#sum-3-2)\n- [3.3 Static routing IPv4 dan IPv6](#sum-3-3)\n- [3.4 Single area OSPFv2](#sum-3-4)\n- [3.5 First hop redundancy protocols (FHRP)](#sum-3-5)\n- [Checklist Review 3.0](#sum-3-checklist)\n\n**4.0 IP Services (10%)**\n\n- [4.1 Inside source NAT (static dan pool)](#sum-4-1)\n- [4.2 NTP (client dan server mode)](#sum-4-2)\n- [4.3 Peran DHCP dan DNS dalam jaringan](#sum-4-3)\n- [4.4 Fungsi SNMP dalam operasional jaringan](#sum-4-4)\n- [4.5 Syslog: facilities dan severity levels](#sum-4-5)\n- [4.6 DHCP client dan relay](#sum-4-6)\n- [4.7 Forwarding per-hop behavior (PHB) untuk QoS](#sum-4-7)\n- [4.8 Remote access menggunakan SSH](#sum-4-8)\n- [4.9 Kemampuan dan fungsi TFTP/FTP](#sum-4-9)\n- [Checklist Review 4.0](#sum-4-checklist)\n\n**5.0 Security Fundamentals (15%)**\n\n- [5.1 Konsep keamanan utama](#sum-5-1)\n- [5.2 Elemen program keamanan](#sum-5-2)\n- [5.3 Device access control dengan local passwords](#sum-5-3)\n- [5.4 Elemen kebijakan password](#sum-5-4)\n- [5.5 IPsec remote access dan site-to-site VPN](#sum-5-5)\n- [5.6 Access Control List (ACL)](#sum-5-6)\n- [5.7 Fitur keamanan Layer 2](#sum-5-7)\n- [5.8 Authentication, Authorization, Accounting (AAA)](#sum-5-8)\n- [5.9 Protokol keamanan wireless](#sum-5-9)\n- [5.10 Konfigurasi WLAN di GUI dengan WPA2 PSK](#sum-5-10)\n- [Checklist Review 5.0](#sum-5-checklist)\n\n**6.0 Automation and Programmability (10%)**\n\n- [6.1 Dampak otomasi terhadap manajemen jaringan](#sum-6-1)\n- [6.2 Traditional networks vs controller-based networking](#sum-6-2)\n- [6.3 Arsitektur controller-based (software defined)](#sum-6-3)\n- [6.4 AI (generative dan predictive) dan machine learning dalam operasional jaringan](#sum-6-4)\n- [6.5 Karakteristik REST-based API](#sum-6-5)\n- [6.6 Configuration management: Ansible dan Terraform](#sum-6-6)\n- [6.7 Komponen data JSON](#sum-6-7)\n- [Checklist Review 6.0](#sum-6-checklist)\n"}]}, {"category": "1.0 NETWORK FUNDAMENTALS", "items": [{"id": "sum-1-1", "label": "1.1 Peran dan fungsi komponen jaringan", "title": "1.1 Peran dan fungsi komponen jaringan", "html": "<h3>1.1.a Routers</h3>\n<ul>\n<li>Perangkat <strong>Layer 3</strong> yang menghubungkan <strong>jaringan yang berbeda</strong> (antar subnet/network) dan meneruskan paket berdasarkan <strong>alamat IP tujuan</strong>.</li>\n<li>Memelihara <strong>routing table</strong> dan memilih jalur terbaik menuju tujuan.</li>\n<li>Setiap interface router berada pada <strong>broadcast domain</strong> yang terpisah (router <strong>memisahkan broadcast domain</strong>).</li>\n<li>Menghubungkan LAN ke WAN/Internet.</li>\n</ul>\n<h3>1.1.b Layer 2 dan Layer 3 Switches</h3>\n<table>\n<thead>\n<tr>\n<th>Aspek</th>\n<th>Layer 2 Switch</th>\n<th>Layer 3 Switch</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Dasar forwarding</td>\n<td><strong>MAC address</strong> (frame)</td>\n<td>MAC address <strong>dan</strong> IP address (paket)</td>\n</tr>\n<tr>\n<td>Fungsi routing</td>\n<td>Tidak</td>\n<td>Ya (routing antar VLAN/subnet)</td>\n</tr>\n<tr>\n<td>Broadcast domain</td>\n<td>Satu per VLAN</td>\n<td>Satu per VLAN; dapat merutekan antar VLAN</td>\n</tr>\n<tr>\n<td>Collision domain</td>\n<td>Satu per port</td>\n<td>Satu per port</td>\n</tr>\n<tr>\n<td>Interface</td>\n<td>Switchport</td>\n<td>Switchport, <strong>SVI</strong>, dan <strong>routed port</strong></td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li>Switch memisahkan <strong>collision domain</strong> per port; hanya VLAN yang memisahkan <strong>broadcast domain</strong>.</li>\n</ul>\n<h3>1.1.c Next-Generation Firewalls (NGFW) dan IPS</h3>\n<p><strong>Next-Generation Firewall (NGFW)</strong></p>\n<ul>\n<li>Firewall <em>stateful</em> + kemampuan tambahan: <strong>application visibility and control (AVC)</strong>, <strong>URL filtering</strong>, <strong>advanced malware protection</strong>, inspeksi traffic terenkripsi (SSL/TLS), dan integrasi threat intelligence.</li>\n<li>Mengambil keputusan berdasarkan <strong>aplikasi, user, dan konten</strong>, bukan hanya IP/port.</li>\n</ul>\n<p><strong>Intrusion Prevention System (IPS)</strong></p>\n<ul>\n<li>Menganalisis traffic secara <strong>real time</strong>, terpasang <strong>inline</strong> pada jalur traffic.</li>\n<li>Dapat <strong>mendeteksi dan memblokir</strong> ancaman (drop paket, reset koneksi, blokir sumber), berbeda dengan IDS yang hanya mendeteksi/memberi alert.</li>\n</ul>\n<h3>1.1.d Access Points (AP)</h3>\n<ul>\n<li>Perangkat yang menghubungkan <strong>client wireless</strong> (Wi-Fi) ke <strong>jaringan kabel</strong>.</li>\n<li>Mengubah frame 802.11 (wireless) menjadi frame 802.3 (Ethernet) dan sebaliknya.</li>\n<li>Terhubung ke switch melalui kabel Ethernet (umumnya mendapat daya via <strong>PoE</strong>).</li>\n</ul>\n<h3>1.1.e Controllers</h3>\n<ul>\n<li><strong>Wireless LAN Controller (WLC):</strong> mengelola banyak AP secara terpusat (konfigurasi, manajemen RF, keamanan, roaming).</li>\n<li><strong>Network controller</strong> (mis. <strong>Cisco Catalyst Center</strong>, sebelumnya DNA Center): platform manajemen terpusat untuk otomasi dan monitoring jaringan berbasis kebijakan.</li>\n<li>Manfaat: manajemen terpusat, konsistensi konfigurasi, otomasi, visibilitas.</li>\n</ul>\n<h3>1.1.f Endpoints</h3>\n<ul>\n<li>Perangkat ujung yang menjadi <strong>sumber atau tujuan</strong> data: PC, laptop, smartphone, tablet, IP phone, printer, kamera IP, perangkat IoT.</li>\n<li>Terhubung ke jaringan melalui kabel (access port) atau wireless (AP).</li>\n</ul>\n<h3>1.1.g Servers</h3>\n<ul>\n<li>Perangkat yang <strong>menyediakan layanan</strong> kepada client dalam jaringan.</li>\n<li>Contoh: web server, file server, DNS server, DHCP server, mail server, database server, application server, authentication server.</li>\n<li>Dapat berupa <strong>server fisik</strong> atau <strong>virtual</strong> (lihat 1.12).</li>\n</ul>\n<h3>1.1.h PoE (Power over Ethernet)</h3>\n<ul>\n<li>Menyalurkan <strong>daya listrik melalui kabel Ethernet (twisted pair)</strong> bersamaan dengan data.</li>\n<li><strong>PSE</strong> (<em>Power Sourcing Equipment</em>): pemberi daya (mis. switch PoE).</li>\n<li><strong>PD</strong> (<em>Powered Device</em>): penerima daya (mis. AP, IP phone, kamera IP).</li>\n</ul>\n<table>\n<thead>\n<tr>\n<th>Standar</th>\n<th>Nama</th>\n<th>Daya maks. dari PSE</th>\n<th>Daya maks. ke PD</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>802.3af</td>\n<td>PoE (Type 1)</td>\n<td>15.4 W</td>\n<td>12.95 W</td>\n</tr>\n<tr>\n<td>802.3at</td>\n<td>PoE+ (Type 2)</td>\n<td>30 W</td>\n<td>25.5 W</td>\n</tr>\n<tr>\n<td>802.3bt</td>\n<td>PoE++ (Type 3)</td>\n<td>60 W</td>\n<td>51 W</td>\n</tr>\n<tr>\n<td>802.3bt</td>\n<td>PoE++ (Type 4)</td>\n<td>100 W</td>\n<td>71.3 W</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li>Cisco proprietary: <strong>UPOE</strong> (60 W) dan <strong>UPOE+</strong> (90 W).</li>\n<li>Switch mendeteksi apakah perangkat ujung adalah PD sebelum mengirim daya.</li>\n</ul>", "raw": "### 1.1.a Routers\n\n- Perangkat **Layer 3** yang menghubungkan **jaringan yang berbeda** (antar subnet/network) dan meneruskan paket berdasarkan **alamat IP tujuan**.\n- Memelihara **routing table** dan memilih jalur terbaik menuju tujuan.\n- Setiap interface router berada pada **broadcast domain** yang terpisah (router **memisahkan broadcast domain**).\n- Menghubungkan LAN ke WAN/Internet.\n\n### 1.1.b Layer 2 dan Layer 3 Switches\n\n| Aspek | Layer 2 Switch | Layer 3 Switch |\n|---|---|---|\n| Dasar forwarding | **MAC address** (frame) | MAC address **dan** IP address (paket) |\n| Fungsi routing | Tidak | Ya (routing antar VLAN/subnet) |\n| Broadcast domain | Satu per VLAN | Satu per VLAN; dapat merutekan antar VLAN |\n| Collision domain | Satu per port | Satu per port |\n| Interface | Switchport | Switchport, **SVI**, dan **routed port** |\n\n- Switch memisahkan **collision domain** per port; hanya VLAN yang memisahkan **broadcast domain**.\n\n### 1.1.c Next-Generation Firewalls (NGFW) dan IPS\n\n**Next-Generation Firewall (NGFW)**\n\n- Firewall *stateful* + kemampuan tambahan: **application visibility and control (AVC)**, **URL filtering**, **advanced malware protection**, inspeksi traffic terenkripsi (SSL/TLS), dan integrasi threat intelligence.\n- Mengambil keputusan berdasarkan **aplikasi, user, dan konten**, bukan hanya IP/port.\n\n**Intrusion Prevention System (IPS)**\n\n- Menganalisis traffic secara **real time**, terpasang **inline** pada jalur traffic.\n- Dapat **mendeteksi dan memblokir** ancaman (drop paket, reset koneksi, blokir sumber), berbeda dengan IDS yang hanya mendeteksi/memberi alert.\n\n### 1.1.d Access Points (AP)\n\n- Perangkat yang menghubungkan **client wireless** (Wi-Fi) ke **jaringan kabel**.\n- Mengubah frame 802.11 (wireless) menjadi frame 802.3 (Ethernet) dan sebaliknya.\n- Terhubung ke switch melalui kabel Ethernet (umumnya mendapat daya via **PoE**).\n\n### 1.1.e Controllers\n\n- **Wireless LAN Controller (WLC):** mengelola banyak AP secara terpusat (konfigurasi, manajemen RF, keamanan, roaming).\n- **Network controller** (mis. **Cisco Catalyst Center**, sebelumnya DNA Center): platform manajemen terpusat untuk otomasi dan monitoring jaringan berbasis kebijakan.\n- Manfaat: manajemen terpusat, konsistensi konfigurasi, otomasi, visibilitas.\n\n### 1.1.f Endpoints\n\n- Perangkat ujung yang menjadi **sumber atau tujuan** data: PC, laptop, smartphone, tablet, IP phone, printer, kamera IP, perangkat IoT.\n- Terhubung ke jaringan melalui kabel (access port) atau wireless (AP).\n\n### 1.1.g Servers\n\n- Perangkat yang **menyediakan layanan** kepada client dalam jaringan.\n- Contoh: web server, file server, DNS server, DHCP server, mail server, database server, application server, authentication server.\n- Dapat berupa **server fisik** atau **virtual** (lihat 1.12).\n\n### 1.1.h PoE (Power over Ethernet)\n\n- Menyalurkan **daya listrik melalui kabel Ethernet (twisted pair)** bersamaan dengan data.\n- **PSE** (*Power Sourcing Equipment*): pemberi daya (mis. switch PoE).\n- **PD** (*Powered Device*): penerima daya (mis. AP, IP phone, kamera IP).\n\n| Standar | Nama | Daya maks. dari PSE | Daya maks. ke PD |\n|---|---|---|---|\n| 802.3af | PoE (Type 1) | 15.4 W | 12.95 W |\n| 802.3at | PoE+ (Type 2) | 30 W | 25.5 W |\n| 802.3bt | PoE++ (Type 3) | 60 W | 51 W |\n| 802.3bt | PoE++ (Type 4) | 100 W | 71.3 W |\n\n- Cisco proprietary: **UPOE** (60 W) dan **UPOE+** (90 W).\n- Switch mendeteksi apakah perangkat ujung adalah PD sebelum mengirim daya."}, {"id": "sum-1-2", "label": "1.2 Arsitektur topologi jaringan", "title": "1.2 Arsitektur topologi jaringan", "html": "<h3>1.2.a Two-Tier (Collapsed Core)</h3>\n<ul>\n<li>Dua lapisan: <strong>Access</strong> dan <strong>Distribution/Core (collapsed)</strong>.</li>\n<li>Fungsi distribution dan core <strong>digabung</strong> dalam satu lapisan.</li>\n<li>Cocok untuk <strong>kampus/gedung kecil-menengah</strong>; biaya lebih rendah, desain lebih sederhana, skalabilitas terbatas.</li>\n</ul>\n<pre><code>        [ Collapsed Core / Distribution ]\n            /         |          \\\n      [Access]    [Access]     [Access]\n</code></pre>\n<h3>1.2.b Three-Tier</h3>\n<table>\n<thead>\n<tr>\n<th>Layer</th>\n<th>Fungsi</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Access</strong></td>\n<td>Menghubungkan endpoint (PC, AP, phone); PoE, VLAN, port security</td>\n</tr>\n<tr>\n<td><strong>Distribution</strong></td>\n<td>Agregasi access switch; batas Layer 2/Layer 3; inter-VLAN routing, kebijakan (ACL, QoS), redundansi</td>\n</tr>\n<tr>\n<td><strong>Core</strong></td>\n<td>Backbone berkecepatan tinggi; <strong>forwarding cepat</strong>, high availability; tanpa kebijakan yang memperlambat</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li>Cocok untuk <strong>jaringan kampus besar</strong> yang membutuhkan skalabilitas dan ketersediaan tinggi.</li>\n</ul>\n<h3>1.2.c Spine-Leaf</h3>\n<ul>\n<li>Umum pada <strong>data center</strong>.</li>\n<li><strong>Leaf</strong>: switch tempat server/endpoint terhubung. <strong>Spine</strong>: backbone yang menghubungkan semua leaf.</li>\n<li>Setiap leaf terhubung ke <strong>setiap</strong> spine; <strong>leaf tidak terhubung ke leaf</strong>, <strong>spine tidak terhubung ke spine</strong>.</li>\n<li>Karakteristik: <strong>latensi dapat diprediksi</strong> (jumlah hop konsisten), optimal untuk traffic <strong>east-west</strong> (server ke server), mudah diskalakan dengan menambah leaf/spine.</li>\n</ul>\n<pre><code>   [Spine1]     [Spine2]\n    /  |  \\      /  |  \\\n [Leaf1][Leaf2][Leaf3][Leaf4]   (setiap leaf ke setiap spine)\n</code></pre>\n<h3>1.2.d WAN (Wide Area Network)</h3>\n<ul>\n<li>Menghubungkan LAN yang <strong>terpisah secara geografis</strong> (kantor cabang, kantor pusat, data center).</li>\n<li>Umumnya disediakan oleh <strong>service provider (ISP)</strong>.</li>\n<li>Contoh konektivitas: <strong>leased line</strong>, <strong>MPLS</strong>, <strong>Metro Ethernet</strong>, dan <strong>koneksi Internet + VPN</strong> (broadband/DSL/kabel/seluler).</li>\n</ul>\n<h3>1.2.e Small Office/Home Office (SOHO)</h3>\n<ul>\n<li>Jaringan skala kecil (beberapa perangkat).</li>\n<li>Biasanya memakai <strong>satu perangkat all-in-one</strong> (router + switch + AP + firewall dasar) yang terhubung ke ISP.</li>\n<li>Sederhana, murah, manajemen minimal.</li>\n</ul>\n<h3>1.2.f On-Premises dan Cloud</h3>\n<table>\n<thead>\n<tr>\n<th>Aspek</th>\n<th>On-Premises</th>\n<th>Cloud</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Lokasi infrastruktur</td>\n<td>Dikelola sendiri di lokasi organisasi</td>\n<td>Dikelola penyedia cloud, diakses via Internet/WAN</td>\n</tr>\n<tr>\n<td>Biaya</td>\n<td><strong>CapEx</strong> besar di awal</td>\n<td><strong>OpEx</strong> (bayar sesuai pemakaian)</td>\n</tr>\n<tr>\n<td>Skalabilitas</td>\n<td>Terbatas hardware, lambat</td>\n<td>Cepat dan elastis</td>\n</tr>\n<tr>\n<td>Kontrol</td>\n<td>Penuh</td>\n<td>Terbatas sesuai layanan</td>\n</tr>\n<tr>\n<td>Pemeliharaan</td>\n<td>Tanggung jawab sendiri</td>\n<td>Sebagian/seluruhnya oleh provider</td>\n</tr>\n</tbody>\n</table>", "raw": "### 1.2.a Two-Tier (Collapsed Core)\n\n- Dua lapisan: **Access** dan **Distribution/Core (collapsed)**.\n- Fungsi distribution dan core **digabung** dalam satu lapisan.\n- Cocok untuk **kampus/gedung kecil-menengah**; biaya lebih rendah, desain lebih sederhana, skalabilitas terbatas.\n\n```\n        [ Collapsed Core / Distribution ]\n            /         |          \\\n      [Access]    [Access]     [Access]\n```\n\n### 1.2.b Three-Tier\n\n| Layer | Fungsi |\n|---|---|\n| **Access** | Menghubungkan endpoint (PC, AP, phone); PoE, VLAN, port security |\n| **Distribution** | Agregasi access switch; batas Layer 2/Layer 3; inter-VLAN routing, kebijakan (ACL, QoS), redundansi |\n| **Core** | Backbone berkecepatan tinggi; **forwarding cepat**, high availability; tanpa kebijakan yang memperlambat |\n\n- Cocok untuk **jaringan kampus besar** yang membutuhkan skalabilitas dan ketersediaan tinggi.\n\n### 1.2.c Spine-Leaf\n\n- Umum pada **data center**.\n- **Leaf**: switch tempat server/endpoint terhubung. **Spine**: backbone yang menghubungkan semua leaf.\n- Setiap leaf terhubung ke **setiap** spine; **leaf tidak terhubung ke leaf**, **spine tidak terhubung ke spine**.\n- Karakteristik: **latensi dapat diprediksi** (jumlah hop konsisten), optimal untuk traffic **east-west** (server ke server), mudah diskalakan dengan menambah leaf/spine.\n\n```\n   [Spine1]     [Spine2]\n    /  |  \\      /  |  \\\n [Leaf1][Leaf2][Leaf3][Leaf4]   (setiap leaf ke setiap spine)\n```\n\n### 1.2.d WAN (Wide Area Network)\n\n- Menghubungkan LAN yang **terpisah secara geografis** (kantor cabang, kantor pusat, data center).\n- Umumnya disediakan oleh **service provider (ISP)**.\n- Contoh konektivitas: **leased line**, **MPLS**, **Metro Ethernet**, dan **koneksi Internet + VPN** (broadband/DSL/kabel/seluler).\n\n### 1.2.e Small Office/Home Office (SOHO)\n\n- Jaringan skala kecil (beberapa perangkat).\n- Biasanya memakai **satu perangkat all-in-one** (router + switch + AP + firewall dasar) yang terhubung ke ISP.\n- Sederhana, murah, manajemen minimal.\n\n### 1.2.f On-Premises dan Cloud\n\n| Aspek | On-Premises | Cloud |\n|---|---|---|\n| Lokasi infrastruktur | Dikelola sendiri di lokasi organisasi | Dikelola penyedia cloud, diakses via Internet/WAN |\n| Biaya | **CapEx** besar di awal | **OpEx** (bayar sesuai pemakaian) |\n| Skalabilitas | Terbatas hardware, lambat | Cepat dan elastis |\n| Kontrol | Penuh | Terbatas sesuai layanan |\n| Pemeliharaan | Tanggung jawab sendiri | Sebagian/seluruhnya oleh provider |"}, {"id": "sum-1-3", "label": "1.3 Tipe interface dan kabel fisik", "title": "1.3 Tipe interface dan kabel fisik", "html": "<h3>1.3.a Single-mode fiber, multimode fiber, copper</h3>\n<table>\n<thead>\n<tr>\n<th>Karakteristik</th>\n<th>Single-mode Fiber (SMF)</th>\n<th>Multimode Fiber (MMF)</th>\n<th>Copper (UTP)</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Media</td>\n<td>Serat optik</td>\n<td>Serat optik</td>\n<td>Kabel tembaga twisted pair</td>\n</tr>\n<tr>\n<td>Diameter core</td>\n<td>Kecil (± 9 µm)</td>\n<td>Lebih besar (50 / 62.5 µm)</td>\n<td>—</td>\n</tr>\n<tr>\n<td>Sumber cahaya</td>\n<td><strong>Laser</strong></td>\n<td><strong>LED / VCSEL</strong></td>\n<td>Sinyal listrik</td>\n</tr>\n<tr>\n<td>Jarak</td>\n<td><strong>Sangat jauh</strong> (puluhan km)</td>\n<td>Menengah (ratusan meter)</td>\n<td>Maks. <strong>100 m</strong></td>\n</tr>\n<tr>\n<td>Biaya</td>\n<td>Lebih mahal</td>\n<td>Lebih murah dari SMF</td>\n<td>Termurah</td>\n</tr>\n<tr>\n<td>Kekebalan EMI</td>\n<td>Kebal</td>\n<td>Kebal</td>\n<td>Rentan</td>\n</tr>\n<tr>\n<td>Contoh standar</td>\n<td>1000BASE-LX, 10GBASE-LR</td>\n<td>1000BASE-SX, 10GBASE-SR</td>\n<td>10BASE-T, 100BASE-TX, 1000BASE-T</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li><strong>Copper (UTP):</strong> konektor <strong>RJ-45</strong>, 4 pasang kabel; maks. <strong>100 meter</strong> per segmen.</li>\n<li><strong>Fiber</strong> digunakan untuk jarak jauh, bandwidth tinggi, dan lingkungan dengan banyak interferensi elektromagnetik.</li>\n</ul>\n<h3>1.3.b Connections (Ethernet shared media dan point-to-point)</h3>\n<table>\n<thead>\n<tr>\n<th>Aspek</th>\n<th>Ethernet <strong>Shared Media</strong></th>\n<th>Ethernet <strong>Point-to-Point</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Perangkat</td>\n<td><strong>Hub</strong> (bus/half-duplex)</td>\n<td><strong>Switch</strong> atau koneksi langsung</td>\n</tr>\n<tr>\n<td>Duplex</td>\n<td><strong>Half-duplex</strong></td>\n<td><strong>Full-duplex</strong></td>\n</tr>\n<tr>\n<td>Akses media</td>\n<td><strong>CSMA/CD</strong></td>\n<td>Tidak memerlukan CSMA/CD</td>\n</tr>\n<tr>\n<td>Collision</td>\n<td>Mungkin terjadi (satu collision domain bersama)</td>\n<td>Tidak ada (kirim &amp; terima pada jalur terpisah)</td>\n</tr>\n<tr>\n<td>Kinerja</td>\n<td>Bandwidth dibagi bersama</td>\n<td>Bandwidth penuh per koneksi</td>\n</tr>\n</tbody>\n</table>", "raw": "### 1.3.a Single-mode fiber, multimode fiber, copper\n\n| Karakteristik | Single-mode Fiber (SMF) | Multimode Fiber (MMF) | Copper (UTP) |\n|---|---|---|---|\n| Media | Serat optik | Serat optik | Kabel tembaga twisted pair |\n| Diameter core | Kecil (± 9 µm) | Lebih besar (50 / 62.5 µm) | — |\n| Sumber cahaya | **Laser** | **LED / VCSEL** | Sinyal listrik |\n| Jarak | **Sangat jauh** (puluhan km) | Menengah (ratusan meter) | Maks. **100 m** |\n| Biaya | Lebih mahal | Lebih murah dari SMF | Termurah |\n| Kekebalan EMI | Kebal | Kebal | Rentan |\n| Contoh standar | 1000BASE-LX, 10GBASE-LR | 1000BASE-SX, 10GBASE-SR | 10BASE-T, 100BASE-TX, 1000BASE-T |\n\n- **Copper (UTP):** konektor **RJ-45**, 4 pasang kabel; maks. **100 meter** per segmen.\n- **Fiber** digunakan untuk jarak jauh, bandwidth tinggi, dan lingkungan dengan banyak interferensi elektromagnetik.\n\n### 1.3.b Connections (Ethernet shared media dan point-to-point)\n\n| Aspek | Ethernet **Shared Media** | Ethernet **Point-to-Point** |\n|---|---|---|\n| Perangkat | **Hub** (bus/half-duplex) | **Switch** atau koneksi langsung |\n| Duplex | **Half-duplex** | **Full-duplex** |\n| Akses media | **CSMA/CD** | Tidak memerlukan CSMA/CD |\n| Collision | Mungkin terjadi (satu collision domain bersama) | Tidak ada (kirim & terima pada jalur terpisah) |\n| Kinerja | Bandwidth dibagi bersama | Bandwidth penuh per koneksi |"}, {"id": "sum-1-4", "label": "1.4 Masalah interface dan kabel", "title": "1.4 Masalah interface dan kabel", "html": "<p><strong>Pemeriksaan utama:</strong> <code>show interfaces</code>, <code>show interfaces status</code>, <code>show interfaces counters errors</code>.</p>\n<h3>Status interface</h3>\n<table>\n<thead>\n<tr>\n<th>Status (line / protocol)</th>\n<th>Arti umum</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>administratively down / down</code></td>\n<td>Interface dimatikan (<code>shutdown</code>)</td>\n</tr>\n<tr>\n<td><code>down / down</code></td>\n<td>Masalah Layer 1 (kabel putus/tidak tercolok, perangkat seberang mati)</td>\n</tr>\n<tr>\n<td><code>up / down</code></td>\n<td>Masalah Layer 2 (mis. encapsulation/clocking tidak cocok)</td>\n</tr>\n<tr>\n<td><code>up / up</code></td>\n<td>Normal</td>\n</tr>\n</tbody>\n</table>\n<h3>Indikator error pada <code>show interfaces</code></h3>\n<table>\n<thead>\n<tr>\n<th>Counter</th>\n<th>Arti</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Runts</strong></td>\n<td>Frame <strong>&lt; 64 byte</strong> (sering akibat collision)</td>\n</tr>\n<tr>\n<td><strong>Giants</strong></td>\n<td>Frame lebih besar dari ukuran maksimum Ethernet (&gt; 1518 byte)</td>\n</tr>\n<tr>\n<td><strong>CRC</strong></td>\n<td>Frame gagal pemeriksaan <strong>FCS</strong> (kabel buruk, interferensi, duplex mismatch)</td>\n</tr>\n<tr>\n<td><strong>Input errors</strong></td>\n<td>Total error saat menerima (runts, giants, CRC, frame, overrun, dll.)</td>\n</tr>\n<tr>\n<td><strong>Output errors</strong></td>\n<td>Total error yang mencegah frame terkirim sepenuhnya</td>\n</tr>\n<tr>\n<td><strong>Collisions</strong></td>\n<td>Tabrakan frame (normal hanya pada half-duplex)</td>\n</tr>\n<tr>\n<td><strong>Late collisions</strong></td>\n<td>Collision setelah 64 byte pertama dikirim; indikasi <strong>duplex mismatch</strong> atau kabel terlalu panjang</td>\n</tr>\n</tbody>\n</table>\n<h3>Duplex mismatch</h3>\n<ul>\n<li>Terjadi bila satu sisi <strong>full-duplex</strong> dan sisi lain <strong>half-duplex</strong>.</li>\n<li>Gejala: kinerja lambat, <strong>late collisions</strong> pada sisi half-duplex, serta <strong>CRC/runt errors</strong> pada sisi full-duplex.</li>\n<li>Penyebab umum: satu sisi di-hardcode, sisi lain <strong>auto-negotiation</strong> (negosiasi gagal, duplex default ke half pada 10/100).</li>\n<li>Solusi: samakan pengaturan kedua sisi (keduanya auto, atau keduanya manual dengan nilai sama).</li>\n</ul>\n<h3>Speed mismatch</h3>\n<ul>\n<li>Kecepatan di kedua sisi berbeda → link <strong>tidak up</strong> atau tidak stabil.</li>\n</ul>\n<h3>Penyebab masalah kabel</h3>\n<ul>\n<li>Jenis kabel salah, kabel rusak/terlalu panjang (&gt; 100 m untuk copper), konektor buruk, atau interferensi elektromagnetik (EMI).</li>\n</ul>", "raw": "**Pemeriksaan utama:** `show interfaces`, `show interfaces status`, `show interfaces counters errors`.\n\n### Status interface\n\n| Status (line / protocol) | Arti umum |\n|---|---|\n| `administratively down / down` | Interface dimatikan (`shutdown`) |\n| `down / down` | Masalah Layer 1 (kabel putus/tidak tercolok, perangkat seberang mati) |\n| `up / down` | Masalah Layer 2 (mis. encapsulation/clocking tidak cocok) |\n| `up / up` | Normal |\n\n### Indikator error pada `show interfaces`\n\n| Counter | Arti |\n|---|---|\n| **Runts** | Frame **< 64 byte** (sering akibat collision) |\n| **Giants** | Frame lebih besar dari ukuran maksimum Ethernet (> 1518 byte) |\n| **CRC** | Frame gagal pemeriksaan **FCS** (kabel buruk, interferensi, duplex mismatch) |\n| **Input errors** | Total error saat menerima (runts, giants, CRC, frame, overrun, dll.) |\n| **Output errors** | Total error yang mencegah frame terkirim sepenuhnya |\n| **Collisions** | Tabrakan frame (normal hanya pada half-duplex) |\n| **Late collisions** | Collision setelah 64 byte pertama dikirim; indikasi **duplex mismatch** atau kabel terlalu panjang |\n\n### Duplex mismatch\n\n- Terjadi bila satu sisi **full-duplex** dan sisi lain **half-duplex**.\n- Gejala: kinerja lambat, **late collisions** pada sisi half-duplex, serta **CRC/runt errors** pada sisi full-duplex.\n- Penyebab umum: satu sisi di-hardcode, sisi lain **auto-negotiation** (negosiasi gagal, duplex default ke half pada 10/100).\n- Solusi: samakan pengaturan kedua sisi (keduanya auto, atau keduanya manual dengan nilai sama).\n\n### Speed mismatch\n\n- Kecepatan di kedua sisi berbeda → link **tidak up** atau tidak stabil.\n\n### Penyebab masalah kabel\n\n- Jenis kabel salah, kabel rusak/terlalu panjang (> 100 m untuk copper), konektor buruk, atau interferensi elektromagnetik (EMI)."}, {"id": "sum-1-5", "label": "1.5 TCP vs UDP", "title": "1.5 TCP vs UDP", "html": "<table>\n<thead>\n<tr>\n<th>Karakteristik</th>\n<th><strong>TCP</strong></th>\n<th><strong>UDP</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Layer</td>\n<td>Transport (Layer 4)</td>\n<td>Transport (Layer 4)</td>\n</tr>\n<tr>\n<td>Koneksi</td>\n<td><strong>Connection-oriented</strong> (3-way handshake)</td>\n<td><strong>Connectionless</strong></td>\n</tr>\n<tr>\n<td>Reliabilitas</td>\n<td><strong>Reliable</strong> (sequence number, ACK, retransmisi)</td>\n<td><strong>Unreliable</strong> (best-effort)</td>\n</tr>\n<tr>\n<td>Flow control</td>\n<td>Ya (<strong>windowing</strong>)</td>\n<td>Tidak</td>\n</tr>\n<tr>\n<td>Urutan data</td>\n<td>Dijamin berurutan</td>\n<td>Tidak dijamin</td>\n</tr>\n<tr>\n<td>Overhead</td>\n<td>Lebih besar (header 20 byte+)</td>\n<td>Kecil (header 8 byte)</td>\n</tr>\n<tr>\n<td>Kecepatan</td>\n<td>Lebih lambat</td>\n<td>Lebih cepat</td>\n</tr>\n<tr>\n<td>Cocok untuk</td>\n<td>Data yang harus utuh (web, email, transfer file)</td>\n<td>Data sensitif waktu (voice, video, streaming)</td>\n</tr>\n</tbody>\n</table>\n<p><strong>TCP three-way handshake:</strong> <code>SYN</code> → <code>SYN-ACK</code> → <code>ACK</code></p>", "raw": "| Karakteristik | **TCP** | **UDP** |\n|---|---|---|\n| Layer | Transport (Layer 4) | Transport (Layer 4) |\n| Koneksi | **Connection-oriented** (3-way handshake) | **Connectionless** |\n| Reliabilitas | **Reliable** (sequence number, ACK, retransmisi) | **Unreliable** (best-effort) |\n| Flow control | Ya (**windowing**) | Tidak |\n| Urutan data | Dijamin berurutan | Tidak dijamin |\n| Overhead | Lebih besar (header 20 byte+) | Kecil (header 8 byte) |\n| Kecepatan | Lebih lambat | Lebih cepat |\n| Cocok untuk | Data yang harus utuh (web, email, transfer file) | Data sensitif waktu (voice, video, streaming) |\n\n**TCP three-way handshake:** `SYN` → `SYN-ACK` → `ACK`"}, {"id": "sum-1-6", "label": "1.6 Konfigurasi dan verifikasi IPv4 addressing dan subnetting", "title": "1.6 Konfigurasi dan verifikasi IPv4 addressing dan subnetting", "html": "<h3>Struktur alamat IPv4</h3>\n<ul>\n<li><strong>32 bit</strong>, ditulis 4 oktet desimal (<code>192.168.10.1</code>).</li>\n<li>Terdiri dari bagian <strong>network</strong> dan <strong>host</strong>, dibedakan oleh <strong>subnet mask</strong> (atau notasi <strong>CIDR</strong> <code>/n</code>).</li>\n</ul>\n<h3>Subnetting</h3>\n<p><strong>Rumus:</strong></p>\n<ul>\n<li>Jumlah subnet = <strong>2ⁿ</strong> (n = bit host yang dipinjam)</li>\n<li>Jumlah host per subnet = <strong>2ʰ − 2</strong> (h = bit host tersisa; dikurangi alamat network dan broadcast)</li>\n</ul>\n<p><strong>Nilai bit per oktet:</strong> <code>128 | 64 | 32 | 16 | 8 | 4 | 2 | 1</code></p>\n<p><strong>Tabel CIDR (oktet ke-4):</strong></p>\n<table>\n<thead>\n<tr>\n<th>CIDR</th>\n<th>Subnet Mask</th>\n<th>Block size</th>\n<th>Host valid</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>/24</td>\n<td>255.255.255.0</td>\n<td>256</td>\n<td>254</td>\n</tr>\n<tr>\n<td>/25</td>\n<td>255.255.255.128</td>\n<td>128</td>\n<td>126</td>\n</tr>\n<tr>\n<td>/26</td>\n<td>255.255.255.192</td>\n<td>64</td>\n<td>62</td>\n</tr>\n<tr>\n<td>/27</td>\n<td>255.255.255.224</td>\n<td>32</td>\n<td>30</td>\n</tr>\n<tr>\n<td>/28</td>\n<td>255.255.255.240</td>\n<td>16</td>\n<td>14</td>\n</tr>\n<tr>\n<td>/29</td>\n<td>255.255.255.248</td>\n<td>8</td>\n<td>6</td>\n</tr>\n<tr>\n<td>/30</td>\n<td>255.255.255.252</td>\n<td>4</td>\n<td>2</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Contoh:</strong> <code>192.168.10.100/26</code></p>\n<ol>\n<li>Mask <code>/26</code> = 255.255.255.192 → block size = <strong>64</strong>.</li>\n<li>Subnet: <code>.0</code>, <code>.64</code>, <code>.128</code>, <code>.192</code>.</li>\n<li><code>.100</code> berada di subnet <code>.64</code>.</li>\n<li><strong>Network ID:</strong> <code>192.168.10.64</code></li>\n<li><strong>Broadcast:</strong> <code>192.168.10.127</code></li>\n<li><strong>Range host:</strong> <code>192.168.10.65 – 192.168.10.126</code></li>\n</ol>\n<blockquote>\n<p>Subnetting dengan mask berbeda-beda untuk tiap segmen (VLSM) mengikuti cara yang sama: pilih mask sesuai kebutuhan host tiap subnet.</p>\n</blockquote>\n<h3>Konfigurasi IPv4 pada interface</h3>\n<pre><code>Router(config)# interface gigabitEthernet 0/0\nRouter(config-if)# ip address 192.168.10.1 255.255.255.0\nRouter(config-if)# no shutdown\nRouter(config-if)# description LAN-Marketing\n</code></pre>\n<h3>Verifikasi</h3>\n<pre><code>Router# show ip interface brief\nRouter# show interfaces gigabitEthernet 0/0\nRouter# show running-config interface gigabitEthernet 0/0\nRouter# ping 192.168.10.2\n</code></pre>", "raw": "### Struktur alamat IPv4\n\n- **32 bit**, ditulis 4 oktet desimal (`192.168.10.1`).\n- Terdiri dari bagian **network** dan **host**, dibedakan oleh **subnet mask** (atau notasi **CIDR** `/n`).\n\n### Subnetting\n\n**Rumus:**\n\n- Jumlah subnet = **2ⁿ** (n = bit host yang dipinjam)\n- Jumlah host per subnet = **2ʰ − 2** (h = bit host tersisa; dikurangi alamat network dan broadcast)\n\n**Nilai bit per oktet:** `128 | 64 | 32 | 16 | 8 | 4 | 2 | 1`\n\n**Tabel CIDR (oktet ke-4):**\n\n| CIDR | Subnet Mask | Block size | Host valid |\n|---|---|---|---|\n| /24 | 255.255.255.0 | 256 | 254 |\n| /25 | 255.255.255.128 | 128 | 126 |\n| /26 | 255.255.255.192 | 64 | 62 |\n| /27 | 255.255.255.224 | 32 | 30 |\n| /28 | 255.255.255.240 | 16 | 14 |\n| /29 | 255.255.255.248 | 8 | 6 |\n| /30 | 255.255.255.252 | 4 | 2 |\n\n**Contoh:** `192.168.10.100/26`\n\n1. Mask `/26` = 255.255.255.192 → block size = **64**.\n2. Subnet: `.0`, `.64`, `.128`, `.192`.\n3. `.100` berada di subnet `.64`.\n4. **Network ID:** `192.168.10.64`\n5. **Broadcast:** `192.168.10.127`\n6. **Range host:** `192.168.10.65 – 192.168.10.126`\n\n> Subnetting dengan mask berbeda-beda untuk tiap segmen (VLSM) mengikuti cara yang sama: pilih mask sesuai kebutuhan host tiap subnet.\n\n### Konfigurasi IPv4 pada interface\n\n```\nRouter(config)# interface gigabitEthernet 0/0\nRouter(config-if)# ip address 192.168.10.1 255.255.255.0\nRouter(config-if)# no shutdown\nRouter(config-if)# description LAN-Marketing\n```\n\n### Verifikasi\n\n```\nRouter# show ip interface brief\nRouter# show interfaces gigabitEthernet 0/0\nRouter# show running-config interface gigabitEthernet 0/0\nRouter# ping 192.168.10.2\n```"}, {"id": "sum-1-7", "label": "1.7 Private IPv4 addressing", "title": "1.7 Private IPv4 addressing", "html": "<p>Alamat privat didefinisikan pada <strong>RFC 1918</strong>, <strong>tidak dirutekan di Internet publik</strong>, dan dapat dipakai berulang di banyak organisasi.</p>\n<table>\n<thead>\n<tr>\n<th>Kelas</th>\n<th>Rentang</th>\n<th>Prefix</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>A</td>\n<td>10.0.0.0 – 10.255.255.255</td>\n<td><strong>10.0.0.0/8</strong></td>\n</tr>\n<tr>\n<td>B</td>\n<td>172.16.0.0 – 172.31.255.255</td>\n<td><strong>172.16.0.0/12</strong></td>\n</tr>\n<tr>\n<td>C</td>\n<td>192.168.0.0 – 192.168.255.255</td>\n<td><strong>192.168.0.0/16</strong></td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li>Tujuan: menghemat alamat IPv4 publik dan memisahkan jaringan internal.</li>\n<li>Agar perangkat dengan alamat privat bisa mengakses Internet, alamatnya harus diterjemahkan ke alamat publik (melalui NAT).</li>\n</ul>", "raw": "Alamat privat didefinisikan pada **RFC 1918**, **tidak dirutekan di Internet publik**, dan dapat dipakai berulang di banyak organisasi.\n\n| Kelas | Rentang | Prefix |\n|---|---|---|\n| A | 10.0.0.0 – 10.255.255.255 | **10.0.0.0/8** |\n| B | 172.16.0.0 – 172.31.255.255 | **172.16.0.0/12** |\n| C | 192.168.0.0 – 192.168.255.255 | **192.168.0.0/16** |\n\n- Tujuan: menghemat alamat IPv4 publik dan memisahkan jaringan internal.\n- Agar perangkat dengan alamat privat bisa mengakses Internet, alamatnya harus diterjemahkan ke alamat publik (melalui NAT)."}, {"id": "sum-1-8", "label": "1.8 Konfigurasi dan verifikasi IPv6 addressing dan prefix", "title": "1.8 Konfigurasi dan verifikasi IPv6 addressing dan prefix", "html": "<h3>Struktur alamat IPv6</h3>\n<ul>\n<li><strong>128 bit</strong>, ditulis <strong>8 grup heksadesimal</strong> (16 bit per grup), dipisah titik dua.</li>\n<li>Contoh: <code>2001:0DB8:0000:0000:0000:0000:0000:0001</code></li>\n</ul>\n<p><strong>Aturan penyingkatan:</strong></p>\n<ol>\n<li><strong>Hilangkan nol di depan</strong> pada tiap grup: <code>0DB8</code> → <code>DB8</code>, <code>0000</code> → <code>0</code>.</li>\n<li><strong>Ganti satu urutan grup nol berturut-turut</strong> dengan <code>::</code> (<strong>hanya boleh sekali</strong> dalam satu alamat).</li>\n<li><code>2001:0DB8:0000:0000:0000:0000:0000:0001</code> → <code>2001:DB8::1</code></li>\n</ol>\n<h3>Prefix</h3>\n<ul>\n<li>Ditulis dengan notasi <code>/panjang-prefix</code> (contoh <code>2001:DB8:1::/64</code>).</li>\n<li><strong>/64</strong> adalah panjang prefix standar untuk subnet LAN (64 bit network/subnet + 64 bit <strong>interface ID</strong>).</li>\n</ul>\n<h3>Konfigurasi</h3>\n<pre><code>Router(config)# ipv6 unicast-routing          ! aktifkan routing IPv6\nRouter(config)# interface gigabitEthernet 0/0\n\n! Alamat statis penuh\nRouter(config-if)# ipv6 address 2001:DB8:1:1::1/64\n\n! Interface ID otomatis dengan modified EUI-64\nRouter(config-if)# ipv6 address 2001:DB8:1:1::/64 eui-64\n\n! Link-local manual\nRouter(config-if)# ipv6 address FE80::1 link-local\n\nRouter(config-if)# no shutdown\n</code></pre>\n<h3>Verifikasi</h3>\n<pre><code>Router# show ipv6 interface brief\nRouter# show ipv6 interface gigabitEthernet 0/0\nRouter# show ipv6 route\nRouter# ping 2001:DB8:1:1::2\n</code></pre>", "raw": "### Struktur alamat IPv6\n\n- **128 bit**, ditulis **8 grup heksadesimal** (16 bit per grup), dipisah titik dua.\n- Contoh: `2001:0DB8:0000:0000:0000:0000:0000:0001`\n\n**Aturan penyingkatan:**\n\n1. **Hilangkan nol di depan** pada tiap grup: `0DB8` → `DB8`, `0000` → `0`.\n2. **Ganti satu urutan grup nol berturut-turut** dengan `::` (**hanya boleh sekali** dalam satu alamat).\n   - `2001:0DB8:0000:0000:0000:0000:0000:0001` → `2001:DB8::1`\n\n### Prefix\n\n- Ditulis dengan notasi `/panjang-prefix` (contoh `2001:DB8:1::/64`).\n- **/64** adalah panjang prefix standar untuk subnet LAN (64 bit network/subnet + 64 bit **interface ID**).\n\n### Konfigurasi\n\n```\nRouter(config)# ipv6 unicast-routing          ! aktifkan routing IPv6\nRouter(config)# interface gigabitEthernet 0/0\n\n! Alamat statis penuh\nRouter(config-if)# ipv6 address 2001:DB8:1:1::1/64\n\n! Interface ID otomatis dengan modified EUI-64\nRouter(config-if)# ipv6 address 2001:DB8:1:1::/64 eui-64\n\n! Link-local manual\nRouter(config-if)# ipv6 address FE80::1 link-local\n\nRouter(config-if)# no shutdown\n```\n\n### Verifikasi\n\n```\nRouter# show ipv6 interface brief\nRouter# show ipv6 interface gigabitEthernet 0/0\nRouter# show ipv6 route\nRouter# ping 2001:DB8:1:1::2\n```"}, {"id": "sum-1-9", "label": "1.9 Tipe alamat IPv6", "title": "1.9 Tipe alamat IPv6", "html": "<h3>1.9.a Unicast</h3>\n<p>Alamat untuk <strong>satu interface tunggal</strong> (komunikasi one-to-one).</p>\n<table>\n<thead>\n<tr>\n<th>Tipe</th>\n<th>Prefix</th>\n<th>Keterangan</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Global Unicast</strong></td>\n<td><strong>2000::/3</strong> (awalan 2 atau 3)</td>\n<td>Dapat dirutekan di Internet; setara IPv4 publik</td>\n</tr>\n<tr>\n<td><strong>Unique Local</strong></td>\n<td><strong>FC00::/7</strong> (praktiknya <strong>FD00::/8</strong>)</td>\n<td>Hanya untuk jaringan internal; tidak dirutekan di Internet; setara IPv4 privat</td>\n</tr>\n<tr>\n<td><strong>Link-Local</strong></td>\n<td><strong>FE80::/10</strong></td>\n<td>Hanya berlaku pada <strong>satu link/segmen</strong>; tidak dirutekan oleh router; otomatis dibuat di setiap interface IPv6</td>\n</tr>\n</tbody>\n</table>\n<h3>1.9.b Anycast</h3>\n<ul>\n<li>Satu alamat yang <strong>dipasang pada beberapa perangkat</strong>; paket dikirim ke perangkat <strong>terdekat</strong> (berdasarkan routing metric).</li>\n<li>Dibuat dengan memasang alamat unicast yang sama pada lebih dari satu interface.</li>\n</ul>\n<h3>1.9.c Multicast</h3>\n<ul>\n<li>Dikirim ke <strong>sekelompok perangkat</strong> (one-to-many); prefix <strong>FF00::/8</strong>.</li>\n<li>IPv6 <strong>tidak memakai broadcast</strong>; fungsinya digantikan multicast.</li>\n</ul>\n<table>\n<thead>\n<tr>\n<th>Alamat</th>\n<th>Fungsi</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>FF02::1</code></td>\n<td>Semua node pada link (<em>all-nodes</em>)</td>\n</tr>\n<tr>\n<td><code>FF02::2</code></td>\n<td>Semua router pada link (<em>all-routers</em>)</td>\n</tr>\n</tbody>\n</table>\n<h3>1.9.d Modified EUI-64</h3>\n<p>Metode membentuk <strong>interface ID 64-bit</strong> dari <strong>MAC address 48-bit</strong>:</p>\n<ol>\n<li>Pecah MAC menjadi dua bagian (24 bit + 24 bit).</li>\n<li>Sisipkan <strong><code>FFFE</code></strong> di tengah.</li>\n<li><strong>Balik bit ke-7</strong> (bit U/L) dari byte pertama.</li>\n</ol>\n<p><strong>Contoh:</strong> MAC <code>00:1A:2B:3C:4D:5E</code></p>\n<ol>\n<li><code>001A2B</code> + <code>FFFE</code> + <code>3C4D5E</code> → <code>001A:2BFF:FE3C:4D5E</code></li>\n<li>Byte pertama <code>00</code> = <code>0000 0000</code> → balik bit ke-7 → <code>0000 0010</code> = <code>02</code></li>\n<li>Interface ID = <strong><code>021A:2BFF:FE3C:4D5E</code></strong></li>\n</ol>\n<p>Jika prefix <code>2001:DB8:1:1::/64</code>, alamat lengkap: <code>2001:DB8:1:1:21A:2BFF:FE3C:4D5E</code>.</p>", "raw": "### 1.9.a Unicast\n\nAlamat untuk **satu interface tunggal** (komunikasi one-to-one).\n\n| Tipe | Prefix | Keterangan |\n|---|---|---|\n| **Global Unicast** | **2000::/3** (awalan 2 atau 3) | Dapat dirutekan di Internet; setara IPv4 publik |\n| **Unique Local** | **FC00::/7** (praktiknya **FD00::/8**) | Hanya untuk jaringan internal; tidak dirutekan di Internet; setara IPv4 privat |\n| **Link-Local** | **FE80::/10** | Hanya berlaku pada **satu link/segmen**; tidak dirutekan oleh router; otomatis dibuat di setiap interface IPv6 |\n\n### 1.9.b Anycast\n\n- Satu alamat yang **dipasang pada beberapa perangkat**; paket dikirim ke perangkat **terdekat** (berdasarkan routing metric).\n- Dibuat dengan memasang alamat unicast yang sama pada lebih dari satu interface.\n\n### 1.9.c Multicast\n\n- Dikirim ke **sekelompok perangkat** (one-to-many); prefix **FF00::/8**.\n- IPv6 **tidak memakai broadcast**; fungsinya digantikan multicast.\n\n| Alamat | Fungsi |\n|---|---|\n| `FF02::1` | Semua node pada link (*all-nodes*) |\n| `FF02::2` | Semua router pada link (*all-routers*) |\n\n### 1.9.d Modified EUI-64\n\nMetode membentuk **interface ID 64-bit** dari **MAC address 48-bit**:\n\n1. Pecah MAC menjadi dua bagian (24 bit + 24 bit).\n2. Sisipkan **`FFFE`** di tengah.\n3. **Balik bit ke-7** (bit U/L) dari byte pertama.\n\n**Contoh:** MAC `00:1A:2B:3C:4D:5E`\n\n1. `001A2B` + `FFFE` + `3C4D5E` → `001A:2BFF:FE3C:4D5E`\n2. Byte pertama `00` = `0000 0000` → balik bit ke-7 → `0000 0010` = `02`\n3. Interface ID = **`021A:2BFF:FE3C:4D5E`**\n\nJika prefix `2001:DB8:1:1::/64`, alamat lengkap: `2001:DB8:1:1:21A:2BFF:FE3C:4D5E`."}, {"id": "sum-1-10", "label": "1.10 Verifikasi parameter IP pada Client OS", "title": "1.10 Verifikasi parameter IP pada Client OS", "html": "<p>Parameter yang diverifikasi: <strong>alamat IP, subnet mask/prefix, default gateway, DNS server, status DHCP, MAC address</strong>.</p>\n<table>\n<thead>\n<tr>\n<th>OS</th>\n<th>Perintah / Lokasi</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Windows</strong></td>\n<td><code>ipconfig</code>, <code>ipconfig /all</code> (detail termasuk MAC, DHCP, DNS), <code>ipconfig /release</code>, <code>ipconfig /renew</code></td>\n</tr>\n<tr>\n<td><strong>macOS</strong></td>\n<td><code>ifconfig</code>, <code>networksetup -getinfo Wi-Fi</code>, atau <em>System Settings → Network</em></td>\n</tr>\n<tr>\n<td><strong>Linux</strong></td>\n<td><code>ip addr</code> (<code>ip a</code>), <code>ip route</code> (default gateway), <code>ifconfig</code>, <code>resolvectl status</code> atau <code>/etc/resolv.conf</code> (DNS)</td>\n</tr>\n</tbody>\n</table>", "raw": "Parameter yang diverifikasi: **alamat IP, subnet mask/prefix, default gateway, DNS server, status DHCP, MAC address**.\n\n| OS | Perintah / Lokasi |\n|---|---|\n| **Windows** | `ipconfig`, `ipconfig /all` (detail termasuk MAC, DHCP, DNS), `ipconfig /release`, `ipconfig /renew` |\n| **macOS** | `ifconfig`, `networksetup -getinfo Wi-Fi`, atau *System Settings → Network* |\n| **Linux** | `ip addr` (`ip a`), `ip route` (default gateway), `ifconfig`, `resolvectl status` atau `/etc/resolv.conf` (DNS) |"}, {"id": "sum-1-11", "label": "1.11 Prinsip wireless", "title": "1.11 Prinsip wireless", "html": "<h3>1.11.a Nonoverlapping Wi-Fi channels</h3>\n<ul>\n<li>Channel yang <strong>tidak saling tumpang tindih</strong> mencegah interferensi <strong>co-channel/adjacent-channel</strong>.</li>\n<li><strong>2.4 GHz:</strong> hanya <strong>3 channel</strong> non-overlapping (lebar 20 MHz): <strong>1, 6, dan 11</strong>.</li>\n<li><strong>5 GHz:</strong> lebih banyak channel non-overlapping, kapasitas lebih besar, interferensi lebih sedikit.</li>\n<li>Perencanaan: AP bertetangga memakai channel berbeda yang tidak overlap.</li>\n</ul>\n<h3>1.11.b SSID</h3>\n<ul>\n<li><strong>Service Set Identifier</strong>: <strong>nama jaringan WLAN</strong> yang tampil pada client (hingga 32 karakter).</li>\n<li>Satu AP dapat menyiarkan beberapa SSID.</li>\n</ul>\n<h3>1.11.c RF (Radio Frequency)</h3>\n<table>\n<thead>\n<tr>\n<th>Konsep</th>\n<th>Penjelasan</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Frekuensi</strong></td>\n<td>Pita Wi-Fi umum: <strong>2.4 GHz</strong> dan <strong>5 GHz</strong></td>\n</tr>\n<tr>\n<td><strong>Channel</strong></td>\n<td>Pembagian rentang frekuensi dalam pita; lebar channel 20/40/80/160 MHz</td>\n</tr>\n<tr>\n<td><strong>2.4 GHz vs 5 GHz</strong></td>\n<td>2.4 GHz: jangkauan lebih jauh, penetrasi baik, lebih padat/interferensi. 5 GHz: throughput lebih tinggi, jangkauan lebih pendek</td>\n</tr>\n<tr>\n<td><strong>Daya sinyal</strong></td>\n<td>Diukur dalam <strong>dBm</strong> (makin mendekati 0 = makin kuat; mis. −50 dBm lebih baik dari −80 dBm)</td>\n</tr>\n<tr>\n<td><strong>Interferensi</strong></td>\n<td>Berasal dari perangkat lain (microwave, Bluetooth) atau AP lain pada channel yang sama</td>\n</tr>\n<tr>\n<td><strong>Atenuasi</strong></td>\n<td>Pelemahan sinyal akibat jarak dan penghalang (dinding, logam)</td>\n</tr>\n</tbody>\n</table>\n<h3>1.11.d Encryption</h3>\n<ul>\n<li>Mengenkripsi data antara client dan AP agar tidak dapat dibaca pihak lain.</li>\n<li>Protokol: <strong>Open</strong> (tanpa enkripsi), <strong>WPA2</strong> (AES-CCMP), <strong>WPA3</strong> (lebih kuat; SAE).</li>\n<li>Gunakan WPA2/WPA3 untuk keamanan WLAN.</li>\n</ul>", "raw": "### 1.11.a Nonoverlapping Wi-Fi channels\n\n- Channel yang **tidak saling tumpang tindih** mencegah interferensi **co-channel/adjacent-channel**.\n- **2.4 GHz:** hanya **3 channel** non-overlapping (lebar 20 MHz): **1, 6, dan 11**.\n- **5 GHz:** lebih banyak channel non-overlapping, kapasitas lebih besar, interferensi lebih sedikit.\n- Perencanaan: AP bertetangga memakai channel berbeda yang tidak overlap.\n\n### 1.11.b SSID\n\n- **Service Set Identifier**: **nama jaringan WLAN** yang tampil pada client (hingga 32 karakter).\n- Satu AP dapat menyiarkan beberapa SSID.\n\n### 1.11.c RF (Radio Frequency)\n\n| Konsep | Penjelasan |\n|---|---|\n| **Frekuensi** | Pita Wi-Fi umum: **2.4 GHz** dan **5 GHz** |\n| **Channel** | Pembagian rentang frekuensi dalam pita; lebar channel 20/40/80/160 MHz |\n| **2.4 GHz vs 5 GHz** | 2.4 GHz: jangkauan lebih jauh, penetrasi baik, lebih padat/interferensi. 5 GHz: throughput lebih tinggi, jangkauan lebih pendek |\n| **Daya sinyal** | Diukur dalam **dBm** (makin mendekati 0 = makin kuat; mis. −50 dBm lebih baik dari −80 dBm) |\n| **Interferensi** | Berasal dari perangkat lain (microwave, Bluetooth) atau AP lain pada channel yang sama |\n| **Atenuasi** | Pelemahan sinyal akibat jarak dan penghalang (dinding, logam) |\n\n### 1.11.d Encryption\n\n- Mengenkripsi data antara client dan AP agar tidak dapat dibaca pihak lain.\n- Protokol: **Open** (tanpa enkripsi), **WPA2** (AES-CCMP), **WPA3** (lebih kuat; SAE).\n- Gunakan WPA2/WPA3 untuk keamanan WLAN."}, {"id": "sum-1-12", "label": "1.12 Dasar virtualisasi", "title": "1.12 Dasar virtualisasi", "html": "<h3>Server Virtualization</h3>\n<ul>\n<li>Satu server fisik menjalankan <strong>banyak Virtual Machine (VM)</strong>, masing-masing dengan <strong>OS sendiri</strong>.</li>\n<li>Dikelola oleh <strong>hypervisor</strong>:</li>\n<li><strong>Type 1 (bare-metal):</strong> berjalan langsung di hardware (mis. VMware ESXi, KVM, Hyper-V). Dipakai di data center.</li>\n<li><strong>Type 2 (hosted):</strong> berjalan di atas OS host (mis. VirtualBox, VMware Workstation).</li>\n<li>Manfaat: efisiensi hardware, isolasi antar VM, fleksibilitas dan pemulihan cepat, biaya lebih rendah.</li>\n</ul>\n<h3>Containers</h3>\n<ul>\n<li>Virtualisasi pada <strong>level OS</strong>: container <strong>berbagi kernel OS host</strong> dan hanya membawa aplikasi + dependensinya.</li>\n<li>Lebih <strong>ringan dan cepat</strong> dari VM (tidak ada OS tamu penuh), startup cepat, portabel.</li>\n<li>Contoh: <strong>Docker</strong>.</li>\n</ul>\n<table>\n<thead>\n<tr>\n<th>Aspek</th>\n<th>Virtual Machine</th>\n<th>Container</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>OS</td>\n<td>Tiap VM punya OS sendiri</td>\n<td>Berbagi kernel host</td>\n</tr>\n<tr>\n<td>Ukuran/beban</td>\n<td>Besar</td>\n<td>Ringan</td>\n</tr>\n<tr>\n<td>Startup</td>\n<td>Lebih lambat</td>\n<td>Cepat</td>\n</tr>\n<tr>\n<td>Isolasi</td>\n<td>Lebih kuat</td>\n<td>Lebih ringan</td>\n</tr>\n</tbody>\n</table>\n<h3>VRFs (Virtual Routing and Forwarding)</h3>\n<ul>\n<li>Teknologi yang memungkinkan <strong>banyak routing table terpisah</strong> pada <strong>satu router fisik</strong>.</li>\n<li>Setiap VRF seperti router virtual terpisah: <strong>isolasi traffic</strong> antar pelanggan/departemen dan mendukung <strong>alamat IP yang tumpang tindih</strong>.</li>\n<li>Interface dimasukkan ke VRF tertentu; routing hanya terjadi dalam VRF yang sama.</li>\n</ul>", "raw": "### Server Virtualization\n\n- Satu server fisik menjalankan **banyak Virtual Machine (VM)**, masing-masing dengan **OS sendiri**.\n- Dikelola oleh **hypervisor**:\n  - **Type 1 (bare-metal):** berjalan langsung di hardware (mis. VMware ESXi, KVM, Hyper-V). Dipakai di data center.\n  - **Type 2 (hosted):** berjalan di atas OS host (mis. VirtualBox, VMware Workstation).\n- Manfaat: efisiensi hardware, isolasi antar VM, fleksibilitas dan pemulihan cepat, biaya lebih rendah.\n\n### Containers\n\n- Virtualisasi pada **level OS**: container **berbagi kernel OS host** dan hanya membawa aplikasi + dependensinya.\n- Lebih **ringan dan cepat** dari VM (tidak ada OS tamu penuh), startup cepat, portabel.\n- Contoh: **Docker**.\n\n| Aspek | Virtual Machine | Container |\n|---|---|---|\n| OS | Tiap VM punya OS sendiri | Berbagi kernel host |\n| Ukuran/beban | Besar | Ringan |\n| Startup | Lebih lambat | Cepat |\n| Isolasi | Lebih kuat | Lebih ringan |\n\n### VRFs (Virtual Routing and Forwarding)\n\n- Teknologi yang memungkinkan **banyak routing table terpisah** pada **satu router fisik**.\n- Setiap VRF seperti router virtual terpisah: **isolasi traffic** antar pelanggan/departemen dan mendukung **alamat IP yang tumpang tindih**.\n- Interface dimasukkan ke VRF tertentu; routing hanya terjadi dalam VRF yang sama."}, {"id": "sum-1-13", "label": "1.13 Konsep switching", "title": "1.13 Konsep switching", "html": "<h3>1.13.a MAC Learning dan Aging</h3>\n<ul>\n<li><strong>MAC learning:</strong> switch memeriksa <strong>source MAC address</strong> setiap frame yang masuk, lalu mencatatnya di MAC address table bersama <strong>port</strong> dan <strong>VLAN</strong> tempat frame diterima.</li>\n<li><strong>Aging:</strong> entri yang tidak aktif dihapus setelah waktu tertentu. Default pada Cisco switch: <strong>300 detik (5 menit)</strong>; timer di-reset setiap kali switch melihat frame dari MAC tersebut.</li>\n</ul>\n<h3>1.13.b Frame Switching</h3>\n<p>Keputusan forwarding berdasarkan <strong>destination MAC address</strong>:</p>\n<table>\n<thead>\n<tr>\n<th>Kondisi</th>\n<th>Tindakan</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Known unicast</strong> (MAC tujuan ada di tabel)</td>\n<td>Teruskan hanya ke <strong>port tujuan</strong></td>\n</tr>\n<tr>\n<td><strong>Unknown unicast</strong> (MAC tujuan tidak ada di tabel)</td>\n<td><strong>Flood</strong> ke semua port dalam VLAN (kecuali port asal)</td>\n</tr>\n<tr>\n<td><strong>Broadcast / Multicast</strong></td>\n<td><strong>Flood</strong> ke semua port dalam VLAN (kecuali port asal)</td>\n</tr>\n<tr>\n<td>Tujuan di port yang sama dengan asal</td>\n<td><strong>Filter</strong> (frame dibuang)</td>\n</tr>\n</tbody>\n</table>\n<h3>1.13.c Frame Flooding</h3>\n<ul>\n<li>Pengiriman frame ke <strong>semua port dalam VLAN yang sama kecuali port tempat frame diterima</strong>.</li>\n<li>Terjadi pada: <strong>unknown unicast</strong>, <strong>broadcast</strong>, dan <strong>multicast</strong> (tanpa pembatasan khusus).</li>\n</ul>\n<h3>1.13.d MAC Address Table</h3>\n<ul>\n<li>Tabel (juga disebut <em>CAM table</em>) yang menyimpan pemetaan <strong>MAC address ↔ port ↔ VLAN</strong>.</li>\n<li>Isi tabel dibangun secara dinamis lewat MAC learning (dapat juga dikonfigurasi statis).</li>\n</ul>\n<pre><code>Switch# show mac address-table\nSwitch# show mac address-table dynamic\nSwitch# show mac address-table address aaaa.bbbb.cccc\n</code></pre>\n<p><strong>Contoh output:</strong></p>\n<pre><code>Vlan    Mac Address       Type        Ports\n----    -----------       --------    -----\n  10    0050.7966.6800    DYNAMIC     Gi0/1\n  10    0050.7966.6801    DYNAMIC     Gi0/2\n</code></pre>", "raw": "### 1.13.a MAC Learning dan Aging\n\n- **MAC learning:** switch memeriksa **source MAC address** setiap frame yang masuk, lalu mencatatnya di MAC address table bersama **port** dan **VLAN** tempat frame diterima.\n- **Aging:** entri yang tidak aktif dihapus setelah waktu tertentu. Default pada Cisco switch: **300 detik (5 menit)**; timer di-reset setiap kali switch melihat frame dari MAC tersebut.\n\n### 1.13.b Frame Switching\n\nKeputusan forwarding berdasarkan **destination MAC address**:\n\n| Kondisi | Tindakan |\n|---|---|\n| **Known unicast** (MAC tujuan ada di tabel) | Teruskan hanya ke **port tujuan** |\n| **Unknown unicast** (MAC tujuan tidak ada di tabel) | **Flood** ke semua port dalam VLAN (kecuali port asal) |\n| **Broadcast / Multicast** | **Flood** ke semua port dalam VLAN (kecuali port asal) |\n| Tujuan di port yang sama dengan asal | **Filter** (frame dibuang) |\n\n### 1.13.c Frame Flooding\n\n- Pengiriman frame ke **semua port dalam VLAN yang sama kecuali port tempat frame diterima**.\n- Terjadi pada: **unknown unicast**, **broadcast**, dan **multicast** (tanpa pembatasan khusus).\n\n### 1.13.d MAC Address Table\n\n- Tabel (juga disebut *CAM table*) yang menyimpan pemetaan **MAC address ↔ port ↔ VLAN**.\n- Isi tabel dibangun secara dinamis lewat MAC learning (dapat juga dikonfigurasi statis).\n\n```\nSwitch# show mac address-table\nSwitch# show mac address-table dynamic\nSwitch# show mac address-table address aaaa.bbbb.cccc\n```\n\n**Contoh output:**\n\n```\nVlan    Mac Address       Type        Ports\n----    -----------       --------    -----\n  10    0050.7966.6800    DYNAMIC     Gi0/1\n  10    0050.7966.6801    DYNAMIC     Gi0/2\n```"}, {"id": "sum-1-checklist", "label": "Checklist Review 1.0", "title": "Checklist Review Cepat — 1.0 Network Fundamentals (20%)", "html": "<table>\n<thead>\n<tr>\n<th>No.</th>\n<th>Topik</th>\n<th>Poin kunci</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1.1</td>\n<td>Komponen jaringan</td>\n<td>Router (L3), switch L2/L3, NGFW/IPS, AP, controller, endpoint, server, PoE (af/at/bt)</td>\n</tr>\n<tr>\n<td>1.2</td>\n<td>Topologi</td>\n<td>Two-tier, three-tier (access/distribution/core), spine-leaf, WAN, SOHO, on-prem vs cloud</td>\n</tr>\n<tr>\n<td>1.3</td>\n<td>Interface &amp; kabel</td>\n<td>SMF vs MMF vs copper; shared media (hub, half-duplex) vs point-to-point (full-duplex)</td>\n</tr>\n<tr>\n<td>1.4</td>\n<td>Masalah interface</td>\n<td>Collisions, CRC, runts/giants, late collisions, duplex &amp; speed mismatch</td>\n</tr>\n<tr>\n<td>1.5</td>\n<td>TCP vs UDP</td>\n<td>Reliable/connection-oriented vs best-effort/connectionless</td>\n</tr>\n<tr>\n<td>1.6</td>\n<td>IPv4 &amp; subnetting</td>\n<td>Rumus 2ⁿ dan 2ʰ−2, block size, network/broadcast/host range, konfigurasi &amp; verifikasi</td>\n</tr>\n<tr>\n<td>1.7</td>\n<td>Private IPv4</td>\n<td>10/8, 172.16/12, 192.168/16</td>\n</tr>\n<tr>\n<td>1.8</td>\n<td>IPv6 addressing</td>\n<td>128 bit, penyingkatan alamat, /64, <code>ipv6 unicast-routing</code>, <code>ipv6 address</code></td>\n</tr>\n<tr>\n<td>1.9</td>\n<td>Tipe IPv6</td>\n<td>Global (2000::/3), unique local (FC00::/7), link-local (FE80::/10), anycast, multicast (FF00::/8), EUI-64</td>\n</tr>\n<tr>\n<td>1.10</td>\n<td>Client OS</td>\n<td><code>ipconfig /all</code> (Windows), <code>ifconfig</code>/<code>networksetup</code> (macOS), <code>ip addr</code> (Linux)</td>\n</tr>\n<tr>\n<td>1.11</td>\n<td>Wireless</td>\n<td>Channel non-overlap 1/6/11, SSID, RF (2.4 vs 5 GHz, dBm), enkripsi</td>\n</tr>\n<tr>\n<td>1.12</td>\n<td>Virtualisasi</td>\n<td>VM + hypervisor (Type 1/2), container (share kernel), VRF (multi routing table)</td>\n</tr>\n<tr>\n<td>1.13</td>\n<td>Switching</td>\n<td>MAC learning (source), aging 300 s, forward/filter/flood, MAC address table</td>\n</tr>\n</tbody>\n</table>", "raw": "| No. | Topik | Poin kunci |\n|---|---|---|\n| 1.1 | Komponen jaringan | Router (L3), switch L2/L3, NGFW/IPS, AP, controller, endpoint, server, PoE (af/at/bt) |\n| 1.2 | Topologi | Two-tier, three-tier (access/distribution/core), spine-leaf, WAN, SOHO, on-prem vs cloud |\n| 1.3 | Interface & kabel | SMF vs MMF vs copper; shared media (hub, half-duplex) vs point-to-point (full-duplex) |\n| 1.4 | Masalah interface | Collisions, CRC, runts/giants, late collisions, duplex & speed mismatch |\n| 1.5 | TCP vs UDP | Reliable/connection-oriented vs best-effort/connectionless |\n| 1.6 | IPv4 & subnetting | Rumus 2ⁿ dan 2ʰ−2, block size, network/broadcast/host range, konfigurasi & verifikasi |\n| 1.7 | Private IPv4 | 10/8, 172.16/12, 192.168/16 |\n| 1.8 | IPv6 addressing | 128 bit, penyingkatan alamat, /64, `ipv6 unicast-routing`, `ipv6 address` |\n| 1.9 | Tipe IPv6 | Global (2000::/3), unique local (FC00::/7), link-local (FE80::/10), anycast, multicast (FF00::/8), EUI-64 |\n| 1.10 | Client OS | `ipconfig /all` (Windows), `ifconfig`/`networksetup` (macOS), `ip addr` (Linux) |\n| 1.11 | Wireless | Channel non-overlap 1/6/11, SSID, RF (2.4 vs 5 GHz, dBm), enkripsi |\n| 1.12 | Virtualisasi | VM + hypervisor (Type 1/2), container (share kernel), VRF (multi routing table) |\n| 1.13 | Switching | MAC learning (source), aging 300 s, forward/filter/flood, MAC address table |"}]}, {"category": "2.0 NETWORK ACCESS", "items": [{"id": "sum-2-1", "label": "2.1 VLAN (normal range) yang melintasi beberapa switch", "title": "2.1 VLAN (normal range) yang melintasi beberapa switch", "html": "<h3>Konsep VLAN</h3>\n<ul>\n<li><strong>VLAN (Virtual LAN)</strong> membagi satu switch fisik menjadi beberapa <strong>broadcast domain logis</strong> yang terpisah.</li>\n<li>Perangkat di VLAN berbeda <strong>tidak dapat saling berkomunikasi</strong> tanpa perangkat <strong>Layer 3</strong>.</li>\n<li>Manfaat: memisahkan broadcast domain, meningkatkan keamanan, dan mengelompokkan perangkat secara logis (bukan fisik).</li>\n<li><strong>Normal range:</strong> VLAN ID <strong>1 – 1005</strong>. VLAN 1 dan 1002 – 1005 dibuat otomatis dan <strong>tidak dapat dihapus</strong>. Informasi VLAN normal range disimpan di file <strong><code>vlan.dat</code></strong> pada flash.</li>\n<li>VLAN dapat <strong>melintasi beberapa switch</strong> dengan menghubungkan switch menggunakan <strong>trunk</strong> (lihat 2.2) dan membuat VLAN yang sama di tiap switch.</li>\n</ul>\n<pre><code>  [SW1]============trunk============[SW2]\n  VLAN10 ─ PC1                      PC3 ─ VLAN10   (satu subnet, satu VLAN, dua switch)\n  VLAN20 ─ PC2                      PC4 ─ VLAN20\n</code></pre>\n<h3>Membuat VLAN</h3>\n<pre><code>Switch(config)# vlan 10\nSwitch(config-vlan)# name DATA\nSwitch(config-vlan)# exit\nSwitch(config)# vlan 20\nSwitch(config-vlan)# name VOICE\n</code></pre>\n<h3>2.1.a Access Ports (data dan voice)</h3>\n<ul>\n<li><strong>Access port</strong> hanya menjadi anggota <strong>satu VLAN</strong> (data) dan mengirim frame <strong>tanpa tag</strong> 802.1Q; dipakai untuk menghubungkan endpoint.</li>\n<li><strong>Voice VLAN:</strong> pada port yang tersambung ke <strong>IP phone</strong> (dengan PC dihubungkan di belakang phone), trafik suara dipisah ke VLAN tersendiri.</li>\n<li>Trafik <strong>voice</strong>: dikirim <strong>dengan tag</strong> 802.1Q (voice VLAN).</li>\n<li>Trafik <strong>data</strong> (dari PC): dikirim <strong>tanpa tag</strong> (access/data VLAN).</li>\n<li>Switch memberi tahu phone voice VLAN-nya melalui <strong>CDP</strong> (atau LLDP).</li>\n</ul>\n<pre><code>Switch(config)# interface fastEthernet 0/1\nSwitch(config-if)# switchport mode access\nSwitch(config-if)# switchport access vlan 10      ! data VLAN\nSwitch(config-if)# switchport voice vlan 20       ! voice VLAN\n</code></pre>\n<pre><code>[PC] ──── [IP Phone] ──── Fa0/1 [Switch]\n data VLAN 10 (untagged)   voice VLAN 20 (tagged)\n</code></pre>\n<h3>2.1.b Default VLAN</h3>\n<ul>\n<li><strong>VLAN 1</strong> adalah <strong>default VLAN</strong>: semua port switch berada di VLAN 1 secara default.</li>\n<li>VLAN 1 <strong>tidak dapat dihapus</strong>, dan secara default juga menjadi <strong>native VLAN</strong> pada trunk.</li>\n<li>Nama default: <code>default</code>.</li>\n</ul>\n<h3>2.1.c InterVLAN Connectivity</h3>\n<p>Perangkat di VLAN berbeda berada di subnet berbeda sehingga butuh <strong>routing</strong> antar VLAN.</p>\n<table>\n<thead>\n<tr>\n<th>Metode</th>\n<th>Keterangan</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Router-on-a-Stick (ROAS)</strong></td>\n<td>Satu link <strong>trunk</strong> antara switch dan router; router memakai <strong>subinterface</strong> per VLAN dengan <code>encapsulation dot1Q</code></td>\n</tr>\n<tr>\n<td><strong>Layer 3 Switch (SVI)</strong></td>\n<td>Switch L3 merutekan antar VLAN memakai <strong>SVI</strong> (<em>Switch Virtual Interface</em>) per VLAN; lebih cepat (hardware)</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Router-on-a-Stick:</strong></p>\n<pre><code>! Router\nRouter(config)# interface gigabitEthernet 0/0\nRouter(config-if)# no shutdown\nRouter(config)# interface gigabitEthernet 0/0.10\nRouter(config-subif)# encapsulation dot1Q 10\nRouter(config-subif)# ip address 192.168.10.1 255.255.255.0\nRouter(config)# interface gigabitEthernet 0/0.20\nRouter(config-subif)# encapsulation dot1Q 20\nRouter(config-subif)# ip address 192.168.20.1 255.255.255.0\n\n! Switch (sisi router = trunk)\nSwitch(config)# interface gigabitEthernet 0/1\nSwitch(config-if)# switchport mode trunk\n</code></pre>\n<p><strong>Layer 3 Switch dengan SVI:</strong></p>\n<pre><code>Switch(config)# ip routing\nSwitch(config)# interface vlan 10\nSwitch(config-if)# ip address 192.168.10.1 255.255.255.0\nSwitch(config-if)# no shutdown\nSwitch(config)# interface vlan 20\nSwitch(config-if)# ip address 192.168.20.1 255.255.255.0\nSwitch(config-if)# no shutdown\n</code></pre>\n<blockquote>\n<p>Default gateway tiap host = alamat IP subinterface/SVI pada VLAN-nya.</p>\n</blockquote>\n<h3>Verifikasi VLAN</h3>\n<pre><code>Switch# show vlan brief\nSwitch# show vlan id 10\nSwitch# show interfaces fastEthernet 0/1 switchport\nSwitch# show interfaces trunk\nSwitch# show ip interface brief\n</code></pre>\n<ul>\n<li><code>show vlan brief</code> menampilkan VLAN ID, nama, status, dan <strong>port access</strong> yang menjadi anggota (port trunk <strong>tidak</strong> ditampilkan).</li>\n</ul>", "raw": "### Konsep VLAN\n\n- **VLAN (Virtual LAN)** membagi satu switch fisik menjadi beberapa **broadcast domain logis** yang terpisah.\n- Perangkat di VLAN berbeda **tidak dapat saling berkomunikasi** tanpa perangkat **Layer 3**.\n- Manfaat: memisahkan broadcast domain, meningkatkan keamanan, dan mengelompokkan perangkat secara logis (bukan fisik).\n- **Normal range:** VLAN ID **1 – 1005**. VLAN 1 dan 1002 – 1005 dibuat otomatis dan **tidak dapat dihapus**. Informasi VLAN normal range disimpan di file **`vlan.dat`** pada flash.\n- VLAN dapat **melintasi beberapa switch** dengan menghubungkan switch menggunakan **trunk** (lihat 2.2) dan membuat VLAN yang sama di tiap switch.\n\n```\n  [SW1]============trunk============[SW2]\n  VLAN10 ─ PC1                      PC3 ─ VLAN10   (satu subnet, satu VLAN, dua switch)\n  VLAN20 ─ PC2                      PC4 ─ VLAN20\n```\n\n### Membuat VLAN\n\n```\nSwitch(config)# vlan 10\nSwitch(config-vlan)# name DATA\nSwitch(config-vlan)# exit\nSwitch(config)# vlan 20\nSwitch(config-vlan)# name VOICE\n```\n\n### 2.1.a Access Ports (data dan voice)\n\n- **Access port** hanya menjadi anggota **satu VLAN** (data) dan mengirim frame **tanpa tag** 802.1Q; dipakai untuk menghubungkan endpoint.\n- **Voice VLAN:** pada port yang tersambung ke **IP phone** (dengan PC dihubungkan di belakang phone), trafik suara dipisah ke VLAN tersendiri.\n  - Trafik **voice**: dikirim **dengan tag** 802.1Q (voice VLAN).\n  - Trafik **data** (dari PC): dikirim **tanpa tag** (access/data VLAN).\n  - Switch memberi tahu phone voice VLAN-nya melalui **CDP** (atau LLDP).\n\n```\nSwitch(config)# interface fastEthernet 0/1\nSwitch(config-if)# switchport mode access\nSwitch(config-if)# switchport access vlan 10      ! data VLAN\nSwitch(config-if)# switchport voice vlan 20       ! voice VLAN\n```\n\n```\n[PC] ──── [IP Phone] ──── Fa0/1 [Switch]\n data VLAN 10 (untagged)   voice VLAN 20 (tagged)\n```\n\n### 2.1.b Default VLAN\n\n- **VLAN 1** adalah **default VLAN**: semua port switch berada di VLAN 1 secara default.\n- VLAN 1 **tidak dapat dihapus**, dan secara default juga menjadi **native VLAN** pada trunk.\n- Nama default: `default`.\n\n### 2.1.c InterVLAN Connectivity\n\nPerangkat di VLAN berbeda berada di subnet berbeda sehingga butuh **routing** antar VLAN.\n\n| Metode | Keterangan |\n|---|---|\n| **Router-on-a-Stick (ROAS)** | Satu link **trunk** antara switch dan router; router memakai **subinterface** per VLAN dengan `encapsulation dot1Q` |\n| **Layer 3 Switch (SVI)** | Switch L3 merutekan antar VLAN memakai **SVI** (*Switch Virtual Interface*) per VLAN; lebih cepat (hardware) |\n\n**Router-on-a-Stick:**\n\n```\n! Router\nRouter(config)# interface gigabitEthernet 0/0\nRouter(config-if)# no shutdown\nRouter(config)# interface gigabitEthernet 0/0.10\nRouter(config-subif)# encapsulation dot1Q 10\nRouter(config-subif)# ip address 192.168.10.1 255.255.255.0\nRouter(config)# interface gigabitEthernet 0/0.20\nRouter(config-subif)# encapsulation dot1Q 20\nRouter(config-subif)# ip address 192.168.20.1 255.255.255.0\n\n! Switch (sisi router = trunk)\nSwitch(config)# interface gigabitEthernet 0/1\nSwitch(config-if)# switchport mode trunk\n```\n\n**Layer 3 Switch dengan SVI:**\n\n```\nSwitch(config)# ip routing\nSwitch(config)# interface vlan 10\nSwitch(config-if)# ip address 192.168.10.1 255.255.255.0\nSwitch(config-if)# no shutdown\nSwitch(config)# interface vlan 20\nSwitch(config-if)# ip address 192.168.20.1 255.255.255.0\nSwitch(config-if)# no shutdown\n```\n\n> Default gateway tiap host = alamat IP subinterface/SVI pada VLAN-nya.\n\n### Verifikasi VLAN\n\n```\nSwitch# show vlan brief\nSwitch# show vlan id 10\nSwitch# show interfaces fastEthernet 0/1 switchport\nSwitch# show interfaces trunk\nSwitch# show ip interface brief\n```\n\n- `show vlan brief` menampilkan VLAN ID, nama, status, dan **port access** yang menjadi anggota (port trunk **tidak** ditampilkan)."}, {"id": "sum-2-2", "label": "2.2 Konektivitas interswitch", "title": "2.2 Konektivitas interswitch", "html": "<h3>2.2.a Trunk Ports</h3>\n<ul>\n<li><strong>Trunk</strong> adalah link yang membawa <strong>banyak VLAN</strong> sekaligus antar switch (atau switch ke router/AP/server tertentu) melalui satu link fisik.</li>\n<li>Frame diberi <strong>tag</strong> agar penerima tahu VLAN asalnya (kecuali native VLAN).</li>\n</ul>\n<pre><code>Switch(config)# interface gigabitEthernet 0/1\nSwitch(config-if)# switchport mode trunk\nSwitch(config-if)# switchport trunk encapsulation dot1q\nSwitch(config-if)# switchport trunk allowed vlan 10,20,99\n</code></pre>\n<h3>2.2.b 802.1Q</h3>\n<ul>\n<li>Standar IEEE untuk <strong>VLAN tagging</strong> pada Ethernet.</li>\n<li>Menyisipkan <strong>tag 4 byte</strong> ke dalam frame Ethernet (antara <em>source MAC</em> dan <em>EtherType</em>).</li>\n</ul>\n<table>\n<thead>\n<tr>\n<th>Field tag</th>\n<th>Ukuran</th>\n<th>Fungsi</th>\n</tr>\n</t
